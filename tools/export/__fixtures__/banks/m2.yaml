# Фікстура експорту: модуль 2 (t05–t08) — множинний вибір, так/ні з правильним «Неправда», числова з двома
# відповідями, Calculated з відносним і номінальним допуском та логарифмічним набором даних, Cloze з
# регістрозалежною короткою відповіддю.
schemaVersion: 1
kind: training
module: m2
questions:
  - id: t05-q002
    type: multichoice
    topic: t05
    bloom: understand
    single: false
    stem: Які з наведених комітетів зазвичай утворює наглядова рада?
    generalFeedback: Типові комітети — аудиторський і з винагород.
    answers:
      - text: Аудиторський комітет
        fraction: 50
        feedback: Правильно.
      - text: Комітет з винагород
        fraction: 50
        feedback: Правильно.
      - text: Ревізійна комісія
        fraction: -100
        feedback: Це окремий орган, а не комітет ради.

  - id: t06-q001
    type: truefalse
    topic: t06
    bloom: understand
    stem: Правочин із заінтересованістю не потребує жодного погодження.
    generalFeedback: Такі правочини погоджує наглядова рада або загальні збори.
    correct: false
    feedbackTrue: Ні, погодження потрібне.
    feedbackFalse: Так, погодження обов’язкове.

  - id: t07-q005
    type: numerical
    topic: t07
    bloom: apply
    stem: Чистий прибуток 650 000 грн, на дивіденди — 50%, акцій 10 000. Який дивіденд на акцію, грн?
    generalFeedback: 650 000 × 0,5 / 10 000 = 32,5 грн.
    answers:
      - value: 32.5
        tolerance: 0.01
        fraction: 100
        feedback: 'Правильно: 32,5 грн.'
      - value: 325
        tolerance: 0
        fraction: 0
        feedback: Помилка в розряді.

  - id: t07-q006
    type: calculated
    topic: t07
    bloom: apply
    defaultMark: 2
    stem: Чистий прибуток {p} тис. грн, частка на дивіденди {r}%, акцій {n} тис. Який дивіденд на акцію, грн?
    generalFeedback: Дивіденд на акцію = прибуток × частка / кількість акцій.
    answers:
      - formula: '{p} * {r} / 100 / {n}'
        fraction: 100
        feedback: 'Формула: p × r / 100 / n.'
      - formula: '{p} * {r} / {n}'
        fraction: 50
        tolerance: 0.5
        toleranceType: nominal
        correctAnswerFormat: significant-figures
        correctAnswerLength: 3
        feedback: Не поділили частку на 100.
    datasets:
      - name: p
        min: 500
        max: 900
        decimals: 0
      - name: r
        min: 20
        max: 60
        decimals: 0
      - name: n
        min: 5
        max: 20
        decimals: 0

  - id: t08-q001
    type: calculated
    topic: t08
    bloom: apply
    stem: Акція коштує {price} грн, прибуток на акцію {eps} грн. Обчисліть P/E.
    generalFeedback: P/E = ціна / прибуток на акцію.
    itemCount: 5
    answers:
      - formula: 'round({price} / {eps}, 2)'
        fraction: 100
        feedback: Правильно.
    datasets:
      - name: price
        min: 10
        max: 1000
        decimals: 2
        distribution: loguniform
      - name: eps
        min: 0.5
        max: 20
        decimals: 1

  - id: t08-q010
    type: multianswer
    topic: t08
    bloom: remember
    stem: Принцип розкриття інформації Кодексу НКЦПФР — {#1}, а скорочення ESG пишуть як {#2}.
    generalFeedback: Кодекс операційного менеджменту НКЦПФР діє за принципом «дотримуйся або пояснюй».
    subquestions:
      - kind: multichoice
        answers:
          - text: «дотримуйся або пояснюй»
            fraction: 100
            feedback: Так.
          - text: «лише дотримуйся»
            fraction: 0
            feedback: Ні.
      - kind: shortanswer
        caseSensitive: true
        answers:
          - text: ESG
            fraction: 100
            feedback: Правильно, великими літерами.
