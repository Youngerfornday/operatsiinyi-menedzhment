# Дані тренажера практичної 7. Реєстр (мета, результати, рубрика, ПРН, дані статистики) — у course.yaml.
# Формули — лише з docs/research/formula-baseline.md (коди PRJ-01..07, PRJ-09, QC-01, QC-02, QC-04, QC-05).
# PRJ-08 (стиснення проєкту) у тренажері не рахується — лишається задачею самостійної роботи (СРС).
id: p07
title: Сітьове планування проєкту і статистичний контроль якості
intro: >-
  У тренажері — три калькулятори теми 7 і теми 8. Перший будує сітьовий графік, знаходить критичний
  шлях і резерви часу та оцінює ймовірність дотримання строку методом PERT. Другий розраховує контрольні
  межі карт середніх і розмахів (x̄-R) та карти частки дефектних одиниць (p-карта) і визначає, чи
  сигналізує нова підгрупа про розладнання процесу. Третій розраховує індекси придатності процесу Cp і
  Cpk. Кожен варіант генерує нові дані; після перевірки тренажер показує повний розв’язок за формулою.
  XP нараховується лише за перший правильно розв’язаний варіант кожного типу задачі — до 60 XP за
  кожен з трьох калькуляторів.
