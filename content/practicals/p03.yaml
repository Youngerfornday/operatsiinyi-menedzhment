trainer:
  kind: calculation-tasks
  tasks:
    - id: little-law-time
      method: little-law
      resource: time
      title: 'Закон Літтла: середній час перебування в системі (W)'
      formula: 'L = λ · W, звідки W = L / λ'
      ref:
        source: 'Гевко І. Операційний менеджмент, 2017'
        locator: 'тема 10 «Теорія черг», п. 10.3 «Різноманітність моделей черг», с. 102, закон Літтла, визначення часу перебування W (CAP-04)'
        checkedAt: '2026-09-23'
        url: https://elartu.tntu.edu.ua/handle/lib/21300

    - id: little-law-wip
      method: little-law
      resource: wip
      title: 'Закон Літтла: незавершене виробництво (L)'
      formula: 'L = λ · W'
      ref:
        source: 'Гевко І. Операційний менеджмент, 2017'
        locator: 'тема 10 «Теорія черг», п. 10.3 «Різноманітність моделей черг», с. 102, закон Літтла, визначення незавершеного виробництва L (CAP-04)'
        checkedAt: '2026-09-23'
        url: https://elartu.tntu.edu.ua/handle/lib/21300

    - id: little-law-throughput
      method: little-law
      resource: throughput
      title: 'Закон Літтла: пропускна здатність (λ)'
      formula: 'λ = L / W'
      ref:
        source: 'Гевко І. Операційний менеджмент, 2017'
        locator: 'тема 10 «Теорія черг», п. 10.3 «Різноманітність моделей черг», с. 102, закон Літтла, визначення пропускної здатності λ (CAP-04)'
        checkedAt: '2026-09-23'
        url: https://elartu.tntu.edu.ua/handle/lib/21300

    - id: production-cycle
      method: production-cycle
      title: Тривалість виробничого циклу за трьома видами руху партії
      formula: 'Tпосл = n · Σ(ti/Ci) (PC-01); Tпар = p · Σ(ti/Ci) + (n − p) · max(ti/Ci) (PC-02); Tзм = Tпосл − (n − p) · Σ min(ti/Ci; ti+1/Ci+1) (PC-03)'
      ref:
        source: 'Капінос Г.І., Бабій І.В. Операційний менеджмент, 2013'
        locator: 'розділ 4, п. 4.5 «Організація виробничого процесу в просторі та часі», с. 83–84, послідовний (PC-01), паралельний (PC-02) і паралельно-послідовний (PC-03) вид руху партії'
        checkedAt: '2026-09-23'
        url: https://duikt.edu.ua/uploads/l_1479_22227234.pdf

  essay:
    prompt: >-
      Дільниця скоротила незавершене виробництво вдвічі, не змінюючи пропускної здатності. Поясніть за
      законом Літтла, як це вплине на строк виконання замовлення, і назвіть, який із трьох видів руху
      партії (послідовний, паралельний чи паралельно-послідовний) ви обрали б для цієї дільниці та чому,
      з огляду на компроміс між тривалістю циклу й безперервністю роботи операцій.
    maxWords: 300
    expectations:
      - 'Пояснення спирається на власний розрахунок закону Літтла з тренажера (L = λ · W), а не переказує формулу без чисел.'
      - 'Названо конкретний вплив: скорочення незавершеного виробництва при незмінній пропускній здатності пропорційно скорочує середній час перебування в системі.'
      - 'Вибір виду руху партії обґрунтовано компромісом тривалості циклу й безперервності роботи операцій (найкоротший цикл — паралельний, ціна — простої окремих операцій), а не лише посиланням на найменше число.'
    hints:
      - 'Порівняйте власні варіанти тренажера: у скільки разів зменшилося L і у скільки разів (за тією самою пропускною здатністю) зменшився W.'
      - 'Перегляньте розбір WorkedExample «Граничні випадки» лекції теми 4: паралельний рух ніколи не довший за паралельно-послідовний, а той — ніколи не довший за послідовний, але найкоротший цикл коштує простоїв.'
