# Дані тренажерів практичної 3. Реєстр (мета, результати, рубрика, ПРН, дані) — у course.yaml.
# Формули — лише з docs/research/formula-baseline.md (коди CAP-04, PC-01, PC-02, PC-03).
id: p03
title: Операційна система і тривалість виробничого циклу
intro: >-
  Практична складається з двох тренажерів. У першому застосуйте закон Літтла (CAP-04), щоб за двома
  відомими величинами — незавершеним виробництвом, пропускною здатністю чи середнім часом перебування
  в системі — знайти третю. У другому розрахуйте тривалість виробничого циклу партії деталей за трьома
  видами руху: послідовним, паралельним і паралельно-послідовним (PC-01, PC-02, PC-03). Кожен варіант
  генерує нові дані; після перевірки тренажер показує повний розв’язок за формулою. XP нараховується
  лише за перший правильно розв’язаний варіант кожного типу задачі — до 60 XP за кожен тренажер.
status: review
updatedAt: '2026-09-23'
