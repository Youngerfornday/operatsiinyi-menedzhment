# Дані тренажера практичної 1. Реєстр (мета, результати, рубрика, ПРН, дані статистики) — у course.yaml.
# Формули — лише з docs/research/formula-baseline.md (коди PROD-01, PROD-02, PROD-03, CAP-01, CAP-02).
id: p01
title: Операційна функція підприємства і вимірювання продуктивності
intro: >-
  У тренажері розрахуйте показники продуктивності операційної системи за завданнями нижче: часткову
  продуктивність за працею, матеріалами й енергією, багатофакторну продуктивність, індекс її зміни та
  використання й ефективність виробничої потужності. Кожен варіант генерує нові дані; після перевірки
  тренажер показує повний розв’язок за формулою. XP нараховується лише за перший правильно розв’язаний
  варіант кожного типу задачі — до 60 XP за тренажер загалом.
status: review
updatedAt: '2026-09-23'
