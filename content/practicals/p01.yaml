trainer:
  kind: calculation-tasks
  tasks:
    - id: partial-labor
      method: partial-productivity
      resource: labor
      title: Часткова продуктивність за працею
      formula: 'Продуктивність = Обсяг випуску / Людино-години'
      ref:
        source: 'Stevenson W. J. Operations Management, 2020'
        locator: 'розділ «Competitiveness, Strategy, and Productivity», підрозділ Productivity, часткова продуктивність за працею (PROD-01)'
        checkedAt: '2026-09-23'
        url: https://openlibrary.org/isbn/9781260575712

    - id: partial-materials
      method: partial-productivity
      resource: materials
      title: Часткова продуктивність за матеріалами
      formula: 'Продуктивність = Обсяг випуску / Кілограми матеріалів'
      ref:
        source: 'Stevenson W. J. Operations Management, 2020'
        locator: 'розділ «Competitiveness, Strategy, and Productivity», підрозділ Productivity, часткова продуктивність за матеріалами (PROD-01)'
        checkedAt: '2026-09-23'
        url: https://openlibrary.org/isbn/9781260575712

    - id: partial-energy
      method: partial-productivity
      resource: energy
      title: Часткова продуктивність за енергією
      formula: 'Продуктивність = Обсяг випуску / Кіловат-години'
      ref:
        source: 'Stevenson W. J. Operations Management, 2020'
        locator: 'розділ «Competitiveness, Strategy, and Productivity», підрозділ Productivity, часткова продуктивність за енергією (PROD-01)'
        checkedAt: '2026-09-23'
        url: https://openlibrary.org/isbn/9781260575712

    - id: multifactor
      method: multifactor-productivity
      title: Багатофакторна продуктивність
      formula: 'Продуктивність = Обсяг випуску / (Праця + Матеріали + Енергія + Утримання обладнання)'
      ref:
        source: 'Stevenson W. J. Operations Management, 2020'
        locator: 'розділ «Competitiveness, Strategy, and Productivity», підрозділ Productivity, багатофакторна продуктивність (PROD-02)'
        checkedAt: '2026-09-23'
        url: https://openlibrary.org/isbn/9781260575712

    - id: productivity-index
      method: productivity-index
      title: Індекс зміни продуктивності
      formula: 'I = Продуктивність поточного періоду / Продуктивність базового періоду · 100 %'
      ref:
        source: 'Капінос Г.І., Бабій І.В. Операційний менеджмент, 2013'
        locator: 'розділ 9, п. 9.1, с. 248, динамічний індекс продуктивності (PROD-03)'
        checkedAt: '2026-09-23'
        url: https://duikt.edu.ua/uploads/l_1479_22227234.pdf

    - id: capacity-usage
      method: capacity-usage
      title: Коефіцієнт використання потужності
      formula: 'Використання = Фактичний випуск / Проєктна потужність · 100 %'
      ref:
        source: 'Heizer J., Render B., Munson C. Operations Management, 2016'
        locator: 'Supplement 7 «Capacity and Constraint Management», підрозділ «Design and Effective Capacity», коефіцієнт використання потужності (CAP-01)'
        checkedAt: '2026-09-23'
        url: https://openlibrary.org/isbn/9780134163512

    - id: capacity-efficiency
      method: capacity-efficiency
      title: Ефективність використання потужності
      formula: 'Ефективність = Фактичний випуск / Ефективна потужність · 100 %'
      ref:
        source: 'Heizer J., Render B., Munson C. Operations Management, 2016'
        locator: 'Supplement 7 «Capacity and Constraint Management», підрозділ «Design and Effective Capacity», ефективність використання потужності (CAP-02)'
        checkedAt: '2026-09-23'
        url: https://openlibrary.org/isbn/9780134163512

  essay:
    prompt: >-
      Поясніть, чому зростання продуктивності за працею в тренажері може супроводжуватися падінням
      багатофакторної продуктивності, і назвіть два управлінські рішення, що дають такий ефект.
    maxWords: 300
    expectations:
      - 'Названо конкретну причину розбіжності: зекономлений ресурс (наприклад, праця) замінено іншим, який теж входить до знаменника багатофакторного показника.'
      - 'Наведено щонайменше два управлінські рішення з таким ефектом (наприклад, автоматизація дільниці, перехід на дорожче обладнання чи енергоємнішу технологію).'
      - 'Пояснення спирається на власний розрахунок із тренажера, а не переказує визначення часткової й багатофакторної продуктивності.'
    hints:
      - 'Порівняйте, у скільки разів зросли випуск і сумарні витрати ресурсів: якщо витрати зросли швидше за випуск — багатофакторна продуктивність падає, навіть коли часткова за одним ресурсом зростає.'
      - 'Перегляньте розділ лекції «Продуктивність операційної системи: часткова, багатофакторна, загальна» — приклад цеху з новою напівавтоматичною лінією.'
