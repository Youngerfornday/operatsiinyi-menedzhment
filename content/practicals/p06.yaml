# Дані трьох тренажерів практичної 6. Реєстр (мета, результати, рубрика, ПРН, дані закупівель) — у course.yaml.
# Три тренажери практичної (eoq, mrp, sequencing) ділять один список `trainer.tasks`: кожен острів
# фільтрує собі лише відомий метод (src/components/trainers/model/*.ts), не кидаючи помилку на чужі.
# Формули — лише з docs/research/formula-baseline.md (коди EOQ-01, EOQ-03, EOQ-04, MRP-01, MRP-02, MRP-03, SCH-01, SCH-02, SCH-04);
# FCFS — базова черговість без сортування з лекції теми 6 (приклад SCH-01), окремого коду в базі не має.
id: p06
title: Управління запасами і планування потреби в матеріалах
intro: >-
  Практична складається з трьох незалежних тренажерів. У тренажері EOQ розрахуйте оптимальний розмір
  замовлення, точку замовлення зі страховим запасом і чутливість сумарних витрат до відхилення розміру
  замовлення від оптимуму. У тренажері MRP виконайте розгортання триярусної специфікації виробу:
  визначте брутто- і нетто-потребу на кожному рівні та період запуску замовлення з урахуванням часу
  постачання. У тренажері черговості впорядкуйте шість робіт за правилом FCFS, SPT чи EDD і розрахуйте
  середній час проходження, середнє запізнення й завантаження. Кожен варіант генерує нові дані; після перевірки
  тренажер показує повний розв’язок. XP нараховується лише за перший правильно розв’язаний варіант
  кожного типу задачі — до 60 XP за кожен із трьох тренажерів.
status: review
updatedAt: '2026-09-23'
sources:
