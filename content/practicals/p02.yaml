    checkedAt: '2026-09-22'
    note: Уніфікований парк літаків і мережа «з точки в точку» — структурні рішення під пріоритет витрат через високу утилізацію активів.

trainer:
  kind: matching-matrix
  models:
    - id: cost
      title: Пріоритет витрат
      short: Витрати
      term: cost-priority
      countries: ['США']
      summary: Провідний там, де споживачі не розрізняють товари різних виробників і перемагає найнижча ціна.
      examples:
        - company: Southwest Airlines
          country: США
          note: Уніфікований парк Boeing 737 і мережа «з точки в точку» — структурні рішення під високу утилізацію літака заради низьких витрат.
          url: https://www.sec.gov/Archives/edgar/data/92380/000009238026000004/luv-20251231.htm
          checkedAt: '2026-09-22'

    - id: quality
      title: Пріоритет якості та надійності
      short: Якість і надійність
      term: quality-priority
      countries: ['Україна']
      summary: Стабільний результат без дефектів і надійність постачання навіть за складних зовнішніх умов.
      examples:
        - company: Ferrexpo
          country: Україна
          note: Переорієнтація постачання на залізницю та європейських клієнтів заради збереження надійних поставок під логістичним шоком.
          url: https://ferrexpopstorage.blob.core.windows.net/media/yo2jxkc3/ferrexpo-full-year-financial-results-for-2025-combined-for-website.pdf
          checkedAt: '2026-09-22'

    - id: delivery
      title: Пріоритет часу виконання
      short: Час виконання
      term: delivery-priority
      countries: ['Іспанія']
      summary: Швидкість і надійність постачання від замовлення до споживача, часто ціною вищих витрат.
      examples:
        - company: Zara / Inditex
          country: Іспанія
          note: Половина виробників кінцевого продукту поруч зі штаб-квартирою і значні щорічні інвестиції в логістику заради швидкої доставки в магазин.
          url: https://www.inditex.com/itxcomweb/gp/en/press/news-detail/b870d5ec-6b7e-491d-b38e-340cd69036df/fy2025-results
          checkedAt: '2026-09-22'

    - id: flexibility
      title: Пріоритет гнучкості
      short: Гнучкість
      term: flexibility-priority
      countries: ['Україна']
      summary: Широкий асортимент і швидка перебудова процесу під зміну продукту чи попиту.
      examples:
        - company: Kernel
          country: Україна
          note: Мультинасіннєві заводи (соняшник, соя, ріпак) і власна елеваторна мережа дають змогу перемикати виробництво між культурами.
          url: https://www.kernel.ua/wp-content/uploads/2025/10/FY2025_Kernel_Annual_Report.pdf
          checkedAt: '2026-09-22'

  features:
    - id: product-design
      title: Проєктування товару чи послуги
      cells:
        - { model: cost, statement: 'Мінімальна кількість деталей і стандартні компоненти для дешевого виробництва', explanation: 'Що менше унікальних деталей і що більше стандартних компонентів, то дешевша складальна операція та вужчий асортимент постачання.', source: heizer-render }
        - { model: quality, statement: 'Жорсткі допуски і розширена інженерна перевірка конструкції перед запуском', explanation: 'Конструкція проходить перевірку на відмовостійкість, щоб мінімізувати дефекти й повернення вже після виходу продукту на ринок.', source: heizer-render }
        - { model: delivery, statement: 'Модульна конструкція, яку легко скомплектувати чи доставити швидко', explanation: 'Готові модулі дають змогу комплектувати замовлення з наявних вузлів, а не проєктувати кожне з нуля, що скорочує час постачання.', source: heizer-render }
        - { model: flexibility, statement: 'Одна базова платформа з варіативними опціями під різні сегменти попиту', explanation: 'Базова платформа з набором опцій дозволяє швидко випускати варіації під різні сегменти без повного перепроєктування.', source: heizer-render }

    - id: quality-management
      title: Управління якістю
      cells:
        - { model: cost, statement: 'Контроль якості лише на критичних точках, а не суцільна перевірка', explanation: 'Суцільний контроль коштує дорого; вибірковий контроль критичних точок утримує прийнятний рівень браку за нижчих витрат.', source: stevenson }
        - { model: quality, statement: 'Управління якістю на кожному етапі процесу, а не лише на виході', explanation: 'Якість вбудовують у кожен крок процесу, а не перевіряють лише готовий виріб, — основа пріоритету якості та надійності.', source: stevenson }
        - { model: delivery, statement: 'Швидка перевірка, що не затримує потік замовлень', explanation: 'Контроль якості проєктують так, щоб він не подовжував час виконання замовлення, — швидкість перевірки важливіша за її вичерпність.', source: stevenson }
        - { model: flexibility, statement: 'Гнучкі критерії прийнятності, налаштовані під кожен варіант продукту', explanation: 'Коли асортимент широкий і часто змінюється, критерії якості налаштовують під кожен варіант, а не застосовують один жорсткий стандарт.', source: stevenson }

    - id: process-capacity
      title: Проєктування процесу і потужності
      cells:
        - { model: cost, statement: 'Потоковий процес великими партіями з високою утилізацією обладнання', explanation: 'Великі стандартизовані партії й безперервне завантаження обладнання дають найнижчу собівартість одиниці.', source: heizer-render }
        - { model: quality, statement: 'Процес із вбудованими точками контролю і резервом часу на переробку браку', explanation: 'Потужність закладають із запасом, щоб виправлення дефекту не зупиняло весь потік і не жертвувало якістю заради темпу.', source: heizer-render }
        - { model: delivery, statement: 'Резерв потужності для пікового попиту і швидкого розвороту замовлення', explanation: 'Резерв потужності дозволяє виконати замовлення без черги навіть у пікові періоди, підтримуючи обіцяний термін.', source: heizer-render }
        - { model: flexibility, statement: 'Універсальне обладнання і дрібносерійний процес під часту зміну продукту', explanation: 'Універсальне обладнання легко переналаштувати під новий варіант продукту, на відміну від спеціалізованої потокової лінії.', source: heizer-render }

    - id: location
      title: Розміщення об’єктів
      cells:
        - { model: cost, statement: 'Розміщення там, де найдешевша робоча сила, енергія чи сировина', explanation: 'Локацію обирають насамперед за вартістю ресурсів, а не за близькістю до клієнта.', source: heizer-render }
        - { model: quality, statement: 'Розміщення поруч із перевіреними постачальниками сировини заданої якості', explanation: 'Близькість до перевірених джерел сировини знижує ризик відхилень якості на вході в процес.', source: heizer-render }
        - { model: delivery, statement: 'Розміщення поруч із ринком збуту чи виробниками для скорочення часу постачання', explanation: 'Що коротше транспортне плече до клієнта чи від постачальника, то швидше й надійніше виконується обіцяний термін.', source: heizer-render }
        - { model: flexibility, statement: 'Кілька невеликих майданчиків замість одного великого для швидкої переорієнтації', explanation: 'Розосереджена мережа майданчиків дозволяє перекинути виробництво між ними, коли потрібно швидко змінити асортимент чи обсяг.', source: heizer-render }

    - id: layout
      title: Планування виробничих площ
      cells:
        - { model: cost, statement: 'Потокове компонування ліній під один стандартний виріб', explanation: 'Лінія, вибудувана під один виріб, мінімізує переміщення й час такту, знижуючи витрати на одиницю.', source: slack-brandon-jones }
        - { model: quality, statement: 'Контрольні пости на кожному переході між операціями', explanation: 'Контрольні пости між операціями ловлять дефект одразу після його виникнення, а не в кінці процесу.', source: slack-brandon-jones }
        - { model: delivery, statement: 'Компонування, що мінімізує час переміщення замовлення цехом', explanation: 'Коротший фізичний шлях замовлення цехом напряму скорочує загальний час його виконання.', source: slack-brandon-jones }
        - { model: flexibility, statement: 'Гнучке, осередкове компонування, яке легко перебудувати під нову партію', explanation: 'Осередки обладнання, які можна перегрупувати, дають змогу швидко переналаштувати дільницю під інший виріб.', source: slack-brandon-jones }

    - id: human-resources
      title: Людські ресурси і проєктування робіт
      cells:
        - { model: cost, statement: 'Вузька спеціалізація працівників і нормування праці за найнижчою ставкою', explanation: 'Вузько спеціалізована, легко замінна праця коштує дешевше й швидше навчається за низьким тарифом.', source: stevenson }
        - { model: quality, statement: 'Навчання персоналу методам контролю і відповідальність за якість на робочому місці', explanation: 'Працівник, навчений розпізнавати дефект на своєму етапі, зупиняє поширення браку далі процесом.', source: stevenson }
        - { model: delivery, statement: 'Змінний графік і перехресне навчання для покриття пікових замовлень', explanation: 'Персонал, здатний підмінити колег, дозволяє швидко нарощувати темп роботи без затримки замовлень.', source: stevenson }
        - { model: flexibility, statement: 'Багатопрофільні працівники, які виконують кілька видів операцій', explanation: 'Універсальні навички дозволяють переводити людей між операціями слідом за зміною асортименту чи попиту.', source: stevenson }

    - id: supply-chain
      title: Управління ланцюгом постачання
      cells:
        - { model: cost, statement: 'Постачальники з найнижчою ціною і великими партіями поставки', explanation: 'Великі партії від найдешевших постачальників знижують закупівельну ціну за рахунок економії на масштабі.', source: slack-brandon-jones }
        - { model: quality, statement: 'Постачальники, сертифіковані за стандартами якості, з довгостроковими контрактами', explanation: 'Стабільні, перевірені постачальники знижують мінливість якості вхідної сировини й компонентів.', source: slack-brandon-jones, alsoSources: [ferrexpo-fy2025-results] }
        - { model: delivery, statement: 'Кілька логістичних каналів і власні потужності на випадок збою одного з них', explanation: 'Резервний канал постачання чи власна логістика дозволяють дотримати обіцяний термін навіть при збої основного маршруту.', source: slack-brandon-jones, alsoSources: [inditex-fy2025-results] }
        - { model: flexibility, statement: 'Постачальники з коротким циклом виконання дрібних і змінних замовлень', explanation: 'Постачальник, готовий приймати дрібні й часто змінювані замовлення, підтримує здатність компанії швидко міняти асортимент.', source: slack-brandon-jones, alsoSources: [kernel-annual-report-fy2025] }

    - id: inventory
      title: Управління запасами
      cells:
        - { model: cost, statement: 'Мінімальний запас і велика партія замовлення заради економії на закупівлі', explanation: 'Великі партії закупівлі знижують ціну одиниці, навіть якщо це збільшує запас на складі.', source: stevenson }
        - { model: quality, statement: 'Запас перевірених партій з відстеженням постачальника і дати контролю', explanation: 'Простежуваність кожної партії до постачальника дозволяє швидко ізолювати проблему, якщо дефект виявлено пізніше.', source: stevenson }
        - { model: delivery, statement: 'Запас готової продукції поруч із клієнтом для миттєвого виконання замовлення', explanation: 'Запас готового товару поблизу клієнта дозволяє виконати замовлення негайно, не чекаючи на виробничий цикл.', source: stevenson }
        - { model: flexibility, statement: 'Запас уніфікованих компонентів, а не готових виробів, для пізньої диференціації', explanation: 'Запас на рівні компонентів, які збирають у різні варіанти лише в останній момент, дає змогу швидко змінювати асортимент готової продукції.', source: stevenson }

    - id: scheduling
      title: Оперативно-календарне планування
      cells:
        - { model: cost, statement: 'Довгі виробничі цикли з рідкими переналагодженнями обладнання', explanation: 'Рідкі переналагодження зберігають час роботи обладнання на випуск, а не на підготовку, знижуючи витрати на одиницю.', source: heizer-render }
        - { model: quality, statement: 'Розклад із запасом часу на повторний контроль і виправлення браку', explanation: 'Запас часу в розкладі не дає тиску термінів змушувати пропускати етапи контролю якості.', source: heizer-render }
        - { model: delivery, statement: 'Пріоритет завдань за найближчим строком виконання', explanation: 'Черга завдань, вибудувана за строком виконання, а не за зручністю виробництва, напряму підтримує дотримання обіцяного терміну.', source: heizer-render }
