  essay:
    prompt: >-
      Оберіть три підприємства різних галузей (можна скористатися прикладами з лекції теми 2) і для кожного
      визначте провідний операційний пріоритет, окремо назвавши кваліфікаційну вимогу ринку й виграшну
      характеристику замовлення. Потім оберіть одне підприємство, продукт якого перебуває на стадії
      зростання, і складіть план змін в операційній системі для його переходу на стадію зрілості.
    maxWords: 450
    expectations:
      - Для кожного з трьох підприємств визначено провідний пріоритет з обґрунтуванням за описом ринку й операцій, а не навмання.
      - Кваліфікаційна вимога ринку й виграшна характеристика замовлення розмежовані окремо для кожного підприємства, а не змішані в одне поняття.
      - План змін для переходу зі стадії зростання на зрілість містить конкретні зміни в операційній системі (процес, потужність, запаси тощо), а не загальні побажання.
      - Запропоновані зміни прямо узгоджені зі стадією життєвого циклу, а не переказують загальну теорію без застосування до підприємства.
    hints:
      - Перегляньте розділ лекції «Операційні пріоритети і компроміси між ними» — визначення кваліфікатора й виграшної характеристики замовлення.
      - Перегляньте розділ лекції «Вплив життєвого циклу продукту на операційну стратегію» — характер процесу на кожній стадії.
