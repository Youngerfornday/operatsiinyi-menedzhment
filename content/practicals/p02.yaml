# Дані тренажера практичної 2. Реєстр (мета, результати, рубрика, ПРН, дані статистики) — у course.yaml.
# Моделі матриці — чотири операційні пріоритети теми 2 (cost-priority, quality-priority, delivery-priority,
# flexibility-priority з course.yaml); ознаки — десять класичних рішень операційного менеджменту (проєктування
# товару, якість, процес і потужність, розміщення, планування площ, персонал, ланцюг постачання, запаси,
# оперативне планування, обслуговування). Приклади компаній — лише з docs/research/cases.md (кейси теми 2:
# kernel, ferrexpo, zara-inditex, southwest-airlines).
id: p02
title: Операційна стратегія та операційні пріоритети підприємства
intro: >-
  У тренажері зіставте кожне формулювання рішення операційного менеджменту з операційним пріоритетом, який
  воно найточніше обслуговує. Перша спроба навчальна — після кожної ознаки (рядка) відкривається розбір усіх
  чотирьох клітинок із поясненням і джерелом; друга спроба оцінюється за рубрикою практичної без розбору до
  завершення. Нижче також є практика «визначте пріоритет компанії» за короткими описами реальних підприємств.
  XP нараховується за оцінювану спробу.
status: review
updatedAt: '2026-09-23'
sources:
  - id: heizer-render
    type: book
    title: 'Operations Management: Sustainability and Supply Chain Management'
    authors: [Heizer J., Render B., Munson C.]
    publisher: Pearson
    year: 2016
    language: en
    url: https://openlibrary.org/isbn/9780134163512
    checkedAt: '2026-09-22'
    note: Джерело класичного переліку рішень операційного менеджменту (проєктування товару, процес і потужність, розміщення, планування площ, обслуговування) і їх зв’язку зі структурними рішеннями стратегії.

  - id: stevenson
    type: book
    title: Operations Management
    authors: [Stevenson W. J.]
    publisher: McGraw-Hill Education
    year: 2020
    language: en
    url: https://openlibrary.org/isbn/9781260575712
    checkedAt: '2026-09-22'
    note: Джерело трактування операційних пріоритетів (витрати, якість і надійність, час виконання, гнучкість) і їх впливу на рішення про якість, персонал і запаси.

  - id: slack-brandon-jones
    type: book
    title: Operations and Process Management
    authors: [Slack N., Brandon-Jones A.]
    publisher: Pearson Education
    year: 2021
    language: en
    url: https://openlibrary.org/isbn/9781292350103
    checkedAt: '2026-09-22'
    note: Джерело трактування рішень про планування виробничих площ і управління ланцюгом постачання під різні операційні пріоритети.

  - id: kernel-annual-report-fy2025
    type: report
    title: Kernel Holding S.A. Annual Report and Accounts for the year ended 30 June 2025
    publisher: Kernel Holding S.A.
