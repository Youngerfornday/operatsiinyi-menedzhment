<svg xmlns="http://www.w3.org/2000/svg" id="fig-t06-1" class="scheme" viewBox="0 0 640 380" role="img" aria-labelledby="fig-t06-1-title fig-t06-1-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t06-1-title">Рисунок 1. Ієрархія планування операцій: довгий, середній і короткий горизонт</title>
  <desc id="fig-t06-1-desc">Піраміда з трьох горизонтальних шарів згори вниз. Верхній, найширший шар — довгостроковий горизонт: потужність, розміщення об'єктів, технологія, вимірюється роками. Середній шар, виділений карміновим і вужчий за верхній, — середньостроковий горизонт: агрегатне планування персоналу, понаднормового часу, запасів і субпідряду, вимірюється місяцями. Нижній, найвужчий шар — короткостроковий горизонт: диспетчерування і черговість конкретних робіт, вимірюється днями й тижнями. Між шарами вертикальні стрілки згори вниз підписані «межі задає вищий рівень». Унизу карміновий блок нагадує, що нижчий рівень не може вийти за межі, які задав вищий.</desc>
  <style>
    #fig-t06-1 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t06-1 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t06-1 .t { fill: var(--ink, #0f1c2e); font-size: 14.5px; font-weight: 650; }
    #fig-t06-1 .s { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t06-1 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t06-1 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.5; fill: none; }
    #fig-t06-1 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t06-1 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t06-1 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t06-1 .exam { stroke: var(--err, #b42318); }
    #fig-t06-1 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12.5px; font-weight: 600; }
    #fig-t06-1 .box.exam { fill: var(--err-bg, #fdecea); stroke: var(--err, #b42318); }
    #fig-t06-1 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t06-1 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t06-1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box box-owner" x="32" y="30" width="576" height="70" rx="8"/>
  <text class="t" x="320" y="56" text-anchor="middle">Довгостроковий горизонт — роки</text>
  <text class="s" x="320" y="76" text-anchor="middle">потужність, розміщення об'єктів, технологія</text>
  <text class="s" x="320" y="92" text-anchor="middle">структурні рішення: дорогі, повільні, майже незворотні</text>

  <path class="arrow" marker-end="url(#fig-t06-1-arr)" d="M320 100 L320 124"/>
  <text class="lbl" x="336" y="116">межі задає вищий рівень</text>

  <rect class="box exam" x="80" y="128" width="480" height="70" rx="8"/>
  <text class="t" x="320" y="154" text-anchor="middle">Середньостроковий горизонт — місяці</text>
  <text class="exam-t" x="320" y="174" text-anchor="middle">агрегатний план: персонал, понаднормовий час, запаси, субпідряд</text>
  <text class="s" x="320" y="190" text-anchor="middle">узгоджує наявну потужність із сезонним попитом</text>

  <path class="arrow" marker-end="url(#fig-t06-1-arr)" d="M320 198 L320 222"/>
  <text class="lbl" x="336" y="214">межі задає вищий рівень</text>

  <rect class="box" x="130" y="226" width="380" height="70" rx="8"/>
  <text class="t" x="320" y="252" text-anchor="middle">Короткостроковий горизонт — дні й тижні</text>
  <text class="s" x="320" y="272" text-anchor="middle">диспетчерування і черговість конкретних робіт</text>
  <text class="s" x="320" y="288" text-anchor="middle">доводить план до кожного робочого місця</text>

  <rect class="box exam" x="32" y="314" width="576" height="50" rx="8"/>
  <text class="exam-t" x="320" y="336" text-anchor="middle">Кожен нижчий рівень деталізує вищий</text>
  <text class="exam-t" x="320" y="352" text-anchor="middle">і не може перевищити межі, які вищий рівень уже задав</text>

  <circle class="refc" cx="56" cy="46" r="11"/><text class="refn" x="56" y="50">1</text>
  <circle class="refc exam" cx="104" cy="144" r="11"/><text class="refn exam-n" x="104" y="148">2</text>
  <circle class="refc" cx="154" cy="242" r="11"/><text class="refn" x="154" y="246">3</text>
  <circle class="refc" cx="56" cy="330" r="11"/><text class="refn" x="56" y="334">4</text>
</svg>
