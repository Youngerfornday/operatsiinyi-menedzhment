# Презентація теми 6. Текст слайдів стислий: повний виклад — у lecture.mdx, пояснення — у нотатках.
# Кожне число слайда має бути в лонгріді теми й мати джерело зі sources.yaml.
topic: t06
slides:
  - id: title
    type: title
    subtitle: Модуль 2. Управління поточним функціонуванням операційної системи
    notes: >-
      Вступ через диспетчера поштового оператора вранці понеділка: три різні питання «скільки» на трьох різних
      горизонтах — сьогоднішня зміна, квартальна потужність, порядок обробки черги. Запитайте аудиторію, чому
      план на квартал не годиться для сьогоднішньої зміни.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після теми
    notes: >-
      Чотири результати: два розрахункові про прогноз і агрегатний план, два — про запаси й MRP. Це найважча
      тема курсу — п’ять різних розрахункових задач на п’яти горизонтах. Запитайте, яку з п’яти задач аудиторія
      вважає найближчою до власного досвіду.

  - id: s01-section
    type: section
    number: 1
    title: Довгострокове, середньострокове та короткострокове планування операцій
    notes: >-
      Перше питання теми. Три горизонти: довгий (потужність, роками), середній (агрегатний план, місяцями),
      короткий (диспетчерування, днями). Кожен нижчий рівень працює в межах, які задав вищий. Запитайте, яке
      рішення на підприємстві аудиторія віднесла б до довгого горизонту, а яке — до короткого.

  - id: s01-figure
    type: figure
    title: Ієрархія планування операцій
    figure: fig-01-planning-horizons.svg
    caption: Кожен нижчий горизонт деталізує рішення вищого і не може вийти за його межі.
    sources: [heizer-render-munson-2016]
    notes: >-
      Диспетчер не може відправити в зміну більше людей, ніж дозволяє агрегатний план; агрегатний план не може
      обіцяти випуск понад потужність, яку не встигли побудувати. Приклад: рішення про нову лінію ухвалюють за
      рік до сплеску попиту. Запитайте, що станеться, якщо короткий горизонт спробує компенсувати помилку довгого.

  - id: s01-case-ukrposhta
    type: case
    title: Укрпошта — 2 млн відправлень/добу проти ≈117 тис. фактичних
    case: ukrposhta
    facts:
      - 'За даними міністерства, у 2025 р. завершено автоматизацію: 24 логістичні центри за 22 місяці.'
      - Заявлена потужність сортування — до 2 млн відправлень на добу.
      - За 2025 рік доставлено 42,7 млн посилок — це близько 117 тис. на добу в середньому.
      - Заявлену потужність задіяно приблизно на 5,9% у середньому за добу (CAP-01).
      - Аналогічне рішення про нарощування потужності — інвестиція Нової Пошти 492 млн грн у сортувальні лінії.
    question: Про що каже розрив між заявленою потужністю і фактичним середньодобовим обсягом?
    sources: [ukrposhta-2025-summary, nova-poshta-results-2026]
    notes: >-
      Використовуйте формулу CAP-01 з теми 1: 117 000 / 2 000 000 ≈ 5,9%. Низький відсоток не доводить
      надлишковості — потужність будують під пік, а не під середній день. Запитайте, чому 6% завантаження саме
      по собі не доводить, що інвестиція в автоматизацію була зайвою.

  - id: s02-section
    type: section
    number: 2
    title: Прогнозування в операційному менеджменті — методи та оцінка точності
    notes: >-
      Друге питання теми. Кількісні методи: ковзна середня, зважена ковзна середня, експоненційне
      згладжування. Точність оцінюють MAD, MSE, MAPE; системне зміщення — сигнал відстеження. Запитайте, чим
      відрізняється «неточний прогноз» від «зміщеного прогнозу».

  - id: s02-methods
    type: bullets
    title: Три кількісні методи прогнозування
    bullets:
      - 'Проста ковзна середня: Ft = середнє попиту за n останніх періодів (FC-01).'
      - 'Зважена ковзна середня: більша вага ближчому періоду, сума ваг = 1 (FC-02).'
      - 'Експоненційне згладжування: Ft = Ft−1 + α·(Dt−1 − Ft−1) (FC-03).'
      - Ширше вікно чи менше α — стабільніший, але повільніший прогноз.
      - Вужче вікно чи більше α — чутливіший до останнього коливання попиту.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Приклад: попит 120→150 за 8 тижнів дає прогноз простою МА 144,0, зваженою — 145,2 на тиждень 9. Запитайте,
      який метод аудиторія обрала б для ряду з різким одноразовим викидом попиту.

  - id: s02-accuracy
    type: formula
    title: Точність і зміщення прогнозу
    formula: MAD, MSE, MAPE — розмір похибки; TS = ΣRSFE/MAD — зміщення
    explanation:
      - 'MAD ≈ 8,87 шт., MSE ≈ 109,25 шт.², MAPE ≈ 6,26% — усі три вимірюють розмір похибки (FC-04–FC-06).'
      - Сигнал відстеження TS ≈ 6,00 — шість «стандартних» похибок зміщення в один бік (FC-07).
      - 'Усі шість похибок у прикладі додатні: прогноз жодного разу не перевищив факт.'
      - Низький MAPE сам собою не звільняє від перевірки сигналу відстеження.
    sources: [kapinos-babiy-2013]
    notes: >-
      Причина зміщення в прикладі — попит стабільно зростає, а експоненційне згладжування з α = 0,3
      підтягується до нього лише частково. Запитайте, що робити менеджеру, який побачив TS ≈ 6,00.

  - id: s03-section
    type: section
    number: 3
    title: 'Агрегатне планування: стратегії погоні та рівномірного виробництва'
    notes: >-
      Третє питання теми. Стратегія погоні — випуск дорівнює попиту, персонал наймають і звільняють (AGG-01).
      Стратегія рівномірного виробництва — сталий темп, різницю покриває запас (AGG-02). Жодна не «правильніша»
      абстрактно. Запитайте, яка стратегія дорожча, коли зберігання дуже дороге.

  - id: s03-figure
    type: figure
    title: Погоня проти рівномірного виробництва
    figure: fig-02-chase-level.svg
    caption: Погоня йде за кожним коливанням попиту, рівномірне виробництво тримає сталий темп і покриває різницю запасом.
    sources: [heizer-render-munson-2016]
    notes: >-
      Погоня платить наймом, звільненням і плинністю персоналу; рівномірне виробництво платить зберіганням
      запасу. Запитайте, яку статтю витрат аудиторія вважає керованішою на знайомому підприємстві.

  - id: s03-costs
    type: bullets
    title: Порівняння стратегій на прикладі шести місяців
    bullets:
      - 'Попит 700–1300–900 виробів/міс.; продуктивність 20 виробів/робітника.'
      - 'Стратегія погоні: 30 найнято, 25 звільнено за півроку; разом 1 060 000 г.о. (AGG-01, AGG-03).'
      - 'Стратегія рівномірного виробництва: один найм на старті, запас до 500 шт.; разом 995 000 г.о. (AGG-02, AGG-03).'
      - Регулярна оплата праці однакова в обох стратегіях — 900 000 г.о., бо сумарний випуск однаковий.
      - Рівномірне виробництво дешевше на 65 000 г.о. за цих ставок витрат — перевага не універсальна.
    sources: [heizer-render-munson-2016]
    notes: >-
      Наголосіть: перевага рівномірного виробництва тримається, доки зберігання дешевше за найм-звільнення.
      Запитайте, за яких ставок витрат порівняння могло б дати протилежний результат.

  - id: s03-case-tesla
    type: case
    title: Tesla, Model 3 — крива нарощування темпу
    case: tesla-model3-ramp
    facts:
      - 'Випуск за квартал: 260 → 2425 → 9766 → 28 578 → 53 239 → 61 394 автомобілі (2017–2018).'
      - 'Компанія: «наш попередній досвід показав складність точного прогнозування темпів виробництва».'
      - 'У листі акціонерам: «ми зробили помилку, додавши забагато автоматизації занадто швидко».'
      - '5031 автомобіль за останній тиждень 2 кв. 2018 — це пік, а не середній темп (≈2200/тиждень).'
    question: Про що каже офіційне визнання складності прогнозування власного темпу нарощування?
    sources: [tesla-q1-2018-update, tesla-q4-2018-production]
    notes: >-
      Крива — типове освоєння нової потужності, і навіть компанія з повним доступом до власних даних визнає
      систематичну складність прогнозу. Запитайте, чому піковий тижневий показник не можна плутати із середнім.

  - id: s04-section
    type: section
    number: 4
    title: Функції оперативного управління та організація диспетчерування
    notes: >-
      Четверте питання теми. Диспетчерування — найкоротший горизонт: розподіл конкретних робіт між конкретними
      потужностями в реальному часі, у межах, які вже задав агрегатний план. Запитайте, чим диспетчерування
      відрізняється від агрегатного плану за горизонтом.

  - id: s04-case-uz
    type: case
    title: Укрзалізниця — автоматизований розподіл вагонів у чергу на ремонт
    case: ukrzaliznytsia
    facts:
      - 'Система враховує завантаженість депо, виробничі можливості й територіальну близькість.'
      - Мета — «єдина прозора черга на ремонт за зрозумілими цифровими правилами однаково для всіх».
      - Тестова експлуатація — з 01.01.2026.
      - У 2024 р. відремонтовано 24 233 вагони — на 18,7% більше, ніж роком раніше.
    question: Чому розподіл вагонів у ремонт — це задача диспетчерування, а не оперативно-календарного планування самого ремонту?
    sources: [ukrzaliznytsia-repair-dispatch-2025, ukrzaliznytsia-repair-volume-2025]
    notes: >-
      Система вирішує «яке депо отримає конкретний вагон просто зараз», а не «скільки ремонтувати» чи «в якому
      порядку на одному робочому місці». Запитайте, чому зростання обсягу ремонту не доводить, що дефіцит
      потужностей закрито.

  - id: s05-section
    type: section
    number: 5
    title: Матеріально-технічне забезпечення підприємства — функції та характеристика
    notes: >-
      П’яте питання теми. МТЗ постачає ресурси до початку виробництва: визначення потреби, закупівля,
      доставка, складування, розподіл. Межа з наступним розділом: МТЗ про постачальника й логістику, запаси —
      про політику складу. Запитайте, чиє рішення — обрати транзитну чи складську форму постачання.

  - id: s05-functions
    type: bullets
    title: Основні й допоміжні функції МТЗ
    bullets:
      - 'Основні: визначення потреби, закупівля, доставка, складування, розподіл, контроль поставок.'
      - 'Допоміжні: маркетингові (вибір постачальника) і юридичні (оформлення угод).'
      - 'Транзитна форма: від виробника напряму — швидша, вимагає більших партій.'
      - 'Складська форма: через посередника — гнучкіша партія, додаткові витрати зберігання.'
      - Час постачання й надійність постачальника — вхідні дані для розрахунків запасів.
    sources: [kapinos-babiy-2013]
    notes: >-
      Приклад: вибір постачальника враховує не лише ціну, а й здатність швидко змінити обсяг чи асортимент.
      Запитайте, який критерій вибору постачальника аудиторія поставила б на перше місце.

  - id: s06-section
    type: section
    number: 6
    title: Управління запасами — фіксований розмір замовлення, фіксований інтервал, ABC-аналіз
    notes: >-
      Шосте питання теми. EOQ мінімізує суму витрат на замовлення й зберігання; точка замовлення і страховий
      запас визначають, коли й скільки; система з фіксованим інтервалом замовляє поповнення до рівня S за
      розкладом. Запитайте, чому EOQ і ROP — це дві різні відповіді на два різні питання.

  - id: s06-figure
    type: figure
    title: Цикл EOQ — точка замовлення, час постачання, страховий запас
    figure: fig-03-eoq-cycle.svg
    caption: Запас спадає з постійним темпом; у точці замовлення подається нова партія, яка надходить через час постачання L.
    sources: [starchenko-kalinko-kosach-2020]
    notes: >-
      Розберіть пилку: спад — споживання, стрибок — надходження партії, смуга внизу — страховий запас, який
      лінія в нормі не перетинає. Запитайте, що станеться, якщо час постачання L раптово подовжиться.

  - id: s06-numbers
    type: bullets
    title: EOQ, точка замовлення, страховий запас — приклад
    bullets:
      - 'D = 7200 шт./рік, S = 450 г.о./замовлення, H = 18 г.о./рік → EOQ = 600 шт., 12 замовлень/рік (EOQ-01).'
      - 'd̄ = 24 шт./день, L = 6 днів → ROP без страхового запасу = 144 шт. (EOQ-03).'
      - 'z = 1,65, σ_dLT = 20 → страховий запас SS = 33 шт.; ROP разом = 177 шт. (EOQ-04).'
      - 'Система з фіксованим інтервалом T = 30 днів: рівень «поповнення до» S = 897 шт. (EOQ-06).'
      - 'ABC-аналіз: три з восьми позицій запасу дають 85,0% вартісного споживання (EOQ-05).'
    sources: [starchenko-kalinko-kosach-2020, kapinos-babiy-2013]
    notes: >-
      При EOQ = 600 витрати оформлення точно дорівнюють витратам зберігання — 5400 г.о. кожна, разом 10 800.
      Запитайте, як зміниться EOQ, якщо вартість зберігання H подвоїться.

  - id: s06-case-kernel
    type: case
    title: Kernel — елеватор як буфер між урожаєм і переробкою
    case: kernel
    facts:
      - '29 елеваторів; приймання липень — грудень дає сезонний оборот понад 1,0 ємності мережі за сезон.'
      - Зернові запаси групи на кінець звітного року — 209 тис. т.
      - У вересні 2026 р. компанія закупила 40 000 т модульного зерносховища.
      - Модульне зберігання — реакція на обмеження чорноморських експортних маршрутів, а не плановий цикл поставок.
    question: Яку функцію запасу виконує елеватор — і чим модульне зерносховище відрізняється від планового поповнення?
    sources: [kernel-annual-report-fy2025, kernel-modular-storage-2026]
    notes: >-
      Елеватор поглинає різницю темпів між нерівномірним надходженням сировини й рівномірною цілорічною
      переробкою — та сама роль, що в запасу стратегії рівномірного виробництва. Запитайте, чому купівля
      40 000 т не «розв’язує» проблему експортної блокади для компанії, що оперує мільйонами тонн.

  - id: s06-case-toyota
    type: case
    title: Toyota — just-in-time проти буфера запасу
    case: toyota-tps
    facts:
      - 'Офіційне визначення just-in-time: «виробляти лише потрібне, тоді, коли потрібно, і в потрібній кількості».'
      - Кіічіро Тойода вивів принцип із того, що автомобіль складається більш ніж із 30 000 деталей.
      - Офіційний опис TPS не наводить жодної кількісної метрики запасів.
    question: Чому just-in-time — це логіка стратегії погоні, перенесена з персоналу на запас постачання?
    sources: [toyota-production-system]
    notes: >-
      JIT свідомо відмовляється від буфера й вимагає, щоб темп постачання точно збігався з темпом споживання —
      пряма протилежність EOQ, яка свідомо тримає запас. Запитайте, чому успіх Toyota не доводить переносності
      відмови від буфера на будь-яке підприємство.

  - id: s07-section
    type: section
    number: 7
    title: 'Планування потреби в матеріалах — брутто- і нетто-потреба, розмір партії'
    notes: >-
      Сьоме питання теми. MRP розв’язує задачу залежного попиту, яку EOQ розв’язати не може: потреба на
      компонент виводиться напряму з плану випуску готового виробу через специфікацію. Запитайте, чим залежний
      попит відрізняється від незалежного.

  - id: s07-figure
    type: figure
    title: Розгортання потреби за триярусною специфікацією
    figure: fig-04-mrp-explosion.svg
    caption: Брутто-потреба нижчого рівня виводиться з планового замовлення вищого рівня.
    sources: [starchenko-kalinko-kosach-2020]
    notes: >-
      Наголосіть: брутто-потреба дочірнього рівня — це не MPS напряму, а планове замовлення батьківського
      рівня, помножене на норму витрати. Запитайте, чому запас компонента другого рівня може виглядати
      солідним, але насправді закривати меншу частину потреби.

  - id: s07-numbers
    type: bullets
    title: Розгортання потреби — приклад
    bullets:
      - 'MPS: 100 виробів А; запас А = 10 → планове замовлення А = 90 шт. (MRP-01, MRP-02).'
      - 'Вузол B (2 на А): брутто 180, запас 30 → планове замовлення B = 150 шт.'
      - 'Деталь C (3 на А): брутто 270, запас 0 → планове замовлення C = 270 шт.'
      - 'Деталь D (4 на B, рівень 2): брутто 600, запас 100 → планове замовлення D = 500 шт.'
      - 'Розмір партії «партія за партією»: замовлення = точно нетто-потреба, без надлишку (MRP-03).'
    sources: [starchenko-kalinko-kosach-2020]
    notes: >-
      Попит на D залежить від попиту на B, а не від власного прогнозу продажів D, — це і є залежний попит.
      Запитайте, скільки D довелося б замовити, якби запас D дорівнював нулю.

  - id: s08-section
    type: section
    number: 8
    title: Контроль в операційному менеджменті; правила пріоритетів у складанні черг робіт
    notes: >-
      Восьме питання теми. SPT мінімізує середній час виконання, EDD — максимальне запізнення; жодне не
      оптимізує обидва критерії одразу. Правило Джонсона мінімізує сумарний час на двох верстатах; критичне
      відношення перераховують щодня. Запитайте, який критерій важливіший для дільниці зі штрафами за зрив строку.

  - id: s08-rules
    type: bullets
    title: Чотири правила пріоритетів — приклад
    bullets:
      - 'SPT: середній час виконання 10,6 дня, максимальне запізнення 13 днів (SCH-01).'
      - 'EDD: середній час виконання 14,2 дня, максимальне запізнення 6 днів (SCH-02).'
      - 'Правило Джонсона (2 верстати): makespan 28 днів проти 32 у довільному порядку (SCH-03).'
      - 'Критичне відношення CR = (строк − сьогодні) / залишок обробки; найменший CR — першим (SCH-05).'
      - CR &lt; 1 — завдання відстає від графіка; CR &gt; 1 — випереджає його.
    sources: [kapinos-babiy-2013]
    notes: >-
      SPT і EDD оптимізують різні критерії на тих самих п’яти завданнях — жодна послідовність не виграє за
      обома одразу. Запитайте, яке правило аудиторія обрала б для дільниці без жодних штрафів за запізнення.

  - id: s08-case-southwest
    type: case
    title: Southwest Airlines — колапс планування екіпажів
    case: southwest-airlines
    facts:
      - 'Уніфікований парк Boeing 737 і мережа «точка-точка» дають високу утилізацію активів.'
      - 'За зимового шторму в грудні 2022 р. скасовано 16 900 рейсів, понад два мільйони пасажирів без обслуговування.'
      - Штраф Міністерства транспорту США — 140 млн дол.; компанія додатково виплатила понад 600 млн дол. повернень.
      - 'За свідченнями профспілки пілотів: дві непов’язані ІТ-системи давали суперечливі рекомендації під час кризи.'
    question: Чому операційна перевага в одній підсистемі (розворот літака) не врятувала від колапсу іншої (планування екіпажів)?
    sources: [southwest-10k-2025, southwest-dot-penalty-2023]
    notes: >-
      Уніфікований парк оптимізований під нормальне навантаження; колапс стався в підсистемі розподілу
      екіпажів на рейси під піковим навантаженням — задача того самого класу, що й правила пріоритетів, тільки
      на масштабі тисяч рейсів. Запитайте, чому штраф DOT не можна вважати повною вартістю збою.

  - id: summary
    type: summary
    title: Підсумок теми
    bullets:
      - Довгий, середній і короткий горизонт планування — кожен нижчий працює в межах вищого.
      - Прогноз (MA, зважена MA, експоненційне згладжування) дає число; MAD, MSE, MAPE, TS перевіряють, чи йому довіряти.
      - Агрегатний план обирає між стратегією погоні (найм-звільнення) і рівномірного виробництва (запас).
      - EOQ, точка замовлення, страховий запас і ABC-аналіз керують незалежним попитом; MRP — залежним.
      - Правила пріоритетів (SPT, EDD, Джонсон, критичне відношення) оптимізують різні критерії черги.
    sources: [heizer-render-munson-2016, starchenko-kalinko-kosach-2020]
    notes: >-
      Поверніться до диспетчера з першого слайда: тепер аудиторія має назвати, яка з п’яти задач теми стоїть за
      кожним із його трьох питань. Запитайте, яку із задач аудиторія вважає найскладнішою для власного проєкту.
