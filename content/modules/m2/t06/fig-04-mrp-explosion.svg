<svg xmlns="http://www.w3.org/2000/svg" id="fig-t06-4" class="scheme" viewBox="0 0 640 400" role="img" aria-labelledby="fig-t06-4-title fig-t06-4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t06-4-title">Рисунок 4. Розгортання потреби за триярусною специфікацією виробу</title>
  <desc id="fig-t06-4-desc">Дерево специфікації виробу з трьох рівнів. Угорі один блок готового виробу А — рівень 0, з підписом «MPS задає брутто-потребу». Від нього дві стрілки вниз до вузла B і деталі C рівня 1, кожна стрілка підписана нормою витрати — кількістю B і C на один виріб А. Від вузла B ще одна стрілка вниз до деталі D рівня 2, підписана нормою витрати D на один B. Під кожним блоком — міні-таблиця з чотирма рядками: брутто-потреба, наявний запас, нетто-потреба, планове замовлення. Стрілки показують, що планове замовлення батьківського рівня стає множником для брутто-потреби дочірнього рівня.</desc>
  <style>
    #fig-t06-4 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t06-4 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t06-4 .t { fill: var(--ink, #0f1c2e); font-size: 13.5px; font-weight: 650; }
    #fig-t06-4 .s { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t06-4 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t06-4 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.5; fill: none; }
    #fig-t06-4 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t06-4 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t06-4 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t06-4 .exam { stroke: var(--err, #b42318); }
    #fig-t06-4 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12px; font-weight: 600; }
    #fig-t06-4 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t06-4 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t06-4-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box box-owner" x="240" y="24" width="160" height="88" rx="8"/>
  <text class="t" x="320" y="46" text-anchor="middle">Виріб А</text>
  <text class="lbl" x="320" y="62" text-anchor="middle">рівень 0 — MPS задає брутто</text>
  <text class="s" x="320" y="80" text-anchor="middle">брутто / запас / нетто</text>
  <text class="s" x="320" y="96" text-anchor="middle">планове замовлення</text>

  <path class="arrow" marker-end="url(#fig-t06-4-arr)" d="M280 112 L152 168"/>
  <text class="lbl" x="190" y="140">× норма B/А</text>
  <path class="arrow" marker-end="url(#fig-t06-4-arr)" d="M360 112 L488 168"/>
  <text class="lbl" x="450" y="140">× норма C/А</text>

  <rect class="box exam" x="72" y="172" width="160" height="88" rx="8"/>
  <text class="t" x="152" y="194" text-anchor="middle">Вузол B</text>
  <text class="exam-t" x="152" y="210" text-anchor="middle">рівень 1</text>
  <text class="s" x="152" y="228" text-anchor="middle">брутто / запас / нетто</text>
  <text class="s" x="152" y="244" text-anchor="middle">планове замовлення</text>

  <rect class="box" x="408" y="172" width="160" height="88" rx="8"/>
  <text class="t" x="488" y="194" text-anchor="middle">Деталь C</text>
  <text class="lbl" x="488" y="210" text-anchor="middle">рівень 1</text>
  <text class="s" x="488" y="228" text-anchor="middle">брутто / запас / нетто</text>
  <text class="s" x="488" y="244" text-anchor="middle">планове замовлення</text>

  <path class="arrow" marker-end="url(#fig-t06-4-arr)" d="M152 260 L152 296"/>
  <text class="lbl" x="168" y="282">× норма D/B</text>

  <rect class="box" x="72" y="300" width="160" height="88" rx="8"/>
  <text class="t" x="152" y="322" text-anchor="middle">Деталь D</text>
  <text class="lbl" x="152" y="338" text-anchor="middle">рівень 2</text>
  <text class="s" x="152" y="356" text-anchor="middle">брутто / запас / нетто</text>
  <text class="s" x="152" y="372" text-anchor="middle">планове замовлення</text>

  <circle class="refc" cx="240" cy="46" r="11"/><text class="refn" x="240" y="50">1</text>
  <circle class="refc exam" cx="72" cy="194" r="11"/><text class="refn exam-n" x="72" y="198">2</text>
  <circle class="refc" cx="72" cy="322" r="11"/><text class="refn" x="72" y="326">3</text>
  <circle class="refc" cx="568" cy="244" r="11"/><text class="refn" x="568" y="260">4</text>
</svg>
