  # Основна література курсу
  - id: kapinos-babii-2013
    type: book
    title: 'Операційний менеджмент: навчальний посібник'
    authors: [Капінос Г. І., Бабій І. В.]
    publisher: Центр учбової літератури
    year: 2013
    language: uk
    url: https://duikt.edu.ua/uploads/l_1479_22227234.pdf
    checkedAt: '2026-09-24'
    note: 'Джерело моделей управління запасами: розділ 6.2.4 «Системи управління запасами при незалежному попиті», с. 170–178 — EOQ, точка замовлення, страховий запас і система з фіксованою періодичністю замовлення (EOQ-01, EOQ-03, EOQ-04, EOQ-06). Складу функцій матеріально-технічного забезпечення (основні й допоміжні, транзитна й складська форми) у виданні немає, тому слайд про функції МТЗ на нього не посилається (звірка повного тексту 2026-09-24). Видання 2013 р. старше порогу 2016 р., застосованого при доборі основної літератури силабусу (course.yaml, розділ literature), тому в перелік літератури курсу не входить; тут використане як першоджерело розрахункової бази формул.'

