<svg xmlns="http://www.w3.org/2000/svg" id="fig-t06-3" class="scheme" viewBox="0 0 640 316" role="img" aria-labelledby="fig-t06-3-title fig-t06-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t06-3-title">Рисунок 3. Цикл EOQ: точка замовлення, час постачання і страховий запас</title>
  <desc id="fig-t06-3-desc">Графік запасу в часі у вигляді пилки. Рівень запасу спадає прямою лінією зверху вниз з постійним нахилом — темпом споживання, доки не досягне нижньої смуги страхового запасу. Горизонтальна пунктирна лінія посередині висоти — точка замовлення ROP. Рівні підписано ліворуч від графіка: SS + Q, ROP і SS. У момент, коли лінія запасу перетинає цю пунктирну лінію, подається нове замовлення; фігурна дужка на осі часу від цього моменту до наступного стрибка лінії вгору підписана «час постачання L». У момент надходження партії рівень запасу різко стрибає вгору на розмір партії Q — до максимального запасу SS + Q, і спад повторюється в наступному циклі. Знизу графіка — вузька кармінова смуга страхового запасу SS, буфер під точкою замовлення, який лінія запасу в нормі не повинна перетинати.</desc>
  <style>
    #fig-t06-3 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t06-3 .t { fill: var(--ink, #0f1c2e); font-size: 14px; font-weight: 650; }
    #fig-t06-3 .s { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t06-3 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t06-3 .axis { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t06-3 .stock { stroke: var(--ink, #0f1c2e); stroke-width: 2; fill: none; }
    #fig-t06-3 .rop { stroke: var(--ink-2, #445570); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    #fig-t06-3 .bracket { stroke: var(--err, #b42318); stroke-width: 1.5; fill: none; }
    #fig-t06-3 .ss { fill: var(--err-bg, #fdecea); }
    #fig-t06-3 .pt { fill: var(--err, #b42318); }
    #fig-t06-3 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12.5px; font-weight: 600; }
    #fig-t06-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t06-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t06-3 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t06-3 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t06-3-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z" fill="var(--err, #b42318)"/>
    </marker>
  </defs>

  <text class="t" x="320" y="30" text-anchor="middle">Запас у часі: пилка споживання і поповнення</text>

  <rect class="ss" x="120" y="204" width="480" height="16" />
  <path class="axis" d="M120 230 L600 230"/>
  <text class="lbl" x="600" y="248" text-anchor="end">час</text>

  <path class="rop" d="M120 150 L600 150"/>

  <text class="s" x="106" y="64" text-anchor="end">SS + Q</text>
  <text class="s" x="106" y="154" text-anchor="end">ROP</text>
  <text class="s" x="106" y="216" text-anchor="end">SS</text>

  <path class="stock" d="M128 60 L272 204 L272 60 L416 204 L416 60 L560 204"/>

  <circle class="pt" cx="218" cy="150" r="4"/>
  <circle class="pt" cx="272" cy="60" r="4"/>

  <path class="bracket" d="M218 260 L218 268 L272 268 L272 260"/>
  <text class="exam-t" x="245" y="294" text-anchor="middle">час постачання L</text>

  <circle class="refc" cx="128" cy="60" r="11"/><text class="refn" x="128" y="64">1</text>
  <circle class="refc exam" cx="218" cy="150" r="11"/><text class="refn exam-n" x="218" y="154">2</text>
  <circle class="refc" cx="245" cy="268" r="11"/><text class="refn" x="245" y="272">3</text>
  <circle class="refc" cx="612" cy="212" r="11"/><text class="refn" x="612" y="216">4</text>
