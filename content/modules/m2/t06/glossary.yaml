# Глосарій теми 6. Назви термінів мають дослівно збігатися з реєстром course.yaml (glossaryTerms, topic: t06).
# Визначення — робочі формулювання курсу; розрахункові співвідношення беруться з docs/research/formula-baseline.md.
topic: t06
terms:
  - id: demand-forecasting
    term: Прогнозування попиту
    definition: >-
      Оцінка майбутнього обсягу попиту на основі минулих даних і застосованого методу. Якісні методи —
      експертні оцінки, «мозкова атака», побудова «дерева цілей» — застосовують за браком статистики;
      кількісні методи спираються на числовий ряд минулих періодів і дають перевірний прогноз і
      перевірну похибку.
    synonyms:
      - прогноз попиту
      - demand forecasting
    forms:
      - прогнозування попиту
      - прогнозуванню попиту
      - прогнозуванням попиту
      - прогноз попиту
      - прогнозу попиту
    seeAlso: [moving-average, exponential-smoothing, forecast-error]

  - id: moving-average
    term: Ковзна середня
    definition: >-
      Метод прогнозування, за яким прогноз на наступний період дорівнює середньому фактичному попиту за
      кілька останніх періодів (вікно). Що ширше вікно, то стабільніший прогноз і повільніша реакція на
      зміну тренду; що вужче — то чутливіший до випадкового коливання останнього періоду.
    synonyms:
      - проста ковзна середня
      - moving average
    forms:
      - ковзна середня
      - ковзної середньої
      - ковзну середню
      - ковзною середньою
    seeAlso: [demand-forecasting, weighted-moving-average, forecast-error]

  - id: weighted-moving-average
    term: Зважена ковзна середня
    definition: >-
      Різновид ковзної середньої, у якому кожному з останніх періодів приписують окрему вагу (сума ваг
      дорівнює одиниці), причому ближчим періодам — більшу вагу. Реагує на зміну тренду швидше за просту
      ковзну середню, лишаючись такою ж простою у розрахунку.
    synonyms:
      - зважена ковзна середня
      - weighted moving average
    forms:
      - зважена ковзна середня
      - зваженої ковзної середньої
      - зважену ковзну середню
      - зваженою ковзною середньою
    seeAlso: [moving-average, demand-forecasting]

  - id: exponential-smoothing
    term: Експоненційне згладжування
    definition: >-
      Метод прогнозування, який будує новий прогноз на основі попереднього прогнозу й частки останньої
      похибки прогнозу, зваженої константою згладжування α (0 &lt; α &lt; 1). Не потребує тримати вікно
      останніх фактичних значень — лише попередній прогноз і одне число.
    synonyms:
      - експоненціальне згладжування
      - exponential smoothing
    forms:
      - експоненційне згладжування
      - експоненційного згладжування
      - експоненційним згладжуванням
    seeAlso: [demand-forecasting, moving-average, tracking-signal]

  - id: forecast-error
    term: Похибка прогнозу
    definition: >-
      Різниця між фактичним попитом періоду і прогнозом, зробленим на цей самий період. Основа для всіх
      показників точності прогнозу: MAD бере модуль похибки, MSE — її квадрат, MAPE — відсоток від
      фактичного попиту, а сигнал відстеження — суму похибок зі знаком.
    synonyms:
      - похибка прогнозування
      - forecast error
    forms:
      - похибка прогнозу
      - похибки прогнозу
      - похибку прогнозу
      - похибкою прогнозу
    seeAlso: [mad, mape, tracking-signal]

  - id: mad
    term: Середнє абсолютне відхилення
    definition: >-
      Показник точності прогнозу: середнє значення модулів похибок прогнозу за кілька періодів. Модуль
      не дає додатним і від’ємним похибкам скасувати одна одну, тому MAD показує реальний середній розмір
      помилки в тих самих одиницях, що й сам попит.
    synonyms:
      - MAD
      - mean absolute deviation
    forms:
      - середнє абсолютне відхилення
      - середнього абсолютного відхилення
      - середнім абсолютним відхиленням
    seeAlso: [forecast-error, mape, tracking-signal]

  - id: mape
    term: Середня абсолютна відсоткова похибка
    definition: >-
      Показник точності прогнозу: середнє значення модулів похибок, виражених у відсотках від
      фактичного попиту кожного періоду. На відміну від MAD і MSE вимірюється у відсотках, тому придатна
      для порівняння точності прогнозів товарів різного масштабу попиту.
    synonyms:
      - MAPE
      - mean absolute percentage error
    forms:
      - середня абсолютна відсоткова похибка
      - середньої абсолютної відсоткової похибки
      - середньою абсолютною відсотковою похибкою
    seeAlso: [forecast-error, mad, tracking-signal]

  - id: tracking-signal
    term: Сигнал відстеження
    definition: >-
      Показник, який ділить накопичену (зі знаком, а не за модулем) похибку прогнозу на MAD. На відміну
      від MAD, MSE й MAPE, які вимірюють розмір похибки, сигнал відстеження виявляє системне зміщення
      прогнозу в один бік.
    synonyms:
      - tracking signal
      - TS
    forms:
      - сигнал відстеження
      - сигналу відстеження
      - сигналом відстеження
    seeAlso: [forecast-error, mad, exponential-smoothing]

  - id: aggregate-planning
    term: Агрегатне планування
    definition: >-
      Середньостроковий план випуску, персоналу й запасів на горизонт від кількох місяців до півтора
      року, побудований на агрегованому (сумарному за родиною продуктів) попиті й без зміни самої
      потужності. Розподіляє наперед відомий, але нерівномірний попит по періодах горизонту з
      мінімальними сумарними витратами.
    synonyms:
      - агрегатний план
      - sales and operations planning
    forms:
      - агрегатне планування
      - агрегатного планування
      - агрегатному плануванню
      - агрегатний план
      - агрегатного плану
    seeAlso: [chase-strategy, level-strategy]

  - id: chase-strategy
    term: Стратегія погоні за попитом
    definition: >-
      Стратегія агрегатного плану, у якій обсяг випуску кожного періоду встановлюють рівним
      прогнозованому попиту саме цього періоду: запасу не накопичують, а персонал і понаднормовий час
      підлаштовують під коливання попиту наймом і звільненням.
    synonyms:
      - стратегія погоні
      - chase strategy
    forms:
      - стратегія погоні за попитом
      - стратегії погоні за попитом
      - стратегію погоні за попитом
      - стратегія погоні
    seeAlso: [aggregate-planning, level-strategy]

  - id: level-strategy
    term: Стратегія рівномірного виробництва
    definition: >-
      Стратегія агрегатного плану, у якій темп випуску сталий на весь горизонт і дорівнює середньому
      попиту, а розбіжність між сталим випуском і фактичним попитом кожного періоду покриває запас —
      накопичується, коли випуск перевищує попит, і витрачається у зворотному випадку.
    synonyms:
      - рівномірне виробництво
      - level strategy
    forms:
      - стратегія рівномірного виробництва
      - стратегії рівномірного виробництва
      - стратегію рівномірного виробництва
    seeAlso: [aggregate-planning, chase-strategy]

  - id: inventory
    term: Виробничі запаси
    definition: >-
      Товарно-матеріальні цінності, що очікують надходження до виробничого чи особистого споживання:
      запаси сировини й матеріалів, запаси незавершеного виробництва та запаси готової продукції.
      Управління запасами балансує витрати на оформлення замовлення проти витрат на зберігання.
    synonyms:
      - запаси
      - товарно-матеріальні запаси
      - inventory
    forms:
      - виробничі запаси
      - виробничих запасів
      - виробничими запасами
      - запас
      - запасу
      - запасів
    seeAlso: [eoq, reorder-point, safety-stock, abc-analysis]

  - id: eoq
    term: Оптимальний розмір замовлення
    definition: >-
      Фіксований обсяг замовлення в системі управління запасами з фіксованим розміром, за якого сума
      річних витрат на оформлення замовлень і витрат на зберігання запасу мінімальна. У точці EOQ річні
      витрати на оформлення дорівнюють річним витратам на зберігання середнього запасу.
    synonyms:
      - EOQ
      - економічний розмір замовлення
      - economic order quantity
    forms:
      - оптимальний розмір замовлення
      - оптимального розміру замовлення
      - оптимальним розміром замовлення
    seeAlso: [inventory, reorder-point, abc-analysis]

  - id: reorder-point
    term: Точка замовлення
    definition: >-
      Рівень запасу, при досягненні якого подають чергове замовлення на поповнення, щоб нова партія
      надійшла точно до вичерпання наявного запасу (формула EOQ-03). Залежить від середнього попиту за
      період постачання і самого часу постачання; без страхового запасу дає лише половинний рівень
      обслуговування, бо не враховує можливого сплеску попиту під час постачання.
    synonyms:
      - точка перезамовлення
      - ROP
      - reorder point
    forms:
      - точка замовлення
      - точки замовлення
      - точку замовлення
      - точкою замовлення
    seeAlso: [eoq, safety-stock, inventory]

  - id: safety-stock
    term: Страховий запас
    definition: >-
      Додатковий обсяг запасу понад розрахункову точку замовлення, який тримають на випадок відхилення
      фактичного попиту чи часу постачання від середнього. Розмір задає бажаний рівень обслуговування
      через коефіцієнт z і мінливість попиту за час постачання.
    synonyms:
      - резервний запас
      - буферний запас
      - safety stock
    forms:
      - страховий запас
      - страхового запасу
      - страховим запасом
    seeAlso: [reorder-point, eoq, inventory]

  - id: abc-analysis
    term: ABC-аналіз запасів
    definition: >-
      Метод, який ранжує позиції запасу за спадом частки у вартісному річному споживанні й розподіляє їх
      кумулятивно на групи: невелика кількість позицій із найбільшою вартісною часткою отримує найретельніший
      контроль, а позиції з найменшою часткою — спрощений облік.
    synonyms:
      - ABC-аналіз
      - ABC analysis
    forms:
      - abc-аналіз запасів
      - abc-аналізу запасів
      - abc-аналіз
    seeAlso: [inventory, eoq]

  - id: mrp
    term: Планування потреби в матеріалах
    definition: >-
      Метод, який переводить основний план-графік випуску готових виробів (MPS) у план замовлень на
      кожен компонент специфікації виробу, рівень за рівнем, з урахуванням наявного запасу й уже
      запланованих надходжень. Працює для залежного попиту, на відміну від EOQ і точки замовлення.
    synonyms:
      - MRP
      - material requirements planning
    forms:
      - планування потреби в матеріалах
      - плануванню потреби в матеріалах
      - планування потреб у матеріалах
    seeAlso: [bill-of-materials, gross-requirement, net-requirement]

  - id: bill-of-materials
    term: Специфікація виробу
    definition: >-
      Ієрархічний, багаторівневий перелік усіх деталей, вузлів і матеріалів, з яких складається готовий
      виріб, із зазначенням норми витрати кожного компонента на одиницю виробу вищого рівня. Основа
      розрахунку MRP: розгортання потреби йде рівень за рівнем, згори вниз.
    synonyms:
      - BOM
      - bill of materials
    forms:
      - специфікація виробу
      - специфікації виробу
      - специфікацію виробу
    seeAlso: [mrp, gross-requirement, net-requirement]

  - id: gross-requirement
    term: Брутто-потреба
    definition: >-
      Повна кількість компонента, потрібна для виконання плану виробництва рівня вище, без урахування
      наявного запасу. На рівні 0 визначається основним планом-графіком (MPS); на нижчих рівнях —
      плановим замовленням батьківського рівня, помноженим на норму витрати.
    synonyms:
      - валова потреба
      - gross requirement
    forms:
      - брутто-потреба
      - брутто-потреби
      - брутто-потребу
      - брутто-потребою
    seeAlso: [net-requirement, mrp, bill-of-materials]

  - id: net-requirement
    term: Нетто-потреба
    definition: >-
      Кількість компонента, яку справді потрібно замовити чи виготовити понад те, що вже є: брутто-потреба
      за вирахуванням наявного запасу й запланованих надходжень, з поправкою на резервування. Від’ємне
      значення прирівнюють до нуля.
    synonyms:
      - чиста потреба
      - net requirement
    forms:
      - нетто-потреба
      - нетто-потреби
      - нетто-потребу
      - нетто-потребою
    seeAlso: [gross-requirement, mrp]

  - id: dispatching
    term: Диспетчерування виробництва
    definition: >-
      Оперативний розподіл конкретних робіт між конкретними виконавцями та обладнанням і контроль за
      ходом їх виконання в реальному часі — найкоротший горизонт оперативного управління, дні й години.
      Диспетчер ухвалює рішення в межах, які вже задав агрегатний план.
    synonyms:
      - диспетчеризація
      - dispatching
    forms:
      - диспетчерування виробництва
      - диспетчерування
      - диспетчеруванню виробництва
      - диспетчеруванням виробництва
    seeAlso: [priority-rules]

  - id: priority-rules
    term: Правила пріоритетів
    definition: >-
      Формальні правила, за якими визначають порядок виконання завдань у черзі на одну потужність.
      Різні правила оптимізують різні критерії — SPT мінімізує середній час виконання, EDD максимальне
      запізнення, правило Джонсона сумарний час виконання на двох верстатах, критичне відношення поєднує
      строк і залишок часу обробки, — і жодне не оптимізує всі критерії одразу.
    synonyms:
      - правила черговості
      - priority rules
    forms:
      - правила пріоритетів
      - правил пріоритетів
      - правилами пріоритетів
    seeAlso: [dispatching]
