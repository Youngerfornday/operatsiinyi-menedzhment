  <circle class="pt" cx="560" cy="190" r="4"/>

  <text class="t" x="320" y="40" text-anchor="middle">Крива попиту й дві стратегії агрегатного плану</text>

  <text class="s" x="368" y="96" text-anchor="middle">попит</text>
