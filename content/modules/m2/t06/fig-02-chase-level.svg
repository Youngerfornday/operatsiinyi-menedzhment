<svg xmlns="http://www.w3.org/2000/svg" id="fig-t06-2" class="scheme" viewBox="0 0 640 380" role="img" aria-labelledby="fig-t06-2-title fig-t06-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t06-2-title">Рисунок 2. Стратегія погоні проти стратегії рівномірного виробництва</title>
  <desc id="fig-t06-2-desc">Графік із двома лініями по горизонтальній осі шести періодів. Хвиляста лінія попиту йде вгору до середини горизонту й вниз до кінця. Друга лінія, позначена карміновими маркерами в кожній точці, точно повторює хвилю попиту — це стратегія погоні, підписана «випуск дорівнює попиту кожного періоду; персонал наймають і звільняють». Пряма горизонтальна пунктирна лінія на рівні середнього попиту — стратегія рівномірного виробництва зі сталим темпом. Ліворуч, де крива попиту нижча за середній рівень, заштрихована зона підписана «запас»: сталий випуск перевищує попит. У середині, де крива попиту вища за середній рівень, заштрихована зона підписана «дефіцит»: попит перевищує сталий випуск, і різницю покриває раніше накопичений запас.</desc>
  <style>
    #fig-t06-2 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t06-2 .t { fill: var(--ink, #0f1c2e); font-size: 14px; font-weight: 650; }
    #fig-t06-2 .s { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t06-2 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t06-2 .axis { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t06-2 .demand { stroke: var(--ink, #0f1c2e); stroke-width: 2; fill: none; }
    #fig-t06-2 .level { stroke: var(--ink-2, #445570); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    #fig-t06-2 .pt { fill: var(--err, #b42318); }
    #fig-t06-2 .zone-surplus { fill: var(--surface-tint, #eef4fa); opacity: 0.85; }
    #fig-t06-2 .zone-deficit { fill: var(--err-bg, #fdecea); opacity: 0.85; }
    #fig-t06-2 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12.5px; font-weight: 600; }
    #fig-t06-2 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t06-2 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t06-2 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t06-2 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

