# Глосарій теми 5. Назви термінів мають дослівно збігатися з реєстром course.yaml (glossaryTerms, topic: t05).
# Визначення — робочі формулювання курсу; розрахункові співвідношення беруться з docs/research/formula-baseline.md.
topic: t05
terms:
  - id: facility-design
    term: Проектування операційної системи
    definition: >-
      Визначення складу, розміщення й способу взаємодії ресурсів, потрібних, щоб операційна система
      давала заданий обсяг продукції чи послуг заданої якості: вибір місця розташування, планування
      приміщення й обладнання, балансування потокової лінії, проектування робіт і нормування праці.
      На відміну від поточного управління, створює самі межі ресурсів, а не оптимізує роботу в них.
    synonyms:
      - проєктування операційної системи
      - facility design
    forms:
      - проектування операційної системи
      - проектування операційних систем
      - проектуванням операційної системи
    seeAlso: [facility-location, line-balancing, work-measurement]

  - id: facility-location
    term: Вибір місця розташування
    definition: >-
      Структурне рішення про розміщення виробничого чи сервісного об’єкта на основі факторів двох
      рівнів: макрорівня (ринки збуту, джерела сировини, трудові ресурси, енергія, політична
      стабільність, оподаткування) і мікрорівня (норми забудови, розмір і конфігурація ділянки,
      транспорт, енергозабезпечення, близькість житла і конкурентів).
    synonyms:
      - розміщення виробничих об’єктів
      - facility location
    forms:
      - вибір місця розташування
      - вибору місця розташування
      - вибором місця розташування
    seeAlso: [factor-rating-method, center-of-gravity-method]

  - id: factor-rating-method
    term: Метод вагових коефіцієнтів
    definition: >-
      Метод порівняння варіантів розміщення за кількома факторами одразу: кожному фактору надають
      вагу так, щоб сума ваг дорівнювала одиниці, кожен варіант оцінюють у балах за кожним фактором,
      а підсумковий бал варіанта — сума добутків ваги на оцінку. Обирають варіант із найвищим балом.
    synonyms:
      - метод факторного рейтингу
      - factor-rating method
    forms:
      - метод вагових коефіцієнтів
      - методу вагових коефіцієнтів
      - методом вагових коефіцієнтів
    seeAlso: [facility-location, center-of-gravity-method]

  - id: center-of-gravity-method
    term: Метод центру ваги
    definition: >-
      Метод обчислення географічної точки, яка мінімізує сумарну зважену відстань до вже відомих
      точок — постачальників, складів чи ринків збуту: координати точки — середнє координат відомих
      точок, зважене обсягом перевезень до кожної з них.
    synonyms:
      - метод центру мас
      - center-of-gravity method
    forms:
      - метод центру ваги
      - методу центру ваги
      - методом центру ваги
    seeAlso: [facility-location, factor-rating-method]

  - id: process-layout
    term: Технологічне планування
    definition: >-
      Тип компонування приміщення, який групує обладнання за спільністю виконуваної функції, а не за
      послідовністю операцій виробу. Підходить для дрібносерійного й одиничного виробництва з широкою
      номенклатурою: дає високу гнучкість, але подовжує маршрут предмета праці між дільницями.
    synonyms:
      - функціональне планування
      - process layout
    forms:
      - технологічне планування
      - технологічного планування
      - технологічним плануванням
    seeAlso: [product-layout, cellular-layout, fixed-position-layout]

  - id: product-layout
    term: Предметне планування
    definition: >-
      Тип компонування приміщення, який розставляє обладнання в тій самій послідовності, у якій
      виконуються операції над конкретним виробом, — потокова лінія. Дає короткий і прямий маршрут,
      але низьку гнучкість: виправдане лише за високого й стабільного обсягу випуску одного продукту.
    synonyms:
      - лінійне планування
      - product layout
    forms:
      - предметне планування
      - предметного планування
      - предметним плануванням
    seeAlso: [process-layout, cellular-layout, line-balancing]

  - id: cellular-layout
    term: Комірчасте планування
    definition: >-
      Тип компонування приміщення, що групує обладнання в комірки під родину подібних деталей, а
      всередині комірки розміщує його в технологічній послідовності. Поєднує частину гнучкості
      технологічного планування з частиною швидкості предметного.
    synonyms:
      - групове планування
      - cellular layout
    forms:
      - комірчасте планування
      - комірчастого планування
      - комірчастим плануванням
    seeAlso: [process-layout, product-layout]

  - id: fixed-position-layout
    term: Планування з фіксованою позицією
    definition: >-
      Тип компонування приміщення для надто великого чи важкого виробу, щоб рухати його між
      дільницями (корабель, літак, будівля): виріб лишається нерухомим, а до нього по черзі підвозять
      матеріали, обладнання й бригади.
    synonyms:
      - позиційне планування
      - fixed-position layout
    forms:
      - планування з фіксованою позицією
      - плануванню з фіксованою позицією
      - плануванням з фіксованою позицією
    seeAlso: [process-layout, product-layout]

  - id: line-balancing
    term: Балансування потокової лінії
    definition: >-
      Розподіл операцій процесу між робочими станціями так, щоб час роботи кожної станції був
      якомога ближчим до такту, а сумарний простій лінії — мінімальним. Спирається на мінімальну
      кількість станцій, фактичне закріплення операцій, ефективність і втрати на простій.
    synonyms:
      - балансування складальної лінії
      - line balancing
    forms:
      - балансування потокової лінії
      - балансування потокових ліній
      - балансуванням потокової лінії
    seeAlso: [takt-time, product-layout]

  - id: takt-time
    term: Такт потокової лінії
    definition: >-
      Час, який лінія має витрачати на кожну одиницю продукції, щоб точно встигати за попитом:
      доступний час виробництва, поділений на попит за той самий період. Відправна точка
      балансування лінії.
    synonyms:
      - час такту
      - takt time
    forms:
      - такт потокової лінії
      - такту потокової лінії
      - тактом потокової лінії
    seeAlso: [line-balancing]

  - id: work-measurement
    term: Нормування праці
    definition: >-
      Вид управлінської діяльності, спрямований на оцінку та встановлення раціональних співвідношень
      витрат і результатів праці на конкретній операції за заданих організаційно-технічних умов.
      Завершує проектування операційної системи конкретним числом — нормою часу чи виробітку.
    synonyms:
      - технічне нормування праці
      - work measurement
    forms:
      - нормування праці
      - нормуванню праці
      - нормуванням праці
    seeAlso: [time-standard, output-standard, standard-time-piece]

  - id: time-standard
    term: Норма часу
    definition: >-
      Загальний регламентований час на виконання одиниці роботи в заданих організаційно-технічних
      умовах: складається з підготовчо-завершального, оперативного (основного й допоміжного) часу,
      часу обслуговування робочого місця й часу на відпочинок і особисті потреби.
    synonyms:
      - норматив часу
      - time standard
    forms:
      - норма часу
      - норми часу
      - нормою часу
    seeAlso: [standard-time-piece, output-standard, work-measurement]

  - id: output-standard
    term: Норма виробітку
    definition: >-
      Кількість одиниць продукції визначеного виду, яку працівник чи бригада мають виготовити за
      заданий проміжок часу: змінний фонд робочого часу, поділений на норму часу одиниці
      (штучно-калькуляційний час; у масовому виробництві — штучний час).
    synonyms:
      - норма продуктивності праці
      - output standard
    forms:
      - норма виробітку
      - норми виробітку
      - нормою виробітку
    seeAlso: [time-standard, standard-time-piece]

  - id: standard-time-piece
    term: Штучний час
    definition: >-
      Норма часу на одиницю продукції в умовах масового й великосерійного виробництва: сума
      оперативного часу, часу обслуговування робочого місця й часу на відпочинок та особисті потреби,
      без частки підготовчо-завершального часу.
    synonyms:
      - piece time
    forms:
      - штучний час
      - штучного часу
      - штучним часом
    seeAlso: [time-standard, output-standard, work-measurement]
