# Презентація теми 5. Текст слайдів стислий: повний виклад — у lecture.mdx, пояснення — у нотатках.
# Кожне число слайда має бути в лонгріді теми й мати джерело зі sources.yaml.
topic: t05
slides:
  - id: title
    type: title
    subtitle: Модуль 2. Організаційно-функціональна характеристика операційної діяльності підприємств
    notes: >-
      Вступ через контраст двох рішень про той самий склад: перше на око («тут дешевша земля»), друге —
      зважений розрахунок факторів. Обидва можуть дати той самий майданчик, але лише друге можна
      пред’явити як обґрунтування. Запитайте аудиторію, чи траплялося їм бачити рішення про локацію,
      ухвалене «на око».

  - id: outcomes
    type: outcomes
    title: Що ви зможете після теми
    notes: >-
      Чотири результати теми: два понятійні (етапи й види проектування) і два розрахункові — обрати
      майданчик двома методами й пояснити розбіжність результатів, а також збалансувати лінію та
      порахувати норму часу й виробітку. Запитайте, з якою з цих задач аудиторія стикалася на практиці.

  - id: s01-section
    type: section
    number: 1
    title: Проектування операційної системи — сутність, цілі та етапи
    notes: >-
      Перше питання теми. Головна теза: проектування створює межі ресурсів, а поточне управління (тема 6)
      оптимізує роботу вже в цих межах. Приклад: обраний майданчик визначає, яке планування приміщення
      взагалі можливе. Запитайте, яке рішення аудиторія вважає найдорожчим для виправлення заднім числом.

  - id: s01-figure
    type: figure
    title: Послідовність проектних рішень операційної системи
    figure: fig-01-design-stages.svg
    caption: Кожен крок звужує простір рішень для наступного.
    sources: [kushniruk-2017]
    notes: >-
      П’ять кроків: стратегія продукту й процесу, локація, планування приміщення, балансування лінії,
      нормування праці. Приклад: локація в поясі сировини (кейс Kernel далі) одразу обмежує, яке
      компонування заводу можливе. Запитайте, чи можна поміняти кроки місцями.

  - id: s01-bullets
    type: bullets
    title: Мета й завдання проектування
    bullets:
      - Проектування визначає склад, розміщення й взаємодію ресурсів під заданий обсяг випуску.
      - На відміну від поточного управління, воно створює самі межі, а не оптимізує роботу в них.
      - 'Завдання: обрати локацію, спланувати приміщення, збалансувати лінію, визначити норму часу.'
      - Кожне завдання має власний розрахунок і власний розділ цієї теми.
    sources: [kushniruk-2017]
    notes: >-
      Наголосіть на різниці з темою 6: проектування — про межі, поточне управління — про роботу в межах.
      Приклад: зміна продукту чи зростання попиту понад потужність повертає проектні рішення знову.
      Запитайте, яке з чотирьох завдань аудиторія вважає найменш очевидним.

  - id: s02-section
    type: section
    number: 2
    title: Види проектування; сучасний рівень розвитку операційних систем
    notes: >-
      Друге питання теми. Три види: нове («з чистого аркуша»), реконструктивне, трансферне (перенесення
      вже спроєктованої системи). Сучасний рівень додає вибір рівня автоматизації як окреме рішення.
      Запитайте, який вид проектування, на думку аудиторії, найризикованіший.

  - id: s02-bullets
    type: bullets
    title: Три види проектування й рівень автоматизації
    bullets:
      - 'Нове: найбільша свобода вибору, але й найбільший ризик без досвіду експлуатації.'
      - 'Реконструктивне: обмежене наявним, зате спирається на фактичні дані роботи системи.'
      - 'Трансферне: перенесення вже перевіреної системи — задача точного відтворення, не оптимізації.'
      - 'Рівень автоматизації — окреме проєктне рішення з власною ціною: капітал проти гнучкості.'
    notes: >-
      Наголосіть: трансферне проектування не про «покращити на місці» — кожна локальна оптимізація
      руйнує порівнянність із еталонним майданчиком. Приклад — кейс Intel далі. Запитайте, чому вища
      автоматизація може означати нижчу гнучкість.

  - id: s02-case-intel
    type: case
    title: 'Intel «Copy Exactly!» — проектування як точне відтворення'
    case: intel-copy-exactly
    facts:
      - Метод розроблено для покоління техпроцесу 0,5 мкм — не «з 1980-х», як стверджують деякі джерела.
      - 'Філософія: усе, що впливає на процес, копіюється до дрібниць, окрім фізично неможливого.'
      - Зіставлення нового майданчика з еталонним — на чотирьох рівнях, з формальними статистичними тестами.
      - 'Заборона: уникати компенсаційного підлаштування замість пошуку корінної причини розбіжності.'
      - Два нові заводи вийшли на ту саму якість виходу продукції, що й дослідна лінія.
    question: Чому компанія обрала точне копіювання замість локальної оптимізації на кожному новому майданчику?
    sources: [intel-copy-exactly-1998]
    notes: >-
      Ключ до розбору: перенесення вже спроєктованої системи — це не привід «покращити на місці», бо
      локальна оптимізація руйнує порівнянність і робить розбіжність нез’ясовною. Межа кейсу: первинне
      джерело не наводить жодної кількісної метрики приросту якості. Запитайте, чим трансфер відрізняється
      від проектування нового об’єкта.

  - id: s03-section
    type: section
    number: 3
    title: Вибір місця розташування виробничих і сервісних об’єктів
    notes: >-
      Третє питання теми, центральне для розрахункової частини. Два рівні факторів — макро й мікро — і
      два методи розрахунку: вагових коефіцієнтів і центру ваги. Запитайте, який фактор аудиторія назвала
      б першим для власного гіпотетичного бізнесу.

  - id: s03-factors
    type: two-columns
    title: Фактори макро- і мікрорівня
    left:
      heading: Макрорівень
      bullets:
        - Розмір і динаміка ринків збуту.
        - Джерела сировини й транспортні витрати на доставку.
        - Кількість і кваліфікація трудових ресурсів.
        - Доступність енергії та води, політична стабільність.
    right:
      heading: Мікрорівень
      bullets:
        - Обмежувальні норми забудови ділянки.
        - Розмір, конфігурація й сумісність із сусідніми об’єктами.
        - Доступність транспорту та енергозабезпечення.
        - Близькість житла для працівників, наявність конкурентів.
    sources: [kushniruk-2017]
    notes: >-
      Наголосіть: для багатьох підприємств рішення визначає один домінантний фактор (сировина, дешева
      праця). Приклад — кейс Kernel далі: насипна густина сировини обмежує зону збирання. Запитайте, який
      фактор домінував би для кав’ярні, а який — для металургійного заводу.

  - id: s03-formula-factor
    type: formula
    title: Метод вагових коефіцієнтів
    formula: Бал варіанта = Σ (вага фактора × оцінка варіанта за фактором)
    explanation:
      - Ваги факторів у сумі дають одиницю; оцінки — за єдиною шкалою для всіх варіантів.
      - 'Приклад: майданчик А — 71,5 бала, майданчик Б — 76,25 бала за трьома факторами.'
      - Один сильний фактор не переважує рішення автоматично, якщо сума все одно нижча.
      - Показник має код LOC-01 у розрахунковій базі курсу.
    sources: [heizer-render-munson-2016]
    notes: >-
      Розберіть приклад лонгріда: майданчик А переважає лише за сировиною (вагою 0,40), але програє за
      рештою факторів. Приклад чутливості: зміна ваги на 0,15 може перевернути результат. Запитайте, чи
      довіряла б аудиторія самим вагам без обговорення з командою.

  - id: s03-formula-cog
    type: formula
    title: Метод центру ваги
    formula: 'x* = Σ(Qᵢ·xᵢ) / ΣQᵢ; y* = Σ(Qᵢ·yᵢ) / ΣQᵢ'
    explanation:
      - Координати точки — середнє відомих точок, зважене обсягом перевезень до кожної.
      - 'Приклад: три точки з обсягами 50, 80 і 30 тис. т дають точку (48,75; 45,625).'
      - Точка з найбільшим обсягом «притягує» результат сильніше за прості середні координати.
      - Показник має код LOC-02 у розрахунковій базі курсу; на відміну від LOC-01, без суб’єктивних балів.
    sources: [heizer-render-munson-2016]
    notes: >-
      Наголосіть на відмінності від LOC-01: тут немає суб’єктивних оцінок аналітика, результат повністю
      визначений вхідними даними. Приклад: результат — лише точка, її ще звіряють із реальною картою.
      Запитайте, які якісні фактори цей метод узагалі не бачить.

  - id: s03-case-ukrposhta
    type: case
    title: Укрпошта — нормативна формула розміщення мережі
    case: ukrposhta
    facts:
      - Норматив у містах — від 15 000 осіб на відділення (понад 500 тис. населення) до 6 000 (до 10 тис.).
      - 'Сільська формула: N = K1 · (S / 62) + K2 · (X / 1300), де S — площа, X — сільське населення області.'
      - 'Приклад коефіцієнтів для Вінницької області: K1 = 0,96, K2 = 0,94.'
      - Документ розрізняє розрахункову (нормативну) мережу й базову мережу, яку оператор задає щороку.
    question: Чим розрахунок за нормативною формулою відрізняється від вибору майданчика методом вагових коефіцієнтів?
    sources: [nakaz-959-2013]
    notes: >-
      Головне: тут розміщення точок задає держава через норматив навантаження, а не менеджмент компанії
      через зважений вибір — третій підхід, відмінний від LOC-01 і LOC-02. Продовжує тему 1, де ціль
      Укрпошти вже була заданою ззовні. Запитайте, чи можна застосувати цю саму формулу для приватної
      мережі магазинів.

  - id: s03-case-ajax
    type: case
    title: Ajax Systems — послідовність рішень про розміщення
    case: ajax-systems
    facts:
      - 'Листопад 2020 р.: другий майданчик у Києві, підпорядкований бізнес-цілі подвоїти виробництво.'
      - 'Жовтень 2022 р.: завод у Туреччині, 8 300 м², заявлена потужність 3,2 млн пристроїв на рік.'
      - 'Критерії засновника: фахівці, інфраструктура, вільна економічна зона, оподаткування, підрядники.'
      - 'До 2026 р. додався четвертий завод — у Ханої (В’єтнам), також 8 300 м².'
    question: Чим критерії другого й третього рішень відрізняються від критерію першого?
    sources: [ajax-second-plant-2020, ajax-plant-turkey-2023, ajax-2025-summary]
    notes: >-
      Перше рішення (Київ) підпорядковане бізнес-цілі напряму — це тема 1. Друге й третє — уже класична
      задача локації з явно названими критеріями макро- й мікрорівня. Межа кейсу: компанія приватна,
      цифри — її заява без аудованої звітності. Запитайте, які з критеріїв засновника належать до макро-,
      а які — до мікрорівня.

  - id: s04-section
    type: section
    number: 4
    title: Розміщення обладнання та планування приміщення; планування офісу
    notes: >-
      Четверте питання теми. Чотири типи компонування відрізняються тим, що саме рухається — предмет
      праці чи ресурси. Приклад: потокова лінія — це предметне планування в чистому вигляді. Запитайте,
      який тип компонування аудиторія бачила на знайомому виробництві чи в офісі.

  - id: s04-figure
    type: figure
    title: Чотири типи компонування приміщення
    figure: fig-02-layout-types.svg
    caption: Технологічне й предметне планування — протилежні відповіді на те, що рухається в системі.
    sources: [kushniruk-2017]
    notes: >-
      Технологічне групує обладнання за функцією (гнучкість, довгий маршрут); предметне йде в порядку
      операцій (швидкість, низька гнучкість); комірчасте — компроміс; фіксована позиція — для великого
      нерухомого виробу. Запитайте, до якого типу належить лінія складання автомобіля.

  - id: s04-case-novaposhta
    type: case
    title: Нова Пошта — компонування сортувального терміналу
    case: nova-poshta
    facts:
      - Пропускна здатність терміналу — до 50 000 посилок на годину на площі 24 000 м².
      - Компонування — трирівнева конвеєрна система; інвестиції в термінал — близько 30 млн євро.
      - На скануванні сканери зчитують штрихкод із шести боків коробки на швидкості 3 посилки за секунду.
      - Час перебування посилки в терміналі, за даними компанії, не перевищує 2 хв.
    question: Що в описі терміналу — рішення про компонування приміщення, а що — норма праці на операції?
    sources: [nova-poshta-terminal-2021]
    notes: >-
      Трирівнева конвеєрна система — рішення про компонування; норми 3 посилки/с і 2 хв — уже про
      нормування праці з останнього розділу теми. Межа кейсу: числа отримані під час екскурсії для преси,
      незалежного аудиту немає. Запитайте, чи можна визначити тип компонування лише з цих фактів.

  - id: s05-section
    type: section
    number: 5
    title: Особливості розміщення приміщень і обладнання сервісних підрозділів
    notes: >-
      П’яте питання теми. Клієнт всередині процесу перетворення (тема 3) — і тому стає частиною системи,
      яку проектують. Критерій компонування — час обслуговування, а не фізична відстань предмета праці.
      Запитайте, чим компонування банку відрізняється від компонування складу.

  - id: s05-case-southwest
    type: case
    title: Southwest Airlines — час розвороту як проєктний параметр
    case: southwest-airlines
    facts:
      - 'Схема «точка — точка» разом з уніфікованим парком Boeing 737 спрощує планування й обслуговування.'
      - Компанія прямо називає скорочення часу розвороту способом підвищити утилізацію літака.
      - Точної цифри часу розвороту у хвилинах форма 10-K не наводить.
      - Поширені цифри «≈49 хв факт, ≈44 хв ціль» — із вторинного висвітлення дня інвестора, не з 10-K.
    question: Чому скорочення часу на землі — проєктне рішення про сервісну систему, а не лише ефективність рейсу?
    sources: [southwest-10k-2025]
    notes: >-
      Час розвороту в гейті — параметр проєктування сервісної системи в тому самому сенсі, що й такт
      лінії: коротший розворот дає більше рейсів з того самого літака й гейта. Наголосіть на межі кейсу:
      точних хвилин у первинному документі немає. Запитайте, який ще сервісний параметр діє як такт.

  - id: s06-section
    type: section
    number: 6
    title: Балансування потокової лінії — такт, кількість робочих місць, ефективність
    notes: >-
      Шосте питання теми. Такт задає темп; мінімальна кількість станцій — теоретична межа, яку
      технологічна послідовність часто не дозволяє досягти. Приклад: лінія з восьми операцій і такт
      60 с дають шість станцій замість п’яти. Запитайте, чому фактична кількість станцій може перевищувати
      теоретичний мінімум.

  - id: s06-bullets
    type: bullets
    title: Приклад балансування — вісім операцій, такт 60 с
    bullets:
      - 'Сума часу операцій — 260 с; теоретичний мінімум станцій — 5.'
      - Фактичне закріплення дало 6 станцій — операція 45 с не поєднується із сусідньою, а 38 + 27 с перевищують такт.
      - 'Ефективність лінії — приблизно 72,2%, втрати на простій — 27,8%.'
      - Абсолютний час простою всіх станцій за один цикл — 100 с.
    sources: [hevko-2017, stevenson-2020, heizer-render-munson-2016]
    notes: >-
      Три показники (ефективність, відсоток простою, абсолютний простій) описують той самий факт по-різному:
      перший зручний для порівняння ліній, другий і третій — для розрахунку виграшу від перебалансування.
      Запитайте, який із трьох показників аудиторія обрала б для звіту керівнику цеху.

  - id: s06-figure
    type: figure
    title: Баланс лінії з восьми операцій під такт 60 с
    figure: fig-03-line-balance.svg
    caption: Станція 2 сягає такту точно, без жодної втраченої секунди; решта станцій мають резерв.
    sources: [heizer-render-munson-2016]
    notes: >-
      Стовпчик станції 2 (60 с) торкається лінії такту — нульовий простій. Решта нижчі, різниця —
      простій станції. Приклад: станція 3 (45 с) не могла об’єднатися із сусідньою операцією без
      перевищення такту. Запитайте, яку станцію аудиторія спробувала б довантажити першою.

  - id: s06-case-interpipe
    type: case
    title: Інтерпайп Сталь — такт печі проти циклів суміжних переділів
    case: interpipe-steel
    facts:
      - Тривалість плавки електродугової печі — 53 хв, що на добу давало 27 плавок.
      - 'Цикл піч-ківш — 30–50 хв, цикл вакууматора — 40–50 хв: обидва коротші за такт печі.'
      - Продуктивність двох машин безперервного лиття — 770 і 550 тис. т на рік.
      - Сума 770 + 550 = 1 320 тис. т на рік точно збігалася із заявленою проєктною потужністю заводу.
    question: Чому такт печі, а не швидші суміжні переділи, визначав пропускну здатність усього ланцюга?
    sources: [interpipe-steel-about, interpipe-steel-attack-2026]
    notes: >-
      Найповільніша ланка (такт печі) визначає пропускну здатність — та сама логіка, що й у балансуванні
      складальної лінії. Кейс подано в минулому часі: виробництво зупинилося після удару по підприємству
      в ніч на 22.09.2026 р. Запитайте, чому саме дві позиції піч-ківш, якщо цикл коротший за такт.

  - id: s06-case-tesla
    type: case
    title: Tesla, Model 3 — додаткова лінія проти вузького місця
    case: tesla-model3-ramp
    facts:
      - 'Випуск зростав по кварталах: 260 → 2 425 → 9 766 → 28 578 → 53 239 → 61 394 автомобілі.'
      - 'Компанія визнала: «ми зробили помилку, додавши забагато автоматизації занадто швидко».'
      - Частину лінії батарейних модулів тимчасово повернули до напівавтоматичного й ручного режиму.
      - Нова лінія GA4 забезпечила близько 20% випуску Model 3 в останній тиждень 2 кв. 2018 р.
    question: Чим запуск лінії GA4 відрізняється від рішення «прискорити наявну лінію GA3»?
    sources: [tesla-q1-2018-letter, tesla-q2-2018-update]
    notes: >-
      GA4 — паралельний ресурс поруч із вузьким місцем, той самий принцип, що додаткова станція під довгу
      операцію в балансуванні лінії. Надмірна автоматизація — приклад рішення з розділу 2 теми, яке
      довелося відкотити. Запитайте, чому піковий тижневий показник не можна плутати із середнім темпом
      кварталу.

  - id: s07-section
    type: section
    number: 7
    title: Планування і нормування праці — норма часу, норма виробітку, штучний час
    notes: >-
      Сьоме, завершальне питання теми і головний розрахунковий інструмент розділу. Без нормування баланс
      лінії лишається розрахунком на папері. Запитайте, чому норму часу небезпечно визначати «на око», без
      хронометражу.

  - id: s07-figure
    type: figure
    title: Склад робочого часу операції
    figure: fig-04-time-structure.svg
    caption: Підготовчо-завершальний час — один раз на партію; штучний час — решта категорій на одиницю.
    sources: [kapinos-babii-2013]
    notes: >-
      Оперативний час = основний + допоміжний; штучний час додає до нього обслуговування робочого місця й
      відпочинок. Приклад: у масовому виробництві норму часу на одиницю ототожнюють зі штучним часом.
      Запитайте, чому підготовчо-завершальний час не входить до штучного часу.

  - id: s07-formula
    type: formula
    title: Від штучного часу до норми виробітку
    formula: Тшт = Топ + Тобсл + Твідп; Тшт.к = Тшт + Тпз / n; Нвир = Тзм / Тшт.к
    explanation:
      - 'Приклад: Топ = 3,8 хв, Тшт = 4,18 хв, штучно-калькуляційний час за партії з 40 виробів — 4,63 хв.'
      - 'Норма виробітку за зміну 480 хв: 480 / 4,63 ≈ 103,7, округлено до 103 виробів.'
      - 'Округлення завжди вниз: неповний виріб наприкінці зміни не існує як придатна одиниця.'
      - Коди WM-01…WM-04 у розрахунковій базі курсу.
    sources: [kapinos-babii-2013]
    notes: >-
      Розберіть різницю між штучним і штучно-калькуляційним часом: останній додає частку
      підготовчо-завершального часу, поділену на розмір партії, і саме на нього ділять змінний фонд у нормі
      виробітку. Запитайте, що станеться зі штучно-калькуляційним часом, якщо розмір партії подвоїти.

  - id: summary
    type: summary
    title: Підсумок теми
    bullets:
      - Проектування створює межі ресурсів системи; буває новим, реконструктивним і трансферним.
      - Локацію обирають методом вагових коефіцієнтів (суб’єктивні ваги) і методом центру ваги (об’єктивна точка).
      - Компонування приміщення відповідає на питання, що рухається — предмет праці чи ресурси.
      - Баланс лінії зводить такт, кількість станцій, ефективність і простій в один розрахунок.
      - Нормування праці завершує проектування конкретним числом — нормою часу й виробітку.
    sources: [heizer-render-munson-2016, kapinos-babii-2013]
    notes: >-
      Поверніться до питання з першого слайда: тепер аудиторія має назвати, які саме розрахунки
      перетворюють «рішення на око» про майданчик на обґрунтоване рішення. Запитайте, який із п’яти
      розрахунків теми вони вважають найкориснішим для власної майбутньої роботи.
