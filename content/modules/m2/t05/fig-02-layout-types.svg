<svg xmlns="http://www.w3.org/2000/svg" id="fig-t05-2" class="scheme" viewBox="0 0 700 500" role="img" aria-labelledby="fig-t05-2-title fig-t05-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t05-2-title">Рисунок 2. Чотири типи компонування приміщення</title>
  <desc id="fig-t05-2-desc">Чотири квадранти. Перший — технологічне планування: групи однотипних верстатів, маршрут виробу між ними петляє. Другий, виділений карміновим, — предметне планування: обладнання в один ряд у порядку операцій, маршрут виробу прямий. Третій — комірчасте планування: невелика комірка з кількома верстатами в технологічній послідовності всередині. Четвертий — фіксована позиція: великий нерухомий виріб у центрі, стрілки ресурсів і бригад ведуть до нього з усіх боків.</desc>
  <style>
    #fig-t05-2 .frame { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t05-2 .unit { fill: var(--surface-tint, #eef4fa); stroke: var(--ink-2, #445570); stroke-width: 1; }
    #fig-t05-2 .t { fill: var(--ink, #0f1c2e); font-size: 14px; font-weight: 650; }
    #fig-t05-2 .s { fill: var(--ink-2, #445570); font-size: 11px; }
    #fig-t05-2 .path { stroke: var(--ink-2, #445570); stroke-width: 1.5; fill: none; }
    #fig-t05-2 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t05-2 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t05-2 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t05-2 .exam { stroke: var(--err, #b42318); }
    #fig-t05-2 .exam-t { fill: var(--err-ink, #8f1d14); }
    #fig-t05-2 .exam-path { stroke: var(--err, #b42318); }
    #fig-t05-2 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t05-2 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t05-2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <!-- Квадрант 1: технологічне -->
  <rect class="frame" x="20" y="50" width="300" height="190" rx="6"/>
  <text class="t" x="170" y="76" text-anchor="middle">Технологічне планування</text>
  <g>
    <rect class="unit" x="50" y="100" width="24" height="24"/><rect class="unit" x="78" y="100" width="24" height="24"/>
    <rect class="unit" x="230" y="100" width="24" height="24"/><rect class="unit" x="258" y="100" width="24" height="24"/>
    <rect class="unit" x="140" y="180" width="24" height="24"/><rect class="unit" x="168" y="180" width="24" height="24"/>
    <path class="path" marker-end="url(#fig-t05-2-arr)" d="M62 124 C 40 150, 120 150, 152 178"/>
    <path class="path" marker-end="url(#fig-t05-2-arr)" d="M176 192 C 220 170, 240 150, 242 124"/>
  </g>
  <text class="s" x="170" y="218" text-anchor="middle">маршрут виробу петляє між групами обладнання</text>

  <!-- Квадрант 2: предметне (exam) -->
  <rect class="frame exam" x="380" y="50" width="300" height="190" rx="6"/>
  <text class="exam-t t" x="530" y="76" text-anchor="middle">Предметне планування</text>
  <g>
    <rect class="unit" x="410" y="140" width="24" height="24"/>
    <rect class="unit" x="454" y="140" width="24" height="24"/>
    <rect class="unit" x="498" y="140" width="24" height="24"/>
    <rect class="unit" x="542" y="140" width="24" height="24"/>
    <rect class="unit" x="586" y="140" width="24" height="24"/>
    <path class="path exam-path" marker-end="url(#fig-t05-2-arr)" d="M410 152 L 646 152"/>
  </g>
  <text class="s" x="530" y="218" text-anchor="middle">обладнання в порядку операцій — маршрут прямий</text>

  <!-- Квадрант 3: комірчасте -->
  <rect class="frame" x="20" y="270" width="300" height="190" rx="6"/>
  <text class="t" x="170" y="296" text-anchor="middle">Комірчасте планування</text>
  <ellipse cx="170" cy="365" rx="110" ry="55" fill="none" stroke-dasharray="4 3" class="path"/>
  <g>
    <rect class="unit" x="120" y="345" width="20" height="20"/>
    <rect class="unit" x="150" y="375" width="20" height="20"/>
    <rect class="unit" x="185" y="345" width="20" height="20"/>
    <path class="path" marker-end="url(#fig-t05-2-arr)" d="M140 355 L 150 380"/>
    <path class="path" marker-end="url(#fig-t05-2-arr)" d="M170 385 L 190 358"/>
  </g>
  <text class="s" x="170" y="440" text-anchor="middle">комірка під родину деталей, послідовність усередині</text>

  <!-- Квадрант 4: фіксована позиція -->
  <rect class="frame" x="380" y="270" width="300" height="190" rx="6"/>
  <text class="t" x="530" y="296" text-anchor="middle">Фіксована позиція</text>
  <rect class="unit" x="490" y="335" width="80" height="60" rx="4"/>
  <path class="path" marker-end="url(#fig-t05-2-arr)" d="M410 320 L 486 350"/>
  <path class="path" marker-end="url(#fig-t05-2-arr)" d="M650 320 L 574 350"/>
  <path class="path" marker-end="url(#fig-t05-2-arr)" d="M410 420 L 486 385"/>
  <path class="path" marker-end="url(#fig-t05-2-arr)" d="M650 420 L 574 385"/>
  <text class="s" x="530" y="440" text-anchor="middle">виріб нерухомий, ресурси й бригади рухаються до нього</text>

  <circle class="refc" cx="20" cy="50" r="11"/><text class="refn" x="20" y="54">1</text>
  <circle class="refc exam" cx="380" cy="50" r="11"/><text class="refn exam-n" x="380" y="54">2</text>
  <circle class="refc" cx="20" cy="270" r="11"/><text class="refn" x="20" y="274">3</text>
  <circle class="refc" cx="380" cy="270" r="11"/><text class="refn" x="380" y="274">4</text>
</svg>
