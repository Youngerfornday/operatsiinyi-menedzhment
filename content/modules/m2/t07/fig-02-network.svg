<svg xmlns="http://www.w3.org/2000/svg" id="fig-t07-2" class="scheme" viewBox="0 0 640 340" role="img" aria-labelledby="fig-t07-2-title fig-t07-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t07-2-title">Рисунок 2. Сітьовий графік запуску лінії пакування</title>
  <desc id="fig-t07-2-desc">Сітьовий графік із семи вузлів. Зверху ряд A, C, E, F, G — критичний шлях, з’єднаний карміновими стрілками, під кожним вузлом підписано ранній і пізній старт та фініш, які збігаються. Знизу гілка A, B, D, сірого кольору, що сходиться до вузла F; під B і D підписано резерв часу 2 тижні. Стрілки від D і від E ведуть до спільного вузла F, позначаючи, що обидві роботи мають завершитися, перш ніж F почнеться.</desc>
  <style>
    #fig-t07-2 .node { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t07-2 .node-crit { stroke: var(--err, #b42318); stroke-width: 2; fill: var(--surface-tint, #eef4fa); }
    #fig-t07-2 .node-float { stroke: var(--ink-2, #445570); stroke-dasharray: 3 2; }
    #fig-t07-2 .t { fill: var(--ink, #0f1c2e); font-size: 15px; font-weight: 700; text-anchor: middle; }
    #fig-t07-2 .s { fill: var(--ink-2, #445570); font-size: 10.5px; text-anchor: middle; }
    #fig-t07-2 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.5; fill: none; }
    #fig-t07-2 .arrow-crit { stroke: var(--err, #b42318); stroke-width: 2; fill: none; }
    #fig-t07-2 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t07-2 .arrow-head-crit { fill: var(--err, #b42318); }
    #fig-t07-2 .lbl { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t07-2 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t07-2 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t07-2 .exam { stroke: var(--err, #b42318); }
    #fig-t07-2 .refn-exam { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t07-2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
    <marker id="fig-t07-2-arr-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow-head-crit" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <!-- Critical row: A C E F G -->
  <g>
    <rect class="node node-crit" x="16" y="30" width="76" height="64" rx="6"/>
    <text class="t" x="54" y="55">A</text>
    <text class="s" x="54" y="70">2 тиж.</text>
    <text class="s" x="54" y="83">0–2 / 0–2</text>

    <rect class="node node-crit" x="152" y="30" width="76" height="64" rx="6"/>
    <text class="t" x="190" y="55">C</text>
    <text class="s" x="190" y="70">4 тиж.</text>
    <text class="s" x="190" y="83">2–6 / 2–6</text>

    <rect class="node node-crit" x="288" y="30" width="76" height="64" rx="6"/>
    <text class="t" x="326" y="55">E</text>
    <text class="s" x="326" y="70">6 тиж.</text>
    <text class="s" x="326" y="83">6–12 / 6–12</text>

    <rect class="node node-crit" x="424" y="30" width="76" height="64" rx="6"/>
    <text class="t" x="462" y="55">F</text>
    <text class="s" x="462" y="70">4 тиж.</text>
    <text class="s" x="462" y="83">12–16 / 12–16</text>

    <rect class="node node-crit" x="548" y="30" width="76" height="64" rx="6"/>
    <text class="t" x="586" y="55">G</text>
    <text class="s" x="586" y="70">2 тиж.</text>
    <text class="s" x="586" y="83">16–18 / 16–18</text>

    <path class="arrow-crit" marker-end="url(#fig-t07-2-arr-crit)" d="M92 62 L148 62"/>
    <path class="arrow-crit" marker-end="url(#fig-t07-2-arr-crit)" d="M228 62 L284 62"/>
    <path class="arrow-crit" marker-end="url(#fig-t07-2-arr-crit)" d="M500 62 L544 62"/>
  </g>

  <!-- Float branch: B D -->
  <g>
    <rect class="node node-float" x="152" y="150" width="76" height="64" rx="6"/>
    <text class="t" x="190" y="175">B</text>
    <text class="s" x="190" y="190">5 тиж.</text>
    <text class="s" x="190" y="203">2–7 / 4–9</text>

    <rect class="node node-float" x="288" y="150" width="76" height="64" rx="6"/>
    <text class="t" x="326" y="175">D</text>
    <text class="s" x="326" y="190">3 тиж.</text>
    <text class="s" x="326" y="203">7–10 / 9–12</text>

    <path class="arrow" marker-end="url(#fig-t07-2-arr)" d="M54 94 Q54 150 148 182"/>
    <path class="arrow" marker-end="url(#fig-t07-2-arr)" d="M228 182 L284 182"/>
    <path class="arrow" marker-end="url(#fig-t07-2-arr)" d="M340 150 Q400 110 458 94"/>
  </g>

  <path class="arrow-crit" marker-end="url(#fig-t07-2-arr-crit)" d="M364 62 L420 62"/>

  <rect class="node exam" x="16" y="240" width="608" height="76" rx="6" fill="var(--surface, #ffffff)"/>
  <text class="lbl" x="320" y="264" text-anchor="middle" font-weight="700">Критичний шлях A–C–E–F–G: 18 тижнів, резерв кожної роботи — 0</text>
  <text class="lbl" x="320" y="284" text-anchor="middle">Гілка A–B–D–F–G: 16 тижнів, резерв B і D — 2 тижні кожна</text>
  <text class="lbl" x="320" y="302" text-anchor="middle">F не почнеться, доки не завершаться і D, і E — визначальна E (пізніший ранній фініш)</text>

  <circle class="refc" cx="222" cy="38" r="11"/><text class="refn" x="222" y="42">1</text>
  <circle class="refc exam" cx="16" cy="46" r="11"/><text class="refn refn-exam" x="16" y="50">2</text>
  <circle class="refc" cx="152" cy="166" r="11"/><text class="refn" x="152" y="170">3</text>
  <circle class="refc" cx="288" cy="150" r="11"/><text class="refn" x="288" y="154">4</text>
</svg>
