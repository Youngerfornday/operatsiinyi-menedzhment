<svg xmlns="http://www.w3.org/2000/svg" id="fig-t07-4" class="scheme" viewBox="0 0 640 312" role="img" aria-labelledby="fig-t07-4-title fig-t07-4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t07-4-title">Рисунок 4. Ймовірність дотримання строку за методом PERT</title>
  <desc id="fig-t07-4-desc">Дзвоноподібна крива нормального розподілу з віссю тижнів знизу. Вертикальна пунктирна лінія по центру підписана TE = 18 тижнів, ділить криву навпіл. Друга вертикальна лінія правіше підписана D = 20 тижнів, Z приблизно 1,38. Площа під кривою ліворуч від другої лінії заштрихована карміном і підписана 91,6 %.</desc>
