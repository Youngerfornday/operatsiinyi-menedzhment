<svg xmlns="http://www.w3.org/2000/svg" id="fig-t07-4" class="scheme" viewBox="0 0 640 340" role="img" aria-labelledby="fig-t07-4-title fig-t07-4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t07-4-title">Рисунок 4. Ймовірність дотримання строку за методом PERT</title>
  <desc id="fig-t07-4-desc">Дзвоноподібна крива нормального розподілу з віссю тижнів знизу. Вертикальна пунктирна лінія по центру підписана TE = 18 тижнів, ділить криву навпіл. Друга вертикальна лінія правіше підписана D = 20 тижнів, Z приблизно 1,38. Площа під кривою ліворуч від другої лінії заштрихована карміном і підписана 91,6 %.</desc>
  <style>
    #fig-t07-4 .axis { stroke: var(--ink-2, #445570); stroke-width: 1; }
    #fig-t07-4 .curve { stroke: var(--ink, #0f1c2e); stroke-width: 1.75; fill: none; }
    #fig-t07-4 .area { fill: var(--err, #b42318); opacity: 0.28; stroke: none; }
    #fig-t07-4 .mean { stroke: var(--ink-2, #445570); stroke-width: 1.25; stroke-dasharray: 4 3; }
    #fig-t07-4 .target { stroke: var(--err, #b42318); stroke-width: 1.5; stroke-dasharray: 4 3; }
    #fig-t07-4 .t { fill: var(--ink, #0f1c2e); font-size: 13px; font-weight: 650; text-anchor: middle; }
    #fig-t07-4 .s { fill: var(--ink-2, #445570); font-size: 11.5px; text-anchor: middle; }
    #fig-t07-4 .tick { fill: var(--ink-2, #445570); font-size: 10px; text-anchor: middle; }
    #fig-t07-4 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t07-4 .refn { fill: var(--ink, #0f1c2e); font-size: 11px; font-weight: 700; text-anchor: middle; }
    #fig-t07-4 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t07-4 .refn-exam { fill: var(--err-ink, #8f1d14); }
  </style>

  <!-- x-scale: week w -> x = 284 + (w-18)*36 (sigma ~ 1.45 wk -> ~52px) -->
  <line class="axis" x1="60" y1="260" x2="600" y2="260"/>
  <g class="tick">
    <text x="140" y="276">14</text>
    <text x="212" y="276">16</text>
    <text x="284" y="276">18</text>
    <text x="356" y="276">20</text>
    <text x="428" y="276">22</text>
    <text x="500" y="276">24</text>
  </g>

  <path class="area" d="M60 260
    C 100 260 130 258 160 244
    C 190 228 210 190 240 150
    C 255 128 268 108 284 96
    C 300 108 313 128 328 150
    C 350 182 356 195 356 195
    L 356 260 Z"/>

  <path class="curve" d="M60 260
    C 100 260 130 258 160 244
    C 190 228 210 190 240 150
    C 255 128 268 108 284 96
    C 300 108 313 128 328 150
    C 358 194 380 232 410 250
    C 460 260 540 260 600 260"/>

  <line class="mean" x1="284" y1="70" x2="284" y2="260"/>
  <text class="t" x="284" y="58">TE = 18 тиж.</text>

  <line class="target" x1="356" y1="70" x2="356" y2="260"/>
  <text class="t" x="356" y="58" fill="var(--err, #b42318)">D = 20 тиж.</text>
  <text class="s" x="356" y="290">Z ≈ 1,38</text>

  <text class="t" x="230" y="220" fill="var(--surface, #ffffff)" stroke="var(--err, #b42318)" stroke-width="0.4">91,6 %</text>

  <text class="s" x="140" y="120">Площа ліворуч від TE = 50 %</text>

  <circle class="refc" cx="480" cy="120" r="11"/><text class="refn" x="480" y="124">1</text>
  <circle class="refc exam" cx="356" cy="70" r="11"/><text class="refn refn-exam" x="356" y="74">2</text>
  <circle class="refc exam" cx="230" cy="200" r="11"/><text class="refn refn-exam" x="230" y="204">3</text>
  <circle class="refc" cx="284" cy="70" r="11"/><text class="refn" x="284" y="74">4</text>
</svg>
