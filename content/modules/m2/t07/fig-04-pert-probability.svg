    #fig-t07-4 .area { fill: var(--err, #b42318); opacity: 0.28; stroke: none; }
    #fig-t07-4 .mean { stroke: var(--ink-2, #445570); stroke-width: 1.25; stroke-dasharray: 4 3; }
    #fig-t07-4 .target { stroke: var(--err, #b42318); stroke-width: 1.5; stroke-dasharray: 4 3; }
    #fig-t07-4 .t { fill: var(--ink, #0f1c2e); font-size: 13px; font-weight: 650; text-anchor: middle; }
    #fig-t07-4 .s { fill: var(--ink-2, #445570); font-size: 11.5px; text-anchor: middle; }
    #fig-t07-4 .tick { fill: var(--ink-2, #445570); font-size: 10px; text-anchor: middle; }
    #fig-t07-4 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t07-4 .refn { fill: var(--ink, #0f1c2e); font-size: 11px; font-weight: 700; text-anchor: middle; }
    #fig-t07-4 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t07-4 .refn-exam { fill: var(--err-ink, #8f1d14); }
  </style>

