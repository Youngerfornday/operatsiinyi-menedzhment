<svg xmlns="http://www.w3.org/2000/svg" id="fig-t07-1" class="scheme" viewBox="0 0 640 300" role="img" aria-labelledby="fig-t07-1-title fig-t07-1-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t07-1-title">Рисунок 1. Життєвий цикл проєкту: чотири фази</title>
  <desc id="fig-t07-1-desc">Чотири прямокутники в ряд, з’єднані стрілками зліва направо: ініціація проєкту, планування, здійснення і контроль, завершення. Блок планування виділено карміновим як фаза, де будують сітьовий графік. Під рядом підписано, що пропуск фази планування не скорочує проєкт, а переносить її нерозв’язані задачі у фазу здійснення, де вони коштують дорожче.</desc>
  <style>
    #fig-t07-1 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t07-1 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t07-1 .t { fill: var(--ink, #0f1c2e); font-size: 14px; font-weight: 650; }
    #fig-t07-1 .s { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t07-1 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.5; fill: none; }
    #fig-t07-1 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t07-1 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t07-1 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t07-1 .exam { stroke: var(--err, #b42318); }
    #fig-t07-1 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12.5px; font-weight: 600; }
    #fig-t07-1 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t07-1 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t07-1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="60" width="136" height="88" rx="6"/>
  <text class="t" x="84" y="98" text-anchor="middle">Ініціація</text>
  <text class="s" x="84" y="118" text-anchor="middle">мета, ресурси,</text>
  <text class="s" x="84" y="134" text-anchor="middle">рішення «починати»</text>

  <rect class="box box-owner exam" x="176" y="60" width="136" height="88" rx="6"/>
  <text class="t" x="244" y="98" text-anchor="middle">Планування</text>
  <text class="s" x="244" y="118" text-anchor="middle">перелік робіт,</text>
  <text class="s" x="244" y="134" text-anchor="middle">сітьовий графік</text>

  <rect class="box" x="336" y="60" width="136" height="88" rx="6"/>
  <text class="t" x="404" y="90" text-anchor="middle">Здійснення</text>
  <text class="t" x="404" y="106" text-anchor="middle">і контроль</text>
  <text class="s" x="404" y="128" text-anchor="middle">виконання проти</text>
  <text class="s" x="404" y="144" text-anchor="middle">плану й кошторису</text>

  <rect class="box" x="496" y="60" width="128" height="88" rx="6"/>
  <text class="t" x="560" y="98" text-anchor="middle">Завершення</text>
  <text class="s" x="560" y="118" text-anchor="middle">приймання,</text>
  <text class="s" x="560" y="134" text-anchor="middle">закриття розрахунків</text>

  <path class="arrow" marker-end="url(#fig-t07-1-arr)" d="M152 104 L172 104"/>
  <path class="arrow" marker-end="url(#fig-t07-1-arr)" d="M312 104 L332 104"/>
  <path class="arrow" marker-end="url(#fig-t07-1-arr)" d="M472 104 L492 104"/>

  <rect class="box exam" x="16" y="196" width="608" height="76" rx="6"/>
  <text class="t" x="320" y="222" text-anchor="middle">Ціна пропущеної фази</text>
  <text class="exam-t" x="320" y="244" text-anchor="middle">Нерозв’язана задача планування не зникає — вона переходить у фазу здійснення</text>
  <text class="exam-t" x="320" y="262" text-anchor="middle">і коштує там дорожче, бо забирає час, відведений на інші роботи.</text>

  <circle class="refc" cx="16" cy="80" r="11"/><text class="refn" x="16" y="84">1</text>
  <circle class="refc exam" cx="176" cy="80" r="11"/><text class="refn exam-n" x="176" y="84">2</text>
  <circle class="refc" cx="336" cy="80" r="11"/><text class="refn" x="336" y="84">3</text>
  <circle class="refc" cx="496" cy="80" r="11"/><text class="refn" x="496" y="84">4</text>
</svg>
