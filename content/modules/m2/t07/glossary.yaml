# Глосарій теми 7. Назви термінів мають дослівно збігатися з реєстром course.yaml (glossaryTerms, topic: t07).
# Визначення — робочі формулювання курсу; розрахункові співвідношення беруться з docs/research/formula-baseline.md
# (коди PRJ-01…PRJ-09).
topic: t07
terms:
  - id: project
    term: Проєкт
    definition: >-
      Одноразовий комплекс взаємопов’язаних робіт з чітко визначеними терміном початку й терміном завершення,
      обмеженим обсягом матеріальних, людських і фінансових ресурсів, спрямований на досягнення унікального
      результату. На відміну від поточної операційної діяльності, яка повторюється циклічно, проєкт має
      однозначний кінець і не повторюється в тому самому вигляді.
    synonyms:
      - проєкт
      - project
    forms:
      - проєкт
      - проєкту
      - проєктом
      - проєкти
      - проєктів
      - проєкт
    seeAlso: [project-life-cycle, network-diagram, critical-path]

  - id: project-life-cycle
    term: Життєвий цикл проєкту
    definition: >-
      Послідовність фаз, які проходить проєкт від задуму до завершення. Найпоширеніший поділ — чотири етапи:
      ініціація проєкту, планування, здійснення і контроль, завершення. Кожна фаза має власний набір задач і
      власний ризик; пропуск фази планування не скорочує проєкт, а переносить її задачі, не розв’язані заздалегідь,
      у фазу здійснення, де їх розв’язання коштує дорожче.
    synonyms:
      - фази проєкту
      - project life cycle
    forms:
      - життєвий цикл проєкту
      - життєвого циклу проєкту
      - життєвому циклу проєкту
      - життєвим циклом проєкту
    seeAlso: [project, network-diagram]

  - id: network-diagram
    term: Сітьовий графік
    definition: >-
      Графічна модель проєкту, у якій роботи та їхня послідовність показані вузлами й стрілками; кожна робота
      має список безпосередніх попередників. Сітьовий графік — вхідні дані для методу критичного шляху: за ним
      обчислюють ранні й пізні терміни кожної роботи, резерви часу та сам критичний шлях.
    synonyms:
      - мережевий графік
      - сітьова модель проєкту
      - network diagram
    forms:
      - сітьовий графік
      - сітьового графіка
      - сітьовому графіку
      - сітьовим графіком
      - сітьові графіки
    seeAlso: [critical-path, early-start, late-start]

  - id: critical-path
    term: Критичний шлях
    definition: >-
      Найдовший за тривалістю шлях сітьового графіка від початкової до кінцевої події; його довжина визначає
      мінімально можливу тривалість усього проєкту. Сума резервів часу робіт критичного шляху дорівнює нулю:
      затримка будь-якої критичної роботи на день затримує проєкт на той самий день.
    synonyms:
      - критичний ланцюг робіт
      - critical path
    forms:
      - критичний шлях
      - критичного шляху
      - критичному шляху
      - критичним шляхом
      - критичні роботи
    seeAlso: [network-diagram, total-float, project-crashing]

  - id: early-start
    term: Ранній початок роботи
    definition: >-
      Найраніший можливий момент, коли робота може розпочатися, — максимум з ранніх фінішів усіх її безпосередніх
      попередників. Ранній фініш дорівнює ранньому початку плюс тривалість роботи. Розрахунок раннього початку
      йде від початкової події сітьового графіка до кінцевої — це «прямий прохід» методу критичного шляху.
    synonyms:
      - ES
      - early start
    forms:
      - ранній початок роботи
      - раннього початку роботи
      - ранньому початку роботи
      - раннім початком роботи
      - ранні початки робіт
    seeAlso: [network-diagram, late-start, critical-path]

  - id: late-start
    term: Пізній початок роботи
    definition: >-
      Найпізніший момент, коли робота може розпочатися без затримки всього проєкту, — пізній фініш мінус
      тривалість роботи. Пізній фініш дорівнює мінімуму з пізніх стартів усіх безпосередніх наступників роботи.
      Розрахунок пізнього початку йде від кінцевої події сітьового графіка до початкової — це «зворотний прохід».
    synonyms:
      - LS
      - late start
    forms:
      - пізній початок роботи
      - пізнього початку роботи
      - пізньому початку роботи
      - пізнім початком роботи
      - пізні початки робіт
    seeAlso: [early-start, total-float, critical-path]

  - id: total-float
    term: Повний резерв часу
    definition: >-
      Запас часу, на який можна затримати початок або продовжити тривалість роботи без зсуву терміну завершення
      усього проєкту: різниця між пізнім і раннім початком роботи (або між пізнім і раннім фінішем). Повний
      резерв, вичерпаний на одній роботі шляху, зменшує резерв усіх інших робіт того самого шляху. Робота з
      нульовим повним резервом — критична.
    synonyms:
      - повний резерв
      - загальний резерв часу
      - total float
    forms:
      - повний резерв часу
      - повного резерву часу
      - повному резерву часу
      - повним резервом часу
      - повні резерви часу
    seeAlso: [free-float, critical-path, early-start]

  - id: free-float
    term: Вільний резерв часу
    definition: >-
      Частина повного резерву, яку можна використати для затримки роботи, не зсуваючи ранній початок жодної
      наступної роботи: різниця між найменшим раннім початком безпосередніх наступників і раннім фінішем цієї
      роботи. Вільний резерв завжди не більший за повний: нульовий вільний резерв не означає, що робота
      критична, — вона лише передає свою затримку наступній роботі, у якої може лишатися власний резерв.
    synonyms:
      - вільний резерв
      - free float
    forms:
      - вільний резерв часу
      - вільного резерву часу
      - вільному резерву часу
      - вільним резервом часу
      - вільні резерви часу
    seeAlso: [total-float, early-start, network-diagram]

  - id: gantt-chart
    term: Діаграма Ганта
    definition: >-
      Лінійний графік проєкту, на якому кожна робота показана горизонтальним відрізком від раннього початку
      до раннього фінішу вздовж спільної шкали часу; довжина відрізка дорівнює тривалості роботи, а розрив між
      ним і пізнім фінішем — резерву часу. На відміну від сітьового графіка діаграма Ганта наочно показує
      завантаження часу, але не показує прямо логіку залежностей між роботами.
    synonyms:
      - лінійний графік Ганта
      - стрічковий графік
      - Gantt chart
    forms:
      - діаграма Ганта
      - діаграми Ганта
      - діаграмі Ганта
      - діаграмою Ганта
    seeAlso: [network-diagram, total-float, project]

  - id: pert
    term: Метод PERT
    definition: >-
      Метод оцінки й перегляду планів (Program Evaluation and Review Technique): на відміну від методу
      критичного шляху, який бере тривалість роботи як точно відому, PERT явно враховує невизначеність і задає
      кожну роботу трьома оцінками — оптимістичною, найімовірнішою й песимістичною. З них обчислюють очікувану
      тривалість роботи та її дисперсію, а суму дисперсій робіт критичного шляху використовують для оцінки
      ймовірності завершення проєкту в заданий строк.
    synonyms:
      - PERT
      - метод оцінювання та перегляду планів
    forms:
      - метод PERT
      - методу PERT
      - методом PERT
      - методі PERT
    seeAlso: [activity-variance, critical-path, project]

  - id: activity-variance
    term: Дисперсія тривалості роботи
    definition: >-
      Міра невизначеності тривалості роботи в методі PERT: квадрат стандартного відхилення, обчислений із
      розмаху між песимістичною і оптимістичною оцінками. Що ширший розмах трьох оцінок, то більша дисперсія
      й то менш надійний точковий прогноз тривалості цієї роботи. Дисперсія проєкту — сума дисперсій лише
      робіт критичного шляху, а не всіх робіт сітьового графіка.
    synonyms:
      - дисперсія роботи
      - activity variance
    forms:
      - дисперсія тривалості роботи
      - дисперсії тривалості роботи
      - дисперсію тривалості роботи
      - дисперсією тривалості роботи
    seeAlso: [pert, critical-path]

  - id: project-crashing
    term: Стиснення проєкту
    definition: >-
      Цілеспрямоване скорочення тривалості проєкту за рахунок додаткових витрат на пришвидшення окремих робіт
      критичного шляху — понаднормові зміни, додаткові виконавці, паралельне ведення частин роботи. Кожна
      робота має нахил вартості — подорожчання на одиницю скороченого часу; щоб мінімізувати подорожчання всього
      проєкту, спершу стискають критичну роботу з найменшим нахилом, і лише до її мінімально можливої тривалості.
    synonyms:
      - стиснення проєкту
      - crashing
      - компресія проєкту
    forms:
      - стиснення проєкту
      - стиснення проєкту
      - стисненню проєкту
      - стисненням проєкту
    seeAlso: [critical-path, project]
