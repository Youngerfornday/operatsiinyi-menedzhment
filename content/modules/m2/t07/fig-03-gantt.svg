<svg xmlns="http://www.w3.org/2000/svg" id="fig-t07-3" class="scheme" viewBox="0 0 640 340" role="img" aria-labelledby="fig-t07-3-title fig-t07-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t07-3-title">Рисунок 3. Діаграма Ганта запуску лінії пакування</title>
  <desc id="fig-t07-3-desc">Горизонтальна шкала часу від 0 до 18 тижнів, сім рядків-відрізків одна під одною за роботами A, B, C, D, E, F, G. Відрізки критичних робіт A, C, E, F, G суцільні карміном і закінчуються без продовження. Відрізки B і D сірі з продовженням світлішого відтінку праворуч, що показує резерв часу до пізнього фінішу. Вертикальна пунктирна лінія на позначці 18 тижнів підписана як строк завершення проекту.</desc>
  <style>
    #fig-t07-3 .axis { stroke: var(--ink-2, #445570); stroke-width: 1; }
    #fig-t07-3 .grid { stroke: var(--ink-2, #445570); stroke-width: 0.5; opacity: 0.35; }
    #fig-t07-3 .tick { fill: var(--ink-2, #445570); font-size: 10px; text-anchor: middle; }
    #fig-t07-3 .rowlabel { fill: var(--ink, #0f1c2e); font-size: 13px; font-weight: 700; }
    #fig-t07-3 .bar-crit { fill: var(--err, #b42318); }
    #fig-t07-3 .bar-float { fill: var(--ink-2, #445570); }
    #fig-t07-3 .bar-float-slack { fill: var(--ink-2, #445570); opacity: 0.3; }
    #fig-t07-3 .deadline { stroke: var(--err, #b42318); stroke-width: 1.5; stroke-dasharray: 4 3; }
    #fig-t07-3 .lbl { fill: var(--ink-2, #445570); font-size: 11px; }
    #fig-t07-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t07-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11px; font-weight: 700; text-anchor: middle; }
    #fig-t07-3 .refn-exam { fill: var(--err-ink, #8f1d14); }
  </style>

  <!-- scale: x = 40 + weeks*30, weeks 0..18 -->
  <line class="axis" x1="40" y1="270" x2="580" y2="270"/>
  <g class="tick">
    <text x="40" y="286">0</text>
    <text x="130" y="286">3</text>
    <text x="220" y="286">6</text>
    <text x="310" y="286">9</text>
    <text x="400" y="286">12</text>
    <text x="490" y="286">15</text>
    <text x="580" y="286">18</text>
  </g>
  <line class="grid" x1="130" y1="20" x2="130" y2="270"/>
  <line class="grid" x1="220" y1="20" x2="220" y2="270"/>
  <line class="grid" x1="310" y1="20" x2="310" y2="270"/>
  <line class="grid" x1="400" y1="20" x2="400" y2="270"/>
  <line class="grid" x1="490" y1="20" x2="490" y2="270"/>

  <!-- rows, height 30, gap 4 -->
  <text class="rowlabel" x="16" y="34">A</text>
  <rect class="bar-crit" x="40" y="20" width="60" height="16" rx="2"/>

  <text class="rowlabel" x="16" y="68">B</text>
  <rect class="bar-float" x="100" y="54" width="150" height="16" rx="2"/>
  <rect class="bar-float-slack" x="250" y="54" width="60" height="16" rx="2"/>

  <text class="rowlabel" x="16" y="102">C</text>
  <rect class="bar-crit" x="100" y="88" width="120" height="16" rx="2"/>

  <text class="rowlabel" x="16" y="136">D</text>
  <rect class="bar-float" x="250" y="122" width="90" height="16" rx="2"/>
  <rect class="bar-float-slack" x="340" y="122" width="60" height="16" rx="2"/>

  <text class="rowlabel" x="16" y="170">E</text>
  <rect class="bar-crit" x="220" y="156" width="180" height="16" rx="2"/>

  <text class="rowlabel" x="16" y="204">F</text>
  <rect class="bar-crit" x="400" y="190" width="120" height="16" rx="2"/>

  <text class="rowlabel" x="16" y="238">G</text>
  <rect class="bar-crit" x="520" y="224" width="60" height="16" rx="2"/>

  <line class="deadline" x1="580" y1="10" x2="580" y2="270"/>
  <text class="lbl" x="580" y="8" text-anchor="end">строк — 18 тиж.</text>

  <circle class="refc" cx="40" cy="20" r="10"/><text class="refn" x="40" y="24">1</text>
  <circle class="refc" cx="100" cy="88" r="10"/><text class="refn" x="100" y="92">2</text>
  <circle class="refc" cx="100" cy="54" r="10"/><text class="refn" x="100" y="58">3</text>
  <circle class="refc" cx="250" cy="122" r="10"/><text class="refn" x="250" y="126">4</text>
</svg>
