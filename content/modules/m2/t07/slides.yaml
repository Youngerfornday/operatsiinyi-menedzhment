# Презентація теми 7. Текст слайдів стислий: повний виклад — у lecture.mdx, пояснення — у нотатках.
# Кожне число слайда має бути в лонгріді теми й мати джерело зі sources.yaml.
topic: t07
slides:
  - id: title
    type: title
    subtitle: Модуль 2. Управління проектами
    notes: >-
      Вступ через контраст із попередніми темами: там операційна система вже працює, тут — одноразовий комплекс
      робіт з початком і кінцем. Наскрізний приклад теми — запуск нової лінії пакування. Запитайте аудиторію,
      які проекти вони самі вже виконували на роботі чи в навчанні.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після теми
    notes: >-
      Три результати: перший понятійний (відрізнити проект від операційної діяльності), другий і третій —
      розрахункові (сітьовий графік і критичний шлях; очікуваний строк та ймовірність методом PERT).
      Запитайте, хто вже будував діаграму Ганта на практиці.

  - id: s01-section
    type: section
    number: 1
    title: Сутність проектного підходу до управління організацією; ознаки проектів
    notes: >-
      Перше питання теми. Проект відрізняється від операційної діяльності відсутністю повторюваності — і саме
      тому вищою невизначеністю тривалості кожної роботи. Приклад: партія з 500 однакових виробів — не проект,
      навіть якщо складна. Запитайте, чому запуск нової лінії — проект, а її подальша робота — вже ні.

  - id: s01-signs
    type: bullets
    title: Чотири ознаки проекту
    bullets:
      - Одноразовість — не повторюється в тому самому вигляді.
      - Чітко визначені терміни початку й завершення.
      - Обмежений обсяг ресурсів — грошей, людей, матеріалів.
      - Унікальний результат — його не можна купити в каталозі постачальника.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Кожна ознака відсікає щось важливе: без обмеженого бюджету — це не проект, а нескінченне фінансування;
      без унікального результату — це закупівля. Приклад: цех, що працюватиме, доки існує підприємство, —
      не проект. Запитайте, яку з чотирьох ознак найлегше переплутати з операційною діяльністю.

  - id: s01-vs-operations
    type: two-columns
    title: Проект проти поточної операційної діяльності
    left:
      heading: Операційна діяльність
      bullets:
        - Циклічна — повторюється цикл за циклом.
        - Маршрут відпрацьований і перевірений.
        - Відхилення рідко перевищують кілька відсотків.
    right:
      heading: Проект
      bullets:
        - Одноразовий, не повторюється в тому вигляді.
        - Кожна робота виконується вперше для команди.
        - Невизначеність тривалості — норма, а не виняток.
    sources: [heizer-render-munson-2016]
    notes: >-
      Ця невизначеність і приводить нас до методу PERT у другій половині теми. Приклад: команда, що змонтувала
      одну лінію, при монтажі наступної однаково зіткнеться з іншим приміщенням і постачальником. Запитайте,
      чи можна перенести весь досвід одного проекту на наступний без змін.

  - id: s02-section
    type: section
    number: 2
    title: Життєвий цикл проекту і його фази
    notes: >-
      Друге питання теми. Чотири фази: ініціація, планування, здійснення і контроль, завершення. Головна теза:
      нерозв’язана на плануванні задача не зникає, а переходить у фазу здійснення дорожчою. Запитайте, яку фазу
      найчастіше скорочують під тиском строків і чим це закінчується.

  - id: s02-figure
    type: figure
    title: Чотири фази життєвого циклу проекту
    figure: fig-01-life-cycle.svg
    caption: Пропуск фази планування не скорочує проект, а переносить її задачі у фазу здійснення, де вони коштують дорожче.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Планування само не дає жодної одиниці кінцевого результату, але визначає, наскільки керованими будуть
      решта фаз. Приклад: не узгоджений наперед строк постачання обладнання зринає посеред монтажу.
      Запитайте, у якій фазі команда найчастіше виявляє власні помилки планування.

  - id: s02-case-ukrzaliznytsia
    type: case
    title: Укрзалізниця — відбудова мосту через Ірпінь як багатофазний проект
    case: ukrzaliznytsia
    facts:
      - Тимчасове відновлення руху — початок травня 2022 року.
      - Капітальні роботи — з липня 2022 року.
      - Рух непарною колією — кінець листопада 2022 року.
      - Повне завершення з рухом обома коліями — кінець березня 2023 року.
      - За офіційною цитатою, станом на квітень 2023 року відновлено третину пошкоджених мостів.
    question: Чому відбудову описують послідовністю фаз, а не єдиною датою «міст готовий»?
    sources: [ukrzaliznytsia-bridge-2023, ukrzaliznytsia-bridge-interfax-2023]
    notes: >-
      Кожна проміжна дата — точка, у якій частина результату вже доступна для використання, поки решта робіт
      триває: спершу тимчасова схема, тоді капітальні роботи, тоді одна колія, і лише наостанок — обидві.
      Межа кейсу: «третина мостів» — проміжна цифра квітня 2023 року, а не поточний стан. Запитайте, який ще
      інфраструктурний проект аудиторія бачила поділеним на подібні фази.

  - id: s03-section
    type: section
    number: 3
    title: Характеристика методів планування та контролю проектів
    notes: >-
      Третє питання теми. CPM бере тривалість роботи як точно відому; PERT — як невизначену, задану трьома
      оцінками. Обидва спираються на ту саму сітьову модель. Запитайте, у якому з двох підходів більше довіряють
      оцінці виконавця, а в якому — виміру.

  - id: s03-columns
    type: two-columns
    title: Метод критичного шляху проти методу PERT
    left:
      heading: CPM
      bullets:
        - Тривалість роботи — одне точно відоме число.
        - Придатний, коли роботи вже виконувалися раніше.
        - Дає єдиний детермінований строк проекту.
    right:
      heading: PERT
      bullets:
        - Три оцінки — оптимістична, найімовірніша, песимістична.
        - Явно враховує невизначеність тривалості.
        - Дає ймовірність дотримання заданого строку.
    sources: [omelianenko-osokina-2016]
    notes: >-
      В українській практиці обидва методи разом зі складнішими модифікаціями об’єднують терміном «методи
      сітьового планування та управління». Приклад: поєднання переваг CPM і PERT з обліком вартості дає третій,
      похідний метод. Запитайте, для якого зі своїх проектів аудиторія обрала б PERT, а не CPM.

  - id: s03-case-boeing
    type: case
    title: Boeing 787 — коли контроль над критичним шляхом залежить від партнерів
    case: boeing-787
    facts:
      - Проєктування й виготовлення великих модулів передали партнерам першого рівня.
      - Перший політ — 15 грудня 2009 року, приблизно на два роки пізніше плану 2007 року.
      - Перша поставка замовнику — 25 вересня 2011 року, підтверджено офіційним пресрелізом.
      - Відносно плану травня 2008 року це приблизно 40 місяців затримки.
    question: Чому передання цілих модулів партнерам ускладнює саме контроль критичного шляху?
    sources: [boeing-787-delivery-2011, boeing-787-wikipedia]
    notes: >-
      Сітьова модель однаково правильна незалежно від виконавця роботи — проблема мегапроєкту не в моделі,
      а в тому, що вхідні дані про фактичний стан кожної роботи стали ненадійними. Межа кейсу: це наслідок
      конкретної моделі виконання, а не аутсорсингу як такого. Запитайте, як інакше можна було б зберегти
      контроль над критичним шляхом за такої моделі постачання.

  - id: s04-section
    type: section
    number: 4
    title: Сітьове планування — побудова графіка, ранні й пізні терміни, критичний шлях
    notes: >-
      Четверте питання теми, і найрозрахунковіша частина лекції. Наскрізний приклад — сім робіт запуску лінії
      пакування, дві гілки, що сходяться перед фінальним пусконалагодженням. Запитайте, скільки шляхів матиме
      графік, якщо додати ще одну паралельну гілку.

  - id: s04-table
    type: bullets
    title: Сім робіт запуску лінії пакування
    bullets:
      - 'A: технічне завдання та бюджет, 2 тижні, без попередників.'
      - 'B → D: замовлення (5 тиж.) і монтаж (3 тиж.) допоміжного обладнання.'
      - 'C → E: проєктування (4 тиж.) і монтаж основної лінії (6 тиж.).'
      - 'F: пусконалагодження (4 тиж.), потребує завершення і D, і E.'
      - 'G: навчання персоналу та запуск, 2 тижні.'
    sources: [omelianenko-osokina-2016]
    notes: >-
      Дві гілки — B–D (допоміжне обладнання) і C–E (основна лінія) — сходяться перед F. Приклад: F не почнеться,
      доки не завершаться обидві. Запитайте, яка з двох гілок, на думку аудиторії, довша, ще до розрахунку.

  - id: s04-figure
    type: figure
    title: Сітьовий графік і критичний шлях
    figure: fig-02-network.svg
    caption: Критичний шлях A–C–E–F–G триває 18 тижнів; гілка A–B–D–F–G має резерв 2 тижні.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Ранній старт F визначає довша з двох гілок (12 тижнів по E, а не 10 тижнів по D) — саме тому критичний
      шлях іде через E, а не через D. Приклад перевірки: 2+4+6+4+2 = 18 тижнів. Запитайте, як зміниться
      критичний шлях, якщо E скоротити на 3 тижні.

  - id: s04-formula-cpm
    type: formula
    title: Ранні й пізні терміни, критичний шлях
    formula: 'ES = max(EF попередників); LS = LF − t; Резерв = LS − ES; критичний шлях — резерв = 0'
    explanation:
      - Прямий прохід (від початку) дає ранні терміни ES і EF кожної роботи.
      - Зворотний прохід (від кінця) дає пізні терміни LS і LF.
      - Резерв роботи — різниця LS − ES; нульовий резерв означає критичну роботу.
      - 'Критичний шлях A–C–E–F–G: 18 тижнів, резерв кожної його роботи — 0.'
      - 'Гілка A–B–D–F–G: 16 тижнів, резерв B і D — по 2 тижні.'
    sources: [omelianenko-osokina-2016]
    notes: >-
      Коди бази — PRJ-01 (ES/EF), PRJ-02 (LS/LF), PRJ-03 (резерв), PRJ-04 (критичний шлях). Приклад перевірки
      другим шляхом: 2+5+3+4+2 = 16 тижнів, на 2 коротше за критичний — це і є резерв B і D. Запитайте, чому
      резерв B і D однаковий, хоча самі роботи різної тривалості.

  - id: s04-formula-crash
    type: formula
    title: Стиснення проекту на 2 тижні з мінімальним подорожчанням
    formula: Нахил вартості = (Вартість стиснення − Норм. вартість) / (Норм. тривалість − Трив. стиснення)
    explanation:
      - 'Нахили критичних робіт, тис. грн/тиждень: A 400, C 400, E 600, F 600, G 300.'
      - Стискати з користю можна лише роботи критичного шляху.
      - 'Крок 1: стиснути G (найдешевша, 300 тис. грн) на 1 тиждень — 18 → 17.'
      - 'Крок 2: стиснути A (400 тис. грн) на 1 тиждень — 17 → 16.'
      - Разом 700 тис. грн; A обрано замість C, бо вона спільна для обох гілок графіка.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Код бази — PRJ-08. Пояснити вибір A замість C з тим самим нахилом: C належить лише критичному шляху й
      звузила б резерв гілки B–D із 2 до 1 тижня. Запитайте, що станеться, якщо після цих двох кроків знадобиться
      стиснути ще на тиждень.

  - id: s05-section
    type: section
    number: 5
    title: Резерви часу робіт і їх використання; діаграма Ганта
    notes: >-
      П’яте питання теми. Повний резерв і вільний резерв — різні числа, і плутати їх небезпечно. Приклад:
      робота B має повний резерв 2 тижні, але вільний резерв 0. Запитайте, чи означає нульовий вільний резерв,
      що робота критична.

  - id: s05-formula-float
    type: formula
    title: Повний і вільний резерв — не те саме
    formula: Вільний резерв = min(ES наступників) − EF роботи
    explanation:
      - 'Повний резерв B і D — по 2 тижні (PRJ-03): не зсуває строку проекту.'
      - 'Вільний резерв B: ES(D) − EF(B) = 7 − 7 = 0 (PRJ-09).'
      - 'Вільний резерв D: ES(F) − EF(D) = 12 − 10 = 2 (PRJ-09).'
      - Нульовий вільний резерв не означає, що робота критична.
      - Він означає, що будь-яка затримка одразу передається наступній роботі.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Менеджер, який бачить лише повний резерв 2 тижні на B і вважає роботу «нетерміновою», ризикує непомітно
      з’їсти резерв роботи D ще до того, як сам відчує брак часу. Запитайте, у якої з двох робіт — B чи D —
      запізнення небезпечніше для сусідніх робіт.

  - id: s05-figure
    type: figure
    title: Діаграма Ганта запуску лінії пакування
    figure: fig-03-gantt.svg
    caption: Суцільні відрізки критичних робіт закінчуються без резерву; світліші продовження B і D показують резерв часу.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Діаграма Ганта не показує прямо залежностей між роботами, зате наочно показує завантаження часу по тижнях
      і лягає на календар. Приклад: та сама інформація, що й на сітьовому графіку, лише в лінійному вигляді.
      Запитайте, яку інформацію сітьового графіка діаграма Ганта не показує прямо.

  - id: s05-case-ukrposhta
    type: case
    title: Укрпошта — скелет діаграми Ганта з паралельними потоками
    case: ukrposhta
    facts:
      - За 22 місяці збудовано 24 логістичні центри (державне джерело).
      - Увесь проєкт автоматизації реалізовано за 37 місяців (позиція компанії).
      - Дата завершення розходиться в джерелах — 2025 рік за державним джерелом, травень 2026 року за компанією.
      - 24 центри — не одна робота, а 24 паралельні потоки з власними датами запуску.
    question: Чому для такої програми природніше показати діаграму Ганта, а не єдиний критичний шлях?
    sources: [mininfra-ukrposhta-2025, ukrposhta-automation-delo-2026]
    notes: >-
      37 місяців усього проєкту — це, найімовірніше, найдовший потік плюс роботи до і після паралельної фази,
      а не сума 24 центрів. Межа кейсу: розбивки, які саме місяці працював кожен центр, у відкритих джерелах
      немає. Запитайте, як 22-місячна паралельна фаза співвідноситься із загальними 37 місяцями.

  - id: s06-section
    type: section
    number: 6
    title: Метод PERT — оцінки, дисперсія, ймовірність строку
    notes: >-
      Шосте питання теми. Три оцінки замість однієї: оптимістична, найімовірніша, песимістична. Приклад: у
      наскрізному прикладі найімовірніша оцінка збігається з тривалістю з CPM-розрахунку, тому очікувані часи
      й критичний шлях не змінюються. Запитайте, чому саме найімовірніша оцінка враховується вчетверо.

  - id: s06-formula-te
    type: formula
    title: Очікуваний час і дисперсія роботи
    formula: 'te = (o + 4m + p) / 6; σ² = ((p − o) / 6)²'
    explanation:
      - 'Робота E: o=3, m=6, p=9 → te = (3+24+9)/6 = 6,0 тижня (PRJ-05).'
      - 'Дисперсія E: ((9−3)/6)² = 1,000 — найбільша серед критичних робіт (PRJ-06).'
      - Дисперсію рахують для всіх семи робіт, у суму проекту йдуть лише критичні.
      - 'Сума дисперсій критичного шляху: 0,111+0,444+1,000+0,444+0,111 = 2,111.'
      - Стандартне відхилення критичного шляху σ ≈ 1,45 тижня.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Дисперсія B і D (0,444 кожна) у суму не входить — резервна гілка не визначає строку проекту, доки її
      резерв не вичерпано. Приклад: що ширший розмах між p і o, то більша невизначеність саме цієї роботи.
      Запитайте, яка робота дає найбільший внесок у невизначеність усього проекту.

  - id: s06-formula-prob
    type: formula
    title: Імовірність дотримання строку
    formula: Z = (D − TE) / σ; Φ(Z) — за таблицею стандартного нормального розподілу
    explanation:
      - 'Директивний строк D = 20 тижнів, очікуваний TE = 18 тижнів, σ ≈ 1,45.'
      - 'Z = (20 − 18) / 1,45 ≈ 1,38 (PRJ-07).'
      - 'За таблицею нормального розподілу Φ(1,38) = 0,9162.'
      - Імовірність дотримати строк 20 тижнів — приблизно 91,6 %.
      - Імовірність дотримати строк рівно 18 тижнів — 50 % (середина розподілу).
    sources: [omelianenko-osokina-2016]
    notes: >-
      Метод не враховує ризику, що резервна гілка сама стане критичною (ефект злиття шляхів): вона теж має
      власну дисперсію й лише 2 тижні резерву. Приклад: якщо обидві її роботи наблизяться до песимістичних
      оцінок, вона може перевищити 18 тижнів. Запитайте, як змінилася б ймовірність, якби замовник вимагав
      18 тижнів рівно.

  - id: s06-figure
    type: figure
    title: Крива нормального розподілу строку проекту
    figure: fig-04-pert-probability.svg
    caption: Заштрихована площа ліворуч від директивного строку D = 20 тижнів — імовірність дотримання строку, 91,6 %.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Площа ліворуч від TE завжди дорівнює 50 % — властивість симетричного нормального розподілу, а не окремий
      розрахунок. Приклад: директивний строк 20 тижнів — це TE плюс 1,38 стандартного відхилення. Запитайте,
      яка площа була б заштрихована для директивного строку 16 тижнів.

  - id: s07-section
    type: section
    number: 7
    title: Програмне забезпечення управління проектами
    notes: >-
      Сьоме, останнє питання теми. Розрахунки лекції виконано вручну на сімох роботах; реальні проекти
      налічують сотні й тисячі. Запитайте, з якою кількістю робіт, на думку аудиторії, розрахунок вручну
      стає непрактичним.

  - id: s07-role
    type: bullets
    title: Що дає спеціалізоване програмне забезпечення
    bullets:
      - Виконує ту саму логіку — прямий і зворотний проходи, критичний шлях, PERT-оцінки.
      - Перераховує мережу миттєво після кожної зміни тривалості чи залежності.
      - Автоматично перебудовує діаграму Ганта.
      - Показує перевантаження ресурсу, призначеного на дві паралельні роботи.
    sources: [heizer-render-munson-2016]
    notes: >-
      Для одноразового невеликого проекту, як запуск однієї лінії, достатньо таблиці й графіка на аркуші.
      Приклад: для програми з 24 паралельними потоками (кейс Укрпошти) точний контроль критичного шляху без
      такого забезпечення практично неможливий. Запитайте, який облік ресурсів аудиторія вважає найважчим
      вести вручну.

  - id: s07-cost
    type: bullets
    title: Понад розрахунок строку — вартість і ресурси
    bullets:
      - Будує криві сукупних витрат за проектом і порівнює план із фактом.
      - Поєднує CPM і PERT з обліком вартості в підході PERT/Cost.
      - Пов’язує кожну роботу з ресурсом — людиною, обладнанням, бюджетною статтею.
      - Ті самі формули PRJ-01…PRJ-09 лишаються основою будь-якої такої системи.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Програмне забезпечення не замінює логіку розрахунку — воно лише масштабує її на мережі, які вручну
      порахувати неможливо. Приклад: перерахунок критичного шляху після зміни однієї тривалості займає секунди
      замість повторного проходу вручну. Запитайте, чи бачила аудиторія такі системи на практиці й які саме.

  - id: summary
    type: summary
    title: Підсумок теми
    bullets:
      - Проект — одноразовий, обмежений у ресурсах комплекс робіт з унікальним результатом.
      - Життєвий цикл — чотири фази; ціна помилки планування зростає у фазі здійснення.
      - Критичний шлях — роботи з нульовим резервом; він визначає строк усього проекту.
      - Повний і вільний резерв — різні числа; плутати їх небезпечно.
      - PERT дає ймовірність строку через нормальний розподіл, але не враховує злиття шляхів.
      - Стискати з мінімальним подорожчанням можна лише роботи критичного шляху, від найменшого нахилу.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Поверніться до наскрізного прикладу: критичний шлях A–C–E–F–G, 18 тижнів, імовірність дотримати 20 тижнів
      — 91,6 %, мінімальне стиснення на 2 тижні коштує 700 тис. грн. Запитайте, яке з п’яти чисел аудиторія
      запам’ятала найкраще і чому саме воно.
