# Презентація теми 8. Текст слайдів стислий: повний виклад — у lecture.mdx, пояснення — у нотатках.
# Кожне число слайда має бути в лонгріді теми й мати джерело зі sources.yaml.
topic: t08
slides:
  - id: title
    type: title
    subtitle: Модуль 2. Менеджмент якості та управління продуктивністю операційної діяльності
    sources: [southwest-dot-2023]
    notes: >-
      Вступ через приклад ціни неякості: наприкінці грудня 2022 року авіакомпанія скасувала 16 900
      рейсів, а рік по тому заплатила 140 млн доларів штрафу і понад 600 млн доларів повернень; за
      свідченнями профспілки пілотів, підвела не техніка, а система планування екіпажів. Запитайте аудиторію, у що, на їхню думку, обходиться
      неякість на підприємстві, яке вони знають.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після теми
    notes: >-
      Чотири результати теми: два понятійні (менеджмент якості, вартість якості), два розрахункові —
      контрольні карти й індекси Cp/Cpk. Запитайте, хто з аудиторії вже стикався зі словом «Шість
      сигм» на практиці і в якому контексті.

  - id: s01-section
    type: section
    number: 1
    title: Загальний менеджмент якості — принципи та еволюція підходів
    notes: >-
      Перше питання теми. Якість — рівень відповідності характеристик вимогам, а не абсолютна
      досконалість. TQM пройшов той самий шлях, що й уся дисципліна операційного менеджменту, — від
      контролю до вбудованої властивості процесу. Запитайте, чому контроль наприкінці лінії дорожчий,
      ніж зупинка процесу одразу при відхиленні.

  - id: s01-figure
    type: figure
    title: Цикл Демінга — Шухарта (PDCA)
    figure: fig-01-tqm-pdca.svg
    caption: Чотири кроки, що повторюються знову й знову, підіймаючи рівень якості по спіралі.
    sources: [iso-9000-2015-t08]
    notes: >-
      Пройдіть цикл по колу: план, виконання, перевірка, дія. Наголосіть на четвертому кроці —
      без нього цикл вироджується у звітність, як і в темі 1. Приклад: щотижневий звіт про брак,
      після якого нічого не змінюють, — це цикл без «дій». Запитайте, який крок найчастіше випадає на
      знайомому аудиторії підприємстві.

  - id: s01-case-toyota
    type: case
    title: Toyota Production System — вбудована якість
    case: toyota-tps
    facts:
      - '1896 р.: верстат Сакічі Тойоди сам зупиняється при обриві нитки — джерело принципу jidoka.'
      - 'Jidoka: обладнання виявляє відхилення і зупиняється самостійно, а не пропускає деталь далі.'
      - Офіційна сторінка протиставляє це масовому контролю готових виробів наприкінці лінії.
      - Андон-сигнал перетворює контроль якості на властивість самого процесу, а не окрему операцію.
      - Офіційний опис TPS не містить жодної кількісної метрики браку чи зупинок лінії.
    question: Чим зупинка процесу при відхиленні відрізняється від контролю готової продукції на виході?
    sources: [toyota-production-system-t08]
    notes: >-
      Ключ до розбору: контроль наприкінці лінії вже вбрав у себе всі витрати попередніх операцій,
      тоді як jidoka зупиняє процес одразу. Межа кейсу: цифри про частоту смикання андон-шнура в
      різних вторинних джерелах розходяться в кілька разів і в курсі не використовуються. Запитайте,
      чому «вбудована якість» дешевша за «контроль на виході».

  - id: s02-section
    type: section
    number: 2
    title: Показники якості та нормативи якості товарів і послуг
    notes: >-
      Друге питання теми. Три аспекти якості: виробнича, задоволеності споживача, для контракту.
      Норматив перетворює один із цих показників на зовнішню межу. Приклад: партія може пройти вхідний
      контроль і водночас не влаштувати клієнта форматом постачання. Запитайте, який з трьох аспектів
      найважче виміряти.

  - id: s02-methods
    type: bullets
    title: Три аспекти якості й методи її оцінки
    bullets:
      - Виробнича якість — рівень дефектності продукції на виході процесу.
      - Якість задоволеності споживача — наскільки продукт влаштовує того, хто ним користується.
      - Якість для контракту — стабільність показників у довгостроковій поставці.
      - Методи оцінки — експертні, соціологічні, статистичні (контрольні карти, індекси придатності).
      - Дослідження операцій і аналіз великих масивів даних шукають зв’язок процесу з дефектом.
    sources: [kapinos-babii-2013]
    notes: >-
      Наголосіть, що три числа можуть розходитися: гарна виробнича якість не гарантує задоволеності
      споживача форматом постачання. Приклад: партія без жодного дефекту, доставлена не в той день.
      Запитайте, яким із трьох аспектів найчастіше нехтують на знайомому виробництві.

  - id: s02-case-ukrposhta
    type: case
    title: Укрпошта — норматив проти виміряної своєчасності
    case: ukrposhta
    facts:
      - 'Наказ № 1833 від 22.12.2025: для 85 % відправлень норматив Д+3, для 97 % — Д+5.
        Ці нормативи — державні соціальні стандарти.'
      - 'За підсумками 2025 р. від Мінрозвитку, рівень своєчасної доставки становив 97–98 %.'
      - Сама компанія звітувала про своєчасність у діапазоні 97,8–98,02 % за різні періоди.
      - Незалежної (державної) перевірки дотримання нормативу 85 % Д+3 відкриті джерела не наводять.
    question: Чим показник, який компанія рахує сама, відрізняється від нормативу, встановленого державою?
    sources: [nakaz-1833-2025-t08, mininfra-ukrposhta-2025-t08, ukrposhta-automation-delo-2026, ukrposhta-h1-2026]
    notes: >-
      Норматив заданий актом як зовнішня межа, власний показник рахує сама компанія без незалежного
      аудиту. Приклад: запас 97,8–98,02 % проти нормативних 85 % виглядає великим, але висновок
      коректний лише за однакової методики виміру. Запитайте, яка галузь ще працює з нормативно
      заданим рівнем обслуговування.

  - id: s03-section
    type: section
    number: 3
    title: Планування якості та організаційне забезпечення якості
    notes: >-
      Третє питання теми. Якість забезпечується на всіх стадіях «петлі якості», а не лише на
      виробництві. Приклад: якість, не закладену на проєктуванні, неможливо наздогнати контролем.
      Запитайте, яка стадія петлі якості найчастіше випадає з поля зору виробника.

  - id: s03-figure
    type: figure
    title: Петля якості
    figure: fig-02-quality-loop.svg
    caption: Якість забезпечується на кожній стадії життєвого циклу продукту, а не лише на виробництві.
    sources: [kapinos-babii-2013]
    notes: >-
      Пройдіть коло: дослідження ринку, постачання, виробництво, контроль і пакування, розподіл і
      монтаж, експлуатація й утилізація. Сектор «контроль і пакування» виділено як межу передачі.
      Запитайте, що станеться з продуктом, якщо якість втрачено на стадії монтажу, а не виробництва.

  - id: s03-columns
    type: two-columns
    title: Система управління якістю і рівні відповідальності
    left:
      heading: Чотири елементи QMS
      bullets:
        - Відповідальність керівництва.
        - Управління ресурсами.
        - Процеси виробництва та реалізації продукції.
        - Вимірювання, аналізування й поліпшення — замикає цикл.
    right:
      heading: Три організаційні рівні
      bullets:
        - Організація — політика й цілі у сфері якості.
        - Підрозділи — завдання, ресурси, критерії оцінювання.
        - Персонал — відповідальність, повноваження, відносини виконавців.
    sources: [iso-9001-2015-t08]
    notes: >-
      Наголосіть на четвертому елементі QMS: без вимірювання й аналізування неможливо перевірити план,
      без поліпшення — усунути причину розбіжності на майбутнє. Приклад: політика зверху без завдань
      підрозділів лишається декларацією. Запитайте, на якому з трьох рівнів найчастіше рветься ланцюг
      відповідальності.

  - id: s04-section
    type: section
    number: 4
    title: Контроль якості сировини, матеріалів, товарів і послуг; програми забезпечення якості
    notes: >-
      Четверте питання теми. Контроль починається не на виході, а на вході — з вибіркового контролю
      сировини. Приклад: суцільний контроль надійний, але коштує стільки ж, скільки саме виробництво.
      Запитайте, чому підприємство свідомо приймає малий ризик пропустити дефектну партію.

  - id: s04-tools
    type: bullets
    title: Вибірковий контроль і базові інструменти якості
    bullets:
      - Вибірковий контроль — перевірка партії за вибіркою замість суцільного контролю кожної одиниці.
      - Контроль виробництва має відбуватися в керованих умовах — критерії, обладнання, персонал.
      - Невідповідну продукцію ізолюють і усувають причину, а не лише наслідок.
      - Діаграма Парето показує нечисленну групу причин, яка дає більшість втрат.
      - Діаграма Ісікави структурує причини за категоріями для пошуку кореневої причини.
    sources: [kapinos-babii-2013, iso-9001-2015-t08]
    notes: >-
      Пастка мотивації контролера: контроль, який коштує дорожче за дефекти, яких він запобігає, —
      порушення економічності з теми 1. Приклад: діаграма Ісікави після сигналу контрольної карти.
      Запитайте, яку з шести категорій причин (персонал, обладнання, матеріали, метод, середовище,
      вимірювання) аудиторія перевірила б першою.

  - id: s04-case-intel
    type: case
    title: Intel «Copy Exactly!» — дисципліна без компенсаційних підлаштувань
    case: intel-copy-exactly
    facts:
      - 'Метод створений для покоління техпроцесу 0,5 мкм (Intel Technology Journal, 1998).'
      - 'Копіюється все, що може вплинути на процес, до найдрібнішої деталі — діаметрів труб, ревізій плат.'
      - Зіставлення нового майданчика з еталонним відбувається на чотирьох рівнях одразу.
      - На кожному рівні застосовуються формальні статистичні тести.
      - Стаття прямо забороняє «компенсаційне підлаштування» — підкручування замість пошуку причини.
    question: Чому метод забороняє інженеру «підлаштувати» обладнання під інший результат нового майданчика?
    sources: [intel-copy-exactly-1998]
    notes: >-
      Чотирирівневе зіставлення зі статистичними тестами — той самий принцип, що й контрольна карта,
      застосований до трансферу технології між заводами. Межа кейсу: першоджерело не наводить жодного
      числового показника ефекту методу. Запитайте, чим компенсаційне підлаштування схоже на
      переналаштування контрольної карти під сигнал.

  - id: s05-section
    type: section
    number: 5
    title: Статистичний контроль процесу — контрольні карти за кількісною та альтернативною ознаками
    notes: >-
      П’яте питання теми. SPC відрізняє природну варіацію від варіації, спричиненої особливою
      причиною. Приклад: підлаштування процесу під кожне окреме вимірювання лише збільшує розкид.
      Запитайте, яку карту застосувати, якщо показник — «придатна деталь чи ні».

  - id: s05-figure
    type: figure
    title: Анатомія контрольної карти
    figure: fig-03-control-chart.svg
    caption: Центральна лінія, контрольні межі й сигнал виходу процесу з-під контролю.
    sources: [heizer-render-munson-2016]
    notes: >-
      Покажіть, що більшість точок лягають випадково між межами — це природна варіація. Точка за
      межею — сигнал особливої причини. Приклад: нова партія сировини, розладнане обладнання, зміна
      оператора. Запитайте, чому одну точку за межею не можна ігнорувати як «випадковість».

  - id: s05-formula
    type: formula
    title: p-карта — контроль за альтернативною ознакою
    formula: UCLp = p̄ + 3√(p̄(1 − p̄)/n); LCLp = p̄ − 3√(p̄(1 − p̄)/n)
    explanation:
      - 'За 20 підгрупами по 100 одиниць: p̄ = 150 / 2 000 = 0,075.'
      - 'UCLp = 0,075 + 0,079 = 0,154, тобто 15,4 %; LCLp = 0 (не може бути від’ємною).'
      - У 21-й підгрупі дефектними виявилися 18 зі 100, тобто 18,0 % — вище верхньої межі.
      - Сигнал вимагає шукати особливу причину, а не підлаштовувати межі карти.
      - Показник має код QC-02 у розрахунковій базі курсу.
    sources: [heizer-render-munson-2016]
    notes: >-
      Проведіть розрахунок кроками: середня частка, стандартне відхилення, межі, порівняння нової
      точки з межею. Приклад тлумачення: керівник, який лише «зафіксував відхилення» і продовжив
      роботу, розірвав цикл управління з теми 1. Запитайте, яку особливу причину аудиторія назвала б
      першою для сигналу 18,0 %.

  - id: s06-section
    type: section
    number: 6
    title: Придатність процесу — індекси Cp і Cpk; вартість якості
    notes: >-
      Шосте питання теми й найважча розрахункова частина. Cp показує ширину розкиду відносно допуску,
      Cpk додає перевірку центрування. Приклад: стабільний процес усе одно може бути непридатним.
      Запитайте, чи можна судити про якість процесу лише за одним із двох індексів.

  - id: s06-figure
    type: figure
    title: Однаковий розкид, різне центрування
    figure: fig-04-cp-cpk.svg
    caption: Cp у двох процесів однаковий, Cpk — ні, бо середнє одного з них зсунуте до межі допуску.
    sources: [heizer-render-munson-2016]
    notes: >-
      Покажіть, що права частина розподілу процесу Б виходить за USL — саме це і показує Cpk,
      менший за 1. Приклад: висока Cp без перевірки Cpk маскує ризик браку. Запитайте, який із двох
      процесів аудиторія обрала б без вагань, якби знала лише Cp.

  - id: s06-formula
    type: formula
    title: Cp і Cpk — розрахунок для двох процесів
    formula: 'Cp = (USL − LSL) / (6σ); Cpk = min[(USL − μ)/(3σ); (μ − LSL)/(3σ)]'
    explanation:
      - 'Поле допуску 495–505 г, σ = 1,2 г: Cp = 10 / 7,2 ≈ 1,39 для обох процесів.'
      - 'Процес А центрований (μ = 500 г): Cpk = min[1,39; 1,39] = 1,39.'
      - 'Процес Б зсунутий (μ = 502,5 г): Cpk = min[0,69; 2,08] = 0,69.'
      - Cpk завжди не більший за Cp і дорівнює йому лише за точного центрування.
      - Індекси мають коди QC-04 і QC-05 у розрахунковій базі курсу.
    sources: [heizer-render-munson-2016]
    notes: >-
      Наголосіть: однаковий розкид дає однаковий Cp незалежно від центрування. Приклад перевірки:
      менше з двох чисел у формулі Cpk завжди «програє» — саме воно і є відповіддю. Запитайте, що
      станеться з Cpk процесу Б, якщо зсув середнього ще збільшити.

  - id: s06-cost
    type: bullets
    title: Вартість якості — чотири категорії PAF
    bullets:
      - Витрати на попередження — навчання, планування якості, профілактичне обслуговування.
      - Витрати на оцінювання — вимірювання, випробування, контроль до відвантаження.
      - Внутрішні втрати — брак і переробка, виявлені до відвантаження.
      - Зовнішні втрати — рекламації, повернення, гарантійний ремонт після відвантаження.
      - 'Приклад розрахунку: 15,0 % виручки на якість, з них 75,0 % — на втрати, лише 25,0 % — на попередження й оцінювання.'
    sources: [heizer-render-munson-2016]
    notes: >-
      Показник QC-06 і похідні від нього частки COQ-01/COQ-02. Приклад висновку: три чверті витрат
      ідуть на плату за вже допущені дефекти, а не на їх недопущення. Запитайте, яку категорію
      аудиторія скоротила б першою, а яку наростила б.

  - id: s06-case-southwest
    type: case
    title: Southwest Airlines — вартість неякості сервісу
    case: southwest-airlines
    facts:
      - 'Грудень 2022 р.: шторм Elliott, скасовано 16 900 рейсів, понад два мільйони пасажирів без рейсу.'
      - 'Грудень 2023 р.: штраф Міністерства транспорту США — 140 млн доларів.'
      - Компанія додатково виплатила понад 600 млн доларів повернень і відшкодувань.
      - 'За свідченнями профспілки пілотів, причина — суперечливі рекомендації двох непов’язаних інформаційних систем.'
    question: Штраф і повернення коштів — це витрати якої категорії PAF, і чому саме туди вони потрапляють?
    sources: [southwest-dot-2023, swapa-senate-testimony-2023]
    notes: >-
      Це зовнішні втрати якості: ціна сплачена вже після того, як збій дістався споживача. Приклад:
      уніфікований парк заради економії не вберіг від збою в іншій підсистемі — плануванні
      екіпажів. Запитайте, чи можна було цей збій запобігти дешевшими витратами на попередження.

  - id: s07-section
    type: section
    number: 7
    title: Реалізація функції якості як спосіб залучення споживача до операційного процесу
    notes: >-
      Сьоме питання теми. QFD (Quality Function Deployment) переносить голос споживача у технічні
      характеристики ще до проєктування. Приклад: «будинок якості» зіставляє вимоги клієнта з
      характеристиками продукту. Запитайте, чим QFD відрізняється від контролю, який теми 4–6 уже
      розглянули.

  - id: s07-qfd
    type: bullets
    title: QFD — «будинок якості»
    bullets:
      - Вимоги споживача фіксують і ранжують за важливістю для нього.
      - Матриця зіставляє вимоги з технічними характеристиками продукту й процесу.
      - Де зв’язок сильний — концентрують зусилля; де його немає — ресурс не витрачають.
      - Матриця дозволяє порівняти власний продукт із продуктом конкурента за тими самими вимогами.
      - QFD впливає на проєктування, а не на те, що вже спроєктовано.
    sources: [kapinos-babii-2013]
    notes: >-
      Наголосіть на різниці з рештою теми: контроль, SPC і вартість якості мають справу з тим, що вже
      зроблено, а QFD — із тим, що ще буде зроблено. Приклад: характеристика, яку інженери вважали
      «стандартом якості», але яку клієнт не цінує. Запитайте, яку вимогу клієнта найважче перекласти
      в технічну характеристику.

  - id: s08-section
    type: section
    number: 8
    title: Показники результативності операційних систем і управління продуктивністю
    notes: >-
      Восьме питання теми і повернення до продуктивності з теми 1. Результативність охоплює якість
      так само, як обсяг, строк і витрати. Приклад: багато випущеної продукції з високим рівнем
      невідповідності — результативність лише часткова. Запитайте, чи можна оцінити результативність
      одним показником.

  - id: s08-productivity
    type: bullets
    title: Якість піднімає продуктивність — розрахунок індексу
    bullets:
      - Поліпшення якості звільняє ресурси, що раніше йшли на переробку браку.
      - 'До перерозподілу витрат на якість: продуктивність 3,2 виробу на людино-годину.'
      - 'Після: 3,68 виробу на людино-годину за той самий робочий час.'
      - 'Індекс зміни продуктивності (PROD-03): 3,68 / 3,2 · 100 % = 115,0 %.'
      - Зростання пояснюється не швидшою працею, а меншою переробкою дефекту.
    sources: [kapinos-babii-2013]
    notes: >-
      Той самий індекс, що й у темі 1, тепер застосований до наслідків поліпшення якості. Приклад
      перевірки: 115,0 % означає приріст продуктивності на 15 % порівняно з базовим рівнем. Запитайте,
      який показник результативності на знайомому підприємстві найбільше залежить від якості.

  - id: s08-case-ferrexpo
    type: case
    title: Ferrexpo — показники процесу під зовнішнім шоком
    case: ferrexpo
    facts:
      - 'Собівартість C1 окатишів: 76,3 дол./т (2025) проти 77,5 дол./т (2024).'
      - 'Собівартість C4 концентрату: 50,3 дол./т (2025) проти 55,3 дол./т (2024).'
      - 'LTIFR знизився до 0,38 у 2025 р. з 0,54 у 2024-му, а за 1 кв. 2026 р. — до 0,17.'
      - Звіт сам пояснює зниження зовнішніми причинами — блокадою логістики й зупинкою відшкодування ПДВ.
      - Близько 36 % працівників в Україні перевели на простій; працювала лише одна з чотирьох ліній.
    question: Чому зниження собівартості й LTIFR тут не можна тлумачити як зростання ефективності виробництва?
    sources: [ferrexpo-fy2025-results]
    notes: >-
      Показники результативності можуть змінюватися під впливом зовнішніх факторів, не пов’язаних із
      самим процесом. Приклад: знаменник LTIFR (відпрацьовані години) сам змінився через простій.
      Запитайте, який ще показник у кейсі виглядає поліпшенням, але насправді відображає скорочення
      обсягу робіт.

  - id: summary
    type: summary
    title: Підсумок теми
    bullets:
      - Менеджмент якості пройшов шлях від контролю до вбудованої властивості процесу (TQM, PDCA).
      - Показники якості й норматив вимірюють відповідність вимогам — своїм і зовнішнім.
      - Планування й контроль якості охоплюють увесь життєвий цикл продукту — «петлю якості».
      - SPC відрізняє природну варіацію від особливої причини контрольними картами X̄-R і p.
      - Cp і Cpk разом оцінюють придатність процесу; вартість якості показує ціну її відсутності.
      - QFD залучає споживача до проєктування; продуктивність відображає ефект поліпшення якості.
    sources: [kapinos-babii-2013, heizer-render-munson-2016]
    notes: >-
      Поверніться до штрафу 140 млн доларів з першого слайда: тепер аудиторія має назвати категорію
      витрат якості, до якої він належить, і показник, яким виміряти наслідки для продуктивності.
      Запитайте, яке з восьми питань теми вони вважають найважчим і чому.
