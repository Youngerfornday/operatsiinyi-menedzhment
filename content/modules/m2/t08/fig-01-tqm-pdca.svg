<svg xmlns="http://www.w3.org/2000/svg" id="fig-t08-1" class="scheme" viewBox="0 0 680 460" role="img" aria-labelledby="fig-t08-1-title fig-t08-1-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t08-1-title">Рисунок 1. Цикл Демінга — Шухарта (PDCA)</title>
  <desc id="fig-t08-1-desc">Чотири прямокутники розташовані по колу за годинниковою стрілкою: угорі «Плануй», праворуч «Виконуй», унизу «Перевіряй», ліворуч «Дій». Криві стрілки ведуть від кожного прямокутника до наступного за годинниковою стрілкою, а від «Дій» стрілка повертається до «Плануй», підписана як новий, вищий виток спіралі поліпшення. У центрі — коло з підписом «Постійне поліпшення якості». Прямокутник «Дій» виділено карміновим як крок, без якого цикл вироджується у звітність.</desc>
  <style>
    #fig-t08-1 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t08-1 .t { fill: var(--ink, #0f1c2e); font-size: 16px; font-weight: 650; }
    #fig-t08-1 .s { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t08-1 .hub { fill: var(--surface-tint, #eef4fa); stroke: var(--ink-2, #445570); stroke-width: 1; stroke-dasharray: 4 3; }
    #fig-t08-1 .hub-t { fill: var(--ink-2, #445570); font-size: 12px; font-weight: 600; }
    #fig-t08-1 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t08-1 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t08-1 .lbl { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t08-1 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t08-1 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t08-1 .exam { stroke: var(--err, #b42318); }
    #fig-t08-1 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 13px; font-weight: 650; }
    #fig-t08-1 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t08-1 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t08-1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box" x="250" y="20" width="180" height="66" rx="6"/>
  <text class="t" x="340" y="48" text-anchor="middle">1. Плануй</text>
  <text class="s" x="340" y="68" text-anchor="middle">ціль і спосіб її досягти</text>

  <rect class="box" x="484" y="197" width="180" height="66" rx="6"/>
  <text class="t" x="574" y="225" text-anchor="middle">2. Виконуй</text>
  <text class="s" x="574" y="245" text-anchor="middle">реалізуй заплановане</text>

  <rect class="box" x="250" y="374" width="180" height="66" rx="6"/>
  <text class="t" x="340" y="402" text-anchor="middle">3. Перевіряй</text>
  <text class="s" x="340" y="422" text-anchor="middle">зістав факт із планом</text>

  <rect class="box exam" x="16" y="197" width="180" height="66" rx="6"/>
  <text class="exam-t" x="106" y="225" text-anchor="middle">4. Дій</text>
  <text class="s" x="106" y="245" text-anchor="middle">усунь причину розбіжності</text>

  <circle class="hub" cx="340" cy="230" r="56"/>
  <text class="hub-t" x="340" y="226" text-anchor="middle">Постійне</text>
  <text class="hub-t" x="340" y="242" text-anchor="middle">поліпшення якості</text>

  <path class="arrow" marker-end="url(#fig-t08-1-arr)" d="M418 86 C 470 110, 500 140, 530 195"/>
  <path class="arrow" marker-end="url(#fig-t08-1-arr)" d="M540 263 C 500 310, 470 340, 420 372"/>
  <path class="arrow" marker-end="url(#fig-t08-1-arr)" d="M260 372 C 210 340, 180 310, 150 265"/>
  <path class="arrow exam" marker-end="url(#fig-t08-1-arr)" d="M140 195 C 180 140, 210 110, 262 86"/>
  <text class="lbl" x="200" y="130" text-anchor="middle">новий, вищий виток спіралі</text>

  <circle class="refc" cx="250" cy="20" r="11"/><text class="refn" x="250" y="24">1</text>
  <circle class="refc" cx="484" cy="197" r="11"/><text class="refn" x="484" y="201">2</text>
  <circle class="refc" cx="250" cy="374" r="11"/><text class="refn" x="250" y="378">3</text>
  <circle class="refc exam" cx="196" cy="197" r="11"/><text class="refn exam-n" x="196" y="201">4</text>
</svg>
