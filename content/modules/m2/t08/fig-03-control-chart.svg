<svg xmlns="http://www.w3.org/2000/svg" id="fig-t08-3" class="scheme" viewBox="0 0 640 360" role="img" aria-labelledby="fig-t08-3-title fig-t08-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t08-3-title">Рисунок 3. Анатомія контрольної карти</title>
  <desc id="fig-t08-3-desc">Графік із горизонтальною віссю номерів підгруп від 1 до 14 і вертикальною віссю значення показника. Посередині суцільна центральна лінія, вище і нижче — пунктирні верхня і нижня контрольні межі на однаковій відстані від центральної лінії. Тринадцять точок лягають випадково між межами без видимої закономірності і з’єднані ламаною лінією. Чотирнадцята точка виходить за верхню контрольну межу і позначена карміновим кольором як сигнал особливої причини.</desc>
  <style>
    #fig-t08-3 .axis { stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t08-3 .cl { stroke: var(--ink, #0f1c2e); stroke-width: 1.5; }
    #fig-t08-3 .limit { stroke: var(--ink-2, #445570); stroke-width: 1.25; stroke-dasharray: 5 4; }
    #fig-t08-3 .series { stroke: var(--ink-2, #445570); stroke-width: 1.5; fill: none; }
    #fig-t08-3 .pt { fill: var(--surface, #ffffff); stroke: var(--ink-2, #445570); stroke-width: 1.5; }
    #fig-t08-3 .pt.exam { fill: var(--err, #b42318); stroke: var(--err, #b42318); }
    #fig-t08-3 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t08-3 .lbl-strong { fill: var(--ink, #0f1c2e); font-size: 12.5px; font-weight: 650; }
    #fig-t08-3 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12px; font-weight: 650; }
    #fig-t08-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t08-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11px; font-weight: 700; text-anchor: middle; }
    #fig-t08-3 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t08-3 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

