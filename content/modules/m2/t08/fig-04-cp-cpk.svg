<svg xmlns="http://www.w3.org/2000/svg" id="fig-t08-4" class="scheme" viewBox="0 0 640 412" role="img" aria-labelledby="fig-t08-4-title fig-t08-4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t08-4-title">Рисунок 4. Cp і Cpk двох процесів з однаковим розкидом і різним центруванням</title>
  <desc id="fig-t08-4-desc">Дві дзвоноподібні криві розподілу однакової ширини намальовані між тими самими вертикальними лініями нижньої межі допуску LSL і верхньої межі допуску USL. Верхня крива симетрична й центрована рівно посередині поля допуску — це процес А. Нижня крива має ту саму ширину, але її вершина зсунута праворуч, ближче до верхньої межі допуску, і права частина кривої, позначена карміновим кольором, виходить за межу USL — це процес Б.</desc>
  <style>
    #fig-t08-4 .bound { stroke: var(--ink, #0f1c2e); stroke-width: 1.5; stroke-dasharray: 6 4; }
    #fig-t08-4 .mid { stroke: var(--ink-2, #445570); stroke-width: 1; stroke-dasharray: 2 3; }
    #fig-t08-4 .curveA { fill: var(--surface-tint, #eef4fa); stroke: var(--ink, #0f1c2e); stroke-width: 1.5; }
    #fig-t08-4 .curveB { fill: var(--surface-tint, #eef4fa); stroke: var(--ink, #0f1c2e); stroke-width: 1.5; }
    #fig-t08-4 .tail { fill: var(--err, #b42318); fill-opacity: 0.35; stroke: var(--err, #b42318); stroke-width: 1; }
    #fig-t08-4 .lbl { fill: var(--ink-2, #445570); font-size: 12.5px; }
    #fig-t08-4 .lbl-strong { fill: var(--ink, #0f1c2e); font-size: 13px; font-weight: 650; }
    #fig-t08-4 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 13px; font-weight: 650; }
    #fig-t08-4 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t08-4 .refn { fill: var(--ink, #0f1c2e); font-size: 11px; font-weight: 700; text-anchor: middle; }
    #fig-t08-4 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t08-4 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <line class="bound" x1="140" y1="20" x2="140" y2="380"/>
  <text class="lbl-strong" x="140" y="14" text-anchor="middle">LSL</text>
  <line class="bound" x1="540" y1="20" x2="540" y2="380"/>
  <text class="lbl-strong" x="540" y="14" text-anchor="middle">USL</text>
  <line class="mid" x1="340" y1="72" x2="340" y2="380"/>
  <text class="lbl" x="340" y="398" text-anchor="middle">центр поля допуску</text>

  <path class="curveA" d="M180,180 C220,180 260,60 340,60 C420,60 460,180 500,180 L180,180 Z"/>
  <text class="lbl-strong" x="340" y="44" text-anchor="middle">Процес А</text>

  <path class="curveB" d="M280,380 C320,380 360,260 440,260 C520,260 560,380 600,380 L280,380 Z"/>
  <text class="exam-t" x="440" y="244" text-anchor="middle">Процес Б</text>

  <path class="tail" d="M540,380 L540,326.1 C562.7,353.9 581.4,380 600,380 Z"/>

  <circle class="refc" cx="140" cy="200" r="11"/><text class="refn" x="140" y="204">1</text>
  <circle class="refc" cx="340" cy="60" r="11"/><text class="refn" x="340" y="64">2</text>
  <circle class="refc exam" cx="440" cy="260" r="11"/><text class="refn exam-n" x="440" y="264">3</text>
  <circle class="refc exam" cx="557" cy="365" r="11"/><text class="refn exam-n" x="557" y="369">4</text>
</svg>
