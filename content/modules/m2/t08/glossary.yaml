# Глосарій теми 8. Назви термінів мають дослівно збігатися з реєстром course.yaml (glossaryTerms, topic: t08).
# Визначення — робочі формулювання курсу; розрахункові співвідношення беруться з docs/research/formula-baseline.md.
topic: t08
terms:
  - id: quality
    term: Якість
    definition: >-
      Рівень (ступінь), до якого сукупність власних характеристик об’єкта задовольняє сформульовані
      потреби чи очікування, загальнозрозумілі або обов’язкові. Якість — властивість не абсолютна, а
      відносна: та сама характеристика може бути якісною для одного замовлення і непридатною для
      іншого, якщо вимоги розійшлися.
    synonyms:
      - quality
    forms:
      - якість
      - якості
      - якістю
    seeAlso: [tqm, quality-cost, process-capability]

  - id: tqm
    term: Загальний менеджмент якості
    definition: >-
      Total Quality Management (TQM) — підхід до управління організацією, у якому якість є не
      окремою функцією, а способом, яким приймається кожне рішення на кожному рівні; спирається на
      сім принципів управління якістю та цикл PDCA і переслідує одночасно конкурентоспроможність,
      зниження витрат, екологічність і постійне поліпшення понад досягнуту норму.
    synonyms:
      - TQM
      - тотальний менеджмент якості
      - total quality management
    forms:
      - загальний менеджмент якості
      - загального менеджменту якості
      - загальному менеджменту якості
      - загальним менеджментом якості
    seeAlso: [quality, quality-cost]

  - id: quality-cost
    term: Витрати на якість
    definition: >-
      Сукупні витрати підприємства на досягнення й підтримання заданого рівня якості, розкладені на
      чотири категорії класифікації PAF (prevention-appraisal-failure): витрати на попередження,
      витрати на оцінювання, внутрішні та зовнішні втрати (QC-06). Переважання витрат на
      невідповідність над витратами на попередження й оцінювання сигналізує про недоінвестування в
      запобігання дефекту.
    synonyms:
      - вартість якості
      - cost of quality
      - COQ
    forms:
      - витрати на якість
      - витрат на якість
      - витратами на якість
      - вартість якості
      - вартості якості
    seeAlso: [prevention-cost, appraisal-cost, failure-cost, tqm]

  - id: prevention-cost
    term: Витрати на попередження
    definition: >-
      Витрати на заходи, які запобігають виникненню дефекту до того, як він стався: навчання
      персоналу, планування якості, профілактичне обслуговування обладнання. Одна з чотирьох
      категорій класифікації PAF у складі витрат на якість (QC-06).
    synonyms:
      - витрати на запобігання
      - prevention cost
    forms:
      - витрати на попередження
      - витрат на попередження
      - витратами на попередження
    seeAlso: [quality-cost, appraisal-cost, failure-cost]

  - id: appraisal-cost
    term: Витрати на оцінювання
    definition: >-
      Витрати на виявлення дефекту, який уже потенційно існує, через вимірювання, випробування й
      контроль до того, як продукція чи послуга дійде до споживача. Одна з чотирьох категорій
      класифікації PAF у складі витрат на якість (QC-06).
    synonyms:
      - витрати на оцінку
      - appraisal cost
    forms:
      - витрати на оцінювання
      - витрат на оцінювання
      - витратами на оцінювання
    seeAlso: [quality-cost, prevention-cost, failure-cost]

  - id: failure-cost
    term: Витрати на невідповідність
    definition: >-
      Витрати, спричинені дефектом, який уже стався: внутрішні втрати виявляють до відвантаження
      (брак, переробка), зовнішні — вже після того, як продукція дісталася споживача (рекламації,
      повернення, гарантійний ремонт, штрафи). Дві з чотирьох категорій класифікації PAF у складі
      витрат на якість (QC-06).
    synonyms:
      - витрати на брак
      - втрати від невідповідності
      - failure cost
    forms:
      - витрати на невідповідність
      - витрат на невідповідність
      - внутрішні втрати
      - зовнішні втрати
    seeAlso: [quality-cost, prevention-cost, appraisal-cost]

  - id: statistical-process-control
    term: Статистичний контроль процесу
    definition: >-
      Statistical Process Control (SPC) — застосування статистичних методів до вимірювання й аналізу
      варіації процесу, щоб відрізнити випадкову, природну варіацію від варіації, спричиненої
      особливою (усувною) причиною. Основний інструмент SPC — контрольна карта.
    synonyms:
      - SPC
      - статистичне управління процесом
    forms:
      - статистичний контроль процесу
      - статистичного контролю процесу
      - статистичному контролю процесу
    seeAlso: [control-chart, x-bar-chart, p-chart]

  - id: control-chart
    term: Контрольна карта
    definition: >-
      Графік послідовних значень показника процесу з центральною лінією та контрольними межами,
      розрахованими за природною варіацією процесу; сигналізує про вихід процесу з-під статистичного
      контролю, коли точка лягає за межу або утворює невипадкову послідовність.
    synonyms:
      - control chart
    forms:
      - контрольна карта
      - контрольної карти
      - контрольною картою
      - контрольні карти
      - контрольних карт
    seeAlso: [statistical-process-control, x-bar-chart, r-chart, p-chart]

  - id: x-bar-chart
    term: Карта середніх
    definition: >-
      X̄-карта — контрольна карта за кількісною ознакою, яка відстежує середнє значення показника
      процесу в послідовних підгрупах вибірок; будується в парі з картою розмахів (QC-01), бо процес
      може зсунутися за середнім, лишаючись стабільним за розкидом.
    synonyms:
      - X̄-карта
      - карта X-бар
      - x-bar chart
    forms:
      - карта середніх
      - карти середніх
      - картою середніх
    seeAlso: [control-chart, r-chart, statistical-process-control]

  - id: r-chart
    term: Карта розмахів
    definition: >-
      R-карта — контрольна карта за кількісною ознакою, яка відстежує розмах (різницю між
      найбільшим і найменшим значенням) у кожній підгрупі вибірок; будується в парі з картою
      середніх (QC-01), бо процес може розширити розкид, тримаючи середнє на місці.
    synonyms:
      - R-карта
      - r-chart
    forms:
      - карта розмахів
      - карти розмахів
      - картою розмахів
    seeAlso: [control-chart, x-bar-chart, statistical-process-control]

  - id: p-chart
    term: Карта частки невідповідних одиниць
    definition: >-
      p-карта — контрольна карта за альтернативною ознакою («придатна деталь чи ні»), яка відстежує
      частку дефектних одиниць у послідовних підгрупах вибірок фіксованого обсягу (QC-02); межі
      будуються так, щоб нижня межа не була від’ємною.
    synonyms:
      - p-карта
      - p-chart
    forms:
      - карта частки невідповідних одиниць
      - карти частки невідповідних одиниць
      - карту частки невідповідних одиниць
    seeAlso: [control-chart, statistical-process-control, acceptance-sampling]

  - id: process-capability
    term: Придатність процесу
    definition: >-
      Здатність статистично керованого процесу виробляти продукцію в межах заданого поля допуску;
      оцінюється парою індексів Cp і Cpk. Стабільний процес усе одно може бути непридатним, якщо
      розкид, з яким він стабільно працює, ширший за допустиме поле.
    synonyms:
      - process capability
    forms:
      - придатність процесу
      - придатності процесу
    seeAlso: [cp-index, cpk-index, statistical-process-control]

  - id: cp-index
    term: Індекс Cp
    definition: >-
      Індекс відтворюваності процесу: зіставляє ширину поля допуску з розмахом природної варіації
      процесу (QC-04), не враховуючи, де саме всередині поля допуску стоїть середнє процесу; тому
      високий Cp можливий навіть у процесу зі зсунутим середнім.
    synonyms:
      - Cp
      - індекс відтворюваності процесу
    forms:
      - індекс Cp
      - індексу Cp
      - індекс відтворюваності процесу
    seeAlso: [cpk-index, process-capability]

  - id: cpk-index
    term: Індекс Cpk
    definition: >-
      Індекс придатності процесу: враховує і розмах природної варіації, і зміщення середнього
      процесу відносно центру поля допуску (QC-05); завжди не більший за Cp і дорівнює йому лише
      тоді, коли процес точно центрований.
    synonyms:
      - Cpk
      - індекс придатності процесу
    forms:
      - індекс Cpk
      - індексу Cpk
    seeAlso: [cp-index, process-capability]

  - id: acceptance-sampling
    term: Вибірковий контроль
    definition: >-
      Перевірка партії сировини, матеріалів чи готової продукції за вибіркою обмеженого обсягу
      замість суцільного контролю кожної одиниці, з ухваленням рішення прийняти чи забракувати всю
      партію за результатом вибірки; свідомий компроміс між надійністю суцільного контролю і
      витратами на нього.
    synonyms:
      - вхідний контроль
      - acceptance sampling
    forms:
      - вибірковий контроль
      - вибіркового контролю
      - вибірковим контролем
    seeAlso: [p-chart, statistical-process-control]

  - id: pareto-chart
    term: Діаграма Парето
    definition: >-
      Стовпчикова діаграма причин чи видів дефектів, упорядкованих за спаданням частоти; показує,
      яка нечисленна група причин дає більшість втрат, і дозволяє спрямувати ресурс поліпшення саме
      на неї, а не розпорошувати його на весь перелік порівну.
    synonyms:
      - діаграма ABC-аналізу дефектів
      - Pareto chart
    forms:
      - діаграма Парето
      - діаграми Парето
      - діаграмою Парето
    seeAlso: [ishikawa-diagram, quality-cost]

  - id: ishikawa-diagram
    term: Діаграма Ісікави
    definition: >-
      Схема «риб’ячий кістяк», яка структурує можливі причини вже виявленої проблеми якості за
      категоріями — персонал, обладнання, матеріали, метод, середовище, вимірювання — і допомагає
      командному обговоренню дійти до кореневої причини, а не зупинитися на першому поясненні.
    synonyms:
      - діаграма причин і наслідків
      - fishbone diagram
      - Ishikawa diagram
    forms:
      - діаграма Ісікави
      - діаграми Ісікави
      - діаграмою Ісікави
    seeAlso: [pareto-chart, statistical-process-control]

  - id: qfd
    term: Розгортання функції якості
    definition: >-
      Quality Function Deployment (QFD) — метод, який систематично переносить вимоги споживача в
      технічні характеристики продукту й процесу ще на стадії проєктування: вимоги фіксують, ранжують
      за важливістю для споживача і зіставляють у матриці «будинок якості» з технічними
      характеристиками, які їх забезпечують, щоб зосередити зусилля конструювання й контролю там, де
      зв’язок із вимогою споживача сильний.
    synonyms:
      - QFD
      - реалізація функції якості
      - будинок якості
      - quality function deployment
      - house of quality
    forms:
      - розгортання функції якості
      - розгортанням функції якості
      - реалізація функції якості
      - будинок якості
      - будинку якості
    seeAlso: [quality, tqm]
