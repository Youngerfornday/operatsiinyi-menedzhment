<svg xmlns="http://www.w3.org/2000/svg" id="fig-t08-2" class="scheme" viewBox="0 0 640 520" role="img" aria-labelledby="fig-t08-2-title fig-t08-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t08-2-title">Рисунок 2. Петля якості</title>
  <desc id="fig-t08-2-desc">Шість прямокутників розташовані по колу за годинниковою стрілкою: дослідження ринку і проєктування, постачання, виробництво, контроль і пакування, розподіл і монтаж, експлуатація й утилізація. Криві стрілки ведуть від кожного прямокутника до наступного, а від останнього — знову до першого, замикаючи коло й символізуючи новий цикл продукту. Прямокутник «контроль і пакування» виділено карміновим як межу, де якість або підтверджують, або втрачають під час передачі до наступної стадії.</desc>
  <style>
    #fig-t08-2 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t08-2 .t { fill: var(--ink, #0f1c2e); font-size: 13.5px; font-weight: 650; }
    #fig-t08-2 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t08-2 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t08-2 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t08-2 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t08-2 .exam { stroke: var(--err, #b42318); }
    #fig-t08-2 .exam-t { fill: var(--err-ink, #8f1d14); }
    #fig-t08-2 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t08-2 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
    #fig-t08-2 .hub-t { fill: var(--ink-2, #445570); font-size: 12px; font-weight: 600; text-anchor: middle; }
  </style>

  <defs>
    <marker id="fig-t08-2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box" x="230" y="16" width="180" height="60" rx="6"/>
  <text class="t" x="320" y="40" text-anchor="middle">Дослідження ринку</text>
  <text class="t" x="320" y="58" text-anchor="middle">і проєктування</text>

  <rect class="box" x="452" y="120" width="172" height="60" rx="6"/>
  <text class="t" x="538" y="154" text-anchor="middle">Постачання</text>

  <rect class="box" x="452" y="300" width="172" height="60" rx="6"/>
  <text class="t" x="538" y="334" text-anchor="middle">Виробництво</text>

  <rect class="box exam" x="230" y="404" width="180" height="60" rx="6"/>
  <text class="exam-t" x="320" y="428" text-anchor="middle">Контроль</text>
  <text class="exam-t" x="320" y="446" text-anchor="middle">і пакування</text>

  <rect class="box" x="16" y="300" width="172" height="60" rx="6"/>
  <text class="t" x="102" y="324" text-anchor="middle">Розподіл</text>
  <text class="t" x="102" y="342" text-anchor="middle">і монтаж</text>

  <rect class="box" x="16" y="120" width="172" height="60" rx="6"/>
  <text class="t" x="102" y="144" text-anchor="middle">Експлуатація</text>
  <text class="t" x="102" y="162" text-anchor="middle">й утилізація</text>

  <text class="hub-t" x="320" y="244" text-anchor="middle">Життєвий цикл</text>
  <text class="hub-t" x="320" y="262" text-anchor="middle">продукту</text>

  <path class="arrow" marker-end="url(#fig-t08-2-arr)" d="M400 60 C 460 75, 500 95, 530 122"/>
  <path class="arrow" marker-end="url(#fig-t08-2-arr)" d="M538 180 L 538 298"/>
  <path class="arrow" marker-end="url(#fig-t08-2-arr)" d="M530 358 C 500 385, 460 400, 408 415"/>
  <path class="arrow" marker-end="url(#fig-t08-2-arr)" d="M232 415 C 180 400, 140 385, 110 360"/>
  <path class="arrow" marker-end="url(#fig-t08-2-arr)" d="M102 298 L 102 182"/>
  <path class="arrow" marker-end="url(#fig-t08-2-arr)" d="M110 120 C 140 95, 180 75, 228 60"/>

  <circle class="refc" cx="230" cy="16" r="11"/><text class="refn" x="230" y="20">1</text>
  <circle class="refc" cx="452" cy="120" r="11"/><text class="refn" x="452" y="124">2</text>
  <circle class="refc exam" cx="410" cy="404" r="11"/><text class="refn exam-n" x="410" y="408">3</text>
  <circle class="refc" cx="16" cy="120" r="11"/><text class="refn" x="16" y="124">4</text>
</svg>
