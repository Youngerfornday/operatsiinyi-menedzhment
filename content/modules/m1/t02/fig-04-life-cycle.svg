  <text class="t" x="326" y="316" text-anchor="middle">Зрілість</text>
  <text class="s" x="326" y="330" text-anchor="middle">модифікації виробу</text>

  <text class="t" x="441" y="316" text-anchor="middle">Насичення</text>
