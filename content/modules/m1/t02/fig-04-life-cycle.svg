    </marker>
  </defs>

  <path class="axis" marker-end="url(#fig-t02-4-arr)" d="M40 280 L612 280"/>
  <text class="lbl" x="600" y="300" text-anchor="end">час</text>
  <path class="axis" marker-end="url(#fig-t02-4-arr)" d="M40 280 L40 42"/>
  <text class="lbl" x="48" y="46" text-anchor="start">обсяг продажів</text>

  <line class="divider" x1="155" y1="50" x2="155" y2="280"/>
  <line class="divider" x1="269" y1="50" x2="269" y2="280"/>
  <line class="divider" x1="383" y1="50" x2="383" y2="280"/>
  <line class="divider" x1="498" y1="50" x2="498" y2="280"/>

  <path class="curve2" d="M90 274 C 130 268, 160 260, 185 252 C 220 234, 260 162, 299 122 C 330 102, 370 90, 413 87 C 450 85, 490 84, 528 84 C 560 92, 600 132, 615 172"/>
