<svg xmlns="http://www.w3.org/2000/svg" id="fig-t02-4" class="scheme" viewBox="0 0 640 360" role="img" aria-labelledby="fig-t02-4-title fig-t02-4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t02-4-title">Рисунок 4. Життєвий цикл продукту і зміна операційної стратегії</title>
  <desc id="fig-t02-4-desc">Крива обсягу продажів у формі літери S зліва направо з чотирма підписаними ділянками: зародження, зростання, зрілість, спад. Перша ділянка виділена карміновим. Під кожною ділянкою — короткий підпис характеру процесу: зародження — гнучкий, дрібносерійний; зростання — дедалі автоматизованіший і капіталомісткіший; зрілість — стандартизований, орієнтований на скорочення витрат; спад — підтримка наявною інфраструктурою без нових вкладень. Пунктирна крива над суцільною позначає паралельний життєвий цикл процесу, зсунутий у часі, — застереження, що розбіжність двох циклів шкодить конкурентоспроможності.</desc>
  <style>
    #fig-t02-4 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t02-4 .t { fill: var(--ink, #0f1c2e); font-size: 13.5px; font-weight: 650; }
    #fig-t02-4 .s { fill: var(--ink-2, #445570); font-size: 10.5px; }
    #fig-t02-4 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t02-4 .axis { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t02-4 .curve { stroke: var(--ink, #0f1c2e); stroke-width: 2; fill: none; }
    #fig-t02-4 .curve2 { stroke: var(--ink-2, #445570); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    #fig-t02-4 .divider { stroke: var(--ink-2, #445570); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.6; }
    #fig-t02-4 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t02-4 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t02-4 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t02-4 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 13.5px; font-weight: 650; }
    #fig-t02-4 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t02-4 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t02-4-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <path class="axis" marker-end="url(#fig-t02-4-arr)" d="M40 280 L612 280"/>
  <text class="lbl" x="600" y="300" text-anchor="end">час</text>
  <path class="axis" marker-end="url(#fig-t02-4-arr)" d="M40 280 L40 42"/>
  <text class="lbl" x="16" y="52" text-anchor="start">обсяг продажів</text>

  <line class="divider" x1="180" y1="50" x2="180" y2="280"/>
  <line class="divider" x1="320" y1="50" x2="320" y2="280"/>
  <line class="divider" x1="460" y1="50" x2="460" y2="280"/>

  <path class="curve2" d="M100 274 C 150 266, 190 262, 220 254 C 260 236, 320 150, 360 110 C 400 98, 460 96, 500 98 C 540 100, 585 130, 610 180"/>
  <path class="curve" d="M60 270 C 110 262, 150 258, 180 250 C 220 230, 280 130, 320 90 C 360 80, 420 78, 460 80 C 500 82, 550 120, 580 180"/>

  <text class="t exam-t" x="120" y="316" text-anchor="middle">Зародження</text>
  <text class="s" x="120" y="332" text-anchor="middle">гнучкий, дрібносерійний</text>

  <text class="t" x="250" y="316" text-anchor="middle">Зростання</text>
  <text class="s" x="250" y="332" text-anchor="middle">автоматизація й капітал</text>

  <text class="t" x="390" y="316" text-anchor="middle">Зрілість</text>
  <text class="s" x="390" y="332" text-anchor="middle">скорочення витрат</text>

  <text class="t" x="520" y="316" text-anchor="middle">Спад</text>
  <text class="s" x="520" y="332" text-anchor="middle">наявна інфраструктура</text>

  <circle class="refc exam" cx="60" cy="270" r="11"/><text class="refn exam-n" x="60" y="274">1</text>
  <circle class="refc" cx="180" cy="250" r="11"/><text class="refn" x="180" y="254">2</text>
  <circle class="refc" cx="320" cy="90" r="11"/><text class="refn" x="320" y="94">3</text>
  <circle class="refc" cx="460" cy="80" r="11"/><text class="refn" x="460" y="84">4</text>
</svg>
