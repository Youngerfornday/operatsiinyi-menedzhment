  <text class="t exam-t" x="98" y="316" text-anchor="middle">Зародження</text>
  <text class="s" x="98" y="330" text-anchor="middle">гнучкий процес</text>

  <text class="t" x="212" y="316" text-anchor="middle">Зростання</text>
