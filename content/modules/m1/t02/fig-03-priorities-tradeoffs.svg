<svg xmlns="http://www.w3.org/2000/svg" id="fig-t02-3" class="scheme" viewBox="0 0 640 420" role="img" aria-labelledby="fig-t02-3-title fig-t02-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t02-3-title">Рисунок 3. Чотири операційні пріоритети і компроміс між ними</title>
  <desc id="fig-t02-3-desc">Чотири блоки в кутах умовного ромба, кожен підписаний одним операційним пріоритетом: угорі — витрати, праворуч — час виконання, унизу — гнучкість (виділено карміновим), ліворуч — якість і надійність. Пунктирні лінії з’єднують сусідні кути, позначаючи компроміс: посилення позиції в одному куті тягне лінію від протилежного, показуючи послаблення там. У центрі фігури — напис про те, що жодна реальна операційна система не займає одночасно всі чотири кути.</desc>
  <style>
    #fig-t02-3 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t02-3 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t02-3 .t { fill: var(--ink, #0f1c2e); font-size: 14.5px; font-weight: 650; }
    #fig-t02-3 .s { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t02-3 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t02-3 .diag { stroke: var(--ink-2, #445570); stroke-width: 1.25; stroke-dasharray: 5 4; fill: none; }
    #fig-t02-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t02-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t02-3 .exam { stroke: var(--err, #b42318); }
    #fig-t02-3 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 14.5px; font-weight: 650; }
    #fig-t02-3 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t02-3 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <path class="diag" d="M320 50 L520 210"/>
  <path class="diag" d="M520 210 L320 370"/>
  <path class="diag" d="M320 370 L120 210"/>
  <path class="diag" d="M120 210 L320 50"/>

  <text class="lbl" x="320" y="204" text-anchor="middle">Жодна система не займає</text>
  <text class="lbl" x="320" y="220" text-anchor="middle">всі чотири кути одразу</text>

  <rect class="box" x="235" y="20" width="170" height="60" rx="6"/>
  <text class="t" x="320" y="46" text-anchor="middle">Витрати</text>
  <text class="s" x="320" y="64" text-anchor="middle">низька ціна, великі партії</text>

  <rect class="box" x="435" y="180" width="170" height="60" rx="6"/>
  <text class="t" x="520" y="206" text-anchor="middle">Час виконання</text>
  <text class="s" x="520" y="224" text-anchor="middle">швидкість і надійність</text>

  <rect class="box exam" x="220" y="340" width="200" height="60" rx="6"/>
  <text class="exam-t" x="320" y="366" text-anchor="middle">Гнучкість</text>
  <text class="s" x="320" y="384" text-anchor="middle">асортимент і зміна продукту</text>

  <rect class="box" x="35" y="180" width="170" height="60" rx="6"/>
  <text class="t" x="120" y="206" text-anchor="middle">Якість і надійність</text>
  <text class="s" x="120" y="224" text-anchor="middle">стабільний результат</text>

  <circle class="refc" cx="235" cy="20" r="11"/><text class="refn" x="235" y="24">1</text>
  <circle class="refc" cx="35" cy="180" r="11"/><text class="refn" x="35" y="184">2</text>
  <circle class="refc" cx="605" cy="180" r="11"/><text class="refn" x="605" y="184">3</text>
  <circle class="refc exam" cx="220" cy="400" r="11"/><text class="refn exam-n" x="220" y="404">4</text>
</svg>
