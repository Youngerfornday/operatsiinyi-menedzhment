    year: 2021
    language: en
    url: https://openlibrary.org/isbn/9781292350103
    checkedAt: '2026-09-22'
    note: Джерело трактування стратегії процесу — вибору технології, автоматизації й стандартизації — та особливостей процесів у сфері послуг, де клієнт присутній усередині перетворення.

  - id: starchenko-kalinko-kosach-2020
