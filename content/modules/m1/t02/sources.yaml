  # Основна література курсу
  - id: stevenson-2020
    type: book
    title: Operations Management
    authors: [Stevenson W. J.]
    publisher: McGraw-Hill Education
    year: 2020
    language: en
    url: https://openlibrary.org/isbn/9781260575712
    checkedAt: '2026-09-22'
    note: 'Джерело розділу «Competitiveness, Strategy, and Productivity»: операційна стратегія, операційні пріоритети (витрати, якість і надійність, час виконання, гнучкість), кваліфікаційні вимоги й виграшна характеристика замовлення (концепція Террі Хілла).'

  - id: heizer-render-munson-2016
    type: book
    title: 'Operations Management: Sustainability and Supply Chain Management'
    authors: [Heizer J., Render B., Munson C.]
    publisher: Pearson
    year: 2016
    language: en
    url: https://openlibrary.org/isbn/9780134163512
    checkedAt: '2026-09-22'
    note: 'Джерело поділу рішень операційної стратегії на структурні (процес, потужність, вертикальна інтеграція, робоча сила, технологія) та тактичні (інфраструктурні), використаного в темі 1 і поглибленого тут для рівня стратегії (звірено лише за змістом видавця, без сторінки).'

  - id: slack-brandon-jones-2021
