<svg xmlns="http://www.w3.org/2000/svg" id="fig-t02-2" class="scheme" viewBox="0 0 640 352" role="img" aria-labelledby="fig-t02-2-title fig-t02-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t02-2-title">Рисунок 2. Два напрямки побудови операційної системи: «від продукту» і «від процесу»</title>
  <desc id="fig-t02-2-desc">Дві паралельні горизонтальні схеми. Верхня, підписана «від продукту», — стандартний, найпоширеніший шлях: три послідовні блоки — конструкція товару, функціональні характеристики, технологічні операції — з’єднані стрілками зліва направо; останній блок виділено карміновим. Нижня, підписана «від процесу», — виняток для нішевих фірм: два блоки — технологія і стандарт якості нішевої фірми, можливі продукти — з’єднані стрілкою. Між двома схемами — пара вертикальних стрілок, одна суцільна вниз і одна пунктирна вгору, що позначають прямі й зворотні зв’язки продукту і процесу.</desc>
  <style>
    #fig-t02-2 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t02-2 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t02-2 .t { fill: var(--ink, #0f1c2e); font-size: 13.5px; font-weight: 650; }
    #fig-t02-2 .s { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t02-2 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t02-2 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t02-2 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t02-2 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t02-2 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t02-2 .exam { stroke: var(--err, #b42318); }
    #fig-t02-2 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 13px; font-weight: 650; }
    #fig-t02-2 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t02-2 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t02-2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <text class="lbl" x="320" y="30" text-anchor="middle">Від продукту — стандартний, найпоширеніший шлях</text>

  <rect class="box" x="16" y="48" width="189" height="92" rx="6"/>
  <text class="t" x="110" y="86" text-anchor="middle">Конструкція</text>
  <text class="t" x="110" y="106" text-anchor="middle">товару</text>

  <path class="arrow" marker-end="url(#fig-t02-2-arr)" d="M205 94 L225 94"/>

  <rect class="box" x="225" y="48" width="189" height="92" rx="6"/>
  <text class="t" x="319" y="86" text-anchor="middle">Функціональні</text>
  <text class="t" x="319" y="106" text-anchor="middle">характеристики</text>

  <path class="arrow" marker-end="url(#fig-t02-2-arr)" d="M414 94 L434 94"/>

  <rect class="box exam" x="434" y="48" width="190" height="92" rx="6"/>
  <text class="exam-t" x="529" y="86" text-anchor="middle">Технологічні</text>
  <text class="exam-t" x="529" y="106" text-anchor="middle">операції</text>

  <path class="arrow" marker-end="url(#fig-t02-2-arr)" d="M300 140 L300 214"/>
  <text class="lbl" x="290" y="182" text-anchor="end">прямий</text>
  <path class="arrow" stroke-dasharray="4 3" marker-end="url(#fig-t02-2-arr)" d="M340 214 L340 140"/>
  <text class="lbl" x="350" y="182" text-anchor="start">зворотний</text>

  <text class="lbl" x="320" y="340" text-anchor="middle">Від процесу — виняток для нішевих фірм</text>

  <rect class="box box-owner" x="90" y="214" width="250" height="92" rx="6"/>
  <text class="t" x="215" y="252" text-anchor="middle">Технологія й стандарт</text>
  <text class="t" x="215" y="272" text-anchor="middle">якості нішевої фірми</text>

  <path class="arrow" marker-end="url(#fig-t02-2-arr)" d="M340 260 L360 260"/>

  <rect class="box" x="360" y="214" width="190" height="92" rx="6"/>
  <text class="t" x="455" y="252" text-anchor="middle">Можливі</text>
  <text class="t" x="455" y="272" text-anchor="middle">продукти</text>

  <circle class="refc exam" cx="16" cy="48" r="11"/><text class="refn exam-n" x="16" y="52">1</text>
  <circle class="refc" cx="90" cy="214" r="11"/><text class="refn" x="90" y="218">2</text>
  <circle class="refc" cx="320" cy="160" r="11"/><text class="refn" x="320" y="164">3</text>
</svg>
