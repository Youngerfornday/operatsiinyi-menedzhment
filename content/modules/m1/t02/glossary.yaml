# Глосарій теми 2. Назви термінів мають дослівно збігатися з реєстром course.yaml (glossaryTerms, topic: t02).
# Визначення — робочі формулювання курсу.
topic: t02
terms:
  - id: operations-strategy
    term: Операційна стратегія
    definition: >-
      Розробка загальної політики та планів використання ресурсів фірми, націлених на максимально ефективну
      підтримку її довгострокової конкурентної стратегії. Підсистема корпоративної стратегії поряд з
      маркетинговою й фінансовою: розгортається у структурні рішення (процес, потужність, вертикальна
      інтеграція, робоча сила, технологія) і спирається на тактику як спосіб поточної реалізації.
    synonyms:
      - Operations Strategy
      - виробнича стратегія
    forms:
      - операційна стратегія
      - операційної стратегії
      - операційну стратегію
      - операційною стратегією
      - операційних стратегій
    seeAlso: [competitive-priorities, process-strategy, distinctive-competence]

  - id: competitive-priorities
    term: Операційні пріоритети
    definition: >-
      Напрями, за якими підприємство обирає конкурувати своєю операційною системою: витрати, якість і
      надійність продукції, термін виконання замовлення та гнучкість. Жодна операційна система не може бути
      водночас найкращою за всіма напрямами — вибір провідного пріоритету завжди супроводжується компромісом.
    synonyms:
      - конкурентні пріоритети
      - competitive priorities
    forms:
      - операційні пріоритети
      - операційних пріоритетів
      - операційним пріоритетам
      - операційними пріоритетами
    seeAlso: [cost-priority, quality-priority, delivery-priority, flexibility-priority, trade-off]

  - id: cost-priority
    term: Пріоритет витрат
    definition: >-
      Операційний пріоритет, провідний там, де обсяг продажів сегмента ринку залежить винятково від того,
      наскільки низькими є витрати виробника — типово для товарів повсякденного попиту, які споживач не
      розрізняє між компаніями. Бути виробником з найнижчими витратами — умова необхідна для успіху на
      такому сегменті, але не достатня для високої рентабельності.
    synonyms:
      - пріоритет низьких витрат
      - cost priority
    forms:
      - пріоритет витрат
      - пріоритету витрат
      - пріоритетом витрат
    seeAlso: [competitive-priorities, trade-off, order-qualifier]

  - id: quality-priority
    term: Пріоритет якості та надійності
    definition: >-
      Операційний пріоритет, що об’єднує якість продукту (рівень якої залежить від сегмента, для якого
      продукт призначений) і якість процесу, яка визначає, наскільки послідовно виріб виходить без дефектів
      і, отже, наскільки надійним є результат для споживача.
    synonyms:
      - пріоритет якості
      - quality and reliability priority
    forms:
      - пріоритет якості та надійності
      - пріоритету якості та надійності
      - пріоритетом якості та надійності
    seeAlso: [competitive-priorities, distinctive-competence, order-qualifier]

  - id: delivery-priority
    term: Пріоритет часу виконання
    definition: >-
      Операційний пріоритет, що охоплює швидкість виконання замовлення чи надання послуги та надійність
      постачання — здатність поставити товар чи послугу точно в обіцяний термін або раніше. Для сегментів,
      де він провідний, обидві здатності важливі однаково: швидкий, але ненадійний постачальник програє так
      само, як надійний, але повільний.
    synonyms:
      - пріоритет швидкості
      - delivery priority
    forms:
      - пріоритет часу виконання
      - пріоритету часу виконання
      - пріоритетом часу виконання
    seeAlso: [competitive-priorities, order-winner, process-strategy]

  - id: flexibility-priority
    term: Пріоритет гнучкості
    definition: >-
      Операційний пріоритет — здатність компанії пропонувати споживачам широкий вибір товарів, швидко
      розробляти нову продукцію та перебудовувати наявні процеси під її випуск, а також швидко й адекватно
      реагувати на зміну попиту.
    synonyms:
      - пріоритет асортименту
      - flexibility priority
    forms:
      - пріоритет гнучкості
      - пріоритету гнучкості
      - пріоритетом гнучкості
    seeAlso: [competitive-priorities, trade-off, product-life-cycle]

  - id: trade-off
    term: Компроміс операційних пріоритетів
    definition: >-
      Ціна, яку операційна система платить за перевагу в одному операційному пріоритеті втратою в іншому:
      жодна реальна система не може одночасно бути найдешевшою, найякіснішою, найшвидшою і найгнучкішою,
      бо кожен із цих результатів спирається на протилежні структурні рішення.
    synonyms:
      - компроміс пріоритетів
      - trade-off
    forms:
      - компроміс
      - компромісу
      - компроміси
      - компромісів
      - компроміс операційних пріоритетів
    seeAlso: [competitive-priorities, cost-priority, flexibility-priority]

  - id: order-qualifier
    term: Кваліфікаційна вимога ринку
    definition: >-
      Критерій, якому продукт чи послуга зобов’язані відповідати, щоб узагалі потрапити до розгляду
      споживачем: без нього замовлення не отримати, але сама лише його наявність замовлення ще не гарантує.
      Термін увів професор Террі Хілл для опису конкурентних пріоритетів, орієнтованих на маркетинг.
    synonyms:
      - кваліфікатор замовлення
      - order qualifier
    forms:
      - кваліфікаційна вимога ринку
      - кваліфікаційної вимоги ринку
      - кваліфікаційну вимогу ринку
      - кваліфікаційні вимоги ринку
    seeAlso: [order-winner, competitive-priorities]

  - id: order-winner
    term: Виграшна характеристика замовлення
    definition: >-
      Характеристика, яка серед кандидатів, що вже пройшли кваліфікацію ринку, фактично вирішує, кому
      дістанеться замовлення. За узагальненими даними досліджень великих виробничих фірм, низька ціна
      найчастіше виступає саме виграшною характеристикою, тоді як якість і вчасність постачання — типові
      кваліфікаційні вимоги; для кожного конкретного продукту цю пару визначають окремо.
    synonyms:
      - переможець замовлення
      - order winner
    forms:
      - виграшна характеристика замовлення
      - виграшної характеристики замовлення
      - виграшну характеристику замовлення
    seeAlso: [order-qualifier, cost-priority]

  - id: product-life-cycle
    term: Життєвий цикл продукту
    definition: >-
      Послідовність стадій, через які проходить продукт від виведення на ринок до зняття з виробництва:
      зародження, зростання, зрілість, насичення, спад. Кожна стадія вимагає іншого процесу виробництва й
      спирається на іншу конкурентну перевагу; розбіжність між життєвим циклом продукту і життєвим циклом
      процесу, яким його виготовляють, шкодить конкурентоспроможності організації.
    synonyms:
      - ЖЦТ
      - product life cycle
    forms:
      - життєвий цикл продукту
      - життєвого циклу продукту
      - життєвим циклом продукту
    seeAlso: [flexibility-priority, process-strategy, operations-strategy]

  - id: process-strategy
    term: Стратегія процесу
    definition: >-
      Підхід операційного менеджменту до вибору технології, ступеня автоматизації та стандартизації, якими
      створюватимуть товар чи послугу, узгоджений з обраними операційними пріоритетами. Операційну систему
      будують або «від продукту» (стандартний шлях: конструкція товару задає вимоги до процесу), або
      «від процесу» (виняток для нішевих фірм, що самі є джерелом стандарту якості).
    synonyms:
      - стратегія процесів
      - process strategy
    forms:
      - стратегія процесу
      - стратегії процесу
      - стратегію процесу
      - стратегією процесу
    seeAlso: [operations-strategy, product-life-cycle, competitive-priorities]

  - id: distinctive-competence
    term: Виражена компетентність
    definition: >-
      Особлива здатність операційної системи, яку конкурентам важко швидко й дешево скопіювати і яка дає
      підприємству стійку перевагу саме в тих операційних пріоритетах, які воно обрало провідними.
      Конкурентоспроможність операційної системи — здатність утримувати цю компетентність у часі, зокрема
      коли зовнішні умови різко змінюються.
    synonyms:
      - виражена компетенція
      - distinctive competence
    forms:
      - виражена компетентність
      - вираженої компетентності
      - виражену компетентність
      - вираженою компетентністю
    seeAlso: [competitive-priorities, operations-strategy]
