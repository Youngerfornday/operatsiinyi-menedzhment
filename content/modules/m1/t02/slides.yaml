# Презентація теми 2. Текст слайдів стислий: повний виклад — у lecture.mdx, пояснення — у нотатках.
# Кожне число слайда має бути в лонгріді теми й мати джерело зі sources.yaml.
topic: t02
slides:
  - id: title
    type: title
    subtitle: Модуль 1. Теоретичні основи організації та регулювання операційної діяльності
    notes: >-
      Вступ через контраст двох компаній: авіакомпанія літає лише одним типом літака маршрутами «з точки в
      точку», а модний рітейлер тримає половину виробників поруч зі штаб-квартирою і вкладає сотні мільйонів
      у власну логістику. Обидві прибуткові, жодна не намагається бути одночасно найдешевшою і найшвидшою.
      Запитайте аудиторію: за який пріоритет, на їхню думку, платить кожна компанія?

  - id: outcomes
    type: outcomes
    title: Що ви зможете після теми
    notes: >-
      Чотири результати теми: перший і четвертий — понятійні (зв’язок стратегій, процес проти сервісу), другий
      і третій — прикладні (обґрунтувати пріоритети й компроміси, визначити вплив стадії життєвого циклу).
      Запитайте, чи стикалася аудиторія з формулюванням «операційна стратегія» на практиці.

  - id: s01-section
    type: section
    number: 1
    title: Сутність операційної стратегії. Стратегія і тактика
    notes: >-
      Перше питання теми. Операційна стратегія — підсистема корпоративної стратегії поряд з маркетинговою й
      фінансовою (тема 1: три базові функції). Ключова теза розділу: розрізнення стратегії й тактики — це те
      саме розрізнення структурних і поточних рішень з теми 1, піднесене на рівень усієї організації.

  - id: s01-bullets
    type: bullets
    title: Операційна стратегія — визначення
    bullets:
      - Політика і плани використання ресурсів фірми для довгострокової конкурентної переваги
      - Підсистема корпоративної стратегії поряд з маркетинговою й фінансовою
      - Стратегічні цілі логічно випливають з місії організації
      - 'У сфері послуг діє та сама логіка, але в інших межах (тема 1: клієнт у процесі)'
    notes: >-
      Наголосіть, що операційна стратегія — не абстракція, а конкретний рівень рішень, симетричний
      маркетинговій і фінансовій стратегіям. Приклад для розігріву: яке рішення підтримує довгострокову
      конкурентну перевагу — вибір потужності заводу чи розклад цього тижня?

  - id: s01-question
    type: question
    prompt: Яке з двох рішень простіше скасувати — вибір потужності нового заводу чи розмір партії цього місяця?
    options:
      - Потужність заводу — вона гнучкіша, ніж здається
      - Розмір партії — це рішення поточного, тактичного рівня
      - Обидва однаково легко скасувати за потреби
    notes: >-
      Питання без оцінки: мета — відчути різницю між структурним і тактичним рівнем на інтуїтивному прикладі.
      Правильний орієнтир — друга відповідь: розмір партії міняють щомісяця, потужність заводу — раз на роки.

  - id: s01-columns
    type: two-columns
    title: Стратегічні й тактичні рішення операційної стратегії
    left:
      heading: Стратегічні (структурні)
      bullets:
        - Виробнича потужність
        - Розміщення об’єктів
        - Вертикальна інтеграція
        - Технологія й робоча сила
    right:
      heading: Тактичні (інфраструктурні)
      bullets:
        - Керування запасами
        - Складання розкладів
        - Керування якістю
        - Надійність і ремонт
    notes: >-
      Ліва колонка — довгі, дорогі, майже незворотні рішення; права — короткі й оборотні, діють у межах уже
      заданої структури. Найчастіша помилка — поширити тактичні критерії на стратегічний рівень або навпаки
      підпорядкувати стратегію тактиці; приклад із теми 1 про принципи можна згадати тут.

  - id: s02-section
    type: section
    number: 2
    title: Етапи розробки операційної стратегії та ієрархія стратегій
    notes: >-
      Друге питання теми. Розробка стратегії починається поза операційним підрозділом — із вимог споживача,
      які формують операційні пріоритети. Далі пріоритети перекладають у структурні й інфраструктурні
      рішення. Приклад для переходу: вертикальна інтеграція Kernel як накопичена сума структурних виборів.

  - id: s02-figure
    type: figure
    title: Місце операційної стратегії в ієрархії стратегій
    figure: fig-01-strategy-hierarchy.svg
    caption: Пріоритети розгортаються у структурні рішення операційної стратегії й інфраструктурні рішення тактичного рівня.
    sources: []
    notes: >-
      Схема показує чотири рівні згори вниз: місія і корпоративна стратегія, три функціональні стратегії,
      структурні рішення операційної стратегії, тактичні рішення. Наголосіть на стрілках: кожен рівень задає
      межі наступного, а не навпаки.

  - id: s02-bullets
    type: bullets
    title: Від вимог споживача до рішень операційної стратегії
    bullets:
      - Запити споживачів формують операційні пріоритети
      - Пріоритети стають обов’язковими вимогами до операцій
      - Пріоритети перекладають у структурні рішення
      - Структура задає межі подальших інфраструктурних рішень
    notes: >-
      Послідовність кроків, а не одноразовий акт: операційний підрозділ не може задовольнити купівельні
      потреби без досліджень, збуту й підтримки фінансів, кадрів та інформаційних систем. Можливості компанії
      складаються з трьох елементів — технології, систем і персоналу.

  - id: s02-case-kernel
    type: case
    title: Kernel — вертикальна інтеграція як структурний вибір
    case: kernel
    facts:
      - 29 елеваторів приймають і зберігають зерно й олійні культури
      - Сім заводів — паспортна потужність 4,0 млн т насіння на рік
      - Портові термінали — потужність перевалки до 11 млн т на рік
      - У 2017 р. оголошено новий завод на 1 млн т (≈130 млн дол.)
    question: Чому вертикальну інтеграцію не можна назвати одним рішенням, а лише сумою послідовних структурних виборів?
    sources: [kernel-annual-report-fy2025, kernel-crushing-plant-2017]
    notes: >-
      За аудованим річним звітом FY2025: три стадії ланцюга (елеватори, заводи, термінали) могли б належати
      окремим підприємствам. Кожен новий елемент звужує залежність від зовнішніх ланок і водночас заморожує
      капітал у власних активах. Застереження: 4,0 млн т — паспортна потужність, а не гарантований випуск.

  - id: s03-section
    type: section
    number: 3
    title: Формування стратегії виробництва товару
    notes: >-
      Третє питання теми. Рішення про конструкцію товару приймають першими — вони встановлюють межі витрат і
      якості для всього подальшого процесу. Продукт — генератор взаємодії елементів операційної системи.

  - id: s03-bullets
    type: bullets
    title: Продуктове рішення — перше і найдорожче для зміни
    bullets:
      - Конструкція товару встановлює межі витрат і якості процесу
      - Продукт — генератор взаємодії елементів системи
      - Дерево рішень структурує вибір під невизначеністю
      - Продуктове рішення завжди ухвалюють до відомого попиту
    notes: >-
      Дерево рішень — графічне відображення альтернатив, «станів природи» (умов поза контролем менеджера) і
      ймовірностей віддачі. Не усуває невизначеності, але змушує явно перелічити альтернативи. Курс
      повертається до кількісних методів вибору пізніше.

  - id: s04-section
    type: section
    number: 4
    title: Стратегія процесу й особливості сервісних процесів
    notes: >-
      Четверте питання теми. Стратегія процесу обирає технологію, автоматизацію й стандартизацію під обрані
      пріоритети. Два напрямки побудови системи: «від продукту» (стандартний) і «від процесу» (виняток для
      нішевих фірм). У послугах клієнт присутній усередині процесу — тема 1 вже це показала.

  - id: s04-figure
    type: figure
    title: Побудова «від продукту» і «від процесу»
    figure: fig-02-product-process.svg
    caption: «Від продукту» — стандартний шлях; «від процесу» — виняток для нішевих фірм із власним стандартом якості.
    sources: []
    notes: >-
      Верхній ряд — типовий шлях: конструкція товару задає функціональні характеристики, а ті — технологічні
      операції. Нижній ряд — обернений шлях нішевої фірми. Подвійна стрілка посередині — прямі й зворотні
      зв’язки продукту й процесу, здатні спричиняти небажані коливання.

  - id: s04-columns
    type: two-columns
    title: Два напрямки побудови операційної системи
    left:
      heading: Від продукту
      bullets:
        - Стандартний, найпоширеніший шлях
        - Конструкція товару задає вимоги до процесу
        - Кожна характеристика — чіткі технологічні операції
    right:
      heading: Від процесу
      bullets:
        - Виняток для обмеженого кола ринкових структур
        - Наявна технологія визначає можливі продукти
        - Фірма сама є джерелом стандарту якості
    notes: >-
      Нішева фірма в стабільних умовах може будувати систему «від процесу» тією мірою, якою вона сама є
      джерелом стандартів якості для свого сегмента; в інших випадках система будується як стандартна — «від
      продукту». Приклад переходу до кейсу: сервісна мережа Southwest Airlines — теж рішення про процес.

  - id: s04-case-southwest
    type: case
    title: Southwest Airlines — стратегія процесу сервісної системи
    case: southwest-airlines
    facts:
      - Один тип літака Boeing 737 спрощує розклад і обслуговування
      - Мережа «з точки в точку» замість «маточина — спиці»
      - У 2018 р. 704 прямі пари міст, 77% пасажирів без пересадки
      - У грудні 2023 р. DOT оштрафувало компанію на 140 млн дол.
    question: До якої групи рішень належить вибір мережі й парку літаків, і чому колапс 2022 р. стався не в цьому рішенні?
    sources: [southwest-10k-2025, southwest-10k-2018, dot-southwest-penalty-2023]
    notes: >-
      Структурне рішення (парк, мережа) відпрацювало технічно справно й під час шторму 2022 р.; колапс стався
      в тактичній підсистемі планування екіпажів. Наголосіть: структурне рішення не гарантує стійкості системи
      без надійного тактичного рівня керування нею.

  - id: s05-section
    type: section
    number: 5
    title: Операційні пріоритети і компроміси між ними
    notes: >-
      П’яте питання теми, центральне для практичної 2. Чотири пріоритети — витрати, якість і надійність, час
      виконання, гнучкість — конкурують за ресурси системи. Жодна система не може лідирувати за всіма одразу.

  - id: s05-bullets
    type: bullets
    title: Чотири операційні пріоритети
    bullets:
      - 'Витрати: низька ціна там, де товари не розрізняють'
      - 'Якість і надійність: стабільний результат без дефектів'
      - 'Час виконання: швидкість і надійність постачання'
      - 'Гнучкість: широкий асортимент і швидка зміна продукту'
    notes: >-
      Для кожного пріоритету — своя мінімальна умова успіху: витрати виграють лише за найнижчої собівартості;
      якість поєднує якість продукту (за сегментом) і якість процесу (відсутність дефектів); час — і швидкість,
      і надійність одночасно; гнучкість — асортимент плюс швидкість реакції на попит.

  - id: s05-figure
    type: figure
    title: Компроміс між чотирма пріоритетами
    figure: fig-03-priorities-tradeoffs.svg
    caption: Посилення одного пріоритету, як правило, послаблює інший — вони спираються на протилежні структурні рішення.
    sources: []
    notes: >-
      Жодна реальна операційна система не займає всі чотири кути одразу. Запитайте аудиторію: якщо компанія
      вирішує стати найгнучкішою на ринку, чим їй, найімовірніше, доведеться пожертвувати?

  - id: s05-case-zara
    type: case
    title: Zara / Inditex — час виконання, куплений ціною витрат
    case: zara-inditex
    facts:
      - 900 млн євро на рік — інвестиції в логістичні потужності
      - Продажі зросли на 3,2% до 39,9 млрд євро за FY2025
      - Половина виробників кінцевого продукту — поруч зі штаб-квартирою
      - Доставка в магазин — 36 год у Європі, до 48 год далі
    question: Який операційний пріоритет тут провідний, і чим саме компанія за нього свідомо платить?
    sources: [inditex-fy2025-results, inditex-faq]
    notes: >-
      Провідний пріоритет — час виконання: виробників тримають дорожче, ніж могли б, заради швидкості.
      Застереження: 36–48 год — це відрізок «розподільчий центр → магазин», а не весь шлях «від дизайну до
      полиці»; це формулювання в офіційному звіті відсутнє.

  - id: s05-bullets2
    type: bullets
    title: Кваліфікаційні вимоги і виграшна характеристика
    bullets:
      - 'Кваліфікатор: мінімум, без якого замовлення не розглядають'
      - 'Переможець: те, що фактично вирішує конкуренцію за замовлення'
      - Якість і строк найчастіше — кваліфікатори, ціна — переможець
      - Для кожного продукту пару визначають окремо
    notes: >-
      Терміни професора Террі Хілла. Наголосіть на застереженні: узагальнення досліджень великих виробничих
      фірм — орієнтир, а не готова відповідь для конкретного продукту компанії.

  - id: s06-section
    type: section
    number: 6
    title: Виражена компетентність і конкурентоспроможність операційної системи
    notes: >-
      Шосте питання теми. Виражена компетентність прив’язана до обраних пріоритетів і важкокопійована
      конкурентами. Конкурентоспроможність — здатність утримувати цю компетентність у часі, зокрема під
      зовнішнім тиском.

  - id: s06-bullets
    type: bullets
    title: Виражена компетентність і конкурентоспроможність
    bullets:
      - Виражена компетентність — важкокопійована перевага системи
      - Прив’язана до обраних операційних пріоритетів
      - Конкурентоспроможність — утримати перевагу в часі
      - Перевіряється саме тоді, коли умови різко змінюються
    notes: >-
      Розведіть «робити щось добре» і виражену компетентність: остання завжди прив’язана до конкретного
      набору пріоритетів і важко копіюється конкурентами. Перехід до кейсу: Ferrexpo під логістичним шоком.

  - id: s06-case-ferrexpo
    type: case
    title: Ferrexpo — конкурентоспроможність під шоком постачання
    case: ferrexpo
    facts:
      - Виручка 787 млн дол. (−16%), EBITDA 28 млн дол. (−60%)
      - Готівка на кінець року 58 млн дол. проти 106 млн на початок
      - Виробництво окомкування скорочено до однієї лінії з чотирьох
      - LTIFR знизився до 0,38 у 2025 р. проти 0,54 у 2024 р.
    question: Що саме довелося змінити компанії, щоб зберегти конкурентоспроможність, і чого падіння показників само по собі не доводить?
    sources: [ferrexpo-fy2025-results]
    notes: >-
      Компанія переорієнтувала постачання на залізницю й європейських клієнтів замість чорноморських портів —
      зміна структурного рішення, а не пасивне очікування. Застереження: сумарне товарне виробництво впало
      лише приблизно на 9%, а не так різко, як окремо окатиші; поліпшення LTIFR збіглося зі скороченням робіт.

  - id: s07-section
    type: section
    number: 7
    title: Вплив життєвого циклу продукту на операційну стратегію
    notes: >-
      Сьоме, завершальне питання теми. Кожна стадія життєвого циклу продукту вимагає іншого процесу й
      спирається на іншу конкурентну перевагу. Розбіжність циклу продукту й циклу процесу шкодить
      конкурентоспроможності.

  - id: s07-figure
    type: figure
    title: Життєвий цикл продукту і зміна стратегії
    figure: fig-04-life-cycle.svg
    caption: Кожна стадія життєвого циклу продукту вимагає іншого процесу і спирається на іншу конкурентну перевагу.
    sources: []
    notes: >-
      Зародження — гнучкий дрібносерійний процес, конкуренція не ціною. Зростання — стандартизація й
      автоматизація. Зрілість — цінова конкуренція, скорочення витрат. Спад — підтримка наявною
      інфраструктурою без нових вкладень.

  - id: s07-bullets
    type: bullets
    title: Чотири стадії й чотири операційні стратегії
    bullets:
      - 'Зародження: гнучкий дрібносерійний процес, не ціна'
      - 'Зростання: стандартизація, автоматизація, капітал'
      - 'Зрілість: цінова конкуренція, скорочення витрат'
      - 'Спад: підтримка наявною інфраструктурою'
    notes: >-
      Стадія впливає не лише на вибір стратегії, а й на самі способи вдосконалення виробу: на зростанні —
      нові технічні рішення в продукті, на зрілості — модифікації, на спаді — скорочення експлуатаційних
      витрат. Зв’яжіть із розділом 3: продуктове рішення теж залежить від стадії життєвого циклу.

  - id: summary
    type: summary
    title: Головне з теми 2
    bullets:
      - Операційна стратегія — підсистема корпоративної; структурні рішення довгі, тактичні — оборотні
      - Стадії розробки стратегії йдуть від вимог споживача до структурних і тактичних рішень
      - Чотири пріоритети конкурують за ресурси системи — компроміс неминучий
      - Виражена компетентність і конкурентоспроможність — про утримання переваги в часі
      - Життєвий цикл продукту вимагає, щоб стратегія і процес змінювалися разом із ним
    notes: >-
      Підсумок теми: від визначення операційної стратегії й розрізнення стратегії й тактики — через етапи її
      розробки, стратегію товару і процесу — до компромісу пріоритетів, вираженої компетентності й впливу
      життєвого циклу. Наступна практична — тренажер-матриця пріоритетів і рішень.
