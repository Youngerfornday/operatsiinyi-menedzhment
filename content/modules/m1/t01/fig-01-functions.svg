<svg xmlns="http://www.w3.org/2000/svg" id="fig-t01-1" class="scheme" viewBox="0 0 640 344" role="img" aria-labelledby="fig-t01-1-title fig-t01-1-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t01-1-title">Рисунок 1. Місце операційної функції серед функцій підприємства</title>
  <desc id="fig-t01-1-desc">Угорі — мета підприємства: задовольнити потребу споживача й дістати з цього прибуток. Під нею три базові функції в один ряд: маркетинг визначає попит і формує замовлення; операції створюють продукт або послугу; фінанси й облік показують, наскільки економно це зроблено. Стрілки йдуть від маркетингу до операцій і від операцій до фінансів, а від фінансів пунктиром назад до маркетингу — це замкнений контур. Блок операцій позначено карміновим як предмет курсу. Унизу — смуга забезпечувальних функцій: персонал, закупівлі, інформаційні технології, дослідження й розробки; від неї стрілки ведуть угору до всіх трьох базових функцій.</desc>
  <style>
    #fig-t01-1 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-1 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t01-1 .t { fill: var(--ink, #0f1c2e); font-size: 15px; font-weight: 650; }
    #fig-t01-1 .s { fill: var(--ink-2, #445570); font-size: 12.5px; }
    #fig-t01-1 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t01-1 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t01-1 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t01-1 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-1 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t01-1 .exam { stroke: var(--err, #b42318); }
    #fig-t01-1 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12.5px; font-weight: 600; }
    #fig-t01-1 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t01-1 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t01-1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box box-owner" x="120" y="16" width="400" height="44" rx="6"/>
  <text class="t" x="320" y="43" text-anchor="middle">Мета підприємства: потреба споживача і прибуток</text>

  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M320 60 L320 100"/>

  <rect class="box" x="16" y="104" width="180" height="86" rx="6"/>
  <text class="t" x="106" y="134" text-anchor="middle">Маркетинг</text>
  <text class="s" x="106" y="156" text-anchor="middle">визначає попит,</text>
  <text class="s" x="106" y="174" text-anchor="middle">формує замовлення</text>

  <rect class="box exam" x="230" y="104" width="180" height="86" rx="6"/>
  <text class="t" x="320" y="134" text-anchor="middle">Операції</text>
  <text class="exam-t" x="320" y="156" text-anchor="middle">створюють продукт</text>
  <text class="exam-t" x="320" y="174" text-anchor="middle">або послугу</text>

  <rect class="box" x="444" y="104" width="180" height="86" rx="6"/>
  <text class="t" x="534" y="134" text-anchor="middle">Фінанси й облік</text>
  <text class="s" x="534" y="156" text-anchor="middle">показують, наскільки</text>
  <text class="s" x="534" y="174" text-anchor="middle">економно це зроблено</text>

  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M196 147 L226 147"/>
  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M410 147 L440 147"/>
  <path class="arrow" marker-end="url(#fig-t01-1-arr)" stroke-dasharray="4 3" d="M534 104 C 534 72, 106 72, 106 104"/>
  <text class="lbl" x="320" y="82" text-anchor="middle">оцінка результату повертається в рішення про попит</text>

  <rect class="box" x="16" y="238" width="608" height="52" rx="6"/>
  <text class="t" x="320" y="262" text-anchor="middle">Забезпечувальні функції</text>
  <text class="s" x="320" y="281" text-anchor="middle">персонал, закупівлі, інформаційні технології, дослідження й розробки</text>

  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M106 238 L106 194"/>
  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M320 238 L320 194"/>
  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M534 238 L534 194"/>
  <text class="lbl" x="320" y="314" text-anchor="middle">жодна із забезпечувальних функцій не створює продукт сама</text>

  <circle class="refc" cx="16" cy="38" r="11"/><text class="refn" x="16" y="42">1</text>
  <circle class="refc" cx="16" cy="104" r="11"/><text class="refn" x="16" y="108">2</text>
  <circle class="refc exam" cx="410" cy="104" r="11"/><text class="refn exam-n" x="410" y="108">3</text>
  <circle class="refc" cx="624" cy="104" r="11"/><text class="refn" x="624" y="108">4</text>
  <circle class="refc" cx="16" cy="238" r="11"/><text class="refn" x="16" y="242">5</text>
</svg>
