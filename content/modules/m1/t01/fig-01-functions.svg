<svg xmlns="http://www.w3.org/2000/svg" id="fig-t01-1" class="scheme" viewBox="0 0 640 384" role="img" aria-labelledby="fig-t01-1-title fig-t01-1-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t01-1-title">Рисунок 1. Місце операційної функції серед функцій підприємства</title>
  <desc id="fig-t01-1-desc">Угорі — мета підприємства: задовольнити потребу споживача й дістати з цього прибуток. Під нею три базові функції в один ряд: маркетинг визначає попит і формує замовлення; операції створюють продукт або послугу; фінанси й облік показують, наскільки економно це зроблено. Стрілки йдуть від маркетингу до операцій і від операцій до фінансів, а від фінансів пунктиром назад до маркетингу — це замкнений контур. Блок операцій позначено карміновим як предмет курсу. Унизу — смуга забезпечувальних функцій: персонал, закупівлі, інформаційні технології, дослідження й розробки; від неї стрілки ведуть угору до всіх трьох базових функцій.</desc>
  <style>
    #fig-t01-1 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-1 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t01-1 .t { fill: var(--ink, #0f1c2e); font-size: 15px; font-weight: 650; }
    #fig-t01-1 .s { fill: var(--ink-2, #445570); font-size: 12.5px; }
    #fig-t01-1 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t01-1 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t01-1 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t01-1 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-1 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t01-1 .exam { stroke: var(--err, #b42318); }
    #fig-t01-1 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12.5px; font-weight: 600; }
    #fig-t01-1 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t01-1 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t01-1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box box-owner" x="100" y="56" width="440" height="44" rx="6"/>
  <text class="t" x="320" y="83" text-anchor="middle">Мета підприємства: потреба споживача і прибуток</text>

  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M 320 100 L 320 140"/>

  <rect class="box" x="16" y="144" width="180" height="86" rx="6"/>
  <text class="t" x="106" y="174" text-anchor="middle">Маркетинг</text>
  <text class="s" x="106" y="196" text-anchor="middle">визначає попит,</text>
  <text class="s" x="106" y="214" text-anchor="middle">формує замовлення</text>

  <rect class="box exam" x="230" y="144" width="180" height="86" rx="6"/>
  <text class="t" x="320" y="174" text-anchor="middle">Операції</text>
  <text class="exam-t" x="320" y="196" text-anchor="middle">створюють продукт</text>
  <text class="exam-t" x="320" y="214" text-anchor="middle">або послугу</text>

  <rect class="box" x="444" y="144" width="180" height="86" rx="6"/>
  <text class="t" x="534" y="174" text-anchor="middle">Фінанси й облік</text>
  <text class="s" x="534" y="196" text-anchor="middle">показують, наскільки</text>
  <text class="s" x="534" y="214" text-anchor="middle">економно це зроблено</text>

  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M 196 187 L 226 187"/>
  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M 410 187 L 440 187"/>
  <path class="arrow" marker-end="url(#fig-t01-1-arr)" stroke-dasharray="4 3" d="M560 144 V44 Q560 36 552 36 H88 Q80 36 80 44 V140"/>
  <text class="lbl" x="320" y="26" text-anchor="middle">оцінка результату повертається в рішення про попит</text>

  <rect class="box" x="16" y="278" width="608" height="52" rx="6"/>
  <text class="t" x="320" y="302" text-anchor="middle">Забезпечувальні функції</text>
  <text class="s" x="320" y="321" text-anchor="middle">персонал, закупівлі, інформаційні технології, дослідження й розробки</text>

  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M 106 278 L 106 234"/>
  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M 320 278 L 320 234"/>
  <path class="arrow" marker-end="url(#fig-t01-1-arr)" d="M 534 278 L 534 234"/>
  <text class="lbl" x="320" y="354" text-anchor="middle">жодна із забезпечувальних функцій не створює продукт сама</text>

  <circle class="refc" cx="100" cy="56" r="11"/><text class="refn" x="100" y="60">1</text>
  <circle class="refc" cx="16" cy="144" r="11"/><text class="refn" x="16" y="148">2</text>
  <circle class="refc exam" cx="410" cy="144" r="11"/><text class="refn exam-n" x="410" y="148">3</text>
  <circle class="refc" cx="624" cy="144" r="11"/><text class="refn" x="624" y="148">4</text>
  <circle class="refc" cx="16" cy="278" r="11"/><text class="refn" x="16" y="282">5</text>
</svg>
