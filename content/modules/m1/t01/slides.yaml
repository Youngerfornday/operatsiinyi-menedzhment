# Презентація теми 1. Текст слайдів стислий: повний виклад — у lecture.mdx, пояснення — у нотатках.
# Кожне число слайда має бути в лонгріді теми й мати джерело зі sources.yaml.
topic: t01
slides:
  - id: title
    type: title
    subtitle: Модуль 1. Теоретичні основи організації та регулювання операційної діяльності
    notes: >-
      Вступ до курсу через одне питання: два цехи випустили 12 000 і 13 800 виробів за квартал — хто працював краще?
      Відповідь залежить від того, що поставити в знаменник. Запитайте аудиторію, які ресурси вони назвали б у знаменнику,
      перш ніж відповідати.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після теми
    notes: >-
      Три результати теми. Перший і другий — понятійні, третій — розрахунковий: наприкінці теми студент рахує часткову
      й багатофакторну продуктивність і пояснює, чому вони розходяться. Запитайте, хто вже стикався з показником
      «продуктивність праці» на практиці й у якому вигляді його бачив.

  - id: s01-section
    type: section
    number: 1
    title: Сутність і місце операційного менеджменту в системі менеджменту
    notes: >-
      Перше питання теми. Головна теза розділу: операційна функція — одна з трьох базових функцій організації,
      і її виконують усі організації без винятку. Приклад для розігріву: перукарня, лікарня і банк — де там «виробництво».
      Запитайте аудиторію, яку функцію підприємства можна прибрати без зупинки діяльності.

  - id: s01-figure
    type: figure
    title: Місце операційної функції серед функцій підприємства
    figure: fig-01-functions.svg
    caption: Маркетинг визначає попит, операції створюють продукт, фінанси й облік оцінюють економність.
    sources: [jacobs-chase-2019]
    notes: >-
      Схема показує замкнений контур: оцінка результату повертається в рішення про попит. Забезпечувальні функції
      (персонал, закупівлі, інформаційні технології, дослідження й розробки) обслуговують усіх трьох, але продукту
      самі не створюють. Приклад: рішення скоротити асортимент для маркетингу означає втрату частини ринку,
      для операцій — коротші переналагодження, для фінансів — менші запаси. Запитайте, хто з трьох має вирішувати.

  - id: s01-definition
    type: bullets
    title: Операційний менеджмент, операційна функція, предмет дисципліни
    bullets:
      - Операційний менеджмент — управління ресурсами і процесами, що перетворюють входи на товари та послуги.
      - '«Управління виробництвом», «виробничий менеджмент» і «операційний менеджмент» вживаються як рівнозначні.'
      - Операційна функція — дії, унаслідок яких організація дає продукт зовнішньому споживачеві.
      - Її виконують усі організації без винятку — інакше вони нічого не постачали б назовні.
      - Предмет дисципліни — закономірності проектування, завантаження й використання операційної системи.
      - Технологія відповідає «як фізично зробити», операційний менеджмент — «скільки, коли, якою партією і за скільки».
    sources: [omelianenko-osokina-2016, kushniruk-2017]
    notes: >-
      Наголосіть на останньому пункті: межа між технологією й операційним менеджментом — найчастіше джерело плутанини
      на іспиті. Приклад: режими різання визначає технолог, а розмір партії й черговість замовлень — операційний менеджер.
      Запитайте аудиторію, до чиєї компетенції належить рішення закупити другий верстат.

  - id: s02-section
    type: section
    number: 2
    title: Природа та історичний розвиток операційного (виробничого) менеджменту
    notes: >-
      Друге питання теми. Ідея розділу: дисципліна розвивалася хвилями, і кожна хвиля виникала як відповідь на межу,
      у яку впиралося виробництво. Приклад: поділ праці дав зростання випуску без нової техніки, але породив черги
      між операціями. Запитайте, яку межу, на думку аудиторії, долає нинішня, цифрова хвиля.

  - id: s02-figure
    type: figure
    title: Шість хвиль доктрин операційного менеджменту
    figure: fig-03-doctrines-timeline.svg
    caption: Кожна хвиля додає новий предмет управління, не скасовуючи попередній.
    sources: [stevenson-2020]
    notes: >-
      Пройдіть хвилями згори вниз: поділ праці, вимірювання операції, норма й потік, кількісні методи,
      якість і ощадливість, ланцюги та цифрові системи. Третя хвиля виділена карміновим — саме на ній народився
      операційний менеджмент у сучасному розумінні. Приклад: норма часу зробила можливими і календарне планування,
      і розрахунок собівартості. Запитайте, що саме перетворило операцію з опису на число.

  - id: s02-case-toyota
    type: case
    title: Toyota Production System — від прийомів до системи
    case: toyota-tps
    facts:
      - '1896 р.: Сакічі Тойода створює верстат, який сам зупиняється при обриві нитки — джерело принципу jidoka.'
      - Кіічіро Тойода виводить just-in-time з того, що автомобіль складається більш ніж із 30 000 деталей.
      - У повоєнний період Тайіті Оно формує саму систему й базовий каркас методу just-in-time.
      - Компанія визначає TPS як систему повного усунення втрат у пошуку найефективніших методів роботи.
      - Офіційний опис не містить жодної кількісної метрики — цифри цій системі приписувати не можна.
    question: Що саме перетворило окремі винаходи трьох поколінь на управлінську систему?
    sources: [toyota-production-system]
    notes: >-
      Ключ до розбору: jidoka без just-in-time дає зупинки без потоку, just-in-time без jidoka розносить дефект
      по всьому ланцюгу. Працюють вони лише разом. Приклад межі кейсу: визначення kanban і heijunka на офіційній
      сторінці компанії відсутні, тому подавати їх як цитату Toyota не можна. Запитайте аудиторію, чому копіювання
      окремих прийомів TPS на іншому заводі зазвичай не дає того самого результату.

  - id: s03-section
    type: section
    number: 3
    title: Наукові підходи — системний, процесний, ситуаційний
    notes: >-
      Третє питання теми. Кожен підхід — це вказівка, з чого починати аналіз: системний окреслює межі цілого,
      процесний стежить за потоком, ситуаційний перевіряє умови. Приклад: цех, який завантажив себе на повну,
      накопичує незавершене виробництво перед вузьким місцем. Запитайте, який підхід тут порушено.

  - id: s03-columns
    type: two-columns
    title: Системний і ситуаційний підходи
    left:
      heading: Системний
      bullets:
        - Організація — цілісна система, операційна система — її частина.
        - 'Потрібні обидві дії: декомпозиція на елементи й синтез їх як частин цілого.'
        - Оптимум цілого не дорівнює сумі оптимумів частин.
        - 'Організація є соціотехнічною системою: її поведінка стохастична, бо в ній діє людина.'
    right:
      heading: Ситуаційний
      bullets:
        - Універсально найкращого рішення немає — є найкраще за наявних умов.
        - 'Ситуаційні змінні: обсяг і мінливість попиту, номенклатура, персонал, стан обладнання.'
        - Жодна модель курсу не застосовується без перевірки її припущень.
        - Правило черги, що мінімізує середній час, збільшує максимальне запізнення.
    sources: [heizer-render-munson-2016]
    notes: >-
      Порядок у розв’язанні задачі саме такий: спочатку межі, потім потік, потім перевірка припущень.
      Приклад: формула оптимального розміру партії втрачає сенс за нестабільного постачання — це ситуаційне
      обмеження, а не помилка формули. Запитайте, за яких умов перестає працювати показник продуктивності праці.

  - id: s03-process
    type: bullets
    title: Процесний підхід і цикл поліпшення
    bullets:
      - 'Діяльність — мережа процесів: вихід одного стає входом наступного.'
      - Управляти означає визначати процеси, їх взаємодію й критерії результату.
      - Це формулювання закріплене в міжнародному стандарті систем управління якістю.
      - Цикл «плануй — виконуй — перевіряй — дій» задає ритм роботи операційного менеджера.
      - 'Без четвертого кроку цикл вироджується у звітність: відхилення фіксується й нічого не змінює.'
    sources: [iso-9000-2015]
    notes: >-
      Стандарт, ідентично прийнятий в Україні, описує процесний підхід як систематичне визначення процесів
      і управління ними та їх взаємодією. Приклад розірваного циклу: щотижневий звіт про відхилення від плану,
      після якого план не змінюють і роботу не перебудовують. Запитайте, який крок циклу найчастіше випадає
      на знайомому аудиторії підприємстві.

  - id: s04-section
    type: section
    number: 4
    title: Принципи, функції та методи операційного менеджменту
    notes: >-
      Четверте питання теми. Головне, що має винести аудиторія: принципи суперечать один одному, і це не помилка.
      Приклад: безперервність вимагає запасу перед робочим місцем, ощадливість вимагає запас скоротити.
      Запитайте, який принцип аудиторія пожертвувала б першим і чим це обернеться.

  - id: s04-principles
    type: bullets
    title: П’ять принципів організації операційних процесів
    bullets:
      - Пропорційність — узгоджена пропускна здатність суміжних ділянок.
      - Безперервність — скорочення перерв у русі предмета праці.
      - Паралельність — одночасне виконання частин роботи.
      - Прямоточність — найкоротший шлях предмета праці без повернень.
      - Ритмічність — рівномірний випуск замість авралу в останній тиждень місяця.
      - Кожен принцип має вимірне відображення; рахувати їх будемо в темі 4.
    sources: [kushniruk-2017]
    notes: >-
      Наголосіть: ділянка, потужніша за сусідню, не збільшує випуск, а лише накопичує перед нею запас — це
      порушення пропорційності в чистому вигляді. Приклад ритмічності: місячний план, виконаний за останній
      тиждень, коштує понаднормових, браку й зірваних строків. Запитайте, за яким показником аудиторія
      побачила б порушення ритмічності у звітності цеху.

  - id: s04-columns
    type: two-columns
    title: Функції та методи операційного менеджменту
    left:
      heading: Функції
      bullets:
        - Планування — що, скільки й коли виробляти.
        - Організація — хто, на якому обладнанні, у якій послідовності.
        - Мотивація — зв’язок результату працівника з результатом системи.
        - Контроль — регулювання системи за планами, цілями й нормативами.
        - Координація — узгодження дій підрозділів.
    right:
      heading: Методи
      bullets:
        - Організаційно-розпорядчі — норма, регламент, розпорядження.
        - Економічні — ціна, тариф, премія, внутрішній розрахунок.
        - Соціально-психологічні — склад бригади, навчання, участь у поліпшеннях.
        - Кількісні — баланс потужності, нормування, статистика, оптимізація.
    sources: [kushniruk-2017, heizer-render-munson-2016]
    notes: >-
      Пастка мотивації: нормування, прив’язане до особистого виробітку, штовхає робітника працювати швидше
      за такт і створювати запас перед наступною операцією. Приклад: бригада перевиконала змінне завдання
      й забила проходи незавершеним виробництвом. Запитайте, як перебудувати показник, щоб цього не сталося.

  - id: s05-section
    type: section
    number: 5
    title: Цілі та основні завдання операційного менеджменту
    notes: >-
      П’яте питання теми. Мета — ефективна система керування операціями; основне завдання — побудувати керуючі
      системи, що дають ринковий результат. Найважливіша властивість операційних цілей: вони похідні від стратегії,
      а іноді задані ззовні. Запитайте, що станеться з операційною ціллю «випускати більше», якщо взяти її окремо.

  - id: s05-tasks
    type: bullets
    title: Завдання, з яких складається решта курсу
    bullets:
      - Скоротити тривалість виробничого циклу — теми 3 і 4.
      - Узгодити потужність з попитом — теми 5 і 6.
      - Утримувати запас, що покриває мінливість і не заморожує обіговий капітал, — тема 6.
      - Забезпечити ритмічність і виконання строків — теми 6 і 7.
      - Досягти потрібної якості з найменшими витратами на її досягнення — тема 8.
      - Підвищувати продуктивність системи, а не окремого робочого місця, — теми 1 і 8.
    sources: [stevenson-2020]
    notes: >-
      Це карта курсу: кожне завдання має власну тему й власний розрахунок. Приклад похідності цілей: рішення
      про те, як, коли й де виробляти, є стратегічним і ухвалюється з урахуванням даних усіх функціональних
      галузей. Запитайте, яке із шести завдань на знайомому аудиторії підприємстві вирішене найгірше.

  - id: s05-case-ukrposhta
    type: case
    title: Укрпошта — коли ціль операційної системи встановлює держава
    case: ukrposhta
    facts:
      - 'Згідно з наказом від 22.12.2025 № 1833, для 85 % внутрішніх відправлень норматив — день подання плюс три дні.'
      - Для 97 % відправлень норматив становить день подання плюс п’ять днів.
      - Розділ I наказу називає ці нормативи державними соціальними стандартами.
      - За офіційними даними, мережа охоплює 20 204 населені пункти — усю територію, крім тимчасово окупованої.
      - 'За даними міністерства, за 2025 рік доставлено 112,1 млн одиниць кореспонденції та 42,7 млн посилок.'
    question: Чим задача з ціллю, заданою нормативом, відрізняється від задачі, де рівень обслуговування обирає компанія?
    sources: [nakaz-1833-2025, ukrposhta-about, mininfra-ukrposhta-2025]
    notes: >-
      Головне для теми 1: операційні цілі можуть бути повністю екзогенними. Компанія не може відповісти на високу
      вартість обслуговування віддалених сіл відмовою від збиткового сегмента — ціль задана ззовні. Приклад важеля,
      який лишається: де розмістити сортувальні потужності, скільки відділень зробити пересувними, як побудувати
      маршрути. Межа кейсу: усі показники потужності ліній — позиція компанії, а не аудований факт. Запитайте,
      які ще галузі працюють з нормативно заданим рівнем обслуговування.

  - id: s06-section
    type: section
    number: 6
    title: Категорійний апарат — операція, операційна функція, операційна система
    notes: >-
      Шосте питання теми. Розведіть три поняття одразу: операція — що робимо, операційна функція — навіщо,
      операційна система — чим. Приклад: оформлення замовлення теж є операцією, бо має тривалість, вартість
      і виконавця. Запитайте аудиторію, чи є операцією передача змінного завдання.

  - id: s06-figure
    type: figure
    title: Модель «вхід — перетворення — вихід»
    figure: fig-02-input-output.svg
    caption: 'Зворотний зв’язок робить систему керованою: результат вимірюють і за ним коригують процес.'
    sources: [slack-brandon-jones-2021]
    notes: >-
      Розберіть склад входу: об’єкти операційної діяльності (матеріали, клієнти, власність клієнтів), засоби
      діяльності й персонал. У сфері послуг клієнт перебуває всередині процесу перетворення і впливає на його
      тривалість так, як ніколи не впливає заготовка. Приклад: черга в поліклініці — це клієнт усередині системи.
      Запитайте, який вихід операційної системи вважати другорядним і чому його не можна ігнорувати.

  - id: s06-terms
    type: bullets
    title: Три поняття, які постійно плутають
    bullets:
      - Операція — найменша керована одиниця роботи, що має мету й результат.
      - 'Операція буває і фізичною, і інформаційною: розрахунок норми теж є операцією.'
      - Перетворення буває фізичним, просторовим, обмінним, складським, фізіологічним, інформаційним.
      - Додана вартість — різниця між вартістю виходу й вартістю входів.
      - Переміщення, очікування й переробка браку доданої вартості не створюють.
      - Операційна система складається з переробної підсистеми, забезпечення та планування й контролю.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Додана вартість дає операційному менеджеру жорсткий критерій замість інтуїції: за свердління отвору
      споживач платить, за пробіг візка між цехами — ні. Приклад: повторна обробка бракованої деталі додає
      витрати й не додає вартості. Запитайте, які операції на знайомому виробництві не пройшли б цю перевірку.

  - id: s07-section
    type: section
    number: 7
    title: Операційний менеджер і процес управління операціями
    notes: >-
      Сьоме питання теми. Головне розрізнення — структурні й поточні рішення. Приклад: обрати майданчик можна
      один раз на десять років, а розмір партії переглядають щотижня. Запитайте аудиторію, які рішення
      операційного менеджера вони вважають найдорожчими для виправлення.

  - id: s07-columns
    type: two-columns
    title: Структурні й поточні рішення операційного менеджера
    left:
      heading: Структурні
      bullets:
        - Яку потужність створювати й де розмістити об’єкти.
        - Яку технологію й обладнання обрати.
        - Як спланувати приміщення й розташувати обладнання.
        - Де межа між власним виробництвом і закупівлею.
        - Довгі, дорогі й майже незворотні.
    right:
      heading: Поточні
      bullets:
        - Скільки виробляти цього місяця й якою партією.
        - Скільки тримати запасу й коли замовляти.
        - У якій черзі виконувати замовлення.
        - Скільки людей виводити в зміну.
        - Швидкі й оборотні, але обмежені структурними.
    sources: [heizer-render-munson-2016]
    notes: >-
      Наголосіть на залежності: структурні рішення задають межі, усередині яких потім працює лінійний менеджер.
      Приклад: жодне оперативне рішення не дасть випуску понад створену потужність. Процес управління операціями
      є замкненим циклом: план, організація, вимір, порівняння, дія на розбіжність. Запитайте, що відбувається
      з управлінням, коли останній крок випадає.

  - id: s07-case-ajax
    type: case
    title: Ajax Systems — майданчик як інструмент бізнес-цілі
    case: ajax-systems
    facts:
      - У листопаді 2020 року компанія відкрила другий виробничий майданчик у Києві.
      - 'Пояснення засновника: компанія планувала подвоїти бізнес, тому був потрібен ще один майданчик.'
      - За повідомленням компанії, того року планувалося близько 150 робочих місць, наступного — до тисячі.
      - Пізніше компанія виділила окрему передсерійну ділянку для освоєння нових пристроїв.
      - Компанія приватна й аудованої звітності не публікує — усі цифри є її власною заявою.
    question: До якої групи належить це рішення і що станеться, якщо бізнес-ціль зміниться через рік?
    sources: [ajax-second-plant-2020, ajax-preseries-2024]
    notes: >-
      Ланцюг читається в одному реченні засновника: бізнес-ціль задає потрібну потужність, потрібна потужність
      задає рішення про розміщення. Це найпростіший приклад підпорядкованості операційної функції стратегії.
      Приклад другого рішення: передсерійна ділянка виділена, щоб освоєння нового продукту не зупиняло серійний
      потік. Запитайте, чому власне виробництво саме по собі не доводить вигідності проти контрактного.

  - id: s08-section
    type: section
    number: 8
    title: Продуктивність операційної системи — часткова, багатофакторна, загальна
    notes: >-
      Восьме питання теми й головний інструмент курсу. Продуктивність — відношення обсягу випуску до обсягу
      витрачених ресурсів за той самий період. Приклад: випуск, що зріс разом із пропорційним зростанням витрат,
      продуктивності не змінює. Запитайте, чому показник ніколи не наводять без зазначення знаменника.

  - id: s08-figure
    type: figure
    title: Що саме стоїть у знаменнику
    figure: fig-04-productivity.svg
    caption: Часткова й багатофакторна продуктивність відрізняються лише знаменником — і тому дають різні висновки.
    sources: [stevenson-2020, hevko-2017]
    notes: >-
      Часткова ставить у знаменник один ресурс: її легко порахувати й легко пояснити, але вона зростає й тоді,
      коли працю просто замінили дорожчим обладнанням. Багатофакторна зводить кілька ресурсів до гривень і такої
      заміни не пропускає, але залежить від цін. Загальна охоплює всі ресурси, проте не показує причини зміни.
      Приклад: подорожчання електроенергії знизить багатофакторну продуктивність, хоча цех працює так само.
      Запитайте, який із трьох показників аудиторія обрала б для премії начальнику цеху.

  - id: s08-calc
    type: bullets
    title: Розрахунок за два квартали — навчальні дані
    bullets:
      - 'Квартал I: випуск 12 000 виробів, 4 800 людино-годин, ресурсів на 2 000 000 гривень.'
      - 'Квартал II: випуск 13 800 виробів, 4 600 людино-годин, ресурсів на 2 400 000 гривень.'
      - 'Продуктивність праці: 12 000 / 4 800 = 2,5, а 13 800 / 4 600 = 3,0 виробу на людино-годину.'
      - 'Багатофакторна: 12 000 / 2 000 000 дає 6,00, а 13 800 / 2 400 000 — 5,75 виробу на 1 000 гривень.'
      - Продуктивність праці зросла, багатофакторна знизилася — обидва числа правильні.
      - Випуск зріс у 1,15 раза, витрати ресурсів — у 1,20 раза, тому дріб мусив зменшитися.
    sources: [stevenson-2020]
    notes: >-
      Числа навчальні: вони дібрані так, щоб розрахунок легко відтворювався, і не описують реального підприємства.
      Причина розбіжності: нова лінія звільнила працю, але спожила більше енергії й коштувала дорожче в утриманні.
      Приклад перевірки без ділення: якщо знаменник зростає швидше за чисельник, дріб зменшується завжди.
      Запитайте, яким одним показником начальник цеху відзвітував би про цей квартал і що він приховав би.

  - id: s08-oee
    type: formula
    title: Загальна ефективність обладнання
    formula: OEE = Доступність × Продуктивність × Якість
    explanation:
      - Доступність — частка планового фонду часу, коли обладнання справді працювало.
      - Продуктивність — відношення фактичного темпу до ідеального.
      - Якість — частка придатної продукції у фактичному випуску.
      - 'Три складові по 90 % дають не 90 %, а 72,9 %: втрати перемножуються.'
      - Показник має код CAP-03 у розрахунковій базі курсу.
    sources: [iso-22400-1-2014]
    notes: >-
      Розберіть перевірку прямим рахунком: за повний плановий фонд ідеальна лінія дала б 1 000 придатних виробів,
      фактично отримано 729, і відношення дає ті самі 72,9 %. Приклад тлумачення: керівник, який дивиться лише
      на якість і бачить 90 %, не помічає, що більша частина можливого випуску втрачена ще до контролю.
      Запитайте, яку зі складових показника на знайомому виробництві піднімати найдешевше.

  - id: summary
    type: summary
    title: Підсумок теми
    bullets:
      - Операційний менеджмент — управління перетворенням ресурсів на продукт; операційна функція є в кожної організації.
      - Дисципліна склалася хвилями, кожна з яких додала новий предмет управління.
      - Системний підхід дає межі, процесний — потік, ситуаційний — перевірку умов.
      - Операція, операційна функція й операційна система — три різні поняття; критерій корисності — додана вартість.
      - Рішення менеджера поділяються на структурні й поточні; управління є замкненим циклом.
      - Часткова, багатофакторна й загальна продуктивність вимірюють ту саму систему і можуть розходитися.
    sources: [stevenson-2020, omelianenko-osokina-2016]
    notes: >-
      Поверніться до питання з першого слайда: тепер аудиторія має відповісти, який цех працював краще, і назвати
      показник, за яким вона це стверджує. Приклад правильної відповіді: за працею кращий другий, за багатофакторною
      продуктивністю — перший, і рішення потребує обох чисел. Запитайте, який третій показник вони б ще порахували
      перед тим, як ухвалювати рішення про лінію.
