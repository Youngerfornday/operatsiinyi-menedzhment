<svg xmlns="http://www.w3.org/2000/svg" id="fig-t01-2" class="scheme" viewBox="0 0 640 372" role="img" aria-labelledby="fig-t01-2-title fig-t01-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t01-2-title">Рисунок 2. Модель «вхід — перетворення — вихід»</title>
  <desc id="fig-t01-2-desc">Три блоки в один ряд усередині пунктирної рамки, яка позначає межу операційної системи. Ліворуч — вхід: матеріали, люди, обладнання, енергія, інформація, а у сфері послуг ще й сам клієнт та його власність. Посередині — процес перетворення: послідовність операцій, які змінюють предмет праці. Праворуч — вихід: основний результат, тобто готова продукція, змінений стан клієнта або його власності, і другорядний — матеріальні залишки, тепло та інформація. Суцільні стрілки ведуть зліва направо. Від виходу карміновою пунктирною стрілкою повертається зворотний зв’язок до блоку перетворення: результат вимірюють і за ним коригують процес. Над рамкою підписано зовнішнє середовище, з якого надходять ресурси й куди йде результат; підпис під рамкою нагадує, що різниця між вартістю виходу й вартістю входу є доданою вартістю.</desc>
  <style>
    #fig-t01-2 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-2 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t01-2 .t { fill: var(--ink, #0f1c2e); font-size: 15px; font-weight: 650; }
    #fig-t01-2 .s { fill: var(--ink-2, #445570); font-size: 12.5px; }
    #fig-t01-2 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t01-2 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t01-2 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t01-2 .frame { fill: none; stroke: var(--ink-2, #445570); stroke-width: 1; stroke-dasharray: 5 4; }
    #fig-t01-2 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-2 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t01-2 .exam { stroke: var(--err, #b42318); }
    #fig-t01-2 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12px; font-weight: 600; }
    #fig-t01-2 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t01-2 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t01-2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <text class="lbl" x="320" y="20" text-anchor="middle">Зовнішнє середовище: ринок ресурсів, ринок збуту, держава</text>

  <rect class="frame" x="12" y="34" width="616" height="232" rx="10"/>
  <text class="lbl" x="24" y="52">межа операційної системи</text>

  <rect class="box box-owner" x="28" y="76" width="168" height="112" rx="6"/>
  <text class="t" x="112" y="104" text-anchor="middle">Вхід</text>
  <text class="s" x="112" y="126" text-anchor="middle">матеріали, люди,</text>
  <text class="s" x="112" y="144" text-anchor="middle">обладнання, енергія,</text>
  <text class="s" x="112" y="162" text-anchor="middle">інформація, клієнт</text>
  <text class="s" x="112" y="180" text-anchor="middle">і його власність</text>

  <rect class="box" x="236" y="76" width="168" height="112" rx="6"/>
  <text class="t" x="320" y="104" text-anchor="middle">Перетворення</text>
  <text class="s" x="320" y="126" text-anchor="middle">послідовність</text>
  <text class="s" x="320" y="144" text-anchor="middle">операцій, що змінює</text>
  <text class="s" x="320" y="162" text-anchor="middle">предмет праці</text>

  <rect class="box" x="444" y="76" width="168" height="112" rx="6"/>
  <text class="t" x="528" y="104" text-anchor="middle">Вихід</text>
  <text class="s" x="528" y="126" text-anchor="middle">основний: продукція,</text>
  <text class="s" x="528" y="144" text-anchor="middle">змінений клієнт;</text>
  <text class="s" x="528" y="162" text-anchor="middle">другорядний: залишки,</text>
  <text class="s" x="528" y="180" text-anchor="middle">тепло, інформація</text>

  <path class="arrow" marker-end="url(#fig-t01-2-arr)" d="M196 132 L232 132"/>
  <path class="arrow" marker-end="url(#fig-t01-2-arr)" d="M404 132 L440 132"/>
  <path class="arrow exam" marker-end="url(#fig-t01-2-arr)" stroke-dasharray="4 3" d="M528 188 C 528 224, 320 224, 320 190"/>
  <text class="exam-t" x="440" y="251" text-anchor="middle">зворотний зв’язок: вимір результату коригує процес</text>

  <text class="lbl" x="320" y="298" text-anchor="middle">Вартість виходу мінус вартість входів — додана вартість, створена перетворенням.</text>
  <text class="lbl" x="320" y="320" text-anchor="middle">Операція, за яку споживач не готовий платити, доданої вартості не створює.</text>

  <circle class="refc" cx="28" cy="76" r="11"/><text class="refn" x="28" y="80">1</text>
  <circle class="refc" cx="236" cy="76" r="11"/><text class="refn" x="236" y="80">2</text>
  <circle class="refc" cx="612" cy="76" r="11"/><text class="refn" x="612" y="80">3</text>
  <circle class="refc exam" cx="260" cy="247" r="11"/><text class="refn exam-n" x="260" y="251">4</text>
  <circle class="refc" cx="28" cy="298" r="11"/><text class="refn" x="28" y="302">5</text>
</svg>
