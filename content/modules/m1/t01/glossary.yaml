# Глосарій теми 1. Назви термінів мають дослівно збігатися з реєстром course.yaml (glossaryTerms, topic: t01).
# Визначення — робочі формулювання курсу; розрахункові співвідношення беруться з docs/research/formula-baseline.md.
topic: t01
terms:
  - id: operations-management
    term: Операційний менеджмент
    definition: >-
      Діяльність з управління ресурсами і процесами, які перетворюють входи організації на товари та послуги:
      проєктування операційної системи, планування її завантаження, організація і контроль виконання операцій.
      Терміни «управління виробництвом», «виробничий менеджмент» і «операційний менеджмент» вживаються як
      рівнозначні, бо та сама логіка працює і на заводі, і в лікарні, і в банку.
    synonyms:
      - виробничий менеджмент
      - управління виробництвом
      - управління операціями
      - operations management
    forms:
      - операційний менеджмент
      - операційного менеджменту
      - операційному менеджменту
      - операційним менеджментом
      - операційного (виробничого) менеджменту
    seeAlso: [operations-function, operations-manager, operation, productivity]

  - id: operations-function
    term: Операційна функція
    definition: >-
      Сукупність дій, унаслідок яких організація створює продукцію або послугу для зовнішнього споживача.
      Одна з трьох базових функцій підприємства поряд з маркетингом, який визначає попит, і фінансами, які
      оцінюють, наскільки економно цей попит задовольняється. Операційну функцію виконують усі без винятку
      організації, незалежно від галузі й форми власності.
    synonyms:
      - функція «операції»
      - виробнича функція підприємства
      - operations function
    forms:
      - операційна функція
      - операційної функції
      - операційну функцію
      - операційною функцією
      - операційні функції
    seeAlso: [operations-management, operation, transformation-process]

  - id: operation
    term: Операція
    definition: >-
      Завершена частина процесу, яку виконують над одним предметом праці на одному робочому місці: закінчена
      сукупність цілеспрямованих дій, що має власну мету й власний результат. Операція змінює фізичні або
      хімічні властивості предмета, з’єднує чи роз’єднує його частини, готує його до наступної дії або
      створює й передає інформацію.
    synonyms:
      - технологічна операція
      - виробнича операція
      - operation
    forms:
      - операція
      - операції
      - операцію
      - операцією
      - операцій
      - операціями
    seeAlso: [operations-function, transformation-process, operations-process]

  - id: transformation-process
    term: Процес перетворення
    definition: >-
      Ядро операційної системи: послідовність дій, у ході яких входи (матеріали, люди, обладнання, інформація,
      клієнти) стають виходами (продукцією чи послугою). Перетворення буває фізичним, просторовим, обмінним,
      складським, фізіологічним та інформаційним — за характером зміни, якої зазнає предмет операційної
      діяльності.
    synonyms:
      - конверсія
      - трансформація
      - перетворювальний процес
      - transformation process
    forms:
      - процес перетворення
      - процесу перетворення
      - процесом перетворення
      - процеси перетворення
      - перетворення
    seeAlso: [operations-function, value-added, input-output-model]

  - id: value-added
    term: Додана вартість
    definition: >-
      Приріст вартості, який процес перетворення створює понад вартість спожитих ресурсів: різниця між
      вартістю виходу і вартістю входів. Це мірило корисності операції для споживача: дія, за яку споживач
      не готовий платити і яка не потрібна для отримання продукту, доданої вартості не створює і вважається
      втратою.
    synonyms:
      - приріст вартості
      - вартість, додана обробкою
      - value added
    forms:
      - додана вартість
      - доданої вартості
      - додану вартість
      - доданою вартістю
    seeAlso: [transformation-process, productivity, efficiency]

  - id: productivity
    term: Продуктивність
    definition: >-
      Відношення обсягу випуску операційної системи до обсягу витрачених на нього ресурсів за той самий
      період. Показник відповідає на питання, скільки виходу знято з одиниці входу, і зростає лише тоді,
      коли випуск збільшується швидше за витрати ресурсів. Залежно від того, які саме входи стоять у
      знаменнику, розрізняють часткову, багатофакторну й загальну продуктивність.
    synonyms:
      - продуктивність операційної системи
      - віддача ресурсів
      - productivity
    forms:
      - продуктивність
      - продуктивності
      - продуктивністю
      - продуктивностей
    seeAlso: [partial-productivity, multifactor-productivity, efficiency, effectiveness]

  - id: partial-productivity
    term: Часткова продуктивність
    definition: >-
      Продуктивність, у знаменнику якої стоїть один вид ресурсу: праця, матеріали, енергія або капітал.
      Легко вимірюється й легко тлумачиться, але показує лише одну грань роботи системи: часткова
      продуктивність за працею може зростати саме тому, що працю замінили дорожчим обладнанням або енергією.
    synonyms:
      - однофакторна продуктивність
      - продуктивність за одним ресурсом
      - partial productivity
    forms:
      - часткова продуктивність
      - часткової продуктивності
      - часткову продуктивність
      - частковою продуктивністю
      - часткові продуктивності
    seeAlso: [productivity, multifactor-productivity, efficiency]

  - id: multifactor-productivity
    term: Багатофакторна продуктивність
    definition: >-
      Продуктивність, у знаменнику якої стоїть сума кількох видів ресурсів, зведених до спільної одиниці
      вимірювання — найчастіше до грошової. Показує віддачу операційної системи загалом і не дає
      «поліпшити» результат простою заміною одного ресурсу іншим: заміна відображається і в чисельнику,
      і в знаменнику.
    synonyms:
      - багаточинникова продуктивність
      - сукупнофакторна продуктивність
      - multifactor productivity
    forms:
      - багатофакторна продуктивність
      - багатофакторної продуктивності
      - багатофакторну продуктивність
      - багатофакторною продуктивністю
    seeAlso: [productivity, partial-productivity, effectiveness]

  - id: efficiency
    term: Ефективність операційної системи
    definition: >-
      Міра економності операційної системи: наскільки ощадно вона витрачає ресурси на отриманий результат.
      Відповідає на питання «чи правильно ми робимо роботу» і вимірюється співвідношеннями виходу і входу —
      продуктивністю, використанням потужності, часткою часу корисної роботи обладнання.
    synonyms:
      - економність операційної системи
      - operational efficiency
    forms:
      - ефективність операційної системи
      - ефективності операційної системи
      - ефективність
      - ефективності
      - ефективністю
    seeAlso: [productivity, effectiveness, value-added]

  - id: effectiveness
    term: Результативність операційної системи
    definition: >-
      Міра досягнення поставлених цілей: наскільки повно операційна система дає той результат, заради якого
      її створено, — потрібний обсяг, потрібної якості, у потрібний строк. Відповідає на питання «чи ту
      роботу ми робимо» і не замінюється ефективністю: систему можна дуже економно завантажити випуском,
      який нікому не потрібен.
    synonyms:
      - дієвість операційної системи
      - operational effectiveness
    forms:
      - результативність операційної системи
      - результативності операційної системи
      - результативність
      - результативності
      - результативністю
    seeAlso: [efficiency, productivity, operations-management]

  - id: operations-manager
    term: Операційний менеджер
    definition: >-
      Керівник, який відповідає за ресурси і процеси створення продукту чи послуги: за структурні рішення
      про потужність, розміщення й технологію та за поточні рішення про завантаження, запаси, графіки й
      якість. Працює в циклі «планування — організація — мотивація — контроль — координація» і відповідає
      за результат операційної системи перед іншими функціями підприємства.
    synonyms:
      - менеджер з операцій
      - виробничий менеджер
      - operations manager
    forms:
      - операційний менеджер
      - операційного менеджера
      - операційному менеджеру
      - операційним менеджером
      - операційні менеджери
      - операційних менеджерів
    seeAlso: [operations-management, operations-function, effectiveness]

  - id: scientific-management
    term: Наукова організація праці
    definition: >-
      Підхід, сформований на межі XIX і XX століть Фредеріком Тейлором і його послідовниками: замість
      покладатися на досвід робітника, операцію розкладають на елементарні рухи, вимірюють їх тривалість,
      закріплюють найкращий спосіб виконання нормою й добирають та навчають працівника під цю норму.
      Із цього підходу виросли нормування праці, поділ праці за операціями й сам вимір продуктивності.
    synonyms:
      - науковий менеджмент
      - тейлоризм
      - scientific management
    forms:
      - наукова організація праці
      - наукової організації праці
      - наукову організацію праці
      - науковою організацією праці
      - науковий менеджмент
    seeAlso: [operations-management, productivity, operation]
