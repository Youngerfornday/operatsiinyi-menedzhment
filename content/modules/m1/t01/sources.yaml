  # Стандарти
  - id: iso-9000-2015
    type: standard
    title: 'ISO 9000:2015 Quality management systems — Fundamentals and vocabulary'
    publisher: International Organization for Standardization
    year: 2015
    language: en
    url: https://www.en-standard.eu/iso-9000-2015-quality-management-systems-fundamentals-and-vocabulary/
    checkedAt: '2026-09-22'
    note: 'Джерело процесного підходу (ISO-9000-03) і циклу PDCA (ISO-9000-02) у редакції, ідентично прийнятій в Україні як ДСТУ ISO 9000:2015.'

  - id: iso-22400-1-2014
    type: standard
    title: 'ISO 22400-1:2014 Automation systems and integration — Key performance indicators (KPIs) for manufacturing operations management — Part 1: Overview, concepts and terminology'
    publisher: International Organization for Standardization
    year: 2014
    language: en
    url: https://www.en-standard.eu/iso-22400-1-2014-automation-systems-and-integration-key-performance-indicators-kpis-for-manufacturing-operations-management-part-1-overview-concepts-and-terminology/
    checkedAt: '2026-09-22'
    note: 'Загальна частина серії, яка вводить набір показників операційного управління виробництвом; визначення OEE узято з другої частини серії за кодом ISO-22400-01 бази стандартів. Окремі пункти першої частини в курсі не переказуються — вони не звірені за текстом стандарту.'

