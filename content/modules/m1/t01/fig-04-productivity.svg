<svg xmlns="http://www.w3.org/2000/svg" id="fig-t01-4" class="scheme" viewBox="0 0 640 392" role="img" aria-labelledby="fig-t01-4-title fig-t01-4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t01-4-title">Рисунок 4. Часткова й багатофакторна продуктивність: що стоїть у знаменнику</title>
  <desc id="fig-t01-4-desc">Дві дроби поруч, в обох однаковий чисельник — обсяг випуску за період. Ліворуч часткова продуктивність: у знаменнику один вид ресурсу, наприклад відпрацьовані людино-години; результат вимірюється у виробах на людино-годину, показник легко порахувати й легко тлумачити. Праворуч багатофакторна продуктивність: у знаменнику сума кількох ресурсів — праці, матеріалів, енергії та утримання обладнання, зведених до гривень; результат вимірюється у виробах на тисячу гривень витрачених ресурсів. Унизу карміновим виділено попередження: заміна одного ресурсу іншим піднімає часткову продуктивність за зекономленим ресурсом і може водночас опустити багатофакторну, бо новий ресурс теж потрапляє у знаменник. Стрілка від лівої дроби до правої підписана: часткова продуктивність не підсумовується в багатофакторну — це різні вимірювання.</desc>
  <style>
    #fig-t01-4 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-4 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t01-4 .t { fill: var(--ink, #0f1c2e); font-size: 14.5px; font-weight: 650; }
    #fig-t01-4 .s { fill: var(--ink-2, #445570); font-size: 12.5px; }
    #fig-t01-4 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t01-4 .bar { stroke: var(--ink, #0f1c2e); stroke-width: 1.5; }
    #fig-t01-4 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t01-4 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t01-4 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-4 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t01-4 .exam { stroke: var(--err, #b42318); }
    #fig-t01-4 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12.5px; font-weight: 600; }
    #fig-t01-4 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t01-4 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t01-4-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <text class="t" x="160" y="30" text-anchor="middle">Часткова продуктивність</text>
  <text class="t" x="480" y="30" text-anchor="middle">Багатофакторна продуктивність</text>

  <rect class="box box-owner" x="32" y="46" width="256" height="40" rx="6"/>
  <text class="t" x="160" y="71" text-anchor="middle">Обсяг випуску за період</text>
  <line class="bar" x1="24" y1="100" x2="296" y2="100"/>

  <rect class="box" x="32" y="112" width="256" height="72" rx="6"/>
  <text class="t" x="160" y="140" text-anchor="middle">Один вид ресурсу</text>
  <text class="s" x="160" y="162" text-anchor="middle">наприклад, відпрацьовані</text>
  <text class="s" x="160" y="178" text-anchor="middle">людино-години</text>

  <text class="s" x="160" y="208" text-anchor="middle">вироби на людино-годину</text>
  <text class="lbl" x="160" y="228" text-anchor="middle">легко порахувати, легко тлумачити</text>

  <rect class="box box-owner" x="352" y="46" width="256" height="40" rx="6"/>
  <text class="t" x="480" y="71" text-anchor="middle">Обсяг випуску за період</text>
  <line class="bar" x1="344" y1="100" x2="616" y2="100"/>

  <rect class="box" x="352" y="112" width="256" height="72" rx="6"/>
  <text class="t" x="480" y="138" text-anchor="middle">Сума кількох ресурсів</text>
  <text class="s" x="480" y="158" text-anchor="middle">праця + матеріали + енергія +</text>
  <text class="s" x="480" y="176" text-anchor="middle">утримання обладнання, у гривнях</text>

  <text class="s" x="480" y="208" text-anchor="middle">вироби на тисячу гривень ресурсів</text>
  <text class="lbl" x="480" y="228" text-anchor="middle">показує віддачу системи загалом</text>

  <path class="arrow" marker-end="url(#fig-t01-4-arr)" d="M300 148 L348 148"/>
  <text class="lbl" x="324" y="136" text-anchor="middle">різні</text>
  <text class="lbl" x="324" y="176" text-anchor="middle">виміри</text>

  <rect class="box exam" x="32" y="256" width="576" height="96" rx="6"/>
  <text class="t" x="320" y="282" text-anchor="middle">Чому висновки розходяться</text>
  <text class="exam-t" x="320" y="302" text-anchor="middle">Заміна одного ресурсу іншим піднімає часткову продуктивність</text>
  <text class="exam-t" x="320" y="320" text-anchor="middle">за зекономленим ресурсом і може водночас опустити багатофакторну:</text>
  <text class="exam-t" x="320" y="338" text-anchor="middle">новий ресурс теж стоїть у знаменнику.</text>

  <circle class="refc" cx="32" cy="66" r="11"/><text class="refn" x="32" y="70">1</text>
  <circle class="refc" cx="32" cy="132" r="11"/><text class="refn" x="32" y="136">2</text>
  <circle class="refc" cx="608" cy="132" r="11"/><text class="refn" x="608" y="136">3</text>
  <circle class="refc exam" cx="32" cy="276" r="11"/><text class="refn exam-n" x="32" y="280">4</text>
</svg>
