<svg xmlns="http://www.w3.org/2000/svg" id="fig-t04-3" class="scheme" viewBox="-4 0 768 300" role="img" aria-labelledby="fig-t04-3-title fig-t04-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t04-3-title">Рисунок 3. Типи операційних процесів за роллю у створенні продукту</title>
  <desc id="fig-t04-3-desc">Операційний процес підприємства розгалужується на три типи. Основні процеси, виділені карміновим, безпосередньо перетворюють предмет праці на готову продукцію: тут — ланцюжок виплавки й розливання сталі з трьох послідовних переділів, після якого предмет праці стає заготовкою. Допоміжні процеси виробляють те, що фізично споживає основний процес: власна вапняна фабрика постачає вапно, власна кабельна лінія — електроенергію, переробка металобрухту готує сировину. Обслуговуючі процеси нічого не виробляють, а лише рухають, зберігають чи перевіряють: транспортування заготовок, складування сировини, контроль якості готової продукції. Знизу підпис: допоміжний процес виробляє ресурс для основного, обслуговуючий — лише обслуговує потік, не виробляючи нічого.</desc>
  <style>
    #fig-t04-3 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-3 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t04-3 .t { fill: var(--ink, #0f1c2e); font-size: 13.5px; font-weight: 650; }
    #fig-t04-3 .s { fill: var(--ink-2, #445570); font-size: 10.5px; }
    #fig-t04-3 .lbl { fill: var(--ink-2, #445570); font-size: 11px; }
    #fig-t04-3 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t04-3 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t04-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t04-3 .exam { stroke: var(--err, #b42318); }
    #fig-t04-3 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 13.5px; font-weight: 650; }
    #fig-t04-3 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t04-3 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
    #fig-t04-3 .exam-s { fill: var(--err-ink, #8f1d14); font-size: 10px; font-weight: 600; }
  </style>

