<svg xmlns="http://www.w3.org/2000/svg" id="fig-t04-3" class="scheme" viewBox="0 0 640 380" role="img" aria-labelledby="fig-t04-3-title fig-t04-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t04-3-title">Рисунок 3. Типи операційних процесів за роллю у створенні продукту</title>
  <desc id="fig-t04-3-desc">Операційний процес підприємства розгалужується на основні й допоміжні процеси. Основні процеси, виділені карміновим, безпосередньо перетворюють предмет праці на готову продукцію: тут — ланцюжок виплавки й розливання сталі з чотирьох послідовних переділів. Допоміжні процеси не створюють продукт самі, а забезпечують основний: власна вапняна фабрика постачає вапно, власна кабельна лінія — електроенергію, переробка металобрухту готує сировину, ремонтна служба підтримує обладнання. Знизу підпис: зупинка будь-якого допоміжного процесу зрештою зупиняє основний.</desc>
  <style>
    #fig-t04-3 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-3 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t04-3 .t { fill: var(--ink, #0f1c2e); font-size: 14px; font-weight: 650; }
    #fig-t04-3 .s { fill: var(--ink-2, #445570); font-size: 11px; }
    #fig-t04-3 .lbl { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t04-3 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t04-3 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t04-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t04-3 .exam { stroke: var(--err, #b42318); }
    #fig-t04-3 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 11.5px; font-weight: 600; }
    #fig-t04-3 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t04-3 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t04-3-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box box-owner" x="220" y="10" width="200" height="40" rx="6"/>
  <text class="t" x="320" y="35" text-anchor="middle">Операційний процес</text>

  <path class="arrow" d="M280 50 L170 90"/>
  <path class="arrow" d="M360 50 L470 90"/>

  <rect class="box exam" x="70" y="94" width="200" height="40" rx="6"/>
  <text class="exam-t" x="170" y="119" text-anchor="middle">Основні процеси</text>

  <rect class="box" x="370" y="94" width="200" height="40" rx="6"/>
  <text class="t" x="470" y="119" text-anchor="middle">Допоміжні процеси</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M170 134 L170 156"/>

  <rect class="box exam" x="24" y="160" width="80" height="46" rx="5"/>
  <text class="exam-t" x="64" y="180" text-anchor="middle" font-size="10">Електродугова</text>
  <text class="exam-t" x="64" y="192" text-anchor="middle" font-size="10">піч</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M104 183 L120 183"/>
  <rect class="box exam" x="124" y="160" width="80" height="46" rx="5"/>
  <text class="exam-t" x="164" y="180" text-anchor="middle" font-size="10">Піч-ківш,</text>
  <text class="exam-t" x="164" y="192" text-anchor="middle" font-size="10">вакууматор</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M204 183 L220 183"/>
  <rect class="box exam" x="224" y="160" width="80" height="46" rx="5"/>
  <text class="exam-t" x="264" y="180" text-anchor="middle" font-size="10">Розливання</text>
  <text class="exam-t" x="264" y="192" text-anchor="middle" font-size="10">на МБЛЗ</text>

  <text class="s" x="164" y="222" text-anchor="middle">виплавка й розливання сталі — предмет праці стає заготовкою</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M420 134 L360 156"/>
  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M470 134 L470 156"/>
  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M520 134 L580 156"/>

  <rect class="box" x="300" y="160" width="120" height="46" rx="5"/>
  <text class="s" x="360" y="180" text-anchor="middle">Вапняна фабрика</text>
  <text class="s" x="360" y="194" text-anchor="middle">(вапно для печі)</text>

  <rect class="box" x="410" y="160" width="120" height="46" rx="5"/>
  <text class="s" x="470" y="180" text-anchor="middle">Кабельна лінія</text>
  <text class="s" x="470" y="194" text-anchor="middle">330 кВ (енергія)</text>

  <rect class="box" x="520" y="160" width="120" height="46" rx="5"/>
  <text class="s" x="580" y="180" text-anchor="middle">Переробка</text>
  <text class="s" x="580" y="194" text-anchor="middle">металобрухту</text>

  <text class="s" x="470" y="222" text-anchor="middle">ресурси, яких немає в готовій заготовці, але без яких піч не працює</text>

  <text class="lbl" x="320" y="256" text-anchor="middle">зупинка будь-якого допоміжного процесу рано чи пізно зупиняє основний</text>

  <circle class="refc exam" cx="70" cy="94" r="11"/><text class="refn exam-n" x="70" y="98">1</text>
  <circle class="refc" cx="370" cy="94" r="11"/><text class="refn" x="370" y="98">2</text>
  <circle class="refc" cx="300" cy="160" r="11"/><text class="refn" x="300" y="164">3</text>
</svg>
