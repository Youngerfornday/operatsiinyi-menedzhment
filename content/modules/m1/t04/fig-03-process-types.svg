    </marker>
  </defs>

  <rect class="box box-owner" x="280" y="8" width="200" height="38" rx="6"/>
  <text class="t" x="380" y="32" text-anchor="middle">Операційний процес</text>

  <path class="arrow" d="M312 46 L126 90"/>
  <path class="arrow" d="M380 46 L380 90"/>
  <path class="arrow" d="M448 46 L634 90"/>

  <rect class="box exam" x="10" y="90" width="233" height="38" rx="6"/>
  <text class="exam-t" x="126" y="114" text-anchor="middle">Основні процеси</text>

  <rect class="box" x="263" y="90" width="234" height="38" rx="6"/>
  <text class="t" x="380" y="114" text-anchor="middle">Допоміжні процеси</text>

  <rect class="box" x="517" y="90" width="233" height="38" rx="6"/>
  <text class="t" x="634" y="114" text-anchor="middle">Обслуговуючі процеси</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M126 128 L126 150"/>

  <rect class="box exam" x="10" y="154" width="71" height="58" rx="5"/>
  <text class="exam-s" x="45.5" y="178" text-anchor="middle">Електро-</text>
  <text class="exam-s" x="45.5" y="192" text-anchor="middle">дугова піч</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M81 183 L89 183"/>
  <rect class="box exam" x="93" y="154" width="71" height="58" rx="5"/>
  <text class="exam-s" x="128.5" y="178" text-anchor="middle">Піч-ківш,</text>
  <text class="exam-s" x="128.5" y="192" text-anchor="middle">вакууматор</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M164 183 L172 183"/>
  <rect class="box exam" x="176" y="154" width="67" height="58" rx="5"/>
  <text class="exam-s" x="209.5" y="178" text-anchor="middle">Розливання</text>
  <text class="exam-s" x="209.5" y="192" text-anchor="middle">на МБЛЗ</text>

  <text class="s" x="126" y="232" text-anchor="middle">предмет праці</text>
  <text class="s" x="126" y="245" text-anchor="middle">стає заготовкою</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M300 128 L300 150"/>
  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M380 128 L380 150"/>
  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M460 128 L460 150"/>

  <rect class="box" x="263" y="154" width="71" height="58" rx="5"/>
  <text class="s" x="298.5" y="176" text-anchor="middle">Вапняна</text>
  <text class="s" x="298.5" y="189" text-anchor="middle">фабрика</text>
  <text class="s" x="298.5" y="202" text-anchor="middle">(вапно)</text>

  <rect class="box" x="345" y="154" width="71" height="58" rx="5"/>
  <text class="s" x="380.5" y="176" text-anchor="middle">Кабельна</text>
  <text class="s" x="380.5" y="189" text-anchor="middle">лінія 330 кВ</text>
  <text class="s" x="380.5" y="202" text-anchor="middle">(енергія)</text>

  <rect class="box" x="427" y="154" width="70" height="58" rx="5"/>
  <text class="s" x="462" y="176" text-anchor="middle">Переробка</text>
  <text class="s" x="462" y="189" text-anchor="middle">брухту</text>
  <text class="s" x="462" y="202" text-anchor="middle">(сировина)</text>

  <text class="s" x="380" y="232" text-anchor="middle">виробляють ресурс,</text>
  <text class="s" x="380" y="245" text-anchor="middle">який споживає піч</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M554 128 L554 150"/>
  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M634 128 L634 150"/>
  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M714 128 L714 150"/>

  <rect class="box" x="517" y="154" width="74" height="58" rx="5"/>
  <text class="s" x="554" y="176" text-anchor="middle">Транспорту-</text>
  <text class="s" x="554" y="189" text-anchor="middle">вання</text>
  <text class="s" x="554" y="202" text-anchor="middle">заготовок</text>

  <rect class="box" x="597" y="154" width="74" height="58" rx="5"/>
  <text class="s" x="634" y="176" text-anchor="middle">Складування</text>
  <text class="s" x="634" y="189" text-anchor="middle">сировини</text>

  <rect class="box" x="677" y="154" width="73" height="58" rx="5"/>
  <text class="s" x="713.5" y="176" text-anchor="middle">Контроль</text>
  <text class="s" x="713.5" y="189" text-anchor="middle">якості</text>

  <text class="s" x="634" y="232" text-anchor="middle">рухають, зберігають,</text>
  <text class="s" x="634" y="245" text-anchor="middle">перевіряють — нічого не виробляють</text>

  <text class="lbl" x="380" y="272" text-anchor="middle">допоміжний процес виробляє ресурс для основного; обслуговуючий лише обслуговує потік,</text>
  <text class="lbl" x="380" y="286" text-anchor="middle">не виробляючи нічого; зупинка будь-якого з них рано чи пізно зупиняє основний</text>

  <circle class="refc exam" cx="10" cy="90" r="11"/><text class="refn exam-n" x="10" y="94">1</text>
  <circle class="refc" cx="263" cy="90" r="11"/><text class="refn" x="263" y="94">2</text>
