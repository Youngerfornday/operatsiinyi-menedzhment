<svg xmlns="http://www.w3.org/2000/svg" id="fig-t04-3" class="scheme" viewBox="0 0 640 480" role="img" aria-labelledby="fig-t04-3-title fig-t04-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t04-3-title">Рисунок 3. Типи операційних процесів за роллю у створенні продукту</title>
  <desc id="fig-t04-3-desc">Операційний процес підприємства зверху вниз розпадається на три рядки. Перший рядок, виділений карміновим, — основні процеси: електродугова піч, піч-ківш і вакууматор, розливання на МБЛЗ — разом вони перетворюють предмет праці на заготовку. Другий рядок — допоміжні процеси: вапняна фабрика (вапно), кабельна лінія 330 кВ (енергія), переробка брухту (сировина) — кожен виробляє ресурс, який споживає піч. Третій рядок — обслуговуючі процеси: транспортування заготовок, складування сировини, контроль якості — вони рухають, зберігають чи перевіряють, нічого не виробляючи. Знизу підпис: допоміжний процес виробляє ресурс для основного, обслуговуючий — лише обслуговує потік, не виробляючи нічого.</desc>
  <style>
    #fig-t04-3 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-3 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t04-3 .t { fill: var(--ink, #0f1c2e); font-size: 13.5px; font-weight: 650; }
    #fig-t04-3 .s { fill: var(--ink-2, #445570); font-size: 11px; }
    #fig-t04-3 .lbl { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t04-3 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t04-3 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t04-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t04-3 .exam { stroke: var(--err, #b42318); }
    #fig-t04-3 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 13.5px; font-weight: 650; }
    #fig-t04-3 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t04-3 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
    #fig-t04-3 .exam-s { fill: var(--err-ink, #8f1d14); font-size: 11px; }
  </style>

  <defs>
    <marker id="fig-t04-3-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box box-owner" x="220" y="10" width="200" height="38" rx="6"/>
  <text class="t" x="320" y="34" text-anchor="middle">Операційний процес</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M290 48 L76 72"/>

  <!-- Рядок 1: основні процеси -->
  <rect class="box exam" x="16" y="74" width="120" height="66" rx="6"/>
  <text class="exam-t" x="76" y="103" text-anchor="middle">Основні</text>
  <text class="exam-t" x="76" y="117" text-anchor="middle">процеси</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M136 107 L150 107"/>
  <rect class="box exam" x="152" y="74" width="150" height="66" rx="5"/>
  <text class="exam-s" x="227" y="111" text-anchor="middle">Електродугова піч</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M302 107 L310 107"/>
  <rect class="box exam" x="312" y="74" width="150" height="66" rx="5"/>
  <text class="exam-s" x="387" y="111" text-anchor="middle">Піч-ківш, вакууматор</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M462 107 L470 107"/>
  <rect class="box exam" x="472" y="74" width="150" height="66" rx="5"/>
  <text class="exam-s" x="547" y="111" text-anchor="middle">Розливання на МБЛЗ</text>

  <text class="s" x="387" y="158" text-anchor="middle">предмет праці стає заготовкою</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M76 140 L76 198"/>

  <!-- Рядок 2: допоміжні процеси -->
  <rect class="box" x="16" y="200" width="120" height="66" rx="6"/>
  <text class="t" x="76" y="229" text-anchor="middle">Допоміжні</text>
  <text class="t" x="76" y="243" text-anchor="middle">процеси</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M136 233 L150 233"/>
  <rect class="box" x="152" y="200" width="150" height="66" rx="5"/>
  <text class="s" x="227" y="229" text-anchor="middle">Вапняна фабрика</text>
  <text class="s" x="227" y="243" text-anchor="middle">(вапно)</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M302 233 L310 233"/>
  <rect class="box" x="312" y="200" width="150" height="66" rx="5"/>
  <text class="s" x="387" y="229" text-anchor="middle">Кабельна лінія</text>
  <text class="s" x="387" y="243" text-anchor="middle">330 кВ (енергія)</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M462 233 L470 233"/>
  <rect class="box" x="472" y="200" width="150" height="66" rx="5"/>
  <text class="s" x="547" y="229" text-anchor="middle">Переробка брухту</text>
  <text class="s" x="547" y="243" text-anchor="middle">(сировина)</text>

  <text class="s" x="387" y="284" text-anchor="middle">виробляють ресурс, який споживає піч</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M76 266 L76 322"/>

  <!-- Рядок 3: обслуговуючі процеси -->
  <rect class="box" x="16" y="324" width="120" height="66" rx="6"/>
  <text class="t" x="76" y="353" text-anchor="middle">Обслуговуючі</text>
  <text class="t" x="76" y="367" text-anchor="middle">процеси</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M136 357 L150 357"/>
  <rect class="box" x="152" y="324" width="150" height="66" rx="5"/>
  <text class="s" x="227" y="353" text-anchor="middle">Транспортування</text>
  <text class="s" x="227" y="367" text-anchor="middle">заготовок</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M302 357 L310 357"/>
  <rect class="box" x="312" y="324" width="150" height="66" rx="5"/>
  <text class="s" x="387" y="353" text-anchor="middle">Складування</text>
  <text class="s" x="387" y="367" text-anchor="middle">сировини</text>

  <path class="arrow" marker-end="url(#fig-t04-3-arr)" d="M462 357 L470 357"/>
  <rect class="box" x="472" y="324" width="150" height="66" rx="5"/>
  <text class="s" x="547" y="361" text-anchor="middle">Контроль якості</text>

  <text class="s" x="387" y="408" text-anchor="middle">рухають, зберігають,</text>
  <text class="s" x="387" y="422" text-anchor="middle">перевіряють — нічого не виробляють</text>

  <text class="lbl" x="320" y="452" text-anchor="middle">допоміжний процес виробляє ресурс для основного; обслуговуючий лише обслуговує потік,</text>
  <text class="lbl" x="320" y="466" text-anchor="middle">не виробляючи нічого; зупинка будь-якого з них рано чи пізно зупиняє основний</text>

  <circle class="refc exam" cx="16" cy="74" r="11"/><text class="refn exam-n" x="16" y="78">1</text>
  <circle class="refc" cx="16" cy="200" r="11"/><text class="refn" x="16" y="204">2</text>
  <circle class="refc" cx="16" cy="324" r="11"/><text class="refn" x="16" y="328">3</text>
</svg>
