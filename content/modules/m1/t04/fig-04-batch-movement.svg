<svg xmlns="http://www.w3.org/2000/svg" id="fig-t04-4" class="scheme" viewBox="0 0 680 300" role="img" aria-labelledby="fig-t04-4-title fig-t04-4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t04-4-title">Рисунок 4. Тривалість циклу тієї самої партії за трьох видів руху</title>
  <desc id="fig-t04-4-desc">Три горизontальні смуги показують тривалість виробничого циклу однієї й тієї самої партії з шести деталей і тих самих трьох операцій за різних видів руху. Найдовша смуга — послідовний рух, 42 хвилини. Найкоротша, виділена карміновим, — паралельний рух, 30 хвилин. Середня — паралельно-послідовний рух, 34 хвилини. Внизу шкала в хвилинах з кроком 10.</desc>
  <style>
    #fig-t04-4 .box { fill: var(--surface-tint, #eef4fa); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-4 .box.exam { fill: var(--err-tint, #fbe6e3); stroke: var(--err, #b42318); }
    #fig-t04-4 .t { fill: var(--ink, #0f1c2e); font-size: 13px; font-weight: 650; }
    #fig-t04-4 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 13px; font-weight: 650; }
    #fig-t04-4 .s { fill: var(--ink-2, #445570); font-size: 11px; }
    #fig-t04-4 .lbl { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t04-4 .val { fill: var(--ink, #0f1c2e); font-size: 13px; font-weight: 700; }
    #fig-t04-4 .exam-val { fill: var(--err-ink, #8f1d14); font-size: 13px; font-weight: 700; }
    #fig-t04-4 .axis { stroke: var(--ink-2, #445570); stroke-width: 1.25; }
    #fig-t04-4 .grid { stroke: var(--ink-2, #445570); stroke-width: 0.75; opacity: 0.35; }
    #fig-t04-4 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-4 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t04-4 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t04-4 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <text class="t" x="150" y="24" text-anchor="start">n = 6 деталей, три операції (2, 1 і 4 хв), передавальна партія p = 2</text>

  <line class="grid" x1="150" y1="46" x2="150" y2="266"/>
  <line class="grid" x1="250" y1="46" x2="250" y2="266"/>
  <line class="grid" x1="350" y1="46" x2="350" y2="266"/>
  <line class="grid" x1="450" y1="46" x2="450" y2="266"/>
  <line class="grid" x1="550" y1="46" x2="550" y2="266"/>
  <line class="grid" x1="650" y1="46" x2="650" y2="266"/>

  <text class="s" x="150" y="46" text-anchor="middle">0</text>
  <text class="s" x="250" y="46" text-anchor="middle">10</text>
  <text class="s" x="350" y="46" text-anchor="middle">20</text>
  <text class="s" x="450" y="46" text-anchor="middle">30</text>
  <text class="s" x="550" y="46" text-anchor="middle">40</text>
  <text class="s" x="650" y="46" text-anchor="middle">50</text>

  <text class="t" x="16" y="82" text-anchor="start">Послідовний</text>
  <rect class="box" x="150" y="60" width="420" height="36" rx="4"/>
  <text class="val" x="578" y="83" text-anchor="start">42 хв</text>

  <text class="t" x="16" y="160" text-anchor="start">Паралельно-</text>
  <text class="t" x="16" y="176" text-anchor="start">послідовний</text>
  <rect class="box" x="150" y="138" width="340" height="36" rx="4"/>
  <text class="val" x="498" y="161" text-anchor="start">34 хв</text>

  <text class="exam-t" x="16" y="238" text-anchor="start">Паралельний</text>
  <rect class="box exam" x="150" y="216" width="300" height="36" rx="4"/>
  <text class="exam-val" x="458" y="239" text-anchor="start">30 хв</text>

  <line class="axis" x1="150" y1="266" x2="650" y2="266"/>
  <text class="lbl" x="400" y="284" text-anchor="middle">та сама партія й ті самі норми часу — розрізняється лише вид руху в часі</text>

  <circle class="refc" cx="150" cy="60" r="11"/><text class="refn" x="150" y="64">1</text>
  <circle class="refc" cx="150" cy="138" r="11"/><text class="refn" x="150" y="142">2</text>
  <circle class="refc exam" cx="150" cy="216" r="11"/><text class="refn exam-n" x="150" y="220">3</text>
</svg>
