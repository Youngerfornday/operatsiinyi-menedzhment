# Глосарій теми 4. Назви термінів мають дослівно збігатися з реєстром course.yaml (glossaryTerms, topic: t04).
# Визначення — робочі формулювання курсу; розрахункові співвідношення беруться з docs/research/formula-baseline.md (PC-01, PC-02, PC-03).
topic: t04
terms:
  - id: operations-activity
    term: Операційна діяльність
    definition: >-
      Діяльність підприємства, яка охоплює ресурси, процеси й результати операційної системи: залучення
      матеріальних, трудових, енергетичних та інформаційних ресурсів, їх перетворення операційним процесом
      і одержання продукції чи послуги, цінної для споживача. Три складові нерозривні — без ресурсу процес
      не почнеться, без процесу ресурс не стане результатом, а результат без процесу неможливо виміряти.
    synonyms:
      - виробничо-господарська діяльність
      - операційна діяльність підприємства
      - operations activity
    forms:
      - операційна діяльність
      - операційної діяльності
      - операційну діяльність
      - операційною діяльністю
    seeAlso: [operations-process, production-cycle]

  - id: operations-process
    term: Операційний процес
    definition: >-
      Сукупність взаємопов’язаних основних, допоміжних і обслуговуючих процесів праці й знарядь праці,
      спрямованих на перетворення предмета праці на готову продукцію чи послугу. Динамічна основа
      функціонування операційної системи: система задає статичний потенціал (ресурси, потужність, структуру),
      а операційний процес щоразу реалізує цей потенціал у конкретному потоці робіт.
    synonyms:
      - виробничий процес
      - операційний процес організації
      - operations process
    forms:
      - операційний процес
      - операційного процесу
      - операційному процесу
      - операційним процесом
      - операційні процеси
      - операційних процесів
    seeAlso: [operations-activity, main-process, auxiliary-process]

  - id: main-process
    term: Основний процес
    definition: >-
      Процес, у ході якого предмет праці безпосередньо змінює форму, розміри, внутрішні властивості чи
      стан і перетворюється на готову продукцію операційної системи. Сукупність основних процесів утворює
      профіль підприємства: саме за ними визначають, що підприємство виробляє.
    synonyms:
      - основний виробничий процес
      - профільний процес
      - main process
    forms:
      - основний процес
      - основного процесу
      - основному процесу
      - основним процесом
      - основні процеси
    seeAlso: [auxiliary-process, operations-process]

  - id: auxiliary-process
    term: Допоміжний процес
    definition: >-
      Процес, який сам не перетворює предмет праці на продукцію операційної системи, а виробляє чи готує
      те, що фізично споживає основний процес: оснащення та інструмент, енергію, відремонтоване обладнання.
      На відміну від обслуговуючих процесів (транспортування, складування, контроль якості), які лише
      рухають, зберігають чи перевіряють, допоміжний процес щоразу постачає ресурс, який основний процес
      витрачає. Ресурси, які дає допоміжний процес, часто не видно в готовому продукті, але без них основний
      процес зупиняється.
    synonyms:
      - забезпечувальний процес
      - auxiliary process
    forms:
      - допоміжний процес
      - допоміжного процесу
      - допоміжному процесу
      - допоміжним процесом
      - допоміжні процеси
    seeAlso: [main-process, operations-process]

  - id: proportionality
    term: Пропорційність
    definition: >-
      Принцип організації операційного процесу: узгодженість пропускної здатності суміжних ланок процесу
      між собою. Ділянка, потужніша за сусідню, не збільшує кінцевий випуск, а лише накопичує запас перед
      вузьким місцем; порушення пропорційності видно за чергою незавершеного виробництва перед конкретною
      операцією.
    synonyms:
      - пропорційність потужностей
      - proportionality
    forms:
      - пропорційність
      - пропорційності
      - пропорційністю
    seeAlso: [continuity, parallelism]

  - id: continuity
    term: Безперервність
    definition: >-
      Принцип організації операційного процесу: скорочення або усунення перерв у русі предмета праці —
      часу пролежування між операціями, очікування транспорту чи простою через незбалансовану потужність.
      Вимірюється часткою робочого часу в загальній тривалості виробничого циклу.
    synonyms:
      - безперервність процесу
      - continuity
    forms:
      - безперервність
      - безперервності
      - безперервністю
    seeAlso: [proportionality, production-cycle]

  - id: parallelism
    term: Паралельність
    definition: >-
      Принцип організації операційного процесу: одночасне виконання частин процесу — кількох операцій над
      різними деталями партії або кількох елементів однієї операції. Паралельність скорочує тривалість
      виробничого циклу, але вимагає синхронізації суміжних робочих місць у часі.
    synonyms:
      - паралельне виконання робіт
      - parallelism
    forms:
      - паралельність
      - паралельності
      - паралельністю
    seeAlso: [parallel-movement, continuity]

  - id: straight-flow
    term: Прямоточність
    definition: >-
      Принцип організації операційного процесу: рух предмета праці найкоротшим шляхом, без зворотних і
      зустрічних переміщень між операціями. Забезпечується розміщенням робочих місць у послідовності
      технологічних операцій, а не за принципом однорідного обладнання.
    synonyms:
      - прямоточність руху
      - straight-line flow
    forms:
      - прямоточність
      - прямоточності
      - прямоточністю
    seeAlso: [proportionality, rhythm]

  - id: rhythm
    term: Ритмічність
    definition: >-
      Принцип організації операційного процесу: рівномірний випуск однакових обсягів продукції за рівні
      проміжки часу і відповідне рівномірне завантаження робочих місць. Порушення ритмічності — це план,
      виконаний авралом в останні дні періоду; воно коштує понаднормових, браку й зірваних строків.
    synonyms:
      - ритмічність випуску
      - rhythm of production
    forms:
      - ритмічність
      - ритмічності
      - ритмічністю
    seeAlso: [proportionality, continuity]

  - id: production-cycle
    term: Виробничий цикл
    definition: >-
      Календарний період часу, протягом якого предмет праці (партія деталей) проходить усі стадії
      операційного процесу — від запуску у виробництво на першій операції до здавання готової продукції
      на складі. Охоплює час виконання технологічних і допоміжних операцій та час перерв. Тривалість циклу
      залежить від виду руху партії в часі: послідовного, паралельного чи паралельно-послідовного.
    synonyms:
      - тривалість виробничого циклу
      - виробничий цикл партії
      - production cycle
    forms:
      - виробничий цикл
      - виробничого циклу
      - виробничому циклу
      - виробничим циклом
      - виробничі цикли
    seeAlso: [sequential-movement, parallel-movement, parallel-sequential-movement]

  - id: sequential-movement
    term: Послідовний рух партії
    definition: >-
      Вид руху партії деталей у часі: кожна наступна операція розпочинається лише після завершення обробки
      всієї партії на попередній операції. Найпростіший в організації та найдовший за тривалістю циклу з
      трьох видів руху, бо кожна деталь партії чекає обробки всіх інших перед переходом далі.
    synonyms:
      - послідовний вид руху
      - sequential movement
    forms:
      - послідовний рух партії
      - послідовного руху партії
      - послідовному руху партії
      - послідовним рухом партії
    seeAlso: [production-cycle, parallel-movement]

  - id: parallel-movement
    term: Паралельний рух партії
    definition: >-
      Вид руху партії деталей у часі: деталі передаються з операції на операцію транспортними (передавальними)
      партіями одразу після обробки, тому різні операції можуть виконуватися одночасно над різними частинами
      партії. Дає найкоротшу тривалість циклу з трьох видів руху, але за різної тривалості суміжних операцій
      спричиняє простої робочих місць.
    synonyms:
      - паралельний вид руху
      - parallel movement
    forms:
      - паралельний рух партії
      - паралельного руху партії
      - паралельному руху партії
      - паралельним рухом партії
    seeAlso: [production-cycle, sequential-movement, parallel-sequential-movement]

  - id: parallel-sequential-movement
    term: Паралельно-послідовний рух партії
    definition: >-
      Вид руху партії деталей у часі, що поєднує ознаки послідовного й паралельного: кожна операція
      обробляє всю партію без перерв, а на наступну операцію деталі передають транспортними партіями,
      щойно це можливо без простою обладнання. Тривалість циклу — проміжна між послідовним
      і паралельним рухом; на практиці це найпоширеніший компроміс.
    synonyms:
      - змішаний рух партії
      - паралельно-послідовний вид руху
      - mixed movement
    forms:
      - паралельно-послідовний рух партії
      - паралельно-послідовного руху партії
      - паралельно-послідовному руху партії
      - паралельно-послідовним рухом партії
    seeAlso: [production-cycle, sequential-movement, parallel-movement]
