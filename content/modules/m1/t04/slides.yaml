# Презентація теми 4. Текст слайдів стислий: повний виклад — у lecture.mdx, пояснення — у нотатках.
# Кожне число слайда має бути в лонгріді теми й мати джерело зі sources.yaml.
topic: t04
slides:
  - id: title
    type: title
    subtitle: Модуль 1. Теоретичні основи організації та регулювання операційної діяльності
    notes: >-
      Вступ через приклад двох майстрів: та сама партія з шести деталей, ті самі три операції й норми часу,
      а тривалість циклу — 42 хвилини в одного і 30 у другого. Запитайте аудиторію, як таке можливо, перш
      ніж називати причину — різний вид руху партії в часі.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після теми
    notes: >-
      Три результати теми: перший і другий понятійні — пояснити склад операційної діяльності й застосувати
      принципи організації процесу; третій розрахунковий — порахувати тривалість циклу трьома способами й
      обрати вид руху. Запитайте, чи стикалася аудиторія з поняттям «виробничий цикл» на практиці.

  - id: s01-section
    type: section
    number: 1
    title: Сутність операційної діяльності — ресурси, процеси, результати
    notes: >-
      Перше питання теми. Операційна діяльність — єдність трьох нерозривних складових: без ресурсу процес
      не почнеться, без процесу ресурс не стане результатом. Запитайте, що станеться з результатом, якщо
      порахувати лише ресурси, які підприємство закупило за квартал.

  - id: s01-figure
    type: figure
    title: Операційна діяльність — ресурси, процес, результати
    figure: fig-01-activity.svg
    caption: Вихід кожного переділу процесу є входом наступного, тому результат вимірний на кожному з них.
    sources: [starchenko-kalinko-kosach-2020]
    notes: >-
      Наголосіть: результат вимірний на кожному переділі, а не лише на виході всієї системи. Приклад:
      концентрат — проміжний, а не кінцевий результат, і його теж можна виміряти окремо. Запитайте, який
      другорядний результат процесу аудиторія назвала б на знайомому підприємстві.

  - id: s01-resources
    type: bullets
    title: Склад ресурсів операційної діяльності
    bullets:
      - Матеріальні ресурси — сировина, матеріали, комплектувальні.
      - Трудові ресурси — персонал підприємства.
      - Енергетичні й інформаційні ресурси — енергія, норми, креслення, замовлення.
      - Без ресурсу операційний процес не має з чого починатися.
      - Результат без процесу неможливо ні отримати, ні виміряти.
    sources: [starchenko-kalinko-kosach-2020]
    notes: >-
      Склад ресурсів повторює вхід операційної системи з теми 1, але тут акцент на тому, що жодну з трьох
      складових операційної діяльності не можна вивчати окремо. Запитайте, яку категорію ресурсу найлегше
      недооцінити на практиці.

  - id: s01-labour
    type: bullets
    title: Трудові ресурси — управлінські й виробничі
    bullets:
      - Управлінські — виконують управлінські функції, переважно розумова праця.
      - Виробничі — виконавці, які безпосередньо реалізують плани підприємства.
      - Склад і кваліфікація виробничих ресурсів визначають, скільки операцій підприємство виконає за період.
      - Від управлінських ресурсів залежить, наскільки добре цей потенціал використано.
    sources: [starchenko-kalinko-kosach-2020]
    notes: >-
      Цей поділ трудових ресурсів прямо стосується операційної діяльності: виробничі ресурси — це виконавці
      операцій, управлінські — ті, хто планує й координує ці операції. Запитайте, до якої категорії
      аудиторія віднесла б майстра дільниці.

  - id: s01-case-ferrexpo
    type: case
    title: 'Ferrexpo: вимірюваний вихід на кожному переділі'
    case: ferrexpo
    facts:
      - 'Руда з умістом заліза 25–30% Fe → концентрат 65%+ Fe → окатиші 65% чи 67% Fe за 1300 °C.'
      - 'За 2025 р. сумарне товарне виробництво — 6 141 тис. т: 3 221 тис. т окатишів і 2 920 тис. т концентрату.'
      - Виручка знизилася на 16% до 787 млн дол., збиток — 224 млн дол.
      - 'Компанія прямо пояснює зсув міксу: призупинення відшкодування ПДВ зменшує залишок за концентратом.'
      - Падіння окатишів на 47% не означає падіння всього виробництва — сумарний випуск знизився лише на 9%.
    question: Що саме в цьому ланцюжку можна виміряти на кожному переділі, а що — лише на виході всієї системи?
    sources: [ferrexpo-poltava-operations, ferrexpo-fy2025-results]
    notes: >-
      Ключ до розбору: кожен переділ (руда, концентрат, окатиші) має власний вимірний вихід, тому компанія
      здатна свідомо змістити мікс між переділами без зупинки процесу. Межа кейсу: номінальна потужність
      35–40 млн т руди на рік — дані 2021 р., не придатні для оцінки поточного завантаження. Запитайте, чи
      можна за цими даними порахувати продуктивність праці підприємства.

  - id: s02-section
    type: section
    number: 2
    title: Операційні процеси як динамічна основа операційної системи
    notes: >-
      Друге питання теми. Система задає статичний потенціал, процес щоразу реалізує його в конкретному
      потоці робіт. Приклад: та сама дільниця здатна пропустити різні процеси залежно від замовлення.
      Запитайте, чим структура підрозділу відрізняється від процесу, який у ньому щодня відбувається.

  - id: s02-process
    type: bullets
    title: Операційний процес — визначення і межа з операційною системою
    bullets:
      - Операційний процес — сукупність основних, допоміжних і обслуговуючих процесів праці.
      - Система задає статичний потенціал; процес щоразу реалізує його в потоці робіт.
      - Та сама система здатна пропустити крізь себе різні операційні процеси.
      - Заміна одного ресурсу здатна перебудувати сам процес, а не лише його швидкість.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Наголосіть на різниці «система — процес»: студенти часто плутають статичну структуру з динамічним
      потоком робіт усередині неї. Запитайте, чи можна виміряти операційний процес без операційної системи.

  - id: s02-businessprocess
    type: bullets
    title: Процес як мережа з власником і споживачем
    bullets:
      - 'На вході процесу — один чи більше ресурсів, на виході — продукт, цінний для споживача.'
      - У процесу є власник, який відповідає за ресурси й результат.
      - Вихід одного процесу стає входом іншого — процес має внутрішнього або зовнішнього споживача.
      - Операційний процес зручно бачити як мережу процесів, а не один суцільний потік.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Приклад мережі: цех обробки — постачальник для складального цеху, і складальний цех — його внутрішній
      споживач. Запитайте, хто є «споживачем» операції контролю якості на знайомому виробництві.

  - id: s02-case-amazon
    type: case
    title: 'Amazon fulfillment: заміна ресурсу змінює процес'
    case: amazon-fulfillment
    facts:
      - 'Мережа охоплює понад 300 центрів виконання замовлень, компанія повідомила про мільйонного робота.'
      - 'Система DeepFleet, за заявою компанії, прискорює переміщення роботів приблизно на 10%.'
      - 'Робот Hercules підвозить стелаж масою до 567 кг до нерухомого робочого місця (goods-to-person).'
      - Це змінює маршрут і послідовність операцій комплектації, а не лише швидкість того самого процесу.
      - 'За переказом звіту профспілкової коаліції на основі даних до OSHA: 6,6 травми на 100 працівників проти 3,2 на інших складах.'
    question: Що саме змінюється в самому процесі комплектації, коли робот переміщує товар до працівника?
    sources: [amazon-robotics-facts, amazon-million-robots, amazon-injury-report-cnbc]
    notes: >-
      Ключ до розбору: person-to-goods і goods-to-person — два різні операційні процеси з різним маршрутом
      предмета праці, а не одна й та сама швидша версія. Межа кейсу: продуктивність праці на людино-годину
      компанія не розкриває. Запитайте, чи довела б кількість роботів саму собою вищу продуктивність.

  - id: s03-section
    type: section
    number: 3
    title: Принципи організації та складність операційних процесів
    notes: >-
      Третє питання теми. П’ять принципів мають вимірне відображення і суперечать один одному. Приклад:
      безперервність вимагає запасу, ощадливість — його скорочення. Запитайте, яким принципом аудиторія
      пожертвувала б першою на знайомому виробництві.

  - id: s03-figure
    type: figure
    title: П’ять принципів організації операційного процесу
    figure: fig-02-principles.svg
    caption: Кожен принцип має вимірне відображення вздовж єдиної лінії потоку предмета праці.
    sources: [kushniruk-2017]
    notes: >-
      Пройдіть станціями зліва направо: пропорційність, безперервність, паралельність (виділена
      карміновим), прямоточність, ритмічність. Приклад: розрив лінії на другій станції — це перерва в русі
      предмета праці. Запитайте, яку станцію найлегше порушити ненавмисно.

  - id: s03-principles
    type: bullets
    title: Що саме вимірює кожен принцип
    bullets:
      - Пропорційність — узгодженість пропускної здатності суміжних ланок.
      - Безперервність — частка робочого часу в загальній тривалості циклу.
      - Паралельність — одночасне виконання частин процесу.
      - Прямоточність — найкоротший шлях предмета праці без зворотних переміщень.
      - Ритмічність — рівномірний випуск за рівні проміжки часу.
    sources: [kushniruk-2017]
    notes: >-
      Наголосіть: потужніша сусідня ланка не збільшує випуск, а лише нарощує чергу — це порушення
      пропорційності в чистому вигляді. Запитайте, за яким числом на звичайному виробництві видно
      порушення ритмічності.

  - id: s03-complexity
    type: bullets
    title: Складність операційного процесу
    bullets:
      - Зростає з кількістю операцій і переділів процесу.
      - Зростає з різноманітністю маршрутів, якими різні деталі проходять процес.
      - Зростає зі ступенем диференціації операцій — більше передач і черг.
      - Зростає з кількістю паралельних гілок, які треба синхронізувати.
      - Складний процес не гірший за простий, але дорожчий у координації.
    sources: [kushniruk-2017]
    notes: >-
      Складність — окрема від принципів характеристика. Приклад: чим більше гілок процесу, тим дорожче
      коштує порушення пропорційності й безперервності. Запитайте, який із чотирьох факторів складності
      найважче поміряти на практиці.

  - id: s04-section
    type: section
    number: 4
    title: Типи операційних процесів та їх ознаки
    notes: >-
      Четверте питання теми. Основний процес перетворює предмет праці на продукт, допоміжний — забезпечує
      основний. Приклад: ремонт обладнання не робить деталь сам, але без нього дільниця зупиниться.
      Запитайте, до якого типу належить контроль якості готової продукції.

  - id: s04-figure
    type: figure
    title: Основні й допоміжні процеси
    figure: fig-03-process-types.svg
    caption: Основний процес перетворює предмет праці на продукт; допоміжні забезпечують його безперебійний перебіг.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Приклад з дерева: виплавка й розливання сталі — основний процес; вапняна фабрика, кабельна лінія,
      переробка брухту — допоміжні. Запитайте, чи видно допоміжні ресурси в готовій заготовці.

  - id: s04-other-axes
    type: bullets
    title: Інші ознаки класифікації процесів
    bullets:
      - За безперервністю — безперервні й дискретні.
      - За ступенем автоматизації — ручні, механізовані, автоматизовані, автоматичні.
      - За характером номенклатури — одиничні, серійні, масові.
      - Ознаки не взаємовиключні — один процес описують одразу за кількома з них.
    sources: [slack-brandon-jones-2021]
    notes: >-
      Наголосіть: кожна ознака впливає на те, які принципи з попереднього розділу критичніші саме для цього
      процесу. Запитайте, яким одиничне виробництво відрізняється від масового за принципом прямоточності.

  - id: s04-case-interpipe
    type: case
    title: 'Інтерпайп Сталь: ресурси, яких не видно в заготовці'
    case: interpipe-steel
    facts:
      - 'Електродугова піч: місткість 186 т, випуск 160 т, тривалість плавки 53 хв.'
      - 'Дві машини лиття заготовки: 770 плюс 550, тобто 1 320 тис. т на рік — майже точно проєктна потужність 1,32 млн т.'
      - Власна кабельна лінія 330 кВ довжиною 12,8 км забезпечує завод електроенергією.
      - Власна вапняна фабрика постачає вапно, потрібне електродуговій печі.
      - Переробні комплекси продуктивністю 10–25 тис. т на місяць готують металобрухт.
    question: Чому зупинка вапняної фабрики чи кабельної лінії зрештою зупиняє виплавку сталі?
    sources: [interpipe-steel-plant-pages]
    notes: >-
      Ключ до розбору: жодна з трьох допоміжних систем сама не робить заготовку і не видна в її хімічному
      складі, але без них зупиняється основний процес. Межа кейсу: 1,32 млн т — проєктна потужність з
      урахуванням ремонтів, а не добуток такту печі на кількість діб. Запитайте, чому суму продуктивностей
      двох машин лиття свідомо зробили рівною проєктній потужності заводу.

  - id: s05-section
    type: section
    number: 5
    title: Організація процесу в просторі — форми спеціалізації дільниць
    notes: >-
      П’яте питання теми. Технологічна спеціалізація дає гнучкість ціною довшого маршруту; предметна дає
      короткий цикл ціною вузької спеціалізації. Запитайте, яку форму аудиторія обрала б для одиничного
      виробництва, а яку — для масового.

  - id: s05-columns
    type: two-columns
    title: Технологічна й предметна спеціалізація дільниць
    left:
      heading: Технологічна
      bullets:
        - Групує однорідне за призначенням обладнання.
        - Дільниця приймає будь-яку деталь із потрібною операцією.
        - Легко перелаштовується під нову номенклатуру.
        - Довгий, часто зустрічний маршрут — порушує прямоточність.
    right:
      heading: Предметна
      bullets:
        - Закріплює за дільницею повний виріб чи його закінчену частину.
        - Обладнання стоїть у послідовності операцій виробу.
        - Короткий прямоточний маршрут, найкоротший цикл.
        - Потребує стабільного обсягу; дорого переналаштувати під інший виріб.
    sources: [heizer-render-munson-2016]
    notes: >-
      Приклад змішаної форми: частина дільниць технологічна, частина предметна, залежно від стабільності
      обсягу конкретного виробу. Запитайте, яка форма спеціалізації в аудиторії викликає найбільше сумнівів.

  - id: s05-case-boeing
    type: case
    title: 'Boeing 787: предметна спеціалізація на рівні компаній'
    case: boeing-787
    facts:
      - Крило виготовляють у Японії, центральний фюзеляж — в Італії, шасі — у Великій Британії.
      - 'За вторинними джерелами, частка участі японських компаній — 35% конструкції й виробництва літака.'
      - 'Контрактну передачу першого 787 авіакомпанії ANA завершено 25 вересня 2011 р.'
      - Відносно початкового плану поставки (травень 2008 р.) затримка становила приблизно 40 місяців.
      - Кожен партнер відповідає лише за власний модуль, а не за літак цілком.
    question: Чому готовий підвузол від партнера не знімає з інтегратора відповідальності за процес?
    sources: [boeing-787-delivery-pr, boeing-787-wikipedia]
    notes: >-
      Ключ до розбору: партнери постачають готові підвузли — результат уже виконаного предметно
      спеціалізованого процесу, а найскладнішою частиною стає фінальна інтеграція на стику між компаніями.
      Межа кейсу: точний відсоток аутсорсингу оспорюється — в діловій пресі трапляються оцінки 60–70%.
      Запитайте, чи довів би цей кейс, що аутсорсинг завжди спричиняє затримки.

  - id: s06-section
    type: section
    number: 6
    title: Організація процесу в часі — рух партій деталей
    notes: >-
      Шосте питання теми й головний розрахунковий інструмент курсу для цієї теми. Три види руху партії дають
      різну тривалість циклу для тих самих операцій. Запитайте аудиторію, який вид руху вона б назвала
      «найпростішим», перш ніж рахувати.

  - id: s06-formula
    type: formula
    title: Тривалість циклу для трьох видів руху партії
    formula: Tпосл = n · Σ(ti/Ci); Tпар = p · Σ(ti/Ci) + (n − p) · max(ti/Ci); Tзм = Tпосл − (n − p) · Σ min(ti/Ci; ti+1/Ci+1)
    explanation:
      - n — розмір партії, p — розмір транспортної (передавальної) партії.
      - ti — норма часу операції i, Ci — кількість робочих місць на операції i.
      - Формули мають коди PC-01, PC-02, PC-03 у розрахунковій базі курсу.
      - Порядок Tпар ≤ Tзм ≤ Tпосл виконується завжди, для будь-яких вхідних даних.
    sources: [hevko-2017]
    notes: >-
      Наголосіть на порядку нерівності: кожен наступний вид руху лише додає перерв, яких попередній уникав.
      Запитайте, який доданок формули PC-02 відповідає за простій швидшого робочого місця.

  - id: s06-calc
    type: bullets
    title: Розрахунок для однієї партії — навчальні дані
    bullets:
      - 'n = 6 деталей, три операції: t1 = 2 хв, t2 = 1 хв, t3 = 4 хв, Ci = 1, p = 2.'
      - 'Послідовний рух (PC-01): Tпосл = 6 · 7 = 42 хв.'
      - 'Паралельний рух (PC-02): Tпар = 2 · 7 + 4 · 4 = 30 хв.'
      - 'Паралельно-послідовний рух (PC-03): Tзм = 42 − 4 · 2 = 34 хв.'
      - Та сама партія й ті самі норми часу — розрізняється лише вид руху.
    sources: [hevko-2017]
    notes: >-
      Числа навчальні: дібрані так, щоб розрахунок легко відтворювався. Приклад перевірки: сума мінімумів
      суміжних операцій дорівнює 1 + 1 = 2 хв. Запитайте, чому паралельний рух не може бути довшим за
      паралельно-послідовний за жодних вхідних даних.

  - id: s06-figure
    type: figure
    title: Порівняння тривалості циклу за трьох видів руху
    figure: fig-04-batch-movement.svg
    caption: Та сама партія й ті самі норми часу операцій — розрізняється лише вид руху в часі.
    sources: [hevko-2017]
    notes: >-
      Найдовша смуга — послідовний рух, 42 хв; найкоротша, виділена карміновим, — паралельний рух, 30 хв;
      середня — паралельно-послідовний рух, 34 хв. Запитайте, яку смугу аудиторія обрала б для великої
      партії з дуже різною тривалістю операцій.

  - id: s06-choice
    type: bullets
    title: Як обирати вид руху
    bullets:
      - Паралельний рух — найкоротший цикл, але простої швидших робочих місць.
      - Часте транспортування дрібних партій коштує грошей і ризикує пошкодити деталь.
      - Паралельно-послідовний рух — практичний компроміс без вимоги ідеальної синхронізації.
      - Послідовний рух доречний, коли транспортування дороге чи технологічно неможливе.
      - Вибір виду руху — ситуаційне рішення, а не універсальне правило.
    sources: [hevko-2017]
    notes: >-
      Найчастіша помилка — обирати вид руху лише за найкоротшим циклом, не рахуючи вартість простоїв і
      транспортування. Запитайте, яке додаткове число знадобилося б, щоб порахувати цю вартість точно.

  - id: summary
    type: summary
    title: Підсумок теми
    bullets:
      - Операційна діяльність — єдність ресурсів, процесу й результатів; результат вимірний на кожному переділі.
      - Операційний процес — динамічна основа функціонування системи; заміна ресурсу перебудовує сам процес.
      - П’ять принципів мають вимірне відображення і суперечать один одному.
      - Основні процеси перетворюють предмет праці, допоміжні забезпечують перебіг основного.
      - Технологічна й предметна спеціалізація дільниць по-різному вирішують компроміс гнучкість — цикл.
      - Паралельний рух партії дає найкоротший цикл, послідовний — найдовший, паралельно-послідовний — компроміс.
    sources: [starchenko-kalinko-kosach-2020, hevko-2017]
    notes: >-
      Поверніться до прикладу двох майстрів із першого слайда: тепер аудиторія має назвати точну причину
      різниці в 12 хвилин і порахувати її самостійно. Запитайте, яке з шести тверджень підсумку вони
      вважають найважливішим для практичної роботи операційного менеджера.
