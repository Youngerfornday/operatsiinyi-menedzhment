<svg xmlns="http://www.w3.org/2000/svg" id="fig-t04-1" class="scheme" viewBox="0 0 640 336" role="img" aria-labelledby="fig-t04-1-title fig-t04-1-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t04-1-title">Рисунок 1. Операційна діяльність: ресурси, процес і результати</title>
  <desc id="fig-t04-1-desc">Зліва — ресурси операційної діяльності: матеріали, праця, енергія, інформація. Посередині — операційний процес як ланцюжок з трьох переділів; вихід кожного переділу є входом наступного, і результат можна виміряти на кожному з них. Справа — результати: основний (готова продукція) і другорядні (відходи, тепло, інформація про процес). Угорі фігурна дужка позначає, що всі три частини разом і становлять операційну діяльність підприємства.</desc>
  <style>
    #fig-t04-1 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-1 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t04-1 .t { fill: var(--ink, #0f1c2e); font-size: 14px; font-weight: 650; }
    #fig-t04-1 .s { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t04-1 .lbl { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t04-1 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t04-1 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t04-1 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t04-1 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t04-1 .exam { stroke: var(--err, #b42318); }
    #fig-t04-1 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12px; font-weight: 600; }
    #fig-t04-1 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t04-1 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
    #fig-t04-1 .brace { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
  </style>

  <defs>
    <marker id="fig-t04-1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <path class="brace" d="M16 34 C16 20, 632 20, 632 34"/>
  <text class="t" x="324" y="14" text-anchor="middle">Операційна діяльність підприємства</text>

  <rect class="box" x="16" y="58" width="100" height="216" rx="6"/>
  <text class="t" x="66" y="82" text-anchor="middle">Ресурси</text>
  <text class="s" x="66" y="112" text-anchor="middle">матеріали</text>
  <text class="s" x="66" y="142" text-anchor="middle">праця</text>
  <text class="s" x="66" y="172" text-anchor="middle">енергія</text>
  <text class="s" x="66" y="202" text-anchor="middle">інформація</text>
  <text class="s" x="66" y="246" text-anchor="middle">(вхід</text>
  <text class="s" x="66" y="262" text-anchor="middle">системи)</text>

  <path class="arrow" marker-end="url(#fig-t04-1-arr)" d="M116 166 L128 166"/>

  <rect class="box exam" x="132" y="110" width="94" height="112" rx="6"/>
  <text class="exam-t" x="179" y="140" text-anchor="middle">Переділ 1</text>
  <text class="s" x="179" y="162" text-anchor="middle">операція</text>
  <text class="s" x="179" y="178" text-anchor="middle">над предметом</text>
  <text class="s" x="179" y="194" text-anchor="middle">праці</text>

  <path class="arrow" marker-end="url(#fig-t04-1-arr)" d="M226 166 L266 166"/>
  <text class="lbl" x="248" y="94" text-anchor="middle">вихід = вхід</text>

  <rect class="box" x="270" y="110" width="94" height="112" rx="6"/>
  <text class="t" x="317" y="140" text-anchor="middle">Переділ 2</text>
  <text class="s" x="317" y="162" text-anchor="middle">операція</text>
  <text class="s" x="317" y="178" text-anchor="middle">над предметом</text>
  <text class="s" x="317" y="194" text-anchor="middle">праці</text>

  <path class="arrow" marker-end="url(#fig-t04-1-arr)" d="M364 166 L404 166"/>
  <text class="lbl" x="386" y="94" text-anchor="middle">вихід = вхід</text>

  <rect class="box" x="408" y="110" width="94" height="112" rx="6"/>
  <text class="t" x="455" y="140" text-anchor="middle">Переділ 3</text>
  <text class="s" x="455" y="162" text-anchor="middle">операція</text>
  <text class="s" x="455" y="178" text-anchor="middle">над предметом</text>
  <text class="s" x="455" y="194" text-anchor="middle">праці</text>

  <text class="lbl" x="316" y="246" text-anchor="middle">операційний процес: результат вимірний на кожному переділі</text>

  <path class="arrow" d="M502 166 L508 166"/>
  <path class="arrow" marker-end="url(#fig-t04-1-arr)" d="M508 166 L508 108 L516 108"/>
  <path class="arrow" marker-end="url(#fig-t04-1-arr)" d="M508 166 L508 224 L516 224"/>

  <rect class="box" x="520" y="58" width="112" height="100" rx="6"/>
  <text class="t" x="576" y="82" text-anchor="middle">Основний</text>
  <text class="t" x="576" y="99" text-anchor="middle">результат</text>
  <text class="s" x="576" y="122" text-anchor="middle">готова</text>
  <text class="s" x="576" y="138" text-anchor="middle">продукція</text>

  <rect class="box" x="520" y="174" width="112" height="100" rx="6"/>
  <text class="t" x="576" y="198" text-anchor="middle">Другорядні</text>
  <text class="t" x="576" y="215" text-anchor="middle">результати</text>
  <text class="s" x="576" y="238" text-anchor="middle">відходи,</text>
  <text class="s" x="576" y="254" text-anchor="middle">тепло, дані</text>

  <text class="lbl" x="320" y="302" text-anchor="middle">ресурси, процес і результати нерозривні: без ресурсу процес не почнеться,</text>
  <text class="lbl" x="320" y="320" text-anchor="middle">без процесу ресурс не стане результатом, а результат без процесу неможливо виміряти</text>

  <circle class="refc" cx="16" cy="58" r="11"/><text class="refn" x="16" y="62">1</text>
  <circle class="refc exam" cx="132" cy="110" r="11"/><text class="refn exam-n" x="132" y="114">2</text>
  <circle class="refc" cx="248" cy="166" r="11"/><text class="refn" x="248" y="170">3</text>
  <circle class="refc" cx="520" cy="58" r="11"/><text class="refn" x="520" y="62">4</text>
  <circle class="refc" cx="520" cy="174" r="11"/><text class="refn" x="520" y="178">5</text>
</svg>
