<svg xmlns="http://www.w3.org/2000/svg" id="fig-t03-2" class="scheme" viewBox="0 0 640 380" role="img" aria-labelledby="fig-t03-2-title fig-t03-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t03-2-title">Рисунок 2. Три підсистеми операційної системи</title>
  <desc id="fig-t03-2-desc">У центрі — переробна підсистема з входом зліва і виходом справа: вона безпосередньо перетворює вхід на вихід. Знизу до переробної підсистеми підходить блок підсистеми забезпечення з підписом «енергія, ремонт, матеріали, транспорт»: вона обслуговує переробну підсистему, а сама продукту не створює. Згори до переробної підсистеми підходить блок підсистеми планування й контролю. Карміновою стрілкою від переробної підсистеми до підсистеми планування й контролю показано інформацію про стан і незавершене виробництво, а звичайною стрілкою у зворотний бік — рішення про завантаження, послідовність і строки робіт.</desc>
  <style>
    #fig-t03-2 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t03-2 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t03-2 .t { fill: var(--ink, #0f1c2e); font-size: 14.5px; font-weight: 650; }
    #fig-t03-2 .s { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t03-2 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t03-2 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t03-2 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t03-2 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t03-2 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t03-2 .exam { stroke: var(--err, #b42318); }
    #fig-t03-2 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12px; font-weight: 600; }
    #fig-t03-2 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t03-2 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t03-2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="box exam" x="200" y="30" width="240" height="82" rx="8"/>
  <text class="t" x="320" y="56" text-anchor="middle">Підсистема планування й контролю</text>
  <text class="s" x="320" y="76" text-anchor="middle">ухвалює рішення про завантаження,</text>
  <text class="s" x="320" y="94" text-anchor="middle">послідовність і строки робіт</text>

  <text class="s" x="128" y="182" text-anchor="middle">вхід</text>
  <path class="arrow" marker-end="url(#fig-t03-2-arr)" d="M60 190 L196 190"/>

  <rect class="box box-owner" x="200" y="144" width="240" height="92" rx="8"/>
  <text class="t" x="320" y="172" text-anchor="middle">Переробна підсистема</text>
  <text class="s" x="320" y="194" text-anchor="middle">безпосередньо перетворює</text>
  <text class="s" x="320" y="212" text-anchor="middle">вхід на кінцевий вихід</text>

  <text class="s" x="512" y="182" text-anchor="middle">вихід</text>
  <path class="arrow" marker-end="url(#fig-t03-2-arr)" d="M444 190 L580 190"/>

  <rect class="box" x="200" y="266" width="240" height="82" rx="8"/>
  <text class="t" x="320" y="292" text-anchor="middle">Підсистема забезпечення</text>
  <text class="s" x="320" y="312" text-anchor="middle">енергія, ремонт, матеріали,</text>
  <text class="s" x="320" y="330" text-anchor="middle">транспорт, інструмент</text>

  <path class="arrow" marker-end="url(#fig-t03-2-arr)" d="M280 266 L280 240"/>
  <text class="lbl" x="288" y="257">обслуговує переробну</text>

  <path class="arrow exam" marker-end="url(#fig-t03-2-arr)" d="M300 144 L300 116"/>
  <text class="exam-t" x="292" y="126" text-anchor="end">стан, незавершене</text>
  <text class="exam-t" x="292" y="140" text-anchor="end">виробництво</text>

  <path class="arrow" marker-end="url(#fig-t03-2-arr)" d="M360 116 L360 144"/>
  <text class="lbl" x="368" y="126">рішення про</text>
  <text class="lbl" x="368" y="140">завантаження</text>

  <circle class="refc exam" cx="200" cy="30" r="11"/><text class="refn exam-n" x="200" y="34">3</text>
  <circle class="refc" cx="200" cy="144" r="11"/><text class="refn" x="200" y="148">1</text>
  <circle class="refc" cx="200" cy="266" r="11"/><text class="refn" x="200" y="270">2</text>
</svg>
