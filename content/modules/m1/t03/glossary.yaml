# Глосарій теми 3. Назви термінів мають дослівно збігатися з реєстром course.yaml (glossaryTerms, topic: t03).
# Визначення — робочі формулювання курсу; розрахункове співвідношення закону Літтла (CAP-04) — з
# docs/research/formula-baseline.md.
topic: t03
terms:
  - id: systems-approach
    term: Системний підхід
    definition: >-
      Підхід до аналізу операційної діяльності, який вимагає спершу окреслити межі цілого й лише потім
      аналізувати частини: підприємство розглядають як цілісну систему, а операційну систему — як його
      частину, відокремлену суспільним поділом праці. Вимагає двох дій одразу — декомпозиції (поділу
      цілого на елементи) і синтезу (дослідження їхніх властивостей саме як частин цілого). Головний
      практичний наслідок: оптимум цілого не дорівнює сумі оптимумів частин.
    synonyms:
      - системний аналіз операційної діяльності
      - systems approach
    forms:
      - системний підхід
      - системного підходу
      - системному підходу
      - системним підходом
    seeAlso: [operations-system, conversion-subsystem, planning-control-subsystem]

  - id: operations-system
    term: Операційна система
    definition: >-
      Повна система виробничої (операційної) діяльності підприємства, яка використовує ресурси, щоб
      перетворити вхід на продукцію чи послугу на виході. Складається з трьох підсистем — переробної,
      забезпечення та планування й контролю — і відповідає чотирьом критеріям сформованості: економічна
      самостійність, організаційна цілісність, наявність спеціалізованих інформаційних структур і
      можливість виділити загальний результат її роботи.
    synonyms:
      - виробнича система підприємства
      - operations system
    forms:
      - операційна система
      - операційної системи
      - операційну систему
      - операційною системою
      - операційні системи
      - операційних систем
    seeAlso: [systems-approach, input-output-model, conversion-subsystem, support-subsystem, planning-control-subsystem]

  - id: input-output-model
    term: Модель «вхід — перетворення — вихід»
    definition: >-
      Універсальний опис будь-якої операційної системи: вхід (об’єкти діяльності, засоби діяльності й
      персонал) надходить у процес перетворення, який дає вихід (основний і другорядний результат), а
      зворотний зв’язок повертає вимір результату в процес перетворення й у вхід. Модель однаково описує
      виробничу дільницю, лікарню, банк і транспортну мережу — різниться лише предмет перетворення.
    synonyms:
      - модель IPO операційної системи
      - input-transformation-output model
    forms:
      - модель «вхід — перетворення — вихід»
      - моделі «вхід — перетворення — вихід»
    seeAlso: [operations-system, conversion-subsystem]

  - id: conversion-subsystem
    term: Переробна підсистема
    definition: >-
      Підсистема операційної системи, яка безпосередньо перетворює вхідні ресурси на кінцеву продукцію
      чи послугу: тут відбувається сам процес перетворення. Саме склад і послідовність її операцій
      визначають, до якого виду належить операційна система — проєктного, одиничного, серійного,
      масового чи безперервного.
    synonyms:
      - виробнича підсистема
      - processing subsystem
      - conversion subsystem
    forms:
      - переробна підсистема
      - переробної підсистеми
      - переробну підсистему
      - переробною підсистемою
    seeAlso: [operations-system, support-subsystem, planning-control-subsystem]

  - id: support-subsystem
    term: Підсистема забезпечення
    definition: >-
      Підсистема операційної системи, яка виконує функції, потрібні для роботи переробної підсистеми, але
      сама кінцевого продукту не створює: постачання енергією й матеріалами, технічне обслуговування й
      ремонт обладнання, транспортування, інструментальне господарство. Зупинка підсистеми забезпечення
      зупиняє переробну підсистему так само надійно, як зупинка самого технологічного агрегату.
    synonyms:
      - обслуговуюча підсистема
      - support subsystem
    forms:
      - підсистема забезпечення
      - підсистеми забезпечення
      - підсистему забезпечення
      - підсистемою забезпечення
    seeAlso: [conversion-subsystem, operations-system]

  - id: planning-control-subsystem
    term: Підсистема планування й контролю
    definition: >-
      Підсистема операційної системи, яка отримує від переробної підсистеми інформацію про її стан і
      незавершене виробництво й на цій основі ухвалює рішення про завантаження, послідовність і строки
      робіт. Саме вона робить операційну систему керованою: без неї переробна й забезпечувальна підсистеми
      працюють кожна на власний локальний оптимум, а система в цілому — гірше.
    synonyms:
      - підсистема управління операційною діяльністю
      - planning and control subsystem
    forms:
      - підсистема планування й контролю
      - підсистеми планування й контролю
      - підсистему планування й контролю
      - підсистемою планування й контролю
    seeAlso: [operations-system, conversion-subsystem, systems-approach]

  - id: project-operations
    term: Проєктна операційна система
    definition: >-
      Операційна система, побудована навколо одного унікального результату з визначеним початком і
      кінцем: ресурси мобілізують під конкретний проєкт, а після його завершення систему розформовують
      або перебудовують під наступний. Найнижчий ступінь повторюваності серед усіх видів операційних
      систем; типові приклади — будівництво об’єкта, суднобудування, впровадження інформаційної системи.
    synonyms:
      - проєктна система
      - project-based operations
    forms:
      - проєктна операційна система
      - проєктної операційної системи
      - проєктну операційну систему
      - проєктною операційною системою
    seeAlso: [job-shop, batch-production, mass-production, continuous-production]

  - id: job-shop
    term: Одинична операційна система
    definition: >-
      Операційна система з високою різноманітністю виробів і низьким обсягом випуску кожного з них:
      універсальне обладнання, групування за технологічною ознакою, кожне замовлення може вимагати
      власного маршруту й наладки. Високі витрати на одиницю продукції компенсуються гнучкістю щодо
      номенклатури.
    synonyms:
      - система одиничного виробництва
      - job shop
    forms:
      - одинична операційна система
      - одиничної операційної системи
      - одиничну операційну систему
      - одиничною операційною системою
    seeAlso: [project-operations, batch-production]

  - id: batch-production
    term: Серійна операційна система
    definition: >-
      Операційна система, у якій продукцію випускають партіями (серіями), що періодично повторюються:
      обладнання переналаштовують під чергову партію, тому випуск чергується з переналагодженням. Займає
      проміжне місце між одиничною і масовою системами за обсягом випуску й ступенем повторюваності;
      усередині виду розрізняють дрібно-, середньо- і великосерійне виробництво.
    synonyms:
      - система серійного виробництва
      - batch production system
    forms:
      - серійна операційна система
      - серійної операційної системи
      - серійну операційну систему
      - серійною операційною системою
    seeAlso: [job-shop, mass-production]

  - id: mass-production
    term: Масова операційна система
    definition: >-
      Операційна система з високим обсягом випуску вузької номенклатури стандартизованої продукції:
      спеціалізоване обладнання й потокова лінія, закріплена за виробом, дають високу продуктивність
      ціною низької гнучкості щодо зміни номенклатури.
    synonyms:
      - масове виробництво
      - mass production system
    forms:
      - масова операційна система
      - масової операційної системи
      - масову операційну систему
      - масовою операційною системою
    seeAlso: [batch-production, continuous-production]

  - id: continuous-production
    term: Безперервна операційна система
    definition: >-
      Операційна система, у якій предмет праці рухається через переробну підсистему безперервним потоком,
      а не дискретними одиницями: зупинка й повторний запуск процесу коштують дорого й часто технологічно
      обмежені, тому лінію або запускають на повну потужність, або зупиняють — пропорційно попиту її
      «пригальмувати» не можна. Типова форма процесних (апаратурних) виробництв — хімія, металургія,
      енергетика.
    synonyms:
      - апаратурна система
      - процесне виробництво
      - continuous-flow production
    forms:
      - безперервна операційна система
      - безперервної операційної системи
      - безперервну операційну систему
      - безперервною операційною системою
    seeAlso: [mass-production, throughput]

  - id: littles-law
    term: Закон Літтла
    definition: >-
      Співвідношення, яке в стійкому стані операційної системи (коли темп надходження дорівнює темпу
      виходу) зв’язує середню кількість одиниць у системі, пропускну здатність і середній час перебування
      одиниці в системі: незавершене виробництво дорівнює добутку пропускної здатності на тривалість
      проходження. Дійсне для будь-якої черги чи запасу в процесі — виробничого замовлення, пацієнта в
      лікарні, вагона в ремонті — незалежно від того, що саме відбувається всередині системи.
    synonyms:
      - little's law
      - формула незавершеного виробництва
    forms:
      - закон Літтла
      - закону Літтла
      - законом Літтла
    seeAlso: [throughput, operations-system]

  - id: throughput
    term: Пропускна здатність
    definition: >-
      Темп, з яким операційна система приймає в обробку й випускає готові одиниці за одиницю часу:
      кількість одиниць, завершених системою за період, поділена на тривалість цього періоду. У законі
      Літтла — темп надходження, який за стійкого стану дорівнює темпу виходу.
    synonyms:
      - пропускна спроможність
      - throughput rate
    forms:
      - пропускна здатність
      - пропускної здатності
      - пропускну здатність
      - пропускною здатністю
    seeAlso: [littles-law, continuous-production]
