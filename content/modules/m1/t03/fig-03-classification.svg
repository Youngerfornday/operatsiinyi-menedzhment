<svg xmlns="http://www.w3.org/2000/svg" id="fig-t03-3" class="scheme" viewBox="0 0 640 340" role="img" aria-labelledby="fig-t03-3-title fig-t03-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t03-3-title">Рисунок 3. Класифікація операційних систем за ступенем повторюваності й обсягом випуску</title>
  <desc id="fig-t03-3-desc">Горизонтальна шкала від низького обсягу випуску й високої різноманітності ліворуч до високого обсягу й низької різноманітності праворуч. На шкалі позначено п’ять точок: проектна, одинична, серійна, масова, безперервна система. Стрілка під шкалою показує, що великосерійне виробництво тяжіє до масового, а дрібносерійне — до одиничного: межі між сусідніми видами умовні, а не жорсткі.</desc>
  <style>
    #fig-t03-3 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t03-3 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t03-3 .t { fill: var(--ink, #0f1c2e); font-size: 13.5px; font-weight: 650; }
    #fig-t03-3 .s { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t03-3 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t03-3 .axis { stroke: var(--ink, #0f1c2e); stroke-width: 1.5; }
    #fig-t03-3 .tick { stroke: var(--ink, #0f1c2e); stroke-width: 1.5; }
    #fig-t03-3 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t03-3 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t03-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t03-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t03-3 .exam { stroke: var(--err, #b42318); }
    #fig-t03-3 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12px; font-weight: 600; }
    #fig-t03-3 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t03-3 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t03-3-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <text class="lbl" x="70" y="30" text-anchor="middle">низький обсяг,</text>
  <text class="lbl" x="70" y="46" text-anchor="middle">висока різноманітність</text>
  <text class="lbl" x="570" y="30" text-anchor="middle">високий обсяг,</text>
  <text class="lbl" x="570" y="46" text-anchor="middle">низька різноманітність</text>

  <line class="axis" x1="40" y1="90" x2="600" y2="90" marker-end="url(#fig-t03-3-arr)"/>

  <line class="tick" x1="70" y1="82" x2="70" y2="98"/>
  <line class="tick" x1="200" y1="82" x2="200" y2="98"/>
  <line class="tick" x1="320" y1="82" x2="320" y2="98"/>
  <line class="tick" x1="440" y1="82" x2="440" y2="98"/>
  <line class="tick" x1="570" y1="82" x2="570" y2="98"/>

  <rect class="box" x="18" y="112" width="104" height="86" rx="6"/>
  <text class="t" x="70" y="134" text-anchor="middle">Проектна</text>
  <text class="s" x="70" y="154" text-anchor="middle">один</text>
  <text class="s" x="70" y="170" text-anchor="middle">неповторюваний</text>
  <text class="s" x="70" y="186" text-anchor="middle">результат</text>

  <rect class="box" x="148" y="112" width="104" height="86" rx="6"/>
  <text class="t" x="200" y="134" text-anchor="middle">Одинична</text>
  <text class="s" x="200" y="154" text-anchor="middle">широка</text>
  <text class="s" x="200" y="170" text-anchor="middle">номенклатура,</text>
  <text class="s" x="200" y="186" text-anchor="middle">малі кількості</text>

  <rect class="box box-owner exam" x="268" y="112" width="104" height="86" rx="6"/>
  <text class="t" x="320" y="134" text-anchor="middle">Серійна</text>
  <text class="s" x="320" y="154" text-anchor="middle">партії, що</text>
  <text class="s" x="320" y="170" text-anchor="middle">періодично</text>
  <text class="s" x="320" y="186" text-anchor="middle">повторюються</text>

  <rect class="box" x="388" y="112" width="104" height="86" rx="6"/>
  <text class="t" x="440" y="134" text-anchor="middle">Масова</text>
  <text class="s" x="440" y="154" text-anchor="middle">вузька</text>
  <text class="s" x="440" y="170" text-anchor="middle">номенклатура,</text>
  <text class="s" x="440" y="186" text-anchor="middle">великий обсяг</text>

  <rect class="box" x="518" y="112" width="104" height="86" rx="6"/>
  <text class="t" x="570" y="134" text-anchor="middle">Безперервна</text>
  <text class="s" x="570" y="154" text-anchor="middle">суцільний потік,</text>
  <text class="s" x="570" y="170" text-anchor="middle">не дискретні</text>
  <text class="s" x="570" y="186" text-anchor="middle">одиниці</text>

  <path class="arrow exam" marker-end="url(#fig-t03-3-arr)" d="M300 224 C 260 246, 240 246, 210 224"/>
  <text class="exam-t" x="310" y="262" text-anchor="end">дрібносерійна тяжіє до одиничної</text>

  <path class="arrow exam" marker-end="url(#fig-t03-3-arr)" d="M340 224 C 380 246, 400 246, 430 224"/>
  <text class="exam-t" x="330" y="262">великосерійна тяжіє до масової</text>

  <text class="lbl" x="320" y="300" text-anchor="middle">Межі між сусідніми видами умовні: це спектр, а не набір непроникних категорій</text>

  <circle class="refc" cx="18" cy="112" r="11"/><text class="refn" x="18" y="116">1</text>
  <circle class="refc" cx="148" cy="112" r="11"/><text class="refn" x="148" y="116">2</text>
  <circle class="refc exam" cx="268" cy="112" r="11"/><text class="refn exam-n" x="268" y="116">3</text>
  <circle class="refc" cx="388" cy="112" r="11"/><text class="refn" x="388" y="116">4</text>
  <circle class="refc" cx="518" cy="112" r="11"/><text class="refn" x="518" y="116">5</text>
</svg>
