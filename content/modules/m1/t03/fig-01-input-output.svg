<svg xmlns="http://www.w3.org/2000/svg" id="fig-t03-1" class="scheme" viewBox="0 0 640 372" role="img" aria-labelledby="fig-t03-1-title fig-t03-1-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t03-1-title">Рисунок 1. Операційна система як модель «вхід — перетворення — вихід»</title>
  <desc id="fig-t03-1-desc">Три блоки в ряд усередині рамки, що позначає межу операційної системи: вхід (об’єкти діяльності, засоби діяльності, персонал), перетворення, вихід (основний і другорядний результат). Карміновою пунктирною стрілкою від виходу до перетворення позначено зворотний зв’язок: вимір результату повертається в процес. Над рамкою підписано, що виникнення системи зумовлює ринковий попит на її продукцію. Під рамкою — список чотирьох критеріїв сформованості операційної системи: економічна самостійність, організаційна цілісність, наявність спеціалізованих інформаційних структур, можливість виділити загальний результат роботи.</desc>
  <style>
    #fig-t03-1 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t03-1 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t03-1 .t { fill: var(--ink, #0f1c2e); font-size: 15px; font-weight: 650; }
    #fig-t03-1 .s { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t03-1 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t03-1 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t03-1 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t03-1 .frame { fill: none; stroke: var(--ink-2, #445570); stroke-width: 1; stroke-dasharray: 5 4; }
    #fig-t03-1 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t03-1 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t03-1 .exam { stroke: var(--err, #b42318); }
    #fig-t03-1 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12px; font-weight: 600; }
    #fig-t03-1 .refc.exam { stroke: var(--err, #b42318); }
    #fig-t03-1 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <defs>
    <marker id="fig-t03-1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <text class="lbl" x="320" y="20" text-anchor="middle">Виникнення операційної системи зумовлює ринковий попит на її продукцію</text>

  <rect class="frame" x="12" y="34" width="616" height="196" rx="10"/>
  <text class="lbl" x="24" y="52">межа операційної системи</text>

  <rect class="box box-owner" x="28" y="76" width="168" height="110" rx="6"/>
  <text class="t" x="112" y="104" text-anchor="middle">Вхід</text>
  <text class="s" x="112" y="126" text-anchor="middle">об’єкти діяльності:</text>
  <text class="s" x="112" y="144" text-anchor="middle">матеріали, клієнти</text>
  <text class="s" x="112" y="162" text-anchor="middle">засоби діяльності,</text>
  <text class="s" x="112" y="178" text-anchor="middle">персонал</text>

  <rect class="box" x="236" y="76" width="168" height="110" rx="6"/>
  <text class="t" x="320" y="104" text-anchor="middle">Перетворення</text>
  <text class="s" x="320" y="126" text-anchor="middle">відбувається</text>
  <text class="s" x="320" y="144" text-anchor="middle">всередині межі,</text>
  <text class="s" x="320" y="162" text-anchor="middle">яку тримають чотири</text>
  <text class="s" x="320" y="178" text-anchor="middle">критерії нижче</text>

  <rect class="box" x="444" y="76" width="168" height="110" rx="6"/>
  <text class="t" x="528" y="104" text-anchor="middle">Вихід</text>
  <text class="s" x="528" y="126" text-anchor="middle">основний: продукція</text>
  <text class="s" x="528" y="144" text-anchor="middle">чи стан клієнта</text>
  <text class="s" x="528" y="162" text-anchor="middle">другорядний: залишки,</text>
  <text class="s" x="528" y="178" text-anchor="middle">тепло, інформація</text>

  <path class="arrow" marker-end="url(#fig-t03-1-arr)" d="M196 130 L232 130"/>
  <path class="arrow" marker-end="url(#fig-t03-1-arr)" d="M404 130 L440 130"/>
  <path class="arrow exam" marker-end="url(#fig-t03-1-arr)" stroke-dasharray="4 3" d="M528 186 C 528 212, 320 212, 320 190"/>
  <text class="exam-t" x="424" y="206" text-anchor="middle">зворотний зв’язок: вимір результату коригує процес</text>

  <rect class="box" x="28" y="248" width="584" height="104" rx="8"/>
  <text class="t" x="320" y="270" text-anchor="middle">Чотири критерії сформованості операційної системи</text>
  <text class="s" x="48" y="292">1. Економічна самостійність</text>
  <text class="s" x="48" y="312">2. Організаційна цілісність</text>
  <text class="s" x="340" y="292">3. Наявність спеціалізованих інформаційних структур</text>
  <text class="s" x="340" y="312">4. Можливість виділити загальний результат роботи</text>
  <text class="lbl" x="320" y="336" text-anchor="middle">Без четвертого критерію систему не можна планувати як самостійну одиницю</text>

  <circle class="refc" cx="28" cy="76" r="11"/><text class="refn" x="28" y="80">1</text>
  <circle class="refc exam" cx="236" cy="76" r="11"/><text class="refn exam-n" x="236" y="80">2</text>
  <circle class="refc" cx="612" cy="76" r="11"/><text class="refn" x="612" y="80">3</text>
  <circle class="refc" cx="320" cy="212" r="11"/><text class="refn" x="320" y="216">4</text>
</svg>
