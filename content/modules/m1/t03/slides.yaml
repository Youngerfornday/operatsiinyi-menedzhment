# Презентація теми 3. Текст слайдів стислий: повний виклад — у lecture.mdx, пояснення — у нотатках.
# Кожне число слайда має бути в лонгріді теми й мати джерело зі sources.yaml.
topic: t03
slides:
  - id: title
    type: title
    subtitle: Модуль 1. Теоретичні основи організації та регулювання операційної діяльності
    notes: >-
      Відкрийте питанням: цех, олієекстракційний завод і відділення пошти — три різні світи, але той самий
      набір показників (скільки одиниць усередині, з якою швидкістю входять, скільки часу там проводять)
      описує їх усіх однією формулою. До неї повернемося наприкінці теми.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після теми
    notes: >-
      Три результати: описувати операційну систему через вхід-перетворення-вихід, класифікувати її за видом
      і застосовувати закон Літтла. Запитайте, з яким із трьох результатів аудиторія вже стикалася на практиці.

  - id: s01-section
    type: section
    number: 1
    title: Сутність системного підходу до операційного менеджменту
    notes: >-
      Перше питання теми. Системний підхід вимагає спершу окреслити межі цілого, а вже потім аналізувати
      частини. Приклад: дільниця, що максимізувала власне завантаження, накопичує незавершене виробництво
      перед сусідньою. Запитайте, чи траплялося аудиторії бачити «оптимальний» звіт підрозділу на тлі
      проблем усієї системи.

  - id: s01-approach
    type: bullets
    title: Декомпозиція, синтез і локальний оптимум
    bullets:
      - Системний підхід — дві дії одночасно — декомпозиція цілого на елементи і синтез їхніх властивостей як частин цілого.
      - Операційна система — елемент організації, відокремлений суспільним поділом праці.
      - Головний практичний наслідок — оптимум цілого не дорівнює сумі оптимумів частин.
      - Дільниця, що максимізувала власне завантаження, накопичує незавершене виробництво перед сусідньою.
    sources: [omelianenko-osokina-2016, kushniruk-2017]
    notes: >-
      Наголосіть на різниці між декомпозицією і синтезом: розібрати на частини — половина роботи, друга
      половина — дослідити властивості частин саме як частин цілого. Приклад: служба постачання, що мінімізувала
      власні витрати дрібними частими поставками, зупиняє лінію. Запитайте, який підрозділ на знайомому
      підприємстві найчастіше оптимізує себе локально.

  - id: s01-sociotechnical
    type: bullets
    title: Підприємство як соціотехнічна система
    bullets:
      - Параметри нестаціонарні, поведінка стохастична — точний прогноз неможливий.
      - Унікальне й непередбачуване в конкретних умовах через активний елемент — людину.
      - Здатне змінювати структуру, протистояти руйнівним тенденціям, адаптуватися.
      - Формує цілі всередині себе — на відміну від технічних систем.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Ключова відмінність від технічної системи — людина всередині як активний елемент. Приклад: та сама
      норма часу дає різний результат залежно від того, як менеджер пояснив працівникові її мету. Запитайте,
      яку з чотирьох властивостей аудиторія вважає найважчою для управління.

  - id: s02-section
    type: section
    number: 2
    title: Операційна система як об’єкт управління — вхід, перетворення, вихід
    notes: >-
      Друге питання теми. Операційна система — повна система виробничої діяльності, що відповідає чотирьом
      критеріям сформованості. Приклад: якщо результат дільниці не можна виміряти окремо від сусідньої —
      це не самостійна система. Запитайте, чи можна виділити результат конкретного підрозділу окремо.

  - id: s02-figure
    type: figure
    title: Модель «вхід — перетворення — вихід» і критерії сформованості
    figure: fig-01-input-output.svg
    caption: Зворотний зв’язок і чотири критерії сформованості визначають, чи можна взагалі назвати ресурси операційною системою.
    sources: [slack-brandon-jones-2021, omelianenko-osokina-2016]
    notes: >-
      Модель однаково описує цех, лікарню, банк і транспортну мережу — різниться предмет перетворення.
      Приклад: у сфері послуг вхід включає самого клієнта та його власність. Запитайте, який другорядний
      вихід операційної системи аудиторія найчастіше ігнорує.

  - id: s02-criteria
    type: bullets
    title: Операційна система — повна система виробничої діяльності
    bullets:
      - Використовує операційні ресурси, щоб перетворити вхід на вихід.
      - 'Чотири критерії сформованості: економічна самостійність, організаційна цілісність, інформаційні структури, виділений результат.'
      - Виникнення системи зумовлює ринковий попит на її продукцію.
      - 'Останній критерій — найпрактичніший: без нього систему не можна планувати як самостійну одиницю.'
    sources: [omelianenko-osokina-2016]
    notes: >-
      Розберіть четвертий критерій детальніше: можливість виділити загальний результат роботи. Приклад:
      цех без окремого обліку випуску не можна планувати як самостійну систему. Запитайте, за яким критерієм
      аудиторія перевірила б, чи є конкретний підрозділ самостійною операційною системою.

  - id: s02-case-amazon
    type: case
    title: Amazon fulfillment — коли перетворення означає «перекласти», а не «зробити»
    case: amazon-fulfillment
    facts:
      - У червні 2025 р. до центру виконання замовлень у Японії доставили мільйонного робота.
      - Мережа охоплює понад 300 об’єктів по всьому світу.
      - 75% усіх замовлень у світі обробляються за участю роботів.
      - 'Робот Hercules піднімає й переміщує запас під подом вагою до 1 250 фунтів (≈567 кг).'
      - 'За аналізом коаліції профспілок: 6,6 серйозної травми на 100 працівників проти 3,2 на інших складах.'
    question: Що саме тут є «перетворенням», якщо товар на вході й на виході — той самий товар?
    sources: [amazon-bots-numbers-2025, amazon-million-robots-2025, amazon-injury-study-cnbc-2023]
    notes: >-
      Ключ: перетворюється не форма товару, а його розташування — просторове перетворення. Приклад: Hercules
      інвертує схему «людина йде до товару» на «товар їде до людини». Межа кейсу: кількість роботів — показник
      капітальних інвестицій, а не продуктивності праці. Запитайте, чи вважає аудиторія травматизм і роботизацію
      пов’язаними чи випадково суміжними фактами.

  - id: s03-section
    type: section
    number: 3
    title: Підсистеми операційної системи — переробна, забезпечення, планування й контролю
    notes: >-
      Третє питання теми. Переробна підсистема перетворює вхід на вихід, забезпечення обслуговує переробну,
      планування й контроль керує обома на основі інформації про незавершене виробництво. Приклад: зупинка
      підсистеми забезпечення зупиняє переробну так само надійно, як поломка самого агрегату.

  - id: s03-figure
    type: figure
    title: Три підсистеми і зв’язок між ними
    figure: fig-02-subsystems.svg
    caption: Планування й контроль отримує інформацію про незавершене виробництво й ухвалює рішення про завантаження.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Наголосіть на напрямку стрілок: інформація йде від переробної підсистеми вгору, рішення — вниз.
      Приклад: без цього зв’язку переробна підсистема й забезпечення кожна оптимізує себе локально.
      Запитайте, що станеться, якщо цей зв’язок розірвати на тиждень.

  - id: s03-columns
    type: two-columns
    title: Роль кожної підсистеми
    left:
      heading: Переробна і забезпечення
      bullets:
        - Переробна безпосередньо перетворює сировину на кінцеву продукцію.
        - Склад її операцій визначає вид усієї операційної системи.
        - Забезпечення обслуговує переробну — сама продукту не створює.
        - Зупинка забезпечення зупиняє переробну так само, як поломка агрегату.
    right:
      heading: Планування й контроль
      bullets:
        - Отримує від переробної підсистеми інформацію про стан і незавершене виробництво.
        - Ухвалює рішення про завантаження, послідовність і строки.
        - Робить систему керованою в сенсі системного підходу.
        - Без неї підсистеми оптимізують себе локально — система програє.
    sources: [omelianenko-osokina-2016]
    notes: >-
      Поверніться до питання 1: підсистема планування й контролю — конкретний механізм, яким системний підхід
      компенсує локальний оптимум. Приклад: жорстко зв’язане виробництво зрощує цю підсистему з самою
      технологією. Запитайте, де на знайомому підприємстві ця підсистема формалізована, а де — ні.

  - id: s03-case-interpipe
    type: case
    title: Інтерпайп Сталь — три підсистеми жорстко зв’язаного переділу
    case: interpipe-steel
    facts:
      - 'Електродугова піч: місткість 186 т, випуск 160 т, тривалість плавки 53 хв, 27 плавок на добу.'
      - 'Дві МБЛЗ: 770 000 і 550 000 т заготовки на рік — сума точно дорівнює проєктній потужності заводу 1,32 млн т.'
      - 'Забезпечення: власна кабельна лінія 330 кВ (12,8 км), вапняна фабрика, переробка металобрухту.'
      - Розплавлений метал не можна відкласти на потім — зупинка будь-якого агрегату зупиняє весь ланцюг.
      - У ніч на 22.09.2026 підприємство зазнало балістичного удару, виробництво зупинено.
    question: Чому в цьому переділі неможливо тримати запас між операціями так, як у дискретному складанні?
    sources: [interpipe-steel-about, interpipe-steel-attack-2026]
    notes: >-
      Кейс написано в минулому часі через атаку 22.09.2026 — на дату перевірки компанія термінів відновлення
      не називала. Приклад свідомого узгодження ланок: сума потужностей двох МБЛЗ точно дорівнює проєктній
      потужності заводу. Запитайте, де ще аудиторія бачила таке навмисне узгодження пропускної здатності ланок.

  - id: s04-section
    type: section
    number: 4
    title: Класифікаційні підходи до операційних систем
    notes: >-
      Четверте питання теми. Три ознаки одночасно — тип виробництва, характер перетворення, ступінь
      стандартизації процесу. Жодна не діє окремо. Приклад: компанія, що поєднує кілька видів систем під
      одним дахом. Запитайте, чи можна одним словом класифікувати підприємство, яке аудиторія знає.

  - id: s04-figure
    type: figure
    title: Спектр видів операційних систем
    figure: fig-03-classification.svg
    caption: П’ять видів утворюють спектр за обсягом і повторюваністю, а не набір непроникних категорій.
    sources: [heizer-render-munson-2016, stevenson-2020]
    notes: >-
      Наголосіть, що межі між сусідніми видами умовні: великосерійне тяжіє до масового, дрібносерійне — до
      одиничного. Приклад: серійне виробництво часто є перехідною стадією освоєння нової продукції.
      Запитайте, де на цьому спектрі аудиторія розмістила б знайоме підприємство.

  - id: s04-case-kernel
    type: case
    title: Kernel — три операційні системи під одним дахом
    case: kernel
    facts:
      - 'Сім олієекстракційних заводів, потужність 4,0 млн т насіння на рік, працюють цілорічно — безперервна система.'
      - Перероблено 3,5 млн т (+8% р/р), коефіцієнт використання потужності — 87%.
      - '29 елеваторів: сезонний оборот понад 1,0 ємності за рік — серійна за ритмом завантаження система.'
      - Портові термінали розраховані на 11 млн т/рік, фактично перевалено 9,1 млн т (+36%).
    question: Яку операційну систему компанія фактично експлуатує в кожній з трьох ланок?
    sources: [kernel-annual-report-fy2025]
    notes: >-
      Три ланки — три різні відповіді на питання «яка це система». Приклад: спроба описати компанію одним
      словом класифікаційної сітки завжди неточна. Межа кейсу: 87% — завантаження групи, а не галузі;
      сайт компанії подає застарілі цифри. Запитайте, яку з трьох ланок аудиторія назвала б найгнучкішою.

  - id: s05-section
    type: section
    number: 5
    title: Характеристика операційних систем різних видів
    notes: >-
      П’яте питання теми. П’ять видів систем — від проєктної до безперервної. Приклад: реальні підприємства
      здебільшого поєднують кілька видів. Запитайте, чому масове виробництво Toyota перебудували під потік
      одиничних виробів, а не навпаки.

  - id: s05-columns
    type: two-columns
    title: П’ять видів операційних систем
    left:
      heading: Проєктна, одинична, серійна
      bullets:
        - 'Проєктна: один неповторюваний результат — будівництво, суднобудування.'
        - 'Одинична (job shop): широка номенклатура, малі кількості, універсальне обладнання.'
        - 'Серійна: партії, що періодично повторюються — від дрібно- до великосерійної.'
    right:
      heading: Масова і безперервна
      bullets:
        - 'Масова: вузька номенклатура, великий обсяг, спеціалізована лінія.'
        - 'Безперервна: суцільний потік — нафта, хімікати, метал, руда.'
        - Лінію безперервної системи або запускають на повну, або зупиняють.
    sources: [heizer-render-munson-2016, stevenson-2020]
    notes: >-
      Наголосіть на прикладах з переліку викладача: великосерійне охоплює й сервіси — масові щеплення,
      автоматизоване миття машин, поштовий сервіс, швидке харчування. Запитайте, до якого виду аудиторія
      віднесла б відділення видачі посилок і чому воно відрізняється від сортувального вузла.

  - id: s05-case-ferrexpo
    type: case
    title: Ferrexpo — безперервний процес без проміжного режиму
    case: ferrexpo
    facts:
      - Комплекс має чотири лінії окомкування — безперервний процес без проміжного режиму.
      - 'Виробництво окатишів 2025 р.: 3 221 461 т (−47% р/р), концентрату — +311%, до 2,92 млн т.'
      - '05.08.2026 компанія зупинила видобуток через загрозу атак на порти.'
      - 06–07.09.2026 виробництво відновлено, але лише на одній з чотирьох ліній окомкування.
    question: Чому компанія скорочувала випуск окатишів не плавним зниженням темпу всіх ліній, а зупинкою й перезапуском окремих ліній?
    sources: [ferrexpo-production-report-4q2025, ferrexpo-full-year-2025, ferrexpo-halts-production-2026, ferrexpo-resumes-production-2026]
    notes: >-
      Безперервний процес не має режиму «наполовину» — лінію тримають на повній швидкості або зупиняють
      цілком. Приклад: зміна міксу (більше концентрату) пояснюється зупинкою відшкодування ПДВ, а не втратою
      потужності процесу. Запитайте, чим це рішення відрізнялося б у дискретному складальному цеху.

  - id: s05-case-toyota
    type: case
    title: Toyota — масове виробництво, перебудоване під потік
    case: toyota-tps
    facts:
      - Автомобіль складається більш ніж із 30 000 деталей — тримати запас кожної неможливо.
      - Just-in-time «пов’язує всі заводи й усі виробничі процеси в безперервний потік».
      - 'Jidoka — «автоматизація з людським обличчям»: обладнання зупиняється самостійно при відхиленні.'
      - Офіційний опис TPS не містить жодної кількісної метрики.
    question: Чим потік одиничних виробів відрізняється від класичного масового виробництва партіями?
    sources: [toyota-production-system]
    notes: >-
      Межа між масовою і безперервною системою — спектр, а не кордон: виробництво лишається масовим за
      обсягом, але перебудованим під логіку, ближчу до безперервного потоку. Приклад: kanban і heijunka на
      офіційній сторінці компанії відсутні. Запитайте, які інші масові виробництва рухаються в той самий бік.

  - id: s05-case-novaposhta
    type: case
    title: Нова пошта — великосерійна сервісна система проти індивідуального обслуговування
    case: nova-poshta
    facts:
      - 'Заявлена пропускна здатність сортувального терміналу — до 50 000 посилок/год.'
      - Час перебування посилки в терміналі — не більше 2 хв.
      - 'За 2025 р. доставлено 522 млн посилок (+8,8% р/р), мережа зросла на 32%, до 50 003 точок.'
      - Відділення видачі працює за іншою логікою — черга й індивідуальне обслуговування.
    question: Чому сортувальний термінал і відділення в тому самому підприємстві належать до різних видів систем?
    sources: [nova-poshta-terminal-2021, nova-poshta-2025-results]
    notes: >-
      Сортування — велика серія з високим обсягом і низькою варіативністю маршруту, та сама категорія, що й
      поштовий сервіс у прикладах навчальної літератури. Межа кейсу: 50 000 посилок/год — пікова, а не
      середня потужність. Запитайте, яка частина відомого аудиторії сервісу ближча до серійної, а яка — до
      одиничної.

  - id: s05-case-ukrzaliznytsia
    type: case
    title: Укрзалізниця — мережева сервісна система без запасу на складі
    case: ukrzaliznytsia
    facts:
      - '«Продукт» перевезення існує лише в момент надання — його не можна виготовити наперед.'
      - У 2024 р. відремонтовано 24 233 вантажні вагони (+18,7% р/р), 48% — приватний парк.
      - З 01.01.2026 — тестова експлуатація автоматизованого розподілу вагонів у ремонт.
      - Мета системи — «єдина прозора черга на ремонт» за однаковими правилами для всіх клієнтів.
    question: Чому потужність такої системи не можна виміряти обсягом запасу на складі, як у виробництві?
    sources: [ukrzaliznytsia-wagons-repaired-2024, ukrzaliznytsia-automated-distribution-2025]
    notes: >-
      Потужність мережевої сервісної системи вимірюють графіком руху й ремонтною спроможністю. Приклад:
      автоматизований розподіл вагонів — керування чергою між кількома паралельними ремонтними потужностями.
      Межа кейсу: зростання обсягу ремонту не доводить, що дефіцит потужностей закрито. Запитайте, яку ще
      мережеву послугу аудиторія назвала б, де запас неможливий.

  - id: s06-section
    type: section
    number: 6
    title: Показники потоку операційної системи й закон Літтла
    notes: >-
      Шосте, останнє питання теми. Три величини — пропускна здатність, незавершене виробництво, час
      перебування — зв’язані одним рівнянням для будь-якої системи. Повертаємося до головоломки з першого
      слайда.

  - id: s06-throughput
    type: bullets
    title: Пропускна здатність і незавершене виробництво
    bullets:
      - 'Пропускна здатність — темп, з яким система приймає й випускає одиниці за одиницю часу.'
      - Незавершене виробництво — середня кількість одиниць усередині системи в будь-який момент.
      - Середній час перебування — від входу одиниці до її виходу із системи.
      - У стійкому стані темп надходження дорівнює темпу виходу.
    sources: [hevko-2017]
    notes: >-
      Три величини легко виміряти ззовні, не знаючи, що відбувається всередині системи. Приклад: черга
      пацієнтів, вагони в ремонті, замовлення в цеху — та сама логіка. Запитайте, яку з трьох величин
      найлегше виміряти на знайомому аудиторії підприємстві.

  - id: s06-figure
    type: figure
    title: Закон Літтла — операційна система як труба
    figure: fig-04-littles-law.svg
    caption: Незавершене виробництво дорівнює добутку пропускної здатності на середній час перебування в системі.
    sources: [hevko-2017]
    notes: >-
      Розберіть малюнок зліва направо: темп входу дорівнює темпу виходу в стійкому стані, а крапки всередині
      труби — це L. Приклад: формула не залежить від того, що саме рухається трубою. Запитайте, що станеться
      з W, якщо L зросте, а λ лишиться незмінною.

  - id: s06-formula
    type: formula
    title: Закон Літтла
    formula: L = λ · W
    explanation:
      - L — середня кількість одиниць у системі (незавершене виробництво).
      - λ — пропускна здатність, темп надходження одиниць у систему.
      - W — середній час перебування однієї одиниці в системі.
      - Дійсний у стійкому стані для будь-якої черги чи запасу в процесі.
      - Показник має код CAP-04 у розрахунковій базі курсу.
    sources: [hevko-2017]
    notes: >-
      Це тотожність, а не причинне пояснення: вона не каже, чому L велике, лише те, що три величини мусять
      узгоджуватися. Приклад: якщо відомі будь-які дві величини, третя визначена однозначно. Запитайте,
      яку з трьох величин аудиторія вимірювала б першою на реальному підприємстві.

  - id: s06-worked
    type: bullets
    title: Розрахунок — навчальні дані
    bullets:
      - 'Цех: λ = 40 замовлень/добу, L = 100 замовлень, тоді W = 100 / 40 = 2,5 доби.'
      - 'Скоротили незавершене виробництво до 60 замовлень при тій самій λ: W = 60 / 40 = 1,5 доби.'
      - 'Лікарня: λ = 6 пацієнтів/год, W = 4 год, тоді L = 6 · 4 = 24 пацієнти одночасно.'
      - Пропускна здатність не змінилася — швидше замовлення проходять лише тому, що скоротили чергу всередині.
    sources: [hevko-2017]
    notes: >-
      Поверніться до цеху, заводу й відділення пошти з першого слайда: те саме рівняння описує чергу деталей,
      партію насіння й потік посилок. Приклад управлінського висновку: щоб пришвидшити виконання замовлень,
      не завжди потрібно нарощувати потужність — часто досить прибрати причини накопичення черги. Запитайте,
      яке з двох чисел — λ чи L — легше змінити на практиці.

  - id: summary
    type: summary
    title: Підсумок теми
    bullets:
      - Системний підхід вимагає декомпозиції й синтезу; оптимум цілого не дорівнює сумі оптимумів частин.
      - Операційна система — модель «вхід — перетворення — вихід» із зворотним зв’язком і чотирма критеріями сформованості.
      - Три підсистеми — переробна, забезпечення, планування й контроль — і остання не дає локальним оптимумам програвати системі.
      - П’ять видів систем утворюють спектр за обсягом і повторюваністю, а не набір непроникних категорій.
      - Закон Літтла L = λ · W зв’язує пропускну здатність, незавершене виробництво й час перебування для будь-якої черги.
    sources: [omelianenko-osokina-2016, hevko-2017]
    notes: >-
      Поверніться до питання з титульного слайда: аудиторія тепер має власне рівняння, яким можна порівняти
      цех, завод і відділення пошти. Приклад: скорочення незавершеного виробництва при незмінній пропускній
      здатності завжди скорочує строк проходження. Запитайте, яку операційну систему зі знайомих аудиторії
      підприємств вони б класифікували першою, використавши сьогоднішній інструментарій.
