annotation: >-
  Дисципліна формує розуміння того, як влаштована операційна діяльність підприємства й чим саме керує операційний
  менеджер: як проєктується операційна система, як планується завантаження потужностей, запаси й матеріальні
  потреби, як складається і контролюється графік робіт і як забезпечується якість та продуктивність. Курс
  розрахунковий: кожна тема закінчується задачею, яку студент розв’язує в тренажері й перевіряє за формулою
  з перевіреної бази. Матеріал спирається на сучасні українські й міжнародні підручники з операційного
  менеджменту та на стандарти систем управління якістю.
goal: >-
  Сформувати здатність організовувати операційну діяльність підприємства: аналізувати операційну систему,
  обґрунтовувати рішення щодо її проєктування та поточного функціонування й доводити їх розрахунком.
objectives:
  - Пояснити місце операційного менеджменту в системі менеджменту підприємства, його функції, принципи й методи.
  - Навчити розробляти операційну стратегію та обирати операційні пріоритети відповідно до стадії життєвого циклу продукту.
  - Сформувати вміння класифікувати операційні системи й описувати операційні процеси в просторі й часі.
  - Навчити виконувати розрахунки операційного менеджменту — тривалість виробничого циклу, балансування лінії, норми часу, прогноз попиту, розмір замовлення, потреба в матеріалах, критичний шлях, показники якості й продуктивності.
  - Сформувати навички оперативного планування й контролю виконання робіт, зокрема засобами управління проєктами.
  - Розвинути здатність оцінювати результативність операційної системи й обґрунтовувати заходи з підвищення продуктивності та якості.

integralCompetence:
  statement: >-
    Здатність розв’язувати складні спеціалізовані задачі та практичні проблеми, які характеризуються комплексністю
    і невизначеністю умов, у сфері менеджменту або у процесі навчання, що передбачає застосування теорій та методів
    соціальних та поведінкових наук.
  ref: { doc: education-standard, section: '2.2' }

