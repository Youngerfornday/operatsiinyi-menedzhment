literature:
  verification: >-
    Перевірка виконана 2026-09-22 прямими запитами (curl/WebFetch) до першоджерел, оскільки штатний
    пошук (WebSearch) вичерпав ліміт сесії ще до старту роботи — інші п’ять агентів паралельно
    використовували той самий бюджет. Українські видання підтверджені через офіційні
    інституційні репозиторії DSpace відповідних закладів (elartu.tntu.edu.ua, dspace.mnau.edu.ua,
    dspace.luguniv.edu.ua, dspace.pdau.edu.ua, ir.stu.cn.ua) і сайт КНЕУ; закордонні — через
    Open Library (ISBN-13 звірено арифметично контрольною цифрою) і профіль автора в Google Scholar.
    З перелічених у силабусі підтверджено існування та рік >=2016: Старченко/Калінько/Косач
    (Кондор, 2020 — підтверджено бібліографічним записом у профілі І. В. Калінько на Google Scholar;
    окремої сторінки видавця чи бібліотечного каталогу знайти не вдалося, тому дане джерело потребує
    ручної перевірки перед публікацією), Снітко/Завгородня (ЛНУ ім. Тараса Шевченка, 2021, запис
    dspace.luguniv.edu.ua/xmlui/handle/123456789/8544), Гевко (ТНТУ, 2017, elartu.tntu.edu.ua/handle/lib/21300),
    Кушнірук (МНАУ, 2017, dspace.mnau.edu.ua/jspui/handle/123456789/2078), Омельяненко/Осокіна
    (КНЕУ, 2016, ISBN 978-966-926-059-8 звірено — коректний). Маркіна/Помаз/Помаз в інституційному
    репозиторії ПДАУ (dspace.pdau.edu.ua, заклад перейменовано з ПДАА) датовано 2019 роком, а не
    2018, як у силабусі, — включено з реальним роком видання, розбіжність зазначаю тут. Капінос/Бабій
    (ЦУЛ, 2013) і Ратушняк (ВНТУ, 2015) не включені — обидва старіші за поріг 2016 року, як і зазначено
    у завданні. Закордонні видання підібрані як найновіші видання >=2016 зі знайденими коректними
    ISBN-13: Heizer/Render/Munson (Pearson, 2016), Stevenson (McGraw-Hill, 2020), Jacobs/Chase
    (McGraw-Hill, 2019), Slack/Brandon-Jones (Pearson, «Operations and Process Management», 2021 —
    саме це спільне видання двох авторів знайдено з коректним ISBN; більш ранні видання серії мають
    співавторів Chambers/Johnston і/або рік <2016). Стандарти ISO (9000:2015, 9001:2015, 22400-1:2014)
    посилаються на en-standard.eu, бо офіційний iso.org віддає автоматизованим запитам 403 (захист
    від ботів); заголовки сторінок en-standard.eu дослівно збігаються з назвами стандартів — перевірено
    наживо. Для ДСТУ ISO 9001:2015 окремий каталожний запис
    не знайдено (пошук на uas.gov.ua виконується через JS і недоступний curl-запиту), тому посилання
    веде на каталог національних стандартів УкрАгентства зі стандартизації загалом, а не на конкретний
    запис — потребує ручного уточнення. Номери розділів у полях ref.section для normative — послідовні
    заглушки '1'..'3', бо docs/research/standards-baseline.md пише паралельний агент; їх треба звірити
    після завершення цього документа. Держстат: офіційний домен www.ukrstat.gov.ua віддає прострочений
    TLS-сертифікат, тому як url узято robochий дзеркальний домен stat.gov.ua (наразі показує сторінку
    техобслуговування, але домен коректний і резолвиться). Усього перевірено арифметичною контрольною
    цифрою 5 ISBN-13 (усі коректні): 9789669260598, 9780134163512, 9781260575712, 9781260238884,
    9781292350103; для решти видань ISBN не наведено, бо не знайдено надійного джерела для звірки.
    Посилання на стандарти ISO 9000:2015, ISO 9001:2015 та ISO 22400-1:2014 ведуть на en-standard.eu:
    сайт iso.org блокує автоматизовані запити (403 від захисту від ботів), тоді як сторінки en-standard.eu
    відкрилися (200) і заголовки сторінок збіглися з назвами стандартів дослівно — це підтверджена,
    а не здогадана відповідність.
