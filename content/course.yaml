      - Статистичний контроль процесу — контрольні карти за кількісною та альтернативною ознакою.
      - Придатність процесу — індекси Cp і Cpk; вартість якості.
      - Реалізація функції якості як спосіб залучення споживача до операційного процесу.
      - Показники результативності операційних систем і управління продуктивністю.
    hours: { lectures: 4, selfStudy: 14 }
    selfStudyTasks:
      - task: Прочитати лонгрід теми 8 і пройти самоперевірку.
        hours: 4
      - task: За вибірками з двадцяти підгруп побудувати карти середніх і розмахів, визначити межі та знайти сигнали розладнання.
        hours: 4
      - task: Розрахувати Cp і Cpk для двох процесів і пояснити, чому процес із високим Cp може мати низький Cpk.
        hours: 3
      - task: Скласти структуру витрат на якість для умовного підприємства й запропонувати перерозподіл між попередженням і контролем.
        hours: 1
      - task: Пройти тренувальний тест теми 8.
        hours: 2

# ПРН — коди й формулювання силабуса. Розбіжність зі стандартом і з ОПП університету описана
# в docs/research/education-standard.md, розділ 2.7, і винесена на звірку з кафедрою.
    cases:
      - case: ukrposhta
        focus: Законодавчий SLA (85% відправлень Д+3, 97% Д+5) проти власного показника своєчасності 97,8–98,02% — вимірювання
          якості сервісу проти зовнішньої норми.
      - case: ferrexpo
        focus: Собівартість одиниці (C1 76,3 дол./т окатишів, C4 50,3 дол./т концентрату) і LTIFR як показники процесу,
          що змінюються під впливом зовнішніх, а не технологічних факторів.
      - case: interpipe-steel
        focus: Продуктивність праці 1 367 т сталі на працівника за рік і екологічні показники процесу (≤250 кг CO₂ на
          тонну сталі) як заявлені результати проєктних рішень.
      - case: intel-copy-exactly
        focus: Чотирирівневе статистичне зіставлення і пряма заборона «компенсаційних підлаштувань» — дисципліна SPC,
          застосована до трансферу процесу.
      - case: amazon-fulfillment
        focus: Заявлена продуктивність (1 млн роботів, 75% замовлень за участю роботів) проти даних про травматизм,
          порахованих зі звітності самої компанії до OSHA.
      - case: toyota-tps
        focus: 'Jidoka й андон як «вбудована якість»: зупинити процес при відхиленні замість контролю на виході.'
      - case: southwest-airlines
        focus: 'Вартість неякості сервісу: 140 млн дол. штрафу і понад 600 млн дол. повернень після зриву грудня 2022
          р.'
