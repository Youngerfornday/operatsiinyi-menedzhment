# Кейси — з docs/research/cases.md; повна фабула розповідається лише в основній темі (primaryTopic),
# в інших темах кейс подається окремим фокусом. caveat називає те, що першоджерелом не підтверджено.
cases:
  - id: nova-poshta
    title: 'Нова Пошта: сортувальні центри та пропускна здатність'
    region: ua
    primaryTopic: t05
    ref:
      doc: cases
      section: '1'
    caveat: усі показники потужності й мережі — позиція компанії (пресрелізи, екскурсія, власний сайт); незалежного
      аудиту пропускної здатності не знайдено. Сторінка «Nova Post сьогодні» не має дати актуальності й розходиться
      з релізом за 2025 р. (13 тис. проти 15,8 тис. відділень) — ці набори не змішувати.
  - id: ukrposhta
    title: 'Укрпошта: нормативна мережа, законодавчий SLA і автоматизація сортування'
    region: ua
    primaryTopic: t05
    ref:
      doc: cases
      section: '2'
    caveat: 'усі показники потужності ліній («5 посилок/с», «18 тис./год», «2 млн/добу», «у 8 разів») — позиція
      компанії, навіть коли їх передруковує міністерство; незалежного аудиту немає. Офіційно верифіковані держджерелом
      лише мережа, чисельність працівників і річні обсяги 2025 р. Дати повної автоматизації розходяться: міністерство
      пише «завершила у 2025 році», компанія оголошує повну автоматизацію 18.05.2026 — імовірно, це різні етапи
      (посилки проти листів, газет і ліків). Чинність наказу № 959 окремо в реєстрі не звірялася (сторінка оператора
      подає нормативи як діючі).'
  - id: interpipe-steel
    title: 'Інтерпайп Сталь: електросталеплавильний комплекс і балансування переділів'
    region: ua
    primaryTopic: t05
    ref:
      doc: cases
      section: '3'
    caveat: 'усі паспортні параметри — з власного сайту заводу, сторінки без дати публікації; незалежного технічного
      підтвердження немає. Обсяг інвестицій компанія подає двояко: **700 млн дол.** (сайт заводу, сам комплекс)
      і **1 млрд дол.** (ювілейний реліз, «разом із суміжними виробництвами») — наводити обидві цифри з поясненням
      меж проєкту. Чисельність теж розходиться: «понад 700 нових робочих місць» на сайті проти 555 осіб у галузевому
      профілі (близько 2020 р.). Заводські обсяги випуску публічні лише до 2020 р.; з 2022 р. публікуються показники
      групи.'
  - id: kernel
    title: 'Kernel: елеватори, олієпресові заводи і використання потужностей'
    region: ua
    primaryTopic: t03
    ref:
      doc: cases
      section: '4'
    caveat: основне джерело — аудований річний звіт (найвищий рівень верифікації серед українських кейсів), але
      текст видобуто з двоколонкового PDF автоматично, тож прив’язку окремих цифр ємності до конкретних терміналів
      варто звірити візуально за оригіналом перед лекцією. Сайт компанії (`kernel.ua/about`) станом на 2026-09-22
      подає потужність переробки 3,5 млн т/рік і перевалку 6,5 млн т/рік, що розходиться зі звітом FY2025 (4,0 і
      11 млн т) — сторінка сайту не оновлена, у курсі користуватися цифрами звіту.
  - id: ferrexpo
    title: 'Ferrexpo: окомкування залізної руди під логістичним і енергетичним шоком'
    region: ua
    primaryTopic: t04
    ref:
      doc: cases
      section: '5'
    caveat: фінансові й виробничі цифри — з аудованих регуляторних звітів (найвищий рівень верифікації серед українських
      кейсів); опис технологічного процесу й номінальна потужність узяті зі сторінки сайту з даними 2021 р. — рівень
      верифікації нижчий і дані застарілі. Цифра «12 млн т/рік номінальної потужності», що трапляється у галузевих
      оглядах, походить не від компанії — не використовувати.
  - id: ajax-systems
    title: 'Ajax Systems: власне виробництво електроніки і рішення про розміщення'
    region: ua
    primaryTopic: t01
    ref:
      doc: cases
      section: '6'
    caveat: Ajax Systems — приватна компанія без аудованої публічної звітності; усі операційні цифри походять або
      з власних заяв компанії, або з переказу медіа на їх основі. Показники персоналу розходяться між джерелами
      (2 800 осіб у недатованому FAQ проти 5 000 у підсумках 2025 р.) — не використовувати як синхронні.
  - id: ukrzaliznytsia
    title: 'Укрзалізниця: ремонт рухомого складу, черга в ремонт і інфраструктурні проєкти'
    region: ua
    primaryTopic: t06
    ref:
      doc: cases
      section: '7'
    caveat: більшість кількісних даних УЗ походять з офіційних повідомлень компанії й міністерства, ретрансльованих
      галузевою пресою, а не з аудованої звітності — рівень верифікації нижчий, ніж у Ferrexpo чи Kernel. Офіційної
      статистики пунктуальності руху (on-time performance) у відкритому доступі не знайдено взагалі; довоєнні показники
      (98,5% для поїздів далекого сполучення за 2017 р.) походять з аналітичної публікації без опису методики і
      для сучасних задач непридатні.
  - id: toyota-tps
    title: 'Toyota Production System: становлення операційного менеджменту як системи'
    region: international
    primaryTopic: t01
    ref:
      doc: cases
      section: '8'
    caveat: усе, що є, — офіційна сторінка Toyota (якісний опис без чисел) і вторинні джерела про історичний період.
      Окрема офіційна сторінка про just-in-time за адресою `…/production-system/just-in-time.html` повертає 404
      — посилатися лише на загальну сторінку. Книга Тайіті Оно (1988) як першоджерело в цій сесії не перевірялася.
  - id: zara-inditex
    title: 'Zara / Inditex: короткий цикл поставки у fast fashion'
    region: international
    primaryTopic: t02
    ref:
      doc: cases
      section: '9'
    caveat: сторінка з даними про постачальників і час доставки **не датована**, у тексті вжито «last year» без
      зазначення року — цифри 1 790 / 8 756 / 50% не можна впевнено віднести до FY2025. Кількість власних фабрик
      у вторинних джерелах трапляється як 11 проти офіційних 9. PDF річного звіту FY2025 у цій сесії не розпарсено;
      усі цифри — з HTML-версії пресрелізу і FAQ.
  - id: amazon-fulfillment
    title: 'Amazon fulfillment: робототехніка складу і компроміс продуктивність — безпека праці'
    region: international
    primaryTopic: t04
    ref:
      doc: cases
      section: '10'
    caveat: 'усі цифри робототехніки — позиція компанії; незалежного аудиту немає. Дві офіційні сторінки Amazon
      у різних регіональних версіях подають різний набір фактів: показник «75% замовлень за участю роботів» є у
      британській версії матеріалу і відсутній у американській — цитувати з тієї сторінки, де він справді є. Широко
      цитовані цифри про об’єкт у Шарлтоні (Массачусетс), «−25% часу обробки» і «+30% безпеки» у перевірених офіційних
      джерелах **не знайдено** — не використовувати **[пошук]**. Первинні документи OSHA і звіт сенатського комітету
      відкрити не вдалося (403), тому дані про травматизм наведено за матеріалом ділового медіа, що цитує звіт коаліції.'
  - id: boeing-787
    title: 'Boeing 787 Dreamliner: глобальний аутсорсинг і зрив термінів програми'
    region: international
    primaryTopic: t07
    ref:
      doc: cases
      section: '11'
    caveat: 'офіційний пресреліз Boeing фіксує лише факт передачі першого літака і не містить жодного опису затримок;
      хронологія зсувів графіка 2007–2011 рр. зведена з вторинних джерел і **не звірена з першоджерелом**. Повний
      текст звіту NTSB (PDF) відкрити не вдалося; зміст наведено за офіційною сторінкою розслідування, де перелік
      номерів рекомендацій (A-14-032 — A-14-036 і A-14-113 — A-14-130) дає **23** позиції, тоді як у зведенні сторінки
      трапляється число 25 — перед цитуванням звірити за повним текстом. Окремого звіту GAO саме про аутсорсингову
      модель 787 не знайдено: GAO-11-849 присвячений нагляду FAA за композитними конструкціями і **не є** джерелом
      про причини затримок.'
  - id: southwest-airlines
    title: 'Southwest Airlines: уніфікований парк, швидкий розворот і колапс планування екіпажів (2022)'
    region: international
    primaryTopic: t02
    ref:
      doc: cases
      section: '12'
    caveat: сторінка пресрелізу DOT віддає автоматичному клієнту 403; її текст прочитано `2026-09-22` через сторонній
      текстовий проксі, тому цитати подано як зміст пресрелізу, а не як вивірений текст самого наказу; дату наказу
      в різних джерелах подають по-різному. Кількість скасованих рейсів у медіа коливається (16 700 / 16 900); тут
      наведено цифру з пресрелізу DOT. Свідчення SWAPA — документ сторони.
  - id: intel-copy-exactly
    title: 'Intel «Copy Exactly!»: точне відтворення техпроцесу між фабриками'
    region: international
    primaryTopic: t05
    ref:
      doc: cases
      section: '13'
    caveat: усе, що є, — первинна публікація 1998 р. плюс заява керівника в тому самому випуску. Документ фіксує
      момент створення методу для покоління 0,5 мкм; поширене датування «з 1980-х» суперечить тексту. Інформаційний
      листок про Fab 32 (2007 р.) методології **не згадує**, тому зв’язок конкретних заводів із Copy Exactly лишається
      непідтвердженим **[пошук]**, як і повідомлення про перегляд підходу в Intel Foundry у 2020-х.
  - id: tesla-model3-ramp
    title: 'Tesla, Model 3: нарощування потужності й рівень автоматизації (2017–2018)'
    region: international
    primaryTopic: t06
    ref:
      doc: cases
      section: '14'
    caveat: усі виробничі числа — з первинних розкриттів компанії (SEC), але це **заяви емітента**, а не аудовані
      виробничі показники. Два документи за 1 кв. 2018 р. дають різні тижневі темпи (2 020 у квартальному релізі
      на початку квітня і 2 270 у листі акціонерам від 2 травня) — це різні тижні, а не суперечність; наводити з
      датами. Цитату Маска про «надмірну автоматизацію» взято з ділового видання; сам допис як живу сторінку не
      відкривався. Сторінки `ir.tesla.com` і `digitalassets.tesla.com` віддають 403/404 автоматичним клієнтам —
      посилатися лише на EDGAR.

practicals:
  - id: p01
    module: m1
    topics: [t01]
    title: Операційна функція підприємства і вимірювання продуктивності
    hours: 4
    goal: Навчитися відокремлювати операційну функцію від інших функцій підприємства й вимірювати продуктивність операційної системи різними способами.
    results:
      - Визначати склад операційної функції підприємства та її входи, перетворення й виходи.
      - Розраховувати часткову й багатофакторну продуктивність і пояснювати розбіжність висновків за різними показниками.
    prn: [prn03]
    trainers: [productivity]
    tasks:
      - За описом підприємства виділити операційну функцію, назвати входи, процес перетворення й виходи та відокремити їх від маркетингової й фінансової функцій.
      - У тренажері розрахувати часткову продуктивність за працею, за матеріалами й за енергією та багатофакторну продуктивність за два періоди.
      - Пояснити письмово, чому зростання продуктивності за працею може супроводжуватися падінням багатофакторної продуктивності, і назвати два управлінські рішення, що дають такий ефект.
    rubric:
      - title: Опис операційної функції
        points: 2
        levels:
          - { points: 2, description: 'Операційну функцію виділено правильно, входи, перетворення й виходи названо повно, межі з іншими функціями обґрунтовано.' }
          - { points: 1, description: Операційну функцію виділено, але склад входів і виходів неповний або межі не обґрунтовано. }
          - { points: 0, description: Операційну функцію не виділено або описано помилково. }
      - title: Розрахунок продуктивності
        points: 2
        levels:
          - { points: 2, description: 'Усі показники розраховано правильно, одиниці вимірювання узгоджені, результат подано за формулами бази.' }
          - { points: 1, description: 'Розрахунки містять арифметичну помилку або неузгоджені одиниці, але метод обрано правильно.' }
          - { points: 0, description: Розрахунків немає або метод обрано помилково. }
      - title: Тлумачення результату
        points: 1
        levels:
          - { points: 1, description: Пояснено розбіжність показників і названо щонайменше два управлінські рішення, що її спричиняють. }
          - { points: 0, description: Пояснення немає або воно переказує визначення. }
    data:
      - title: Державна служба статистики України — показники продуктивності праці й обсягів промислової продукції
        ref: { doc: data-sources, section: '1' }
        url: https://www.ukrstat.gov.ua/

  - id: p02
    module: m1
    topics: [t02]
    title: Операційна стратегія та операційні пріоритети підприємства
    hours: 4
    goal: Навчитися обґрунтовувати набір операційних пріоритетів підприємства й показувати, чим за кожен пріоритет заплачено.
    results:
      - Визначати провідний операційний пріоритет підприємства за описом його ринку та операцій.
      - Пояснювати компроміси між пріоритетами й зв’язок операційної стратегії зі стадією життєвого циклу продукту.
    prn: [prn03, prn20]
    trainers: [priorities-matrix]
    tasks:
      - У тренажері зіставити операційні пріоритети з рішеннями операційного менеджменту (потужність, розміщення, запаси, персонал, якість) і знайти суперечливі поєднання.
      - Для трьох підприємств різних галузей визначити провідний пріоритет, назвати кваліфікаційні вимоги ринку й виграшну характеристику замовлення.
      - Скласти план змін в операційній системі для переходу продукту зі стадії зростання на стадію зрілості.
    rubric:
      - title: Матриця пріоритетів і рішень
        points: 2
        levels:
          - { points: 2, description: Зіставлення правильне не менш ніж на 90%, суперечливі поєднання знайдено й пояснено. }
          - { points: 1, description: Зіставлення правильне на 60–89% або суперечності названо без пояснення. }
          - { points: 0, description: Зіставлення правильне менш ніж на 60% або завдання не виконано. }
      - title: Визначення пріоритетів підприємств
        points: 2
        levels:
          - { points: 2, description: 'Для кожного підприємства визначено провідний пріоритет, розмежовано кваліфікаційні вимоги й виграшну характеристику.' }
          - { points: 1, description: Пріоритети визначено, але кваліфікаційні вимоги й виграшну характеристику не розмежовано. }
          - { points: 0, description: Пріоритети не визначено або визначено без обґрунтування. }
      - title: План змін за стадією життєвого циклу
        points: 1
        levels:
          - { points: 1, description: План містить конкретні зміни в операційній системі, узгоджені зі стадією життєвого циклу. }
          - { points: 0, description: Плану немає або він не пов’язаний зі стадією життєвого циклу. }
    data:
      - title: Державна служба статистики України — структура реалізованої продукції за видами економічної діяльності
        ref: { doc: data-sources, section: '1' }
        url: https://www.ukrstat.gov.ua/

  - id: p03
    module: m1
    topics: [t03, t04]
    title: Операційна система і тривалість виробничого циклу
    hours: 4
    goal: Навчитися класифікувати операційну систему й розраховувати тривалість виробничого циклу при різних видах руху партій деталей.
    results:
      - Класифікувати операційну систему за типом виробництва й характером перетворення.
      - Розраховувати тривалість виробничого циклу при послідовному, паралельному й паралельно-послідовному русі та обґрунтовувати вибір виду руху.
      - Застосовувати закон Літтла для оцінювання строку проходження замовлення.
    prn: [prn24]
    trainers: [little-law, production-cycle]
    tasks:
      - За описами чотирьох підприємств визначити тип операційної системи й обґрунтувати віднесення за трьома ознаками.
      - У тренажері розрахувати тривалість циклу для партії деталей при трьох видах руху та побудувати графіки.
      - Розв’язати дві задачі на закон Літтла й оцінити, як скорочення незавершеного виробництва змінює строк виконання замовлення.
    rubric:
      - title: Класифікація операційних систем
        points: 1
        levels:
          - { points: 1, description: Усі чотири системи класифіковано правильно з обґрунтуванням за ознаками. }
          - { points: 0.5, description: Класифіковано правильно дві або три системи. }
          - { points: 0, description: Класифіковано правильно менше двох систем. }
      - title: Тривалість виробничого циклу
        points: 3
        levels:
          - { points: 3, description: 'Розрахунки за трьома видами руху правильні, графіки побудовано, вибір виду руху обґрунтовано.' }
          - { points: 2, description: Розрахунки правильні, але графіків немає або вибір не обґрунтовано. }
          - { points: 1, description: Правильно виконано лише один вид руху. }
          - { points: 0, description: Розрахунків немає або всі помилкові. }
      - title: Закон Літтла
        points: 1
        levels:
          - { points: 1, description: Обидві задачі розв’язано правильно, вплив незавершеного виробництва на строк пояснено. }
          - { points: 0, description: Задачі не розв’язано або розв’язано помилково. }
    data:
      - title: Відкриті дані підприємств — довідники норм часу й технологічних процесів
        ref: { doc: data-sources, section: '5' }
        url: https://data.gov.ua/

  - id: p04
    module: m2
    topics: [t05]
    title: Проектування операційної системи — розміщення, балансування лінії, нормування праці
    hours: 4
    goal: Навчитися обґрунтовувати рішення щодо розміщення об’єкта, балансувати потокову лінію й розраховувати норми праці.
    results:
      - Обирати місце розташування об’єкта методом вагових коефіцієнтів і методом центру ваги та пояснювати розбіжність результатів.
      - Балансувати потокову лінію за заданим тактом і оцінювати її ефективність.
      - Розраховувати норму часу й норму виробітку за даними спостережень.
    prn: [prn20, prn24]
    trainers: [facility-location, line-balancing, work-measurement]
    tasks:
      - У тренажері обрати майданчик для нового складу методом вагових коефіцієнтів і перевірити результат методом центру ваги.
      - Збалансувати потокову лінію з восьми операцій під заданий такт, визначити кількість робочих місць і ефективність балансу.
      - За хронометражними даними розрахувати норму часу й норму виробітку та пояснити склад штучного часу.
    rubric:
      - title: Вибір розміщення
        points: 2
        levels:
          - { points: 2, description: 'Обидва методи застосовано правильно, розбіжність результатів пояснено, рішення обґрунтовано.' }
          - { points: 1, description: Застосовано лише один метод або розбіжність не пояснено. }
          - { points: 0, description: Методів не застосовано або результати помилкові. }
      - title: Балансування лінії
        points: 2
        levels:
          - { points: 2, description: 'Такт, кількість робочих місць і ефективність балансу розраховано правильно, закріплення операцій не порушує послідовності.' }
          - { points: 1, description: Баланс побудовано з порушенням послідовності операцій або з помилкою в ефективності. }
          - { points: 0, description: Лінію не збалансовано. }
      - title: Нормування праці
        points: 1
        levels:
          - { points: 1, description: Норму часу й норму виробітку розраховано правильно, склад штучного часу пояснено. }
          - { points: 0, description: Розрахунків немає або вони помилкові. }
    data:
      - title: Відкриті дані про логістику й розміщення об’єктів
        ref: { doc: data-sources, section: '5' }
        url: https://data.gov.ua/

  - id: p05
    module: m2
    topics: [t06]
    title: Прогнозування попиту та агрегатне планування
    hours: 4
    goal: Навчитися будувати прогноз попиту кількома методами, оцінювати його точність і складати агрегатний план.
    results:
      - Будувати прогноз методами ковзної середньої, зваженої ковзної середньої та експоненційного згладжування.
      - Оцінювати точність прогнозу за MAD, MSE і MAPE й обирати метод за результатом оцінювання.
      - Складати агрегатний план і порівнювати стратегії його виконання за сумарними витратами.
    prn: [prn20]
    trainers: [forecasting, aggregate-planning]
    tasks:
      - За рядом попиту з 24 періодів побудувати прогноз трьома методами й порівняти MAD, MSE і MAPE.
      - Підібрати константу згладжування, за якої похибка найменша, і пояснити, чому надто велике значення робить прогноз нестійким.
      - Скласти агрегатний план на шість періодів за стратегією погоні та за стратегією рівномірного виробництва й порівняти витрати.
    rubric:
      - title: Побудова прогнозу
        points: 2
        levels:
          - { points: 2, description: Усі три методи застосовано правильно, розрахунки відтворювані. }
          - { points: 1, description: Застосовано два методи або є арифметичні помилки. }
          - { points: 0, description: Прогноз не побудовано. }
      - title: Оцінювання точності й вибір методу
        points: 2
        levels:
          - { points: 2, description: 'MAD, MSE і MAPE розраховано правильно, метод обрано з обґрунтуванням, вплив константи згладжування пояснено.' }
          - { points: 1, description: Показники розраховано, але вибір методу не обґрунтовано. }
          - { points: 0, description: Точність не оцінено. }
      - title: Агрегатний план
        points: 1
        levels:
          - { points: 1, description: Обидві стратегії прораховано, витрати порівняно, рекомендацію обґрунтовано. }
          - { points: 0, description: План не складено або прораховано лише одну стратегію. }
    data:
      - title: Державна служба статистики України — динаміка обсягів промислової продукції за місяцями
        ref: { doc: data-sources, section: '4' }
        url: https://www.ukrstat.gov.ua/

  - id: p06
    module: m2
    topics: [t06]
    title: Управління запасами і планування потреби в матеріалах
    hours: 4
    goal: Навчитися визначати політику управління запасами розрахунком і виконувати розвертання потреби в матеріалах.
    results:
      - Розраховувати оптимальний розмір замовлення, точку замовлення й страховий запас і оцінювати чутливість витрат до відхилення розміру замовлення.
      - Виконувати розвертання потреби в матеріалах за специфікацією виробу й складати графік замовлень.
      - Упорядковувати черги робіт за правилами пріоритетів і порівнювати результати.
    prn: [prn24]
    trainers: [eoq, mrp, sequencing]
    tasks:
      - Для трьох позицій номенклатури розрахувати EOQ, точку замовлення й страховий запас за заданим рівнем обслуговування.
      - Показати, як зміняться сумарні витрати, якщо відхилитися від EOQ на 20% в обидва боки, і пояснити форму кривої витрат.
      - Виконати розвертання триярусної специфікації виробу, визначити брутто- і нетто-потребу та скласти графік замовлень.
      - Упорядкувати шість робіт за правилами SPT і EDD, порівняти середній час проходження й запізнення.
    rubric:
      - title: Розрахунок параметрів запасів
        points: 2
        levels:
          - { points: 2, description: 'EOQ, точку замовлення й страховий запас розраховано правильно для всіх позицій, рівень обслуговування враховано.' }
          - { points: 1, description: Є помилки в одній позиції або страховий запас розраховано без урахування рівня обслуговування. }
          - { points: 0, description: Розрахунків немає або метод обрано помилково. }
      - title: Розвертання потреби в матеріалах
        points: 2
        levels:
          - { points: 2, description: 'Брутто- і нетто-потребу визначено правильно на всіх рівнях, графік замовлень узгоджено зі строками постачання.' }
          - { points: 1, description: Потребу визначено правильно не на всіх рівнях або строки постачання не враховано. }
          - { points: 0, description: Розвертання не виконано. }
      - title: Упорядкування черги робіт
        points: 1
        levels:
          - { points: 1, description: Обидва правила застосовано правильно, показники порівняно, висновок обґрунтовано. }
          - { points: 0, description: Правил не застосовано або результати помилкові. }
    data:
      - title: Відкриті дані закупівель Prozorro — строки та обсяги постачання
        ref: { doc: data-sources, section: '3' }
        url: https://prozorro.gov.ua/

  - id: p07
    module: m2
    topics: [t07, t08]
    title: Сітьове планування проекту і статистичний контроль якості
    hours: 4
    goal: Навчитися будувати сітьовий графік з визначенням критичного шляху й оцінювати стабільність і придатність процесу статистичними методами.
    results:
      - Будувати сітьовий графік, визначати критичний шлях і резерви часу та оцінювати ймовірність дотримання строку методом PERT.
      - Будувати контрольні карти й тлумачити сигнали розладнання процесу.
      - Розраховувати індекси придатності процесу Cp і Cpk та робити висновок про здатність процесу.
    prn: [prn03, prn24]
    trainers: [cpm-pert, control-charts, process-capability]
    tasks:
      - Побудувати сітьовий графік проекту з дванадцяти робіт, визначити критичний шлях, повні та вільні резерви й побудувати діаграму Ганта.
      - Оцінити ймовірність завершення проекту в заданий строк методом PERT і запропонувати варіант стиснення на два тижні з мінімальним подорожчанням.
      - За двадцятьма підгрупами побудувати карти середніх і розмахів, визначити контрольні межі та знайти сигнали розладнання.
      - Розрахувати Cp і Cpk для двох процесів і пояснити, чому процес із високим Cp може мати низький Cpk.
    rubric:
      - title: Сітьовий графік і критичний шлях
        points: 2
        levels:
          - { points: 2, description: 'Графік побудовано правильно, критичний шлях і резерви визначено, діаграму Ганта складено.' }
          - { points: 1, description: Критичний шлях визначено правильно, але резерви або діаграма Ганта відсутні чи помилкові. }
          - { points: 0, description: Графік не побудовано або критичний шлях визначено помилково. }
      - title: Оцінювання строку та стиснення проекту
        points: 1
        levels:
          - { points: 1, description: Ймовірність строку оцінено методом PERT, варіант стиснення обґрунтовано розрахунком подорожчання. }
          - { points: 0, description: Оцінювання не виконано або виконано без розрахунку. }
      - title: Контрольні карти
        points: 1
        levels:
          - { points: 1, description: 'Карти побудовано, межі розраховано правильно, сигнали розладнання знайдено й витлумачено.' }
          - { points: 0, description: Карт немає або межі розраховано помилково. }
      - title: Придатність процесу
        points: 1
        levels:
          - { points: 1, description: Cp і Cpk розраховано правильно, розбіжність між ними пояснено зміщенням середнього. }
          - { points: 0, description: Індексів не розраховано або висновок помилковий. }
    data:
      - title: ISO 9001 — вимоги до управління якістю продукції та процесів
        ref: { doc: standards-baseline, section: '1' }
        url: https://www.iso.org/iso-9001-quality-management.html

