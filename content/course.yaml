# Лекційні години: 16 лекцій по 2 год = 32 год. Самостійна робота: 120 год.
# Блок cases у кожній темі додається після docs/research/cases.md.
topics:
  - id: t01
    module: m1
    slug: operatsiinyi-menedzhment-yak-funktsiia
    title: Операційний менеджмент як різновид функціонального менеджменту
    summary: Місце операційної функції серед функцій підприємства, історія доктрин, принципи й методи операційного менеджменту, продуктивність як мірило.
    results:
      - statement: Пояснювати сутність операційного менеджменту і його місце серед функціональних підсистем управління підприємством.
        prn: [prn03]
      - statement: Розрізняти наукові підходи до операційного менеджменту й називати внесок ключових етапів його розвитку.
        prn: [prn03]
      - statement: Розраховувати часткову й багатофакторну продуктивність і тлумачити її зміну.
        prn: [prn03]
    lectureQuestions:
      - Сутність і місце операційного менеджменту в системі менеджменту підприємства.
      - Природа та історичний розвиток операційного (виробничого) менеджменту.
      - Наукові підходи до операційного менеджменту — системний, процесний, ситуаційний.
      - Принципи, функції та методи операційного менеджменту.
      - Цілі та основні завдання операційного менеджменту.
      - Категорійний апарат — операція, операційна функція, операційна система.
      - Операційний менеджер і процес управління операціями.
      - Продуктивність операційної системи — часткова, багатофакторна, загальна.
    hours: { lectures: 4, selfStudy: 12 }
    selfStudyTasks:
      - task: Прочитати лонгрід теми 1 і пройти самоперевірку.
        hours: 4
      - task: Скласти таблицю відмінностей операційної функції від маркетингової та фінансової на прикладі одного підприємства.
        hours: 3
      - task: Розрахувати часткову й багатофакторну продуктивність у тренажері за трьома наборами даних і пояснити, чому висновки за різними показниками можуть розходитися.
        hours: 3
      - task: Пройти тренувальний тест теми 1.
        hours: 2
    cases:
      - case: ukrposhta
        focus: 'Універсальна послуга як операційна функція, визначена державою: нормативні строки пересилання є державним
          соціальним стандартом, тобто ціль операційної системи задана ззовні, а не менеджментом.'
      - case: ajax-systems
        focus: Рішення CEO відкрити другий майданчик у Києві як операційний інструмент бізнес-цілі «подвоїти бізнес»
          — найпростіший приклад підпорядкованості операцій стратегії.
      - case: toyota-tps
        focus: Становлення операційного менеджменту як окремої управлінської системи (Сакічі й Кіічіро Тойода, Тайіті
          Оно), а не набору розрізнених прийомів.

  - id: t02
    module: m1
    slug: operatsiina-stratehiia
    title: Операційна стратегія як основа проектування операційної системи
    summary: Етапи розробки операційної стратегії, операційні пріоритети та компроміси між ними, виражена компетентність, вплив життєвого циклу продукту.
    results:
      - statement: Пояснювати зв’язок корпоративної та операційної стратегії й називати етапи розробки операційної стратегії.
        prn: [prn03]
      - statement: Обґрунтовувати набір операційних пріоритетів підприємства й компроміси між ними.
        prn: [prn20]
      - statement: Визначати вплив стадії життєвого циклу продукту на вибір операційної стратегії.
        prn: [prn20]
      - statement: Відрізняти стратегії виробничих процесів від стратегій сервісних процесів.
        prn: [prn03]
    lectureQuestions:
      - Сутність операційної стратегії; стратегія і тактика в управлінні операційною системою.
      - Етапи розробки операційної стратегії та її місце в ієрархії стратегій.
      - Формування стратегії виробництва товару.
      - Розробка стратегії процесу; особливості стратегій сервісних процесів.
      - Операційні пріоритети — витрати, якість і надійність, час, гнучкість — і компроміси між ними.
      - Поняття «виражена компетентність» і «конкурентоспроможність операційної системи».
      - Вплив життєвого циклу продукту на операційну стратегію.
    hours: { lectures: 4, selfStudy: 14 }
    selfStudyTasks:
      - task: Прочитати лонгрід теми 2 і пройти самоперевірку.
        hours: 4
      - task: Для двох підприємств різних галузей визначити провідний операційний пріоритет і показати, чим за нього заплачено.
        hours: 4
      - task: Побудувати матрицю «операційні пріоритети × рішення операційного менеджменту» у тренажері й на прикладі двох рішень пояснити, чому їх важко однозначно віднести до одного пріоритету.
        hours: 4
      - task: Пройти тренувальний тест теми 2.
        hours: 2
    cases:
      - case: kernel
        focus: Вертикальна інтеграція «елеватори → олієекстракційні заводи → портові термінали» як стратегічний вибір
          меж операційного ланцюга.
      - case: ferrexpo
        focus: Залежність від єдиного логістичного каналу (чорноморські порти) як стратегічний операційний ризик і переорієнтація
          на залізницю та європейських клієнтів.
      - case: zara-inditex
        focus: 'Quick response: половина фінальних виробників поруч зі штаб-квартирою і 900 млн євро на рік у логістичні
          потужності — швидкість куплена ціною вищих витрат.'
      - case: southwest-airlines
        focus: Уніфікований парк Boeing 737 плюс point-to-point як узгоджений набір структурних рішень під пріоритет
          «низькі витрати за рахунок високої утилізації літака».

  - id: t03
    module: m1
    slug: operatsiina-systema-orhanizatsii
    title: Операційна система організації — поняття, склад та види
    summary: Системний підхід до операційного менеджменту, склад операційної системи, класифікація операційних систем і закон Літтла як міра потоку.
    results:
      - statement: Описувати операційну систему підприємства через вхід, перетворення, вихід і зворотний зв’язок.
        prn: [prn03]
      - statement: Класифікувати операційну систему за типом виробництва, характером перетворення та ступенем повторюваності.
        prn: [prn24]
      - statement: Застосовувати закон Літтла для зв’язку незавершеного виробництва, пропускної здатності й тривалості проходження замовлення.
        prn: [prn24]
    lectureQuestions:
      - Сутність системного підходу до операційного менеджменту.
      - Операційна система як об’єкт управління — вхід, процес перетворення, вихід, зворотний зв’язок.
      - Підсистеми операційної системи — переробна, забезпечення, планування й контролю.
      - Класифікаційні підходи до операційних систем.
      - Характеристика операційних систем різних видів — проектна, дрібносерійна, масова, безперервна.
      - Показники потоку операційної системи й закон Літтла.
    hours: { lectures: 2, selfStudy: 10 }
    selfStudyTasks:
      - task: Прочитати лонгрід теми 3 і пройти самоперевірку.
        hours: 3
      - task: Класифікувати операційні системи чотирьох підприємств за наведеними описами й обґрунтувати кожне віднесення.
        hours: 3
      - task: Розв’язати три задачі на закон Літтла в тренажері та пояснити, як скорочення незавершеного виробництва впливає на строк виконання замовлення.
        hours: 2
      - task: Пройти тренувальний тест теми 3.
        hours: 2
    cases:
      - case: interpipe-steel
        focus: Металургійний переділ як жорстко пов’язана послідовність агрегатів (піч → піч-ківш → вакууматор → МБЛЗ),
          де зупинка одного агрегату зупиняє весь ланцюг.
      - case: kernel
