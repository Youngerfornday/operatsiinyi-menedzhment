# Розподіл балів за силабусом: присутність 10, практичні 35, розрахунково-графічна робота 15, екзамен 40.
# Модульних тестів силабус не передбачає, тому блоку moduleTests немає.
grading:
  split:
    current: 60
    final: 40
  categories:
    - id: attendance
      stage: current
      title: Присутність та активність на лекціях
      items: 2
      pointsPerItem: 5
    - id: practicals
      stage: current
      title: Практичні роботи
      items: 7
      pointsPerItem: 5
    - id: case-project
      stage: current
      title: Розрахунково-графічна робота
      items: 1
      pointsPerItem: 15
    - id: final-test
      stage: final
      title: Екзамен у формі тестування
      items: 1
      pointsPerItem: 40
  # Екзаменаційний тест: 40 питань за явною матрицею «теми × рівні Блума» (10/12/12/6 = 25/30/30/15%).
  # Тема 6 має найбільшу вагу (8 питань), тема 3 — найменшу (4).
  finalTest:
    questions: 40
    timeLimitMinutes: 60
    attempts: 1
    bankSize: 120
    targetShare: { remember: 25, understand: 30, apply: 30, analyze: 15 }
    matrix:
      - { topic: t01, remember: 2, understand: 2, apply: 1, analyze: 0 }
      - { topic: t02, remember: 1, understand: 2, apply: 1, analyze: 1 }
      - { topic: t03, remember: 2, understand: 1, apply: 1, analyze: 0 }
      - { topic: t04, remember: 1, understand: 2, apply: 1, analyze: 1 }
      - { topic: t05, remember: 1, understand: 1, apply: 2, analyze: 1 }
      - { topic: t06, remember: 1, understand: 2, apply: 4, analyze: 1 }
      - { topic: t07, remember: 1, understand: 1, apply: 1, analyze: 1 }
      - { topic: t08, remember: 1, understand: 1, apply: 1, analyze: 1 }
  caseProject:
    title: Розрахунково-графічна робота «Операційний план дільниці підприємства»
    goal: Скласти операційний план дільниці підприємства за індивідуальним варіантом — від прогнозу попиту до графіка робіт і контролю якості — і довести кожне рішення розрахунком.
    companyCriteria:
      - Варіант вихідних даних визначається за останніми двома цифрами номера залікової книжки; дві роботи з однаковим варіантом до захисту не приймаються.
      - Підприємство для змістовної частини обирається з переробної промисловості або сфери послуг із серійним чи масовим характером операцій.
      - Усі зовнішні дані (норми часу, ціни, строки постачання) супроводжуються посиланням на джерело або приймаються за умовою варіанта з явним застереженням.
    stages:
      - id: rgr-variant
        title: Етап 1. Вихідні дані і характеристика операційної системи
        deliverable: Опис операційної системи обраного підприємства, класифікація за типом виробництва, таблиця вихідних даних варіанта з посиланнями на джерела.
      - id: rgr-plan
        title: Етап 2. Прогноз попиту, потужність і агрегатний план
        deliverable: Прогноз на шість періодів трьома методами з оцінкою точності, розрахунок потрібної потужності та агрегатний план за двома стратегіями з порівнянням витрат.
      - id: rgr-operations
        title: Етап 3. Запаси, матеріальна потреба і календарний графік
        deliverable: Розрахунок EOQ, точки замовлення й страхового запасу, розвертання специфікації виробу, сітьовий графік упровадження з критичним шляхом і діаграмою Ганта.
      - id: rgr-quality
        title: Етап 4. Якість, продуктивність і висновки
        deliverable: Контрольні карти й індекси придатності процесу, розрахунок продуктивності до та після запропонованих заходів, висновки й пояснювальна записка до 20 сторінок.
    rubric:
      - title: Вихідні дані і характеристика операційної системи
        stage: rgr-variant
        points: 2
        levels:
          - { points: 2, description: 'Операційну систему описано й класифіковано правильно, вихідні дані повні, джерела вказано.' }
          - { points: 1, description: Опис є, але класифікація не обґрунтована або частина даних без джерел. }
          - { points: 0, description: Опису немає або дані не відповідають варіанту. }
      - title: Прогноз попиту і оцінка його точності
        stage: rgr-plan
        points: 3
        levels:
          - { points: 3, description: 'Три методи застосовано правильно, точність оцінено за MAD і MAPE, вибір методу обґрунтовано.' }
          - { points: 2, description: Методи застосовано правильно, але вибір не обґрунтовано. }
          - { points: 1, description: Застосовано лише один метод або розрахунки містять системні помилки. }
          - { points: 0, description: Прогнозу немає. }
      - title: Потужність і агрегатний план
        stage: rgr-plan
        points: 2
        levels:
          - { points: 2, description: 'Потрібну потужність розраховано, обидві стратегії прораховано, витрати порівняно, рекомендацію обґрунтовано.' }
          - { points: 1, description: Прораховано одну стратегію або потужність не узгоджено з прогнозом. }
          - { points: 0, description: Плану немає. }
      - title: Запаси і матеріальна потреба
        stage: rgr-operations
        points: 3
        levels:
          - { points: 3, description: 'EOQ, точку замовлення й страховий запас розраховано правильно, розвертання специфікації виконано на всіх рівнях зі строками постачання.' }
          - { points: 2, description: Параметри запасів правильні, але розвертання неповне. }
          - { points: 1, description: Виконано лише одну з двох частин. }
          - { points: 0, description: Розрахунків немає. }
      - title: Календарний графік упровадження
        stage: rgr-operations
        points: 2
        levels:
          - { points: 2, description: 'Сітьовий графік побудовано, критичний шлях і резерви визначено, діаграму Ганта складено.' }
          - { points: 1, description: Критичний шлях визначено, але резервів або діаграми Ганта немає. }
          - { points: 0, description: Графіка немає. }
      - title: Якість і продуктивність
        stage: rgr-quality
        points: 2
        levels:
          - { points: 2, description: 'Контрольні карти й індекси придатності побудовано правильно, приріст продуктивності розраховано й пояснено.' }
          - { points: 1, description: Виконано лише частину розрахунків або висновок не спирається на них. }
          - { points: 0, description: Розділу немає. }
      - title: Оформлення і висновки
        stage: rgr-quality
        points: 1
        levels:
          - { points: 1, description: 'Пояснювальна записка структурована, розрахунки відтворювані, висновки випливають з отриманих чисел.' }
          - { points: 0, description: Оформлення не відповідає вимогам або висновки не пов’язані з розрахунками. }
  admission:
    minCurrentPoints: 20
    conditions:
      - Виконано всі види робіт, передбачені робочою програмою, — 7 практичних робіт і всі етапи розрахунково-графічної роботи.
      - Немає невідпрацьованих практичних занять.
      - Пропуски аудиторних занять без поважних причин не перевищують 30% (не більше 18 з 60 годин).
      - Набрано щонайменше 20 балів поточного контролю — інакше навіть максимум за екзаменаційний тест (40 балів) не дає оцінки E (60 балів).
    currentScoreOption: >-
      Бали поточного контролю не замінюють екзамен: семестровий контроль з дисципліни проводиться у формі
      тестування й дає до 40 балів. Максимум поточного контролю — 60 балів.
    basis:
      - { regulation: assessment-regulation, clause: п. 4.7 }
      - { regulation: assessment-regulation, clause: п. 2.5 }
  bonus:
    maxPoints: 10
    activities:
      - title: Участь в олімпіаді або кейс-конкурсі з менеджменту чи управління операціями (призове місце — до максимуму)
        maxPoints: 10
      - title: Доповідь на студентській науковій конференції з тематики курсу
        maxPoints: 5
      - title: Сертифікат неформальної освіти з тематики курсу, не зарахований замість практичної роботи
        maxPoints: 3
    rule: Додаткові бали нараховуються за підтвердними документами за поточний семестр, разом не більше 10; підсумкова оцінка не може перевищувати 100 балів.
  scaleBasis: { regulation: educational-process-regulation, clause: п. 8.3.2 }

# Шкала за Положенням про організацію освітнього процесу (п. 8.3.2), колонка «Екзамен, диф. залік».
scale:
  - { min: 90, max: 100, ects: A, national: відмінно }
  - { min: 82, max: 89, ects: B, national: добре }
  - { min: 75, max: 81, ects: C, national: добре }
  - { min: 66, max: 74, ects: D, national: задовільно }
  - { min: 60, max: 65, ects: E, national: задовільно }
  - { min: 0, max: 59, ects: FX, national: незадовільно з можливістю повторного складання }

policies:
  attendance: >-
    Присутність і активність на лекціях оцінюються в 10 балів — по 5 балів за кожен змістовий модуль. Пропуски
    понад 30% аудиторних занять без поважних причин (понад 18 з 60 годин) є підставою для недопуску до
    семестрового контролю. Пропущене практичне заняття потрібно відпрацювати — виконати роботу в Moodle до
    строку, погодженого з викладачем.
  deadlines: >-
    Строки практичних робіт і етапів розрахунково-графічної роботи встановлено календарним планом і в Moodle.
    Своєчасність здачі оцінюється в 1 бал: максимальна оцінка невчасно поданої роботи зменшується на цей бал.
    Роботу, подану пізніше ніж за 14 днів після строку без поважної причини, зараховують лише для допуску,
    без балів. За поважної причини, підтвердженої документом, строк продовжують на два тижні.
  academicIntegrity: >-
    Роботи виконуються самостійно за індивідуальним варіантом. Виконання завдань на замовлення, списування під
    час тестування, підказки й передавання відповідей іншим особам є порушенням академічної доброчесності:
    така робота оцінюється в 0 балів і виконується повторно в новому варіанті. Розрахунково-графічна робота
    перевіряється на текстові збіги й на збіг числових результатів між варіантами.
  ai: >-
    Модель «Часткове використання з належним цитуванням». Інструменти штучного інтелекту дозволено для пошуку
    ідей, структурування пояснювальної записки, перекладу й мовної перевірки з обов’язковим зазначенням
    інструмента, мети й використаних фрагментів. Заборонено використовувати ШІ під час екзаменаційного
    тестування і подавати згенеровані розрахунки як власні. Кожну формулу, отриману за допомогою ШІ, потрібно
    звірити з docs/research/formula-baseline.md або з підручником зі списку літератури.
  bonusPoints: >-
    Додаткові бали — до 10 за участь в олімпіадах і кейс-конкурсах, доповіді на студентських наукових
    конференціях і сертифікати неформальної освіти з тематики курсу; сума балів не перевищує 100.
  retakes: >-
    Екзаменаційний тест має одну спробу. Повторне складання з метою підвищення позитивної оцінки не
    дозволяється. У разі повторного складання екзамену бали, набрані протягом семестру, анулюються, а
    повторний екзамен містить два теоретичні й одне практичне питання. Ліквідація академічної заборгованості
    при оцінці FX — у строки за розкладом.
  aiModel:
    model: partial-with-citation
    title: Часткове використання з належним цитуванням
    rationale: >-
      Дисципліна розрахункова: цінність має саме вміння довести рішення числом (ПРН20, ПРН24), тому розрахунки
      мають бути самостійними. Водночас робота з великими рядами даних і оформлення пояснювальної записки —
      рутина, де ШІ доречний. Повна заборона непридатна до перевірки в самостійній роботі; моделі «Вільний
      вибір» і «ШІ як обов’язковий інструмент» підвищують ризик некритичного перенесення чужих формул і
      позначень. Часткове використання з цитуванням і обов’язковою звіркою формул — збалансований варіант.
    rules:
      - Дозволено — пошук ідей і джерел, план роботи, переклад, мовна перевірка пояснювальної записки.
      - Обов’язково — зазначити інструмент, мету використання й фрагменти роботи, створені з його допомогою.
      - Обов’язково — звірити кожну формулу й кожне число за першоджерелом або базою формул курсу.
      - Заборонено — використовувати ШІ під час екзаменаційного тестування.
      - Заборонено — подавати згенеровані розрахунки чи висновки як власні.
    needsConfirmation: true
    note: >-
      Модель політики обирає викладач з чотирьох, запропонованих Положенням про робочі програми та силабуси.
      Силабус 2025 р. розділу про ШІ не містить — звірити формулювання з викладачем.
    basis:
      - { regulation: syllabus-regulation, clause: пп. 2.13.11 }
      - { regulation: ai-policy, clause: вступна частина }
  nonFormalEducation:
    value: >-
      Результати неформальної освіти з тематики курсу (онлайн-курси з операційного менеджменту, управління
      запасами, управління проєктами, систем управління якістю) можуть бути зараховані замість однієї або двох
      практичних робіт відповідних тем за поданням сертифіката й виконанням контрольного завдання, погодженого
      з викладачем; максимум — бали цих практичних робіт. Екзаменаційний тест не замінюється.
    needsConfirmation: true
    note: >-
      Положення університету про визнання результатів неформальної та інформальної освіти в дослідженні не
      опрацьоване — звірити порядок, перелік документів і межі зарахування.
  basis:
    - { regulation: assessment-regulation, clause: 'пп. 2.5, 3.3, 3.4, 3.6, 4.7' }
    - { regulation: syllabus-regulation, clause: пп. 2.13.11 }

