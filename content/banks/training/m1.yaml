    stem: >-
      Дільниця за зміну виготовила 540 виробів. На це витрачено 90 людино-годин праці та 1080 кілограмів
      матеріалу. Яка часткова продуктивність праці, виробів на людино-годину?
    generalFeedback: >-
      Часткова продуктивність = Обсяг випуску / Обсяг одного виду витрачених ресурсів (PROD-01). У
      знаменнику має стояти саме той ресурс, продуктивність якого рахують, — тут це людино-години:
      540 / 90 = 6,0 виробу на людино-годину. Дані про матеріал у цьому розрахунку не використовуються.
    refs:
      - source: Stevenson W. J. Operations Management, 2020
        locator: розділ «Competitiveness, Strategy, and Productivity», часткова продуктивність (PROD-01)
        checkedAt: '2026-09-23'
    answers:
      - value: 6.0
        tolerance: 0.01
        fraction: 100
        feedback: 'Правильно: 540 виробів поділити на 90 людино-годин дає 6,0 виробу на людино-годину.'
