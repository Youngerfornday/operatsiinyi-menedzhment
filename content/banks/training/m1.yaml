  - id: t01-q008
    type: truefalse
    topic: t01
    bloom: understand
    stem: >-
      Оцініть твердження. Часткова продуктивність за працею може зростати навіть тоді, коли багатофакторна
      продуктивність тієї самої системи за той самий період знижується.
    generalFeedback: >-
      Часткова й багатофакторна продуктивність відрізняються лише знаменником, і саме тому можуть давати
      протилежні висновки про ту саму систему: заміна праці дорожчим обладнанням чи більшою витратою енергії
