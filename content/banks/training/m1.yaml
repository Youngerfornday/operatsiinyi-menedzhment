      - value: 0.46
        tolerance: 0.01
        fraction: 0
        feedback: >-
          Так вийде, якщо скласти людино-години й кілограми матеріалу разом і поділити на них випуск
          (540 / 1170). Додавати ресурси різних одиниць виміру можна лише для багатофакторної продуктивності,
          і то після переведення їх у спільну грошову одиницю, а не в натуральних одиницях.

