    correct: false
    feedbackTrue: >-
      Ні, це не так. Теорія управління виробництвом застосовується і за межами заводу — в охороні здоров'я,
      банківській справі, готельному господарстві й на транспорті; відмінність послуг лише в тому, що клієнт
      бере участь у процесі перетворення, послугу не можна виготовити наперед, а виробництво й споживання
      відбуваються одночасно.
    feedbackFalse: >-
      Так, твердження хибне. Операційну функцію виконують усі організації без винятку: комерційні й
      некомерційні, великі й малі, державні й приватні, — інакше вони нічого не постачали б зовнішньому
      споживачеві.

  - id: t01-q003
    type: matching
    topic: t01
    bloom: remember
    stem: Установіть відповідність між поняттям категорійного апарату теми та його визначенням.
    generalFeedback: >-
      Три поняття складають ієрархію: операція — найменша керована одиниця роботи, операційна функція — вся
      сукупність таких одиниць, яка дає продукт зовнішньому споживачеві, а процес перетворення — те, що
      відбувається з ресурсами всередині цієї функції. Додана вартість — критерій, який відокремлює корисну
      роботу від втрати.
    pairs:
      - prompt: Операція
        answer: Завершена частина процесу зі своєю метою й результатом, виконана над предметом праці на одному робочому місці
        feedback: >-
          Так. Операція — найдрібніша одиниця; вона входить до операційної функції, але сама її не вичерпує,
          і охоплює не лише фізичні дії, а й, наприклад, оформлення замовлення чи розрахунок норми.
      - prompt: Операційна функція
        answer: Сукупність дій, унаслідок яких організація виробляє продукцію чи послугу для зовнішнього споживача
        feedback: >-
          Так. Функція — це вся сукупність операцій, що веде до продукту назовні; її виконують усі
          організації без винятку.
      - prompt: Процес перетворення
        answer: Послідовність подій, у ході яких ресурси стають готовою продукцією чи послугами
        feedback: >-
          Так. Це ядро операційної системи: механізм, яким входи (матеріали, люди, інформація) стають
          виходами.
      - prompt: Додана вартість
        answer: Приріст вартості понад вартість спожитих ресурсів — різниця між вартістю виходу і вартістю входів
        feedback: >-
          Так. Це єдиний надійний критерій корисності операції: дія, за яку споживач не платить, доданої
          вартості не створює і є втратою.
    distractors:
