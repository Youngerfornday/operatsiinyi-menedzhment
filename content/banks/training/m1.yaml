    feedbackTrue: >-
      Так. Заміна ресурсу відображається лише в одному знаменнику часткового показника, тоді як
      багатофакторний показник враховує всі ресурси одразу; коли додаткові витрати перевищують виграш від
      заміни, багатофакторна продуктивність падає, а часткова за працею — зростає.
    feedbackFalse: >-
      Ні, це можливо і навіть типово. Часткова продуктивність показує лише одну грань роботи системи, тому
      підвищення одного часткового показника не гарантує, що система стала краще працювати загалом.

