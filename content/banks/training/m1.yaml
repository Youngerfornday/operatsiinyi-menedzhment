  # --- Запам’ятовування (5) ---

  - id: t04-q001
    type: multichoice
    topic: t04
    bloom: remember
    single: true
    stem: Яка зі складових операційної діяльності підприємства безпосередньо перетворює ресурси на результат?
    generalFeedback: >-
      Операційна діяльність підприємства — єдність трьох нерозривних складових: ресурсів, операційного
      процесу і результатів. Саме процес перетворює ресурси на результат; без нього ресурс так і лишається
      ресурсом, а результат неможливо ні отримати, ні виміряти.
    answers:
      - text: Ресурси
        fraction: 0
        feedback: >-
          Ресурси — це те, що залучає підприємство (матеріали, праця, енергія, інформація); самі по собі
          вони нічого не перетворюють, поки їх не задіяно в процесі.
      - text: Операційний процес
        fraction: 100
        feedback: >-
          Так. Операційний процес — сукупність взаємопов’язаних операцій, яка перетворює предмет праці на
          готову продукцію чи послугу; саме він реалізує потенціал ресурсів у конкретний результат.
      - text: Результати
        fraction: 0
        feedback: >-
          Результати — це те, що процес дає на виході (основне й другорядне); вони є наслідком
          перетворення, а не самим перетворенням.
      - text: Операційна система
        fraction: 0
        feedback: >-
          Операційна система — не одна зі складових операційної діяльності, а сукупність ресурсів і
          процесів, у якій ця діяльність відбувається; вона задає статичний потенціал, а не перетворює
          ресурси сама.

  - id: t04-q002
    type: truefalse
    topic: t04
    bloom: remember
    stem: >-
      Оцініть твердження. Допоміжний процес безпосередньо перетворює предмет праці на готову продукцію
      операційної системи.
    generalFeedback: >-
      Безпосереднє перетворення предмета праці на готову продукцію — ознака основного процесу. Допоміжний
      процес сам не створює продукт, а виробляє те, що фізично споживає основний: оснащення, енергію,
      відремонтоване обладнання. Транспортування, складування й контроль якості — це вже обслуговуючі
      процеси: вони нічого не виробляють, а лише рухають, зберігають чи перевіряють.
    correct: false
    feedbackTrue: >-
      Ні, це не так. Основний і допоміжний процеси розрізняють саме за цією ознакою: основний безпосередньо
      перетворює предмет праці на продукцію, а допоміжний лише забезпечує основний, не створюючи продукт сам.
    feedbackFalse: >-
