  # --- Аналіз (1) ---

  - id: t01-q015
    type: multichoice
    topic: t01
    bloom: analyze
    single: true
    stem: >-
      Лінія має OEE 72,9% за складовими: доступність 90%, темп (продуктивність) 90% і якість 90%. Менеджер
      може підняти рівно одну з трьох складових на 5 відсоткових пунктів (до 95%), інші лишаються без змін.
      Яка з трьох дій дасть найбільший приріст OEE?
    generalFeedback: >-
      OEE = Доступність × Продуктивність × Якість (CAP-03) — добуток, а не сума й не середнє. Коли всі три
      множники рівні (тут 0,90), підвищення будь-якого з них на ту саму відносну величину дає однаковий
      результат, бо множення комутативне: 0,95 × 0,90 × 0,90 = 0,7695 незалежно від того, який саме
      множник підняли. Тому питання «яку складову покращувати першою заради найбільшого приросту OEE»
      без додаткової інформації про вартість чи технічну можливість підвищення не має єдиної відповіді на
      користь однієї складової.
    refs:
      - source: ISO 22400-2:2014
        locator: KPI «OEE index», загальна ефективність обладнання (CAP-03)
        checkedAt: '2026-09-23'
    answers:
      - text: Підняти доступність, бо позаплановий простій коштує найдорожче
        fraction: 0
        feedback: >-
          Усі три множники в добутку CAP-03 рівноправні: збільшення будь-якого з них при незмінних інших
          дає однаковий числовий приріст OEE, а не залежить від того, який саме множник це коштовий.
      - text: Підняти якість, бо брак псує вже готові, а отже, найдорожчі вироби
        fraction: 0
        feedback: >-
          Аргумент про вартість браку правильний сам собою, але на приріст OEE він не впливає: добуток
          симетричний щодо своїх співмножників незалежно від того, який з них «дорожчий».
      - text: Приріст буде однаковим незалежно від того, яку зі складових підняти
        fraction: 100
        feedback: >-
          Так. 0,95 × 0,90 × 0,90 дає той самий результат 0,7695 (76,95%), яку б із трьох рівних складових
          не підняли до 95%, — бо в добутку порядок і вибір множника, який змінюють, ролі не відіграють.
      - text: Підняти темп лінії, бо саме він визначає обсяг випуску за зміну
        fraction: 0
        feedback: >-
          Темп — лише один із трьох рівноправних множників добутку CAP-03; сам собою він не «важливіший»
          за доступність чи якість для приросту підсумкового показника.

