  - id: t01-q001
    type: multichoice
    topic: t01
    bloom: remember
    single: true
    stem: Яка з трьох базових функцій підприємства безпосередньо перетворює ресурси на товар або послугу, яку замовив клієнт?
    generalFeedback: >-
      Три базові функції підприємства прибрати не можна жодну: маркетинг з'ясовує попит і формує замовлення,
      операції створюють замовлений продукт, а фінанси й облік показують, наскільки економно це зроблено.
      Забезпечувальні функції — кадри, закупівлі, ІТ — обслуговують ці три, але самі продукту не створюють.
    answers:
      - text: Маркетинг
        fraction: 0
        feedback: >-
          Маркетинг визначає попит і формує замовлення, тобто відповідає на питання «що виробляти й для
          кого», а не перетворює ресурси на продукт.
      - text: Операції
        fraction: 100
        feedback: >-
          Так. Операційна функція — це сукупність дій, унаслідок яких організація виробляє продукцію та
          послуги для зовнішнього споживача; саме вона перетворює ресурси на замовлений товар чи послугу.
      - text: Фінанси й облік
        fraction: 0
        feedback: >-
          Фінанси й облік оцінюють, наскільки економно досягнуто результату, і дають ресурс на наступний
          цикл, але самі товар чи послугу не створюють.
      - text: Забезпечувальні функції (кадри, закупівлі, інформаційні технології)
        fraction: 0
        feedback: >-
          Забезпечувальні функції обслуговують три базові, але прибрати будь-яку з них можна без зупинки
          підприємства — на відміну від операцій, без яких продукту просто не буде.

  - id: t01-q002
    type: truefalse
    topic: t01
    bloom: remember
    stem: >-
      Оцініть твердження. Операційну функцію виконують лише виробничі підприємства, а сфера послуг —
      банки, лікарні, готелі, транспортні компанії — операційної функції не має.
    generalFeedback: >-
      Операційну функцію виконують усі без винятку організації, незалежно від галузі й форми власності:
      організація, яка не постачає нічого назовні, просто не існує як організація. У сфері послуг та сама
      логіка перетворення входів на вихід зберігається, лише предметом перетворення є не метал, а
      інформація, стан клієнта чи його власність.
    correct: false
    feedbackTrue: >-
      Ні, це не так. Теорія управління виробництвом застосовується і за межами заводу — в охороні здоров'я,
      банківській справі, готельному господарстві й на транспорті; відмінність послуг лише в тому, що клієнт
      бере участь у процесі перетворення, послугу не можна виготовити наперед, а виробництво й споживання
      відбуваються одночасно.
    feedbackFalse: >-
      Так, твердження хибне. Операційну функцію виконують усі організації без винятку: комерційні й
      некомерційні, великі й малі, державні й приватні, — інакше вони нічого не постачали б зовнішньому
      споживачеві.

  - id: t01-q003
    type: matching
    topic: t01
    bloom: remember
    stem: Установіть відповідність між поняттям категорійного апарату теми та його визначенням.
    generalFeedback: >-
      Три поняття складають ієрархію: операція — найменша керована одиниця роботи, операційна функція — вся
      сукупність таких одиниць, яка дає продукт зовнішньому споживачеві, а процес перетворення — те, що
      відбувається з ресурсами всередині цієї функції. Додана вартість — критерій, який відокремлює корисну
      роботу від втрати.
    pairs:
      - prompt: Операція
        answer: Завершена частина процесу зі своєю метою й результатом, виконана над предметом праці на одному робочому місці
        feedback: >-
          Так. Операція — найдрібніша одиниця; вона входить до операційної функції, але сама її не вичерпує,
          і охоплює не лише фізичні дії, а й, наприклад, оформлення замовлення чи розрахунок норми.
      - prompt: Операційна функція
        answer: Сукупність дій, унаслідок яких організація виробляє продукцію чи послугу для зовнішнього споживача
        feedback: >-
          Так. Функція — це вся сукупність операцій, що веде до продукту назовні; її виконують усі
          організації без винятку.
      - prompt: Процес перетворення
        answer: Послідовність подій, у ході яких ресурси стають готовою продукцією чи послугами
        feedback: >-
          Так. Це ядро операційної системи: механізм, яким входи (матеріали, люди, інформація) стають
          виходами.
      - prompt: Додана вартість
        answer: Приріст вартості понад вартість спожитих ресурсів — різниця між вартістю виходу і вартістю входів
        feedback: >-
          Так. Це єдиний надійний критерій корисності операції: дія, за яку споживач не платить, доданої
          вартості не створює і є втратою.
    distractors:
      - Показник, який порівнює фактичний випуск не з витраченими ресурсами, а з максимально можливим випуском
      - Сума кількох видів ресурсів, зведених до спільного грошового вимірника

