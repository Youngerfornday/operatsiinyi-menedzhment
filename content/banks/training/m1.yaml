  - id: t01-q008
    type: truefalse
    topic: t01
    bloom: understand
    stem: >-
      Оцініть твердження. Часткова продуктивність за працею може зростати навіть тоді, коли багатофакторна
      продуктивність тієї самої системи за той самий період знижується.
    generalFeedback: >-
      Часткова й багатофакторна продуктивність відрізняються лише знаменником, і саме тому можуть давати
      протилежні висновки про ту саму систему: заміна праці дорожчим обладнанням чи більшою витратою енергії
      піднімає часткову продуктивність за працею, але додаткові статті у знаменнику багатофакторного
      показника можуть з'їсти весь виграш. Тут же варто пам'ятати про суміжну пастку: продуктивність — це
      не прибутковість, а ефективність — не результативність; зростання одного показника саме собою не
      доводить поліпшення інших.
    correct: true
    feedbackTrue: >-
      Так. Заміна ресурсу відображається лише в одному знаменнику часткового показника, тоді як
      багатофакторний показник враховує всі ресурси одразу; коли додаткові витрати перевищують виграш від
      заміни, багатофакторна продуктивність падає, а часткова за працею — зростає.
    feedbackFalse: >-
      Ні, це можливо і навіть типово. Часткова продуктивність показує лише одну грань роботи системи, тому
      підвищення одного часткового показника не гарантує, що система стала краще працювати загалом.

