  - id: t04-q015
    type: multichoice
    topic: t04
    bloom: analyze
    single: true
    stem: >-
      Для тієї самої партії (n і норми часу операцій незмінні) передавальну партію p поступово зменшують.
      Як це впливає на тривалість циклу за паралельного руху й чому?
    generalFeedback: >-
      Формулу PC-02 можна переписати як Tпар = n · max(ti/Ci) + p · (Σ(ti/Ci) − max(ti/Ci)). Сума норм часу
      кількох операцій завжди не менша за найбільшу з них, тож другий доданок ніколи не від’ємний: менший p
      лише зменшує або лишає без змін увесь Tпар. Формула не враховує окремо час і вартість самого
      перевезення транспортної партії — це вже ситуаційне міркування поза формулою PC-02.
    answers:
      - text: Tпар зростає, бо менша передавальна партія означає частіші, а отже довші за сумарним часом перевезення
        fraction: 0
        feedback: >-
          Формула PC-02 не враховує час чи вартість самого перевезення — лише норми часу операцій, розмір
          партії n і розмір передавальної партії p. У формулі менший p не збільшує, а зменшує розрахункову
          тривалість циклу.
      - text: 'Tпар зменшується або не змінюється: доданок p · (Σ(ti/Ci) − max(ti/Ci)) невід’ємний'
        fraction: 100
        feedback: >-
          Так. Сума норм часу кількох операцій завжди не менша за найбільшу з них, тож цей доданок
          невід’ємний; зменшення множника p при незмінному іншому доданку n · max(ti/Ci) не може збільшити
          загальну суму.
      - text: Tпар не залежить від p, бо в формулі PC-02 розмір партії враховано лише через n
        fraction: 0
        feedback: >-
          У формулі PC-02 обидва розміри партії присутні напряму: n входить через доданок n · max(ti/Ci), а
