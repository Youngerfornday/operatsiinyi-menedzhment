      Індекс зміни продуктивності = Продуктивність поточного періоду / Продуктивність базового періоду · 100%
      (PROD-03), і обидві продуктивності мають бути одного виду й порахованими за однією методикою. Тут
      5,2 / 4,0 · 100% = 130,0%: поточна продуктивність становить 130% від базової, тобто зросла на 30
      відсоткових пунктів понад базовий рівень.
    refs:
      - source: Stevenson W. J. Operations Management, 2020
