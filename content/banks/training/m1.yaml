      - prompt: Додана вартість
        answer: Приріст вартості понад вартість спожитих ресурсів — різниця між вартістю виходу і вартістю входів
        feedback: >-
          Так. Це єдиний надійний критерій корисності операції: дія, за яку споживач не платить, доданої
