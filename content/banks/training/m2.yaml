        feedback: Це навпаки описує систему з фіксованим розміром замовлення (EOQ), яку товар щойно залишив, а не ту, на яку він перейшов.
      - text: Інтервал між замовленнями стане сталим, а розмір кожного замовлення — змінним
        fraction: 100
        feedback: 'Так. У системі з фіксованим інтервалом замовляють у сталі моменти часу T; обсяг щоразу дорівнює різниці між рівнем «поповнення до» S і фактичним запасом.'
      - text: Страховий запас стане непотрібним, бо систему переглядають регулярно за розкладом
