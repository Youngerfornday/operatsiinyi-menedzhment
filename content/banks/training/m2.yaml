  - id: t07-q010
    type: multichoice
    topic: t07
    bloom: understand
    single: true
    stem: >-
      У проекті критичний шлях має резерв 0 і дисперсію 2,0; другий, майже критичний шлях має резерв лише
      1 тиждень і дисперсію 3,5. Чому класичний розрахунок імовірності методом PERT для такого проекту може
      бути завищеним?
    generalFeedback: >-
      Це відомий недолік методу PERT — ефект злиття шляхів (merge bias): дисперсія й імовірність рахуються лише
      для «офіційного» критичного шляху, а шлях із високою дисперсією і малим резервом має реальний шанс
      перевищити його й самому стати критичним. Метод цей ризик не враховує.
    answers:
      - text: Бо дисперсія 2,0 сама по собі є завищеним числом і має бути меншою
        fraction: 0
        feedback: Дисперсія 2,0 — просто сума дисперсій критичних робіт за формулою PRJ-06; сама по собі вона не є помилкою і не потребує коригування.
      - text: Бо резерв 1 тиждень означає, що другий шлях насправді є критичним
        fraction: 0
        feedback: Критичним є шлях з нульовим резервом (PRJ-04). Резерв 1 тиждень означає, що шлях некритичний, хоч і близький до критичного.
      - text: Бо високодисперсний майже критичний шлях може перевищити критичний і сам стати визначальним для строку проекту
        fraction: 100
        feedback: 'Так. Це ефект злиття шляхів: що менший резерв і більша дисперсія такого шляху, то вищий шанс, що саме він, а не «офіційний» критичний шлях, визначить фактичний строк.'
      - text: Бо метод PERT взагалі не застосовний до проектів із більш ніж одним шляхом
        fraction: 0
        feedback: Метод PERT застосовний до мереж із будь-якою кількістю шляхів; проблема не в застосовності методу, а в тому, що він не враховує дисперсію нехай навіть майже критичних шляхів.

  # --- Застосування (4) ---

  - id: t07-q011
    type: numerical
    topic: t07
    bloom: apply
    stem: >-
      Робота має трьох безпосередніх попередників з ранніми фінішами 5, 9 і 7 тижнів; сама робота триває
      3 тижні. Який її ранній фініш (EF), тижнів?
    generalFeedback: >-
      Ранній старт роботи дорівнює максимуму з ранніх фінішів усіх попередників (PRJ-01): ES = max(5; 9; 7) = 9.
      Ранній фініш EF = ES + t = 9 + 3 = 12 тижнів.
    refs:
      - source: 'Омельяненко Т.В., Осокіна А.В. Операційний менеджмент, 2016'
        locator: 'розділ «Управління проєктами», метод критичного шляху, ранній старт/фініш операції (PRJ-01)'
        checkedAt: '2026-09-22'
        url: 'https://kneu.edu.ua/get_file/8945/.pdf'
    answers:
      - value: 12
        tolerance: 0.01
        fraction: 100
        feedback: 'Правильно: ES = max(5; 9; 7) = 9, EF = 9 + 3 = 12 тижнів.'
      - value: 9
        tolerance: 0.01
        fraction: 0
        feedback: Це лише ранній старт (ES) роботи — максимум з ранніх фінішів попередників. До нього ще треба додати тривалість самої роботи.
      - value: 24
