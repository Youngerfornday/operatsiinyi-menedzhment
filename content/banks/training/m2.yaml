      перевірено 2 000 одиниць, з яких дефектними виявилися 100. Обчисліть верхню контрольну межу
      UCLp, %.
    generalFeedback: >-
      UCLp = p̄ + 3√(p̄(1 − p̄)/n) (QC-02). Середня частка дефектних: p̄ = 100 / 2 000 = 0,05.
      Стандартне відхилення: √(0,05 · 0,95 / 80) ≈ 0,0244. UCLp = 0,05 + 3 · 0,0244 ≈ 0,1231, тобто
      12,3 %.
