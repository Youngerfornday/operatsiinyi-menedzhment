    pairs:
      - prompt: PRJ-01
        answer: Ранній старт і фініш роботи (прямий прохід)
        feedback: 'Так. PRJ-01 — це ES = max(EF попередників), EF = ES + t.'
      - prompt: PRJ-04
        answer: Критичний шлях мережі
        feedback: Так. PRJ-04 визначає найдовший шлях, сума резервів якого дорівнює нулю.
      - prompt: PRJ-06
        answer: Дисперсія тривалості окремої роботи
