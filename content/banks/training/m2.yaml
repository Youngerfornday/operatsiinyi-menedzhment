  - id: t06-q003
    type: matching
    topic: t06
    bloom: remember
    stem: Установіть відповідність між правилом пріоритетів і критерієм, який воно мінімізує.
    generalFeedback: >-
      Чотири правила пріоритетів оптимізують чотири різні критерії черги: SPT — середній час виконання,
      EDD — максимальне запізнення, правило Джонсона — сумарний час виконання партії на двох послідовних
      верстатах, критичне відношення поєднує строк і залишок часу обробки в динамічний показник, який
      перераховують щодня.
    pairs:
      - prompt: Правило SPT
        answer: Мінімізує середній час виконання завдань і середнє число завдань у черзі
      - prompt: Правило EDD
        answer: Мінімізує максимальне запізнення серед усіх завдань черги
      - prompt: Правило Джонсона
        answer: Мінімізує сумарний час виконання (makespan) партії на двох послідовних верстатах
      - prompt: Критичне відношення
        answer: Поєднує директивний строк і залишок часу обробки в один показник, який перераховують щодня
    distractors:
      - Мінімізує сумарні витрати на найм і звільнення персоналу за горизонт плану

