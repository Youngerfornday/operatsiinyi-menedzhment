    bloom: remember
    single: true
    stem: Який із трьох горизонтів планування операцій узгоджує наявну потужність із сезонним попитом через персонал, понаднормовий час і запаси, не змінюючи самої потужності?
    generalFeedback: >-
      Середньостроковий горизонт (агрегатне планування, місяці) працює саме так: потужність вже задана
