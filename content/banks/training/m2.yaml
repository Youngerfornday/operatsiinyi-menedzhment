        answer: Формулювання мети, оцінка ресурсів і рішення «починати чи ні»
        feedback: 'Так. Ініціація — перша фаза: вона ухвалює саме рішення розпочинати проект.'
      - prompt: Планування
        answer: Перелік робіт із залежностями, оцінка тривалості, побудова сітьового графіка
