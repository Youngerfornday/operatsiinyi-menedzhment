      - text: Комірчасте планування
        fraction: 0
        feedback: >-
          Комірчасте планування групує обладнання під родину подібних деталей, а всередині комірки —
          уже в технологічній послідовності, а не суто за функцією обладнання.
      - text: Технологічне планування
        fraction: 100
        feedback: >-
