  - id: t07-q004
    type: multichoice
    topic: t07
    bloom: remember
    single: true
    stem: Яка формула визначає резерв часу роботи в методі критичного шляху?
    generalFeedback: >-
      Резерв часу роботи — це різниця між пізнім і раннім початком (або між пізнім і раннім фінішем), формула
      PRJ-03. Інші наведені формули належать методу PERT (очікуваний час, імовірність строку) і стисненню
      проекту (нахил вартості), а не розрахунку резерву.
    answers:
      - text: 'te = (o + 4m + p) / 6 (PRJ-05)'
        fraction: 0
        feedback: Це формула очікуваного часу роботи в методі PERT, а не резерву часу.
      - text: 'Резерв = LS − ES (PRJ-03)'
        fraction: 100
        feedback: 'Правильно. Різниця між пізнім і раннім початком роботи — це і є її резерв часу (PRJ-03).'
      - text: 'Z = (D − TE) / σ (PRJ-07)'
        fraction: 0
        feedback: Це формула для оцінки ймовірності дотримання строку проекту, а не резерву часу окремої роботи.
      - text: 'Нахил = (Вартість стиснення − Норм. вартість) / (Норм. тривалість − Трив. стиснення) (PRJ-08)'
        fraction: 0
        feedback: Це формула нахилу вартості для стиснення проекту, а не резерву часу.

