      - prompt: Зовнішні втрати
        answer: Рекламації, повернення й гарантійний ремонт, виявлені вже після того, як продукція дісталася споживача
        feedback: >-
          Так. Найдорожча категорія: до вартості самого дефекту додається вартість втраченої довіри й
