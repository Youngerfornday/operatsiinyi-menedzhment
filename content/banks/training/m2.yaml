    stem: Чому індекс Cpk ніколи не може бути більшим за індекс Cp того самого процесу?
    generalFeedback: >-
      Cp — це ширина поля допуску, поділена на розмах природної варіації; Cpk бере менше з двох
      відстаней від середнього до кожної межі допуску, тому будь-яке зміщення середнього від центру
      знижує Cpk відносно Cp, а точне центрування — єдиний випадок, коли вони рівні.
    answers:
      - text: Бо Cpk рахують за іншою, ширшою вибіркою даних, ніж Cp, тому він завжди менш точний
        fraction: 0
        feedback: >-
          Обидва індекси рахують за тим самим процесом і тими самими даними про розкид; розбіжність
          між ними пояснюється не розміром вибірки, а тим, що Cpk враховує центрування, а Cp — ні.
      - text: Бо Cpk застосовують лише до альтернативної ознаки, а Cp — лише до кількісної, тому їх узагалі не можна порівнювати
        fraction: 0
        feedback: >-
          Обидва індекси застосовують саме до кількісної ознаки процесу; поняття «альтернативна
          ознака» стосується контрольних карт (p-карти), а не індексів придатності процесу.
      - text: Бо Cpk бере менше з двох значень, які враховують відстань середнього до кожної межі, а Cp — лише повну ширину поля допуску
        fraction: 100
        feedback: >-
          Так. Саме тому зміщення середнього до однієї з меж знижує одну з двох часток формули Cpk, а
          Cp цього зміщення взагалі не бачить.

