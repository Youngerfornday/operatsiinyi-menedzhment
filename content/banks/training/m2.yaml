    stem: Яке з наведених формулювань точно відповідає означенню якості, яке курс бере за основу?
    generalFeedback: >-
      Якість — рівень (ступінь), до якого сукупність власних характеристик об’єкта задовольняє
      сформульовані потреби чи очікування; означення робить якість відносною, а не абсолютною
      досконалістю.
    answers:
      - text: Рівень, до якого сукупність власних характеристик об’єкта задовольняє сформульовані потреби чи очікування
        fraction: 100
        feedback: >-
          Так. Це і є означення якості, яке бере курс: відповідність характеристик вимогам, а не
          абсолютна властивість самого об’єкта.
      - text: Повна відсутність дефектів у партії продукції, підтверджена суцільним контролем
        fraction: 0
        feedback: >-
          Це поширена, але хибна підміна: якість — не відсутність дефектів як факт, а відповідність
          сформульованим вимогам; вимога сама може допускати певний рівень дефектності.
      - text: Відповідність продукту найвищому технічно можливому рівню виконання незалежно від вимог замовника
        fraction: 0
        feedback: >-
          Це підміняє відносне поняття якості абсолютним: продукт, зроблений «найкраще, як тільки
          можливо», без урахування вимог замовника, може бути і надлишково дорогим, і непридатним для
          конкретного застосування.

