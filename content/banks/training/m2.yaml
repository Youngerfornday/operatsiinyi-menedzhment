          Площа приміщення не є визначальним критерієм вибору типу компонування в цій темі; питання
          саме про ціну гнучкості, а не про розмір ділянки.
      - text: Бо воно єдине з чотирьох типів, що підходить для сервісних підрозділів
        fraction: 0
