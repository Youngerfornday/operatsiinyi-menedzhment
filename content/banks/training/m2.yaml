  # === Тема 7. Управління проектами ===
  # --- Запам’ятовування (5) ---

  - id: t07-q001
    type: multichoice
    topic: t07
    bloom: remember
    single: true
    stem: Яка з перелічених характеристик є визначальною ознакою проекту, а не поточної операційної діяльності?
    generalFeedback: >-
      Проект — одноразовий комплекс робіт з чітко визначеними термінами початку й завершення, обмеженим обсягом
      ресурсів і унікальним результатом. Циклічність, повторюваний маршрут і необмежена в часі діяльність — це
      ознаки саме поточної операційної діяльності, а не проекту.
    answers:
      - text: Унікальний результат і чітко визначені терміни початку й завершення
        fraction: 100
        feedback: >-
          Так. Результат проекту не можна купити в каталозі постачальника, а терміни зафіксовано наперед —
          на відміну від поточної діяльності, яка триває, доки існує підприємство.
      - text: Циклічність виконання, що повторюється місяць за місяцем
        fraction: 0
        feedback: >-
          Циклічність — ознака саме поточної операційної діяльності: цех виготовляє вироби цикл за циклом за
          відпрацьованим маршрутом, а проект циклічним не буває.
      - text: Використання того самого технологічного маршруту, що й попереднього разу
        fraction: 0
        feedback: >-
          Відпрацьований маршрут — ознака налагодженого процесу поточної діяльності. Кожна робота проекту
          виконується вперше для команди, тож маршрут не повторюється в точності.
      - text: Необмежений у часі характер діяльності
        fraction: 0
        feedback: >-
          Навпаки: проект завжди має чітко визначений термін завершення. Необмежена в часі діяльність — це
          ознака поточної операційної системи, а не проекту.

