  - id: t05-q001
    type: multichoice
    topic: t05
    bloom: remember
    single: true
    stem: Чим проектування операційної системи принципово відрізняється від поточного управління нею?
    generalFeedback: >-
      Проектування і поточне управління розв’язують різні задачі щодо тих самих ресурсів: проектування
      одного разу (чи щоразу, коли змінюється продукт або попит) визначає межі — потужність, локацію,
      компонування, лінію, норми, — а поточне управління щодня працює вже всередині цих меж. Тому
      проектні рішення довгі й дорогі у виправленні, а поточні — швидкі й оборотні.
    answers:
      - text: Проектування стосується лише нових підприємств, а поточне управління — вже наявних
        fraction: 0
        feedback: >-
          Проектні рішення повертаються і для наявних підприємств — при розширенні, реконструкції чи
          перенесенні системи на новий майданчик, а не лише при відкритті нового підприємства.
      - text: Проектування створює межі ресурсів системи, а поточне управління оптимізує роботу вже в цих межах
        fraction: 100
        feedback: >-
          Так. Локація, компонування, баланс лінії й норми часу — це межі, які потім використовує
          оперативне планування; саме тому проектні рішення тема 5 називає структурними.
      - text: Проектування не має власних розрахункових методів, на відміну від поточного управління
        fraction: 0
        feedback: >-
          Навпаки: саме проектування дає розрахункові методи цієї теми — метод вагових коефіцієнтів,
          метод центру ваги, баланс лінії, норму часу й виробітку.

