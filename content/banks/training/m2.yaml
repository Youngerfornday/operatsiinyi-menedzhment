  - id: t06-q001
    type: multichoice
    topic: t06
    bloom: remember
    single: true
    stem: Яка стратегія агрегатного плану тримає нульовий запас і щопериоду підлаштовує чисельність персоналу наймом і звільненням під прогнозований попит?
    generalFeedback: >-
      Стратегія погоні за попитом (AGG-01) встановлює обсяг випуску кожного періоду рівним попиту цього
      самого періоду: запасу не накопичують, а персонал і понаднормовий час підлаштовують наймом і
      звільненням. Стратегія рівномірного виробництва (AGG-02) діє навпаки: сталий темп, а різницю з
      попитом покриває запас.
    answers:
      - text: Стратегія рівномірного виробництва
        fraction: 0
        feedback: >-
          Навпаки: ця стратегія тримає сталий персонал і сталий темп випуску (AGG-02), а коливання попиту
          покриває запас, який накопичується й витрачається по періодах.
      - text: Стратегія погоні за попитом
        fraction: 100
        feedback: 'Так. AGG-01: Виробництво_t = Попит_t — випуск точно повторює прогноз кожного періоду, а персонал наймають і звільняють услід за ним.'
      - text: ABC-аналіз запасів
        fraction: 0
        feedback: ABC-аналіз ранжує позиції запасу за вартісною часткою (EOQ-05) — це метод управління запасами, а не стратегія агрегатного плану.
      - text: Розмір партії «партія за партією»
        fraction: 0
        feedback: 'Це метод визначення розміру замовлення в MRP (MRP-03): замовляти рівно нетто-потребу періоду, без надлишку. До агрегатного планування персоналу він не стосується.'

  - id: t06-q002
