      - text: Короткостроковий горизонт
        fraction: 0
        feedback: Короткостроковий горизонт диспетчерує конкретні роботи на дні й тижні всередині меж, які вже задав агрегатний план середнього горизонту.
      - text: Усі три горизонти вирішують цю задачу однаковою мірою
        fraction: 0
        feedback: Кожен горизонт відповідає за своє питання; узгодження потужності з сезонним попитом через персонал і запаси — задача саме середнього горизонту.
      - text: Середньостроковий горизонт
