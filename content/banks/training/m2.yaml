        fraction: 100
        feedback: Так. Сумарний випуск за горизонт однаковий в обох стратегій за визначенням, тому й сумарні регулярні витрати праці на одиницю продуктивності збігаються.
      - text: Тому що обидві стратегії тримають однаковий запас на кінець горизонту планування
        fraction: 0
        feedback: 'Запас — це якраз те, чим стратегії відрізняються найбільше: погоня тримає нульовий запас, рівномірне виробництво накопичує й витрачає його по періодах.'
      - text: Тому що вартість найму й звільнення персоналу в обох стратегіях однакова
        fraction: 0
        feedback: Навпаки, тут стратегії розходяться найбільше — погоня наймає й звільняє щоперіоду, рівномірне виробництво робить це щонайбільше один раз за весь горизонт.
      - text: Тому що обидві стратегії використовують той самий рівень понаднормового часу
        fraction: 0
        feedback: Понаднормовий час у жодній із двох крайніх стратегій із прикладу не задіяний; вони розходяться коштом найму-звільнення проти зберігання запасу, а не понаднормового часу.

