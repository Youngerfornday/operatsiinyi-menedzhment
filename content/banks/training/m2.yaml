    generalFeedback: >-
      Чотири фази йдуть у порядку: ініціація визначає мету й ухвалює рішення «починати чи ні»; планування
      перетворює мету на перелік робіт і сітьовий графік; здійснення і контроль — виконання зі звіркою факту й
