    stem: Установіть відповідність між кодом бази formula-baseline.md і тим, що саме він обчислює.
    generalFeedback: >-
      PRJ-01 дає ранні терміни прямим проходом; PRJ-04 визначає сам критичний шлях за нульовими резервами;
      PRJ-06 рахує дисперсію тривалості окремої роботи для методу PERT; PRJ-09 дає вільний резерв — величину,
