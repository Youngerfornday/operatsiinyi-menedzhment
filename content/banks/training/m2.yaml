      - text: Бо середній попит — це лише центр розподілу; фактичний попит із рівною ймовірністю буває і вищим, і нижчим за нього
        fraction: 100
        feedback: Так. Без запасу понад середній рівень система захищена лише від половини можливих відхилень попиту за час постачання.
      - text: Бо точка замовлення застосовна лише до системи з фіксованим інтервалом, а не з фіксованим розміром
        fraction: 0
